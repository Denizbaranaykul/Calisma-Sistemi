<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stratejik Yönetim</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>

<script>
const CARDS = [{"d": 1, "t": "Temel", "f": "Stratejik yönetim neyi amaçlar ve nasıl sağlar?", "b": "Örgütün uzun dönemde varlığını sürdürmesini ve nihai amacına ulaşmasını; bunu sürdürülebilir rekabet avantajı ve ortalamanın üzerinde getiri elde ederek sağlar. Bilgi toplanır, analiz edilir, stratejiler belirlenir, seçilir, uygulanır ve kontrol edilir."}, {"d": 1, "t": "Temel", "f": "'Ortalamanın üzerinde getiri' ne demektir?", "b": "Faaliyet gösterilen pazardaki rakiplerin ortalamasından fazla kazanmak. Rekabetin ve işletmenin sürekliliği ortalamadan fazla kazanmaya bağlıdır."}, {"d": 1, "t": "Temel", "f": "Strateji nedir?", "b": "Bugünkü noktadan (A) ulaşmak istediğimiz noktaya (B) götüren dinamik plan. Plan 'durağan' değil, süreç içinde çevreye göre güncellenen bir plandır."}, {"d": 1, "t": "Temel", "f": "Durumsallık (contingency) yaklaşımı stratejik yönetimde ne anlama gelir?", "b": "Tek bir doğru yoktur; yöntem, yönetim aracı ve kararlar duruma/şirkete göre değişir."}, {"d": 1, "t": "Süreç", "f": "Stratejik yönetim sürecinin aşamalarını sırala.", "b": "Stratejik bilinç → stratejistlerin seçimi/görevlendirilmesi → stratejik analiz (dış çevre + iç çevre, SWOT) → stratejik yönlendirme (misyon, vizyon, amaç, değerler) → strateji oluşturma → strateji uygulama → stratejik kontrol (her aşamada eş zamanlı)."}, {"d": 1, "t": "Süreç", "f": "Stratejik analiz evresi hangi bilgileri üretir?", "b": "Dış çevreden fırsatlar ve tehditler, iç çevreden (varlık ve yetenekler) üstünlükler ve zayıflıklar. Sonuçta SWOT gibi durum belirleme matrisleri oluşur."}, {"d": 1, "t": "Süreç", "f": "Stratejik yönlendirme nedir, neleri içerir?", "b": "Stratejilere yön veren kavramlar: işin tanımı (hangi ürün/pazar/teknoloji), misyon (varlık nedeni), vizyon (ulaşılmak istenen son nokta), temel amaç ve hedefler, değerler. Stratejik yönetimin 'kutup yıldızıdır'; bazı kitaplar sürecin başına koyar."}, {"d": 1, "t": "Süreç", "f": "Strateji uygulama evresinde ne yapılır? 7S nedir?", "b": "Stratejiye uygun örgüt yapısı, sistemler, insan kaynağı (seçme, eğitim), liderlik/yönetim tarzı, iletişim ve örgüt kültürü oluşturulur. McKinsey 7S: strateji, yapı (structure), sistemler, yönetim tarzı (style), personel (staff), yetenekler (skills), paylaşılan değerler (shared values)."}, {"d": 1, "t": "Süreç", "f": "Stratejik kontrol sürecin son aşaması mıdır?", "b": "Son aşama gibi sıralansa da yıl sonunda yapılan bir işlem değildir; sürecin her aşamasında geri ve ileri besleme ile eş zamanlı yürür. Hedeflere ulaşıp ulaşmadığımızı sürekli kontrol eder."}, {"d": 1, "t": "Stratejik Bilinç", "f": "Stratejik bilinç nedir? Üç unsuru?", "b": "Yöneticilerin: 1) çevrenin ve işletmenin dahil olduğu sistemlerin sürekli değiştiğinin, 2) rakiplerin de bu değişime karşı sürekli strateji geliştirip uygulamalarını değiştirdiğinin farkında olması, 3) değişimi yönetmek ve rekabet etmek için kendi strateji ve uygulamalarını buna göre ayarlayıp geliştirmesi."}, {"d": 1, "t": "Stratejik Bilinç", "f": "Stratejik körlük ve katılık nedir, kimler düşer?", "b": "Çevredeki değişimi görememe ve mevcut yeteneğe/ürüne sıkı sıkıya bağlı kalma. Özellikle kendi alanında lider ve kârlı şirketler başarı rehaveti ve kibirle düşer (Nokia, Ballmer dönemi Microsoft). Stratejik bilincin zayıflamasıdır."}, {"d": 1, "t": "Stratejistler", "f": "Stratejist kimdir? İki türü nedir?", "b": "Süreçte aktif görev alan, stratejileri belirleyen ve uygulayan kişi. Türleri: yönetici stratejistler (tüm yöneticiler) ve uzman stratejistler (profesyoneller)."}, {"d": 1, "t": "Stratejistler", "f": "Yönetici stratejist ile uzman stratejist farkı nedir?", "b": "Yönetici stratejist: üst/orta/alt düzey her yönetici; karar verir (hangi strateji seçilecek, uygulama sorumluluğu). Uzman stratejist: bilgi toplar, analiz ve planlama yapar, alternatif ve tavsiye sunar; karar vermez. Şirket içinden veya dışından (danışman, serbest uzman, akademisyen) olabilir; her şirket uzman istihdam etmek zorunda değil."}, {"d": 1, "t": "Stratejistler", "f": "'Her yönetici stratejisttir' cümlesinin tersi doğru mudur?", "b": "Hayır. Her yönetici bir stratejisttir (varsayılan olarak) ama her stratejist yönetici olmak zorunda değildir (uzman stratejistler yönetici olmadan da stratejist sayılır). Sınavda kesin bilinmesi gereken bilgi."}, {"d": 1, "t": "Stratejistler", "f": "Yönetim düzeyleri ve üst yönetimde kimler yer alır?", "b": "Üst: işletme sahipleri, yönetim kurulu, genel müdür/CEO, C-suite (CFO, CTO, CHRO...). Orta: departman müdürleri. Alt: şef, yönetmen, usta. Nereye gideceğin son kararını üst yönetim verir."}, {"d": 1, "t": "Vaka", "f": "Nokia vakasında uzmanlar ve üst yönetim ne yaptı?", "b": "2004'te stratejik planlama uzmanları dokunmatik, internet odaklı prototip geliştirip pazarın mobil veri ve deneyime kayacağını öngördü. Üst yönetim maliyetli buldu, tuşlu telefon satışlarını baltalamak istemedi, mevcut işletim sisteminde kaldı. Analiz uzmanlarındı, seçim ve sorumluluk yönetimdeydi. (Şirket bugün farklı alanlarda faaliyet gösteriyor.)"}, {"d": 1, "t": "Vaka", "f": "Microsoft vakası: sorun, kırılma noktası ve çözüm?", "b": "Ballmer döneminde akıllı telefon ve bulut değişimi okunamadı; PC/Windows'a bağımlılık ve başarı rehaveti (stratejik körlük). Kırılma: yönetim kurulunun yeni stratejist seçimi. Nadella (içeriden, bulut bilen, öğrenmeye açık, empatik) seçildi, stratejik bilinç yeniden kuruldu: rakiple savaş yerine iş birliği, değişim odağa; Microsoft yeniden dünyanın en değerli şirketlerinden oldu."}, {"d": 1, "t": "Stratejiler", "f": "Strateji türlerinin iki ana sınıflaması nedir?", "b": "1) Temel stratejiler (büyüme, küçülme, durağanlık/istikrar, karma) 2) Yönetim düzeyine göre stratejiler (kurumsal, rekabet/iş, işlevsel)."}, {"d": 1, "t": "Stratejiler", "f": "Yönetim düzeylerine göre strateji farkı nedir?", "b": "Üst düzey (kurumsal): ne üreteceğiz, çeşitlendirme/çekilme. Orta düzey (rekabet): pazarda nasıl rekabet ederiz → maliyet liderliği, farklılaştırma, odaklanma, birleşik. Alt düzey (işlevsel): üretim, İK, tedarik gibi departman stratejileri. Alt stratejiler bir üstteki stratejiye uygun hizalanmalıdır."}, {"d": 1, "t": "Stratejiler", "f": "Karar verme nedir? Alternatif ve seçim kriteri ilişkisi?", "b": "Birden fazla alternatif arasından birini seçmektir; alternatif yoksa karar yoktur (zorunlu seçmeli). Seçim kriteri şirkete, önceliklere, değerlere ve kişiye göre değişir; bu yüzden farklı kişiler aynı alternatiflerden farklı seçim yapar."}, {"d": 1, "t": "Kontrol", "f": "Açık (gap) analizi nedir?", "b": "Amaçlanan stratejiyle (T+1'de ulaşmak istediğimiz durum) mevcut gidişle gerçekleşeceği öngörülen strateji arasındaki farkın analizidir. Bir stratejik kontrol mekanizmasıdır."}, {"d": 1, "t": "Kontrol", "f": "Açık analizinde açığı kapatmak için hangi üç koşul aranır, sonra ne yapılır?", "b": "Açık önemli olmalı; stratejist kapatmak konusunda istekli/arzulu olmalı; kapatılabileceğine inancı olmalı. Üçü varsa stratejiyi, uygulamaları (uygulama sorunu) ya da amaçları değiştirmek gerekir."}, {"d": 1, "t": "Kontrol", "f": "Stratejik pivot nedir? Başarısızlık itirafı mıdır?", "b": "Çevre öngörülenden bambaşka bir yöne gidince, mevcut yöntemlerle açık kapanmayacaksa zamanında yapılan köklü odak/yön değişikliği. Başarısızlık itirafı değil, dinamik stratejik yönetimin gereğidir ('yolun tıkalı olduğunu görüp yeni yol inşa etme'). Örnekler: Instagram, Slack."}, {"d": 1, "t": "Kontrol", "f": "Nokia pivot yapamadığı için mi geriledi?", "b": "Hayır; pivot yapmadığı için değil, doğru zamanda doğru yönelimi yapamadığı için. Pivot erken ve doğru zamanda yapılmalı; piyasa olgunlaşıp herkes geçtikten sonra yapılan geçiş sürdürülebilir rekabet avantajı/ortalama üstü getiri sağlamaz."}, {"d": 1, "t": "Yaklaşımlar", "f": "Fırsat yaklaşımı ile kaynak temelli yaklaşımı karşılaştır.", "b": "Fırsat yaklaşımı: dış çevrede boşluk/potansiyel pazar bulup varlık ve yetenekleri ona göre dönüştürmek; merkezde dış fırsat; çevik, yenilikçi, riski sever firmalar (örn. OpenAI). Kaynak temelli: sürdürülebilir avantaj şirketin benzersiz varlık ve yeteneklerinden gelir; merkezde içsel yetenek (örn. NVIDIA). Ağırlık değişir, karma olabilir."}, {"d": 2, "t": "Dış Çevre", "f": "Dış çevrenin iki katmanı nedir?", "b": "Genel (uzak) çevre: işletmeyi doğrudan etkilemeyen ama tehdit/fırsat barındıran unsurlar (yasal/politik, ekonomik, sosyo-kültürel ve demografik, teknolojik, doğal). Yakın çevre (sektör/iş çevresi): faaliyetleri doğrudan etkileyen ve işletmenin de doğrudan etkilediği unsurlar."}, {"d": 2, "t": "Dış Çevre", "f": "Yakın çevre, sektör çevresi ve iş çevresi arasındaki ilişki nedir?", "b": "Üçü aynı anlama gelir. Sınavda yakın çevre analizi, sektör çevresi analizi veya iş çevresi analizi adlarıyla karşılaşılabilir."}, {"d": 2, "t": "Dış Çevre", "f": "Yakın çevrede hangi aktörler yer alır?", "b": "Tedarikçiler, müşteriler, rakipler, olası (potansiyel) rakipler ve ikame ürünler. Günlük rekabetin ve yaşamın geçtiği alandır."}, {"d": 2, "t": "Dış Çevre", "f": "Müşteri, tüketici, tedarikçi, rakip ve ikame ürün tanımları?", "b": "Müşteri/tüketici: ürünü alan (işletmeler çoğunlukla aracı müşterilerle çalışır); gelir kaynağı. Tedarikçi: girdi sağlayan herkes (ham madde, iş gücü, bakım, banka/sermaye, teknoloji). Rakip: aynı/benzer ürünü üreten. İkame: aynı ihtiyacı farklı şekilde karşılayan ürün/hizmet."}, {"d": 2, "t": "Dış Çevre", "f": "Yakın çevre analizinin 3 başlığı nedir?", "b": "1) Ana pazar analizi 2) Rekabet analizi (Porter 5 güç) 3) Esas rakip (esas firma) analizi."}, {"d": 2, "t": "Ana Pazar", "f": "Ana pazar nedir, ana pazarda kim yer almaz?", "b": "Ürün ve hizmetleri sattığımız, müşterilere ulaştığımız, gelir elde ettiğimiz ve rakiplerle rekabet ettiğimiz yer. Ana pazarda tedarikçiler yoktur."}, {"d": 2, "t": "Ana Pazar", "f": "Ana pazar analizinin üç konusu nedir?", "b": "1) Pazar sınırlarının belirlenmesi 2) Pazar yapısı (monopol, oligopol, tam rekabet, monopolcü rekabet) 3) Pazarın büyüme hızı ve hayat evresi."}, {"d": 2, "t": "Ana Pazar", "f": "Pazar sınırı nasıl belirlenir? Sınırı değiştirmek neyi değiştirir?", "b": "Ürün yapısına (ne ürettiğimiz; misyonda yazar) veya coğrafi sınıra (Denizli, Ege, Türkiye, Avrupa) göre; ikisi birlikte de olabilir. Sınır değişince müşteri sayısı ve rakipler değişir; işletme kapasitesine ve sektörüne göre seçer, genişletebilir."}, {"d": 2, "t": "Pazar Yapısı", "f": "Monopol pazarın özellikleri ve örnekleri?", "b": "Tek firma, rekabet yok, giriş çok zor/yok. Çoğunlukla devlet/regülasyon: Devlet Demiryolları, savunma sanayi, bölgesel elektrik ve gaz dağıtım şirketleri (coğrafi tekel)."}, {"d": 2, "t": "Pazar Yapısı", "f": "Oligopol pazar nedir?", "b": "Sektöre hakim birkaç büyük ve güçlü firma; sektörün kararları ve fiyatlar üzerinde gizli hakimiyet; giriş çıkış zor (sermaye/teknoloji yoğun); küçük firmalar etkisiz. Örnekler: telekomünikasyon, çip, otomotiv, akaryakıt, havayolu."}, {"d": 2, "t": "Pazar Yapısı", "f": "Tam rekabet pazarı nedir?", "b": "Çok sayıda firma, fiyat üzerinde kimsenin hakimiyeti yok; fiyat arz-talepten kendiliğinden oluşur; giriş çıkış kolay. Örnekler: tarım ürünleri, altın ve emtia piyasaları. Günlük ürünlerde pek görülmez."}, {"d": 2, "t": "Pazar Yapısı", "f": "Monopolcü (tekelci) rekabet pazarı nedir?", "b": "Benzer ürünü üreten çok firma ve kolay giriş; ama tasarım, ambalaj, marka/değer ile farklılaşan firmalar fiyat üzerinde kısmen kontrol sahibi olur. Örnekler: hazır giyim/tekstil, kozmetik, perakende/marketler."}, {"d": 2, "t": "Ana Pazar", "f": "Pazar büyüme hızı nasıl hesaplanır ve nasıl yorumlanır?", "b": "(Cari dönem sektör cirosu − önceki dönem cirosu) / önceki dönem cirosu × 100. Tek başına anlamsızdır; ülkenin büyüme hızıyla karşılaştırılarak sektörün büyüyüp küçüldüğü yorumlanır. Büyüyen pazar fırsat, daralan pazar olumsuzluk taşır."}, {"d": 2, "t": "Ana Pazar", "f": "Pazarın hayat evreleri ve her evrede nakit akışı/maliyet durumu?", "b": "Başlangıç: Ar-Ge ve yatırım maliyeti yüksek, ölçek yok, nakit akışı eksi. Büyüme: satışlar hızla artar, nakit akışı pozitif olmalı (değilse tehlike çanları). Olgunluk: doygun, arz-talep dengesi, Ar-Ge düşük, nakit akışı sabit. Düşüş: satışlar azalır → çıkış (exit) ya da pivot."}, {"d": 2, "t": "Porter", "f": "Porter'ın 5 gücü nelerdir?", "b": "1) Olası (yeni) rakiplerin tehdidi 2) İkame ürünlerin tehdidi 3) Müşterilerin pazarlık gücü 4) Tedarikçilerin pazarlık gücü 5) Mevcut rakipler arası rekabetin şiddeti. Sektörün 'karlı mı kanlı mı' olduğunu belirler."}, {"d": 2, "t": "Porter", "f": "5 güç analizi zorunlu bir standart mıdır?", "b": "Hayır; rekabet analizinde farklı yöntemler kullanılabilir. Ancak Porter'ın modeli literatürde ve uygulamada en geniş çerçeveyi veren ve en çok kullanılan modeldir; çünkü sadece rakipleri ve müşterileri değil, olası rakipleri ve ikameleri de kapsar. (Sınavda diğer adları da çıkabilir: müşteri = alıcı, olası rakip = yeni girişimlerin tehdidi.)"}, {"d": 2, "t": "Porter", "f": "Olası rakiplerin tehdidi ne zaman yüksektir? Giriş engelleri nelerdir?", "b": "Sektör çekici, giriş engelleri az ve mevcut rakiplerin misilleme davranışı düşükse yüksektir (büyüyen, kârlı pazara girilir). Giriş engelleri: dağıtım kanallarına erişememe, müşterilerin mevcut firmalara bağımlılığı, yüksek sermaye gereksinimi, rakiplerin ölçek ekonomisi, yasal engeller."}, {"d": 2, "t": "Porter", "f": "İkame ürünlerin tehdidi neye bağlıdır? Örnekler?", "b": "Tüketici eğilimi, düşük geçiş maliyeti ve fayda–maliyet–kalite denkleminde ikamenin daha güçlü olması. Örnekler: WhatsApp→SMS, benzin→elektrikli/hibrit, kablo TV→dijital platform, CD/DVD→Netflix (Blockbuster), gazlı içecek→soda/su, fosil yakıt→güneş."}, {"d": 2, "t": "Porter", "f": "Müşterinin pazarlık gücü ne zaman yüksektir?", "b": "Alımı işletmenin cirosunda büyük pay tutuyorsa (örn. %30 üzeri risk), bilinçliyse, ikame ürüne kolay geçiyorsa veya ürün farklılaşmamışsa/alternatif firma varsa. Havayolu, e-ticaret, telekomda yüksek; Zara/H&M karşısında fason üretici zayıf. Çözüm: farklılaşma ve başka müşteri bulma."}, {"d": 2, "t": "Porter", "f": "Tedarikçinin pazarlık gücü ne zaman yüksektir?", "b": "Tek/az tedarikçi veya ürün önemli ölçüde farklılaşmışsa, ikamesi yoksa, sektörün alımı tedarikçinin cirosunda küçük yer tutuyorsa, geçiş maliyeti yüksekse ve tedarikçi ileri entegrasyonla sektöre girebiliyorsa (BYD'nin batarya üretiminden elektrikli araca girmesi). Örnekler: çip→otomotiv, ekran/pil→akıllı telefon, petrol→enerji."}, {"d": 2, "t": "Porter", "f": "Rakipler arası rekabetin şiddetini hangi faktörler artırır?", "b": "Çok sayıda ve benzer güçte firma, yavaş büyüyen/doygun pazar (pay almak için çarpışma), farklılaşmamış ürün/hizmet ve yüksek çıkış engelleri (yasal, özelleşmiş varlık, sermaye yoğunluğu). Örnekler: e-ticaret, hava taşımacılığı, GSM, gıda."}, {"d": 2, "t": "Porter", "f": "5 güç sonucuna göre cazip (çekici) sektör nasıl bir sektördür?", "b": "Olası rakiplerin girme olasılığı düşük, ikame yok ya da geçiş mantıksız, müşteri ve tedarikçi pazarlık gücü düşük, rakipler arası rekabet düşük. Tersi cazip değildir. Ek olarak büyüme hızı, kârlılık, arz-talep dengesi ve çözülecek problemlerin karmaşıklığı da cazibeyi etkiler."}, {"d": 2, "t": "Esas Rakip", "f": "Esas rakip (esas firma) analizi nedir, neleri inceler?", "b": "Her işletmenin günlük davranışlarında yakından izlediği bir ya da birkaç rakibi vardır (Apple→Samsung, Adidas→Nike). Analiz edilenler: esas rakibin amaçları, varsayımları, mevcut stratejileri ve yetenekleri (ne yapıyor, ne yapabilir, neye hazırlanıyor)."}, {"d": 2, "t": "Esas Rakip", "f": "Varsayım nedir, nasıl yapılmalıdır?", "b": "Kontrolümüz dışındaki belirsiz geleceği (örn. 2027 ekonomik büyümesi) öngörme çabası. Belirsiz çevreyi daha belirli hale getirir; kör tahmin değil, nitelikli bilgi toplayarak yapılır. İşletme sadece kendisi değil, esas rakibin varsayımlarını da tahmin etmelidir."}, {"d": 2, "t": "Bilgi Kaynağı", "f": "İşletme dış çevre bilgisini nereden toplar?", "b": "Kendi pazarlama ve satış görevlilerinden (sahadan), fuarlardan (rakip ve tedarikçiler orada olur), müşterilerden; ayrıca (kitaba göre) üretken yapay zekâ araçlarından. Amaç isabetli varsayımlar yapmak."}, {"d": 3, "t": "Kavram", "f": "Etkililik ile verimlilik farkı nedir? (Drucker)", "b": "Etkililik = doğru işi yapmak (doğru hedef). Verimlilik = işi doğru yapmak (en az kaynakla). Etkililik olmadan verimlilik anlamsızdır (HızlıTabak: verimli paketleme ama istenmeyen ürün)."}, {"d": 3, "t": "Fonksiyon", "f": "Yönetimin 4 fonksiyonu ve sordukları sorular?", "b": "Planlama – Ne yapmalıyız? · Örgütleme – Nasıl yapacağız? · Yöneltme – Onlara nasıl yaptırırız? · Denetim – Yaptık mı?"}, {"d": 3, "t": "Fonksiyon", "f": "Denetim fonksiyonunun üç adımı?", "b": "Ölçmek, (standartla) karşılaştırmak, düzeltmek."}, {"d": 3, "t": "Fonksiyon", "f": "Hangi yönetim kademesi hangi fonksiyonlara daha çok zaman ayırır?", "b": "Üst ve orta kademe: planlama ve örgütleme. Alt kademe: yöneltme ve denetim (yürütme)."}, {"d": 3, "t": "Kavram", "f": "Plan ile strateji arasındaki fark?", "b": "Plan statiktir (yol haritası). Strateji = plan + olası rakip davranışları → dinamiktir (SpaceX örneği)."}, {"d": 3, "t": "Kavram", "f": "Taktik nedir? Örnek?", "b": "Kısa vadeli, nihai sonuca değil anlık hedefe odaklı hamle. Örn. Efsane Günler kampanyası."}, {"d": 3, "t": "Kavram", "f": "Politika nedir? Örnek?", "b": "Kararlara yön veren rehber/pusula. Örn. çevre politikası, Google'ın çalışanlara %20 serbest zaman politikası."}, {"d": 3, "t": "Kavram", "f": "Amaçlanan, oluşan ve gerçekleşen strateji ilişkisi?", "b": "Amaçlanan (planlanan) stratejinin gerçekleşen kısmı + süreçte kendiliğinden oluşan (emergent) strateji = gerçekleşen strateji."}, {"d": 3, "t": "Ansoff", "f": "Ansoff'un 5 strateji düzeyi (çevre → strateji)?", "b": "Tekrarlayan → kuralcı (mahalle fırını); tekrarlamayan → deneyimci; farkedilen değişim → uzantıcı (EV'ye geçiş); devamlı değişim → ileri tahminci (akıllı telefon); karmaşık → yaratıcı (üretken YZ)."}, {"d": 3, "t": "Mintzberg", "f": "Mintzberg çevreyi hangi iki eksenle sınıflar? Örnekler?", "b": "Değişim hızı × karmaşıklık. Hızlı-karmaşık: YZ, biyotek; hızlı-basit: hızlı moda; yavaş-karmaşık: hastane, üniversite; yavaş-basit: kağıt, madencilik."}, {"d": 3, "t": "D'Aveni", "f": "D'Aveni'nin hiper-rekabet görüşü?", "b": "Kalıcı rekabet avantajı yoktur; art arda yapılan seri manevralarla geçici avantajlar zinciri kurulur."}, {"d": 4, "t": "Dinamik", "f": "Değişimi okuyamayıp geride kalan şirket örnekleri?", "b": "Kodak, Blockbuster, Yahoo, Toys \"R\" Us, BlackBerry, Nokia."}, {"d": 4, "t": "Dinamik", "f": "NVIDIA CUDA (2006) neden amaçlanan/oluşan strateji tartışmasına örnektir?", "b": "Oyun dışı paralel hesaplama için amaçlanan bir yatırımdı; yapay zekâ patlamasıyla beklenmedik biçimde şirketin ana avantajına dönüştü (oluşan sonuç)."}, {"d": 4, "t": "Yönlendirme", "f": "Misyon, vizyon ve amaç/hedef tanımları?", "b": "Misyon: varoluş nedeni (neden varız?). Vizyon: arzulanan gelecek durum. Amaç/hedef: vizyonun zamanlanmış, somut hali."}, {"d": 4, "t": "Yönlendirme", "f": "McKinsey 7-S'nin unsurları?", "b": "Katı: strateji, yapı, sistemler. Yumuşak: paylaşılan değerler, stil, personel (staff), beceriler (skills)."}, {"d": 4, "t": "Yönlendirme", "f": "Pivot nedir? Örnekler?", "b": "Stratejik yön değişikliği. Instagram (Burbn'den), Slack (Glitch oyunundan), YouTube (flört sitesi fikrinden)."}, {"d": 4, "t": "Yaklaşım", "f": "Fırsat yaklaşımı ile kaynak yaklaşımı farkı ve örnekleri?", "b": "Fırsat: dıştan içe, önce çevredeki fırsat (OpenAI-ChatGPT). Kaynak: içten dışa, önce sahip olunan eşsiz yetenek (NVIDIA-GPU)."}, {"d": 4, "t": "Vaka", "f": "Microsoft'un yeniden yönlendirmesinde öne çıkan üç hamle?", "b": "Linux ile entegrasyon (rakiple işbirliği), \"Önce Bulut, Önce Mobil\" stratejisi, growth mindset (gelişim zihniyeti) kültürü."}, {"d": 5, "t": "Çevre", "f": "Çevre örgüt için neden hem destekleyici hem sınırlayıcıdır?", "b": "Örgüt çevrenin istediği çıktıyı ürettikçe meşruiyet ve kaynak kazanır (destek); çevre aynı zamanda faaliyet sınırlarını belirler (sınır)."}, {"d": 5, "t": "Çevre", "f": "Dış çevrenin işletme üzerindeki iki temel etkisi?", "b": "Belirsizlik kaynağı olması ve kaynak deposu olması."}, {"d": 5, "t": "Çevre", "f": "Çevresel belirsizliği belirleyen iki faktör?", "b": "Değişen faktörlerin sayısı ve faktörlerin değişme hızı. İkisi yüksek → yüksek belirsizlik; ikisi düşük → düşük; karışık → orta."}, {"d": 5, "t": "Yaklaşım", "f": "Reaktif (uyumcul) ve proaktif (düzenleyici) yaklaşım farkı ve örnekleri?", "b": "Reaktif: işletme kendini çevreye uydurur (Kodak geçmişte, LCW online, McDonald's vejetaryen burger). Proaktif: işletme çevreyi değiştirir (Tesla, Apple, Getir, Amazon, Starbucks)."}, {"d": 5, "t": "Genel çevre", "f": "Genel çevrenin 8 unsuru?", "b": "Politik, yasal, ekonomik, sosyokültürel, demografik, teknolojik, uluslararası, doğal."}, {"d": 5, "t": "Genel çevre", "f": "Yasal çevre nasıl tanımlanır? Örnek?", "b": "Politik çevre unsurlarının somut kurallara dönüşmüş hali. Örn. engelli çalıştırma (%3 özel, %4 kamu), TOGG için şarj istasyonu mevzuatı."}, {"d": 5, "t": "Ekonomik", "f": "Ekonomik konjonktürün 4 dönemi ve stratejik yaklaşımları?", "b": "Kriz: nakit akışı, maliyet kısma. Canlanma: yeni pazar, büyüme yatırımı. Refah: rekabet avantajı, marka, uluslararası açılım. Gerileme: maliyet kontrolü, ürün çeşitliliğini gözden geçirme, risk yönetimi."}, {"d": 5, "t": "Ekonomik", "f": "Para politikası ve maliye politikası: araçları ve yürütücüleri?", "b": "Para politikası: para arzı – TCMB. Maliye politikası: vergi ve kamu harcamaları – Hazine ve Maliye Bakanlığı."}, {"d": 5, "t": "Ekonomik", "f": "Enflasyonun iki kaynağı?", "b": "Talep enflasyonu (talep fazla, arz az) ve maliyet enflasyonu (üretim faktörü fiyatlarının artması)."}, {"d": 5, "t": "Ekonomik", "f": "GSYİH ile GSMH farkı?", "b": "GSYİH: üretim nerede yapıldı? (toprak ilkesi – Türkiye'deki Alman fabrikası dahil). GSMH: üretimi kim yaptı? (vatandaşlık – Türk müteahhidin Katar projesi dahil)."}, {"d": 5, "t": "Ekonomik", "f": "İrlanda'da GSYİH neden GSMH'den çok yüksektir?", "b": "Yabancı teknoloji devleri (Google, Apple) orada üretim yapar ama kârın büyük kısmı yurt dışına transfer edilir."}, {"d": 5, "t": "Ekonomik", "f": "Üretim faktörleri ve karşılıkları?", "b": "Doğal kaynak → rant, emek → ücret, sermaye → faiz, girişimcilik → kâr."}, {"d": 5, "t": "Genel çevre", "f": "Demografik ve sosyokültürel çevre farkı (Disney+ örneği)?", "b": "Demografik: ölçülebilir nüfus verisi – kaç kişi, yaş, eğitim (20–30 milyon genç abone adayı). Sosyokültürel: nasıl yaşıyor, neye değer veriyor (aile/mahalle dizilerine ilgi → yerel yapım)."}, {"d": 5, "t": "Genel çevre", "f": "Doğal çevrede reaktif ve proaktif örnekler?", "b": "Ani krizler → reaktif: 6 Şubat depremi, COVID-19. Yavaş ölçülebilir iklim değişimi → proaktif: Denizli tekstilinde su geri kazanımı, sigortacıların riskli bölgeleri sigortalamaması."}, {"d": 5, "t": "Ölçüm", "f": "Genel çevre ölçümleme teknikleri (5)?", "b": "Unsurun olasılık derecesi, işletmeye etki derecesi, önem derecesi, işletmenin hazırlıklı olup olmadığı, kullanılabilecek kaynaklar."}, {"d": 6, "t": "İş çevresi", "f": "Tüketici ile müşteri farkı?", "b": "Tüketici: ürünü satın alıp tüketen grup. Müşteri: ürünü satın alıp tüketiciye ulaştıran aracı; işletmenin doğrudan ilişkideki en önemli grubu."}, {"d": 6, "t": "Ana pazar", "f": "Ana pazar hangi 3 açıdan analiz edilir?", "b": "a) Pazar sınırları (ürün yapısı + coğrafya), b) pazarın yapısı (firma sayısı, rekabet, giriş-çıkış), c) pazarın gelişme hızı / yaşam evresi."}, {"d": 6, "t": "Ana pazar", "f": "4 pazar yapısı ve örnekleri?", "b": "Monopol: TCDD, İSKİ, AYDEM. Oligopol: otomotiv, cep telefonu, havayolu. Tam rekabet: buğday, borsa. Monopollü rekabet: kahve zincirleri (Starbucks, Kahve Dünyası)."}, {"d": 6, "t": "Ana pazar", "f": "Pazar gelişim hızı formülü ve yorumu?", "b": "(Cari yıl satışları − geçmiş yıl satışları) / geçmiş yıl satışları × 100. Sonuç ülkenin büyüme hızıyla kıyaslanır."}, {"d": 6, "t": "Porter", "f": "Sektöre giriş engelleri?", "b": "Dağıtım kanalına erişememe, yüksek sermaye, ölçek ekonomisi, marka bağlılığı/farklılaşma zorluğu, mevcut firmaların maliyet avantajı, yüksek geçiş maliyeti, devlet politikaları."}, {"d": 6, "t": "Porter", "f": "İkame ürün nedir? Rakip olup olmaması neye bağlıdır?", "b": "Başka sektörde üretilen, aynı ihtiyacı farklı yoldan karşılayan ürün (SMS→WhatsApp). Bağlı: tüketici eğilimleri, geçiş maliyeti, yarar/fiyat/kalite üstünlüğü."}, {"d": 6, "t": "Porter", "f": "Rakipler arası rekabetin şiddetini artıran koşullar?", "b": "Eş güçte çok firma, düşük pazar büyümesi, yüksek çıkış engelleri, standart ürünler."}, {"d": 6, "t": "Porter", "f": "Elektrikli araç sektöründe en yüksek iki güç ve nedeni?", "b": "Mevcut rekabet (Tesla-BYD-VW fiyat savaşı) ve tedarikçi gücü (batarya maliyetin %30–40'ı, CATL/BYD/LG'de yoğunlaşma)."}, {"d": 6, "t": "Teknik", "f": "Dış çevre analizinde kullanılan 3 teknik?", "b": "Bilgi toplamak, varsayım geliştirmek, tahmin tekniklerinden yararlanmak."}, {"d": 6, "t": "İlişki", "f": "Korunma ve işbirliği yaklaşımlarının araçları?", "b": "Korunma: girdi kontrolü, stoklama, düzenleyici davranış, tahmin, ölçek değiştirme. İşbirliği: pazarlık, sözleşme, içeriden ilişki, ortak girişim, stratejik ortaklık, birleşme/satın alma, meslek birlikleri, resmi makamlarla ilişki."}, {"d": 6, "t": "İlişki", "f": "Stratejik esneklik nedir? Apple örneği?", "b": "Korunma ve işbirliğini terazi gibi dengelemek. Apple: M çipleri ve iOS'ta korunma (kale), üretimde TSMC ve Foxconn ile işbirliği (köprü)."}];

const NOTES = "# Konu 1 — Ders 1 kaydı: Stratejik yönetim sürecine genel bakış\n\n## Stratejik yönetim nedir?\n- Örgütün **uzun dönemde varlığını sürdürmesi** ve nihai amacına ulaşması; bunu **sürdürülebilir rekabet avantajı** ve **ortalamanın üzerinde getiri** ile sağlar.\n- \"Ortalamanın üzerinde getiri\": pazarda rakiplerin ortalamasından fazla kazanmak; rekabetin devamlılığı buna bağlıdır.\n- Süreç gelişigüzel değil, **yönetilmesi gereken analitik ve dinamik** bir süreçtir (bilgi topla → analiz et → strateji belirle → seç → uygula → kontrol et). Günlük kararlar ayrıdır; stratejik yönetim uzun dönemli ve rekabete dayalı bakar.\n- **Durumsallık yaklaşımı:** tek doğru yoktur, yöntem ve kararlar duruma göre değişir.\n- **Strateji** = bugünkü noktadan (A) ulaşmak istediğimiz noktaya (B) götüren **dinamik plan**.\n\n## Sürecin aşamaları (bütün resim)\n1. **Stratejik bilinç** (yöneticilerde) 2. **Stratejistlerin seçimi ve görevlendirilmesi** → *bu ikisine bir daha dönülmüyor ama sınavda mutlaka soru gelir*\n3. **Stratejik analiz:** dış çevre (genel/uzak çevre + yakın çevre) ve iç çevre (varlık ve yetenekler) → **fırsat-tehdit / güçlü-zayıf yön** → **SWOT** ve durum belirleme matrisleri\n4. **Stratejik yönlendirme:** misyon, vizyon, temel amaç/hedefler, değerler, işin tanımı (\"kutup yıldızı\"; bazı kitaplar başa koyar, aşamalar dinamik olduğu için çok önemli değil)\n5. **Strateji oluşturma:** temel stratejiler + yönetim düzeyine göre stratejiler; alternatifler → **seçim kriteri** → seçim\n6. **Strateji uygulama:** örgüt yapısı, sistemler, insan kaynağı (eğitim/seçim), kültür, liderlik, iletişim → **McKinsey 7S** (strateji, structure/yapı, systems/sistemler, style/yönetim tarzı, staff/personel, skills/yetenekler, shared values/paylaşılan değerler)\n7. **Stratejik kontrol:** son aşama gibi görünse de **her aşamada eş zamanlı** işler; geri/ileri besleme.\n\n## Stratejik bilinç (sınavda kesin)\n- Yöneticilerin şu üç şeyin **farkında olması**:\n  1. İşletmenin çevresi ve dahil olduğu tüm sistemler **sürekli değişiyor**\n  2. **Rakipler** de bu değişime karşı **sürekli strateji geliştiriyor/uygulamalarını değiştiriyor**\n  3. Bu değişimi yönetmek ve rekabet edebilmek için kendi strateji ve uygulamalarını **ona göre ayarlayıp geliştirmek** gerekir\n- Tuzak: **Stratejik körlük ve katılık** — özellikle lider ve kârlı şirketler başarının rehaveti/kibriyle dış çevreyi izlemez, ürününe ve mevcut temel yeteneğine odaklanır (Nokia, Microsoft–Ballmer dönemi).\n\n## Stratejistler (sınavda kesin)\n- Stratejist = sürecte aktif görev yapan, stratejileri belirleyen ve uygulayan kişi.\n- **İki tür:**\n  - **Yönetici stratejistler:** üst, orta, alt düzey **tüm yöneticiler**. **Her yönetici bir stratejisttir** (varsayılan olarak). Son kararı (hangi stratejinin seçileceği ve uygulanması) onlar verir.\n  - **Uzman stratejistler:** işi meslek olarak yapan profesyoneller; bilgi toplar, analiz eder, planlama yapar, alternatif ve **tavsiye** sunar; **karar vermez**. Şirket içinden (stratejik planlama departmanı) veya dışından (danışmanlık firması, serbest uzman, akademisyen) olabilir. Her şirket uzman stratejist istihdam etmek zorunda değil.\n- **Her yönetici stratejisttir ama her stratejist yönetici olmak zorunda değildir.**\n- Üst yönetim: işletme sahipleri, yönetim kurulu, genel müdür/CEO, C-suite (CFO, CTO, CHRO...). Orta: departman müdürleri. Alt: şef, yönetmen, usta.\n- **Nokia vakası:** 2004'te stratejik planlama uzmanları dokunmatik ekranlı internet odaklı bir prototip geliştirdi ve pazarın mobil veri/deneyime kayacağını öngördü; ancak **üst yönetim** maliyeti yüksek buldu, mevcut tuşlu telefon satışlarını baltalamak istemedi, Symbian'a bağlı kaldı (Android'e geçmedi). Uzman analiz yaptı, seçimi yönetim yaptı → sorumluluk yönetimde. Nokia bugün telefon liderliği değil, farklı alanlarda faaliyet gösteriyor.\n- **Microsoft vakası:** Ballmer döneminde akıllı telefon ve bulut dönüşümü yanlış okundu (PC ve Windows'a bağımlılık, stratejik körlük; Nokia satın alımı yanlış platformda başarısız). Yönetim kurulu yeni stratejist olarak **Satya Nadella**'yı seçti (içeriden, bulut bilişimi bilen, öğrenmeye açık, empatik, değişimi okuyabilen). Stratejik bilinç yeniden kuruldu: rakiple savaşmak yerine iş birliği (2016 sonrası), değişim odağa konuldu; şirket yeniden dünyanın en değerlilerinden biri oldu. Üst yönetim değişince tüm stratejiler yeniden hizalanır.\n\n## Strateji türleri (sonraki konular)\n- **Temel (büyüme) stratejileri:** büyüme, küçülme, durağanlık (istikrar), karma. Büyümede ilişkili/ilişkisiz, yatay/dikey alt türler.\n- **Yönetim düzeyine göre:**\n  - *Üst düzey (kurumsal):* ne üreteceğiz, çeşitlendirme/çekilme (artır-azalt-karma)\n  - *Orta düzey (rekabet/iş):* pazarda nasıl rekabet edeceğiz → **maliyet liderliği, farklılaştırma, odaklanma, birleşik** (Porter)\n  - *Alt düzey (işlevsel):* üretim, İK, tedarik, pazarlama departman stratejileri; **bir üst düzeye uygun hizalanmalı**\n- Karar vermek = **birden fazla alternatif arasından seçmek**. Seçim kriteri kişiye/şirkete/önceliklere göre değişir.\n\n## Stratejik kontrol ve açık (gap) analizi\n- **Amaçlanan strateji** (T+1'de ulaşmak istediğimiz durum) ile **gerçekleşen strateji** (mevcut gidişle ulaşacağımız durum) arasındaki fark = **açık**.\n- Üç koşul: açık **önemli mi**, stratejist açığı kapatmak **istekli (arzulu)** mi, kapatılabileceğine **inanıyor** mu? Üçü varsa → stratejileri, uygulamaları veya amaçları gözden geçirip değiştir.\n- Açık **mevcut yöntemlerle kapatılamıyorsa** (çevre öngörülenden bambaşka bir yere gidiyor) → **stratejik pivot**: zamanında, köklü odak/yön değişikliği (Instagram ve Slack başarılı pivot örnekleri).\n- **Pivot başarısızlık itirafı değildir**; dinamik stratejik yönetimin gereğidir. Nokia pivot yapamadığı için değil, **doğru zamanda doğru yönetimi yapamadığı** için geriledi. Pivot: \"mevcut yolun tıkalı olduğunu görüp yeni yol inşa etme becerisi\".\n\n## Fırsat yaklaşımı vs kaynak temelli yaklaşım\n- **Fırsat (dış çevre) yaklaşımı:** dış çevrede boşluk/potansiyel pazar/müşteri segmenti bulup varlık ve yetenekleri ona göre dönüştürmek; stratejinin merkezinde **dış çevre fırsatı** var. Çevik, yenilikçi, risk alan firmalar benimser (örn. OpenAI).\n- **Kaynak temelli yaklaşım:** sürdürülebilir rekabet avantajı şirketin **benzersiz varlık ve yeteneklerinden** gelir; stratejinin merkezinde **içsel yetenekler** var (örn. NVIDIA GPU + yazılım ekosistemi). Ağırlıklı olarak biri; karma da olabilir.\n- Kaynak temelli odak, dış değişimi göz ardı ettiğinde stratejik bilinç/körlük sorununa yol açabilir (kârlı mevcut yetenekler seni katılaştırır).\n\n---\n\n# Konu 2 — Ders 2 kaydı: Dış çevre analizi: genel (uzak) çevre ve yakın çevre\n\n## Dış çevre iki katman\n- **Genel (uzak) çevre:** işletmenin faaliyetlerini doğrudan etkilemeyen ama varlığı için tehdit ve fırsat barındıran unsurlar. Derste sayılanlar: **yasal/politik, ekonomik, sosyo-kültürel (demografik), teknolojik, doğal çevre** (transkriptte \"sekiz aktör\" deniyor ancak tamamı net değil; kitabını/slaytı kontrol et).\n- **Yakın çevre = sektör çevresi = iş çevresi** (üçü aynı anlama gelir; **sınavda üç adla da karşılaşabilirsin**). İşletmenin faaliyetlerini **doğrudan etkileyen ve işletmenin de doğrudan etkilediği** unsurlar; günlük rekabet ve yaşam alanı.\n- Yakın çevre aktörleri: **tedarikçiler, müşteriler, rakipler**, ayrıca **olası (potansiyel) rakipler** ve **ikame ürünler**.\n  - **Müşteri/tüketici:** ürünü satın alan; işletmeler ağırlıklı olarak müşterilerle (aracılarla) çalışır, tüketici nihai kullanıcıdır; gelir buradan gelir.\n  - **Tedarikçi:** ham madde değil; iş gücü, bakım hizmeti, banka (sermaye/kredi), teknoloji dahil girdi sağlayan herkes.\n  - **Rakip:** aynı ya da benzer ürün/hizmeti üretenler. **İkame:** aynı ihtiyacı **farklı şekilde** karşılayan ürün/hizmet.\n\n## Yakın çevre analizinin 3 başlığı\n1. **Ana pazar analizi** 2. **Rekabet analizi** (Porter 5 güç) 3. **Esas rakip (esas firma) analizi**\n\n### 1) Ana pazar analizi\n- **Ana pazar:** ürün ve hizmeti sattığımız, müşterilere ulaştığımız, gelir elde ettiğimiz ve rakiplerle rekabet ettiğimiz yer. **Ana pazarda tedarikçi yoktur** (müşteri ve rakipler vardır).\n- Üç inceleme konusu:\n  1. **Pazar sınırlarının belirlenmesi:** ürün yapısına (ne üretiyoruz; misyonda yazar) veya **coğrafi** sınıra (Denizli, Ege, Türkiye, Avrupa) göre; ikisi birlikte de olur. Sınır değişince müşteri ve rakip sayısı değişir.\n  2. **Pazar yapısı** (firma sayısı, özellikleri, rekabet durumu, giriş-çıkış kolaylığına göre dört tip):\n     - **Monopol:** tek firma, rekabet yok, giriş çok zor (Devlet Demiryolları, bölgesel elektrik/gaz dağıtım, savunma sanayi)\n     - **Oligopol:** birkaç büyük güçlü firma, giriş zor, fiyatlar üzerinde gizli hakimiyet (telekomünikasyon, çip, otomotiv, akaryakıt); sermaye/teknoloji yoğun\n     - **Tam rekabet:** çok sayıda firma, fiyat arz-talepten oluşur, giriş-çıkış kolay (tarım ürünleri, altın/emtia)\n     - **Monopolcü (tekelci) rekabet:** çok firma, giriş kolay ama **farklılaşan** firmalar fiyatlarda kısmen kontrol sahibi (hazır giyim/tekstil, kozmetik, marketler)\n  3. **Pazarın büyüme hızı ve hayat evresi**\n     - **Büyüme hızı** = (bu yılın sektör cirosu − geçen yılın cirosu) / geçen yılın cirosu × 100; **ülkenin büyüme hızıyla karşılaştırılarak** sektörün büyüyüp küçüldüğüne karar verilir.\n     - **Hayat evreleri:** başlangıç (Ar-Ge/yatırım yüksek, nakit akışı eksi), büyüme (satışlar hızla artar; nakit akışı pozitif olmalı, değilse tehlike çanları), olgunluk (doygun, arz-talep dengeli, Ar-Ge düşük, nakit akışı sabit), düşüş (satışlar azalır → çıkış/exit ya da pivot).\n\n### 2) Rekabet analizi — Michael Porter'ın 5 gücü\n- Standart zorunlu bir model değildir; ama en geniş çerçeveyi veren, en yaygın araçtır. Sektörün **karlı mı kanlı mı** olduğunu belirleyen beş güç:\n  1. **Olası (yeni) rakiplerin tehdidi:** çekici sektöre giriş olasılığı yüksek. **Giriş engelleri:** dağıtım kanallarına erişememe, müşterilerin mevcut firmalara bağımlılığı, yüksek sermaye gereksinimi, ölçek ekonomisi, yasal engeller. Ayrıca mevcut rakiplerin **misilleme davranışı**.\n  2. **İkame ürünlerin tehdidi:** müşteri eğilimi ve düşük geçiş maliyeti; fayda–maliyet–kalite denklemi. (WhatsApp→SMS, benzin→elektrikli/hibrit, kablo TV→dijital platform, CD/DVD→Netflix/Blockbuster, fosil yakıt→güneş)\n  3. **Müşterilerin pazarlık gücü:** müşteri alımı işletme cirosunda büyük pay tutuyorsa (>%30 risk), bilinçliyse, ikameye kolay geçebiliyorsa, ürün standartsa/farklılaşmamışsa güçlüdür. (havayolu, e-ticaret, telekom; fason üreticilere karşı Zara/H&M)\n  4. **Tedarikçilerin pazarlık gücü:** tek/az sayıda tedarikçi, farklılaşmış ürün, ikamesi yok, işletme tedarikçinin cirosunda küçük pay, tedarikçinin **ileri entegrasyon** (müşterinin sektörüne girme) tehdidi → güçlüdür. (çip–otomotiv, ekran/pil–akıllı telefon, petrol, BYD batarya)\n  5. **Mevcut rakipler arası rekabetin şiddeti:** firma sayısı çok, pazar büyümesi yavaş, ürünler farklılaşmamış, **çıkış engelleri** yüksek (yasal, özelleşmiş varlık, sermaye yoğunluğu) → şiddetli. (e-ticaret, havayolu, GSM, gıda)\n- **Cazip (çekici) sektör:** olası rakip tehdidi düşük, ikame yok/zayıf, müşteri ve tedarikçi pazarlık gücü düşük, rakipler arası rekabet düşük. Tersi cazip değildir. Cazibeyi ayrıca büyüme hızı, kârlılık, arz-talep dengesi, çözülecek problemlerin karmaşıklığı belirler.\n- Farklı adlar: müşteri = alıcı; olası rakip = yeni girişimlerin tehdidi.\n\n### 3) Esas rakip (esas firma) analizi\n- Her işletmenin günlük kararlarında yakından izlediği bir veya birkaç rakibi vardır (Apple→Samsung, Adidas→Nike). Analiz edilecekler: **esas rakibin amaçları, varsayımları, mevcut stratejileri ve yetenekleri** (ne yapıyor, ne yapabilir, neye hazırlanıyor).\n- **Varsayım:** kontrolümüz dışındaki belirsiz geleceği (2027 büyümesi vb.) öngörme çabası; kör tahmin değil, **bilgiye dayalı** olmalı.\n\n## Bilgi kaynakları\n- Kendi **pazarlama ve satış görevlileri** (sahadan), **fuarlar** (rakip ve tedarikçilerle karşılaşma), **müşteriler**; ayrıca (kitaba göre) üretken yapay zekâ araçları.\n- Dış çevrede bilgi toplayıp **isabetli varsayımlarda** bulunmak hedeflenir.\n\n\n# Konu 3 — Slayt Bölüm 1: Temel kavramlar (örgüt, yönetim, strateji)\n\n## Örgüt ve yönetim\n- **Örgüt:** ortak amaçlar için bir araya gelmiş insanların oluşturduğu yapı; **yönetim:** bu amaçlara kaynakları kullanarak ulaşma süreci.\n- **Etkililik = doğru işi yapmak** (doğru hedefi seçmek); **verimlilik = işi doğru yapmak** (en az kaynakla). Drucker: etkililik olmadan verimlilik anlamsızdır. *HızlıTabak vakası:* paketleme çok verimli ama müşterinin istemediği ürün → verimli ama etkili değil.\n\n## Yönetimin 4 fonksiyonu\n| Fonksiyon | Soru | Ne yapılır? |\n|---|---|---|\n| Planlama | Ne yapmalıyız? | Hedef belirleme, karar verme |\n| Örgütleme | Nasıl yapacağız? | İşleri, kişileri, kaynakları yapılandırma |\n| Yöneltme | Onlara nasıl yaptırırız? | Motivasyon, iletişim, liderlik |\n| Denetim | Yaptık mı? | Ölçme, karşılaştırma, düzeltme |\n\n- *Trendyol Go vakası* bu dört fonksiyonla okunur. **Üst ve orta** kademe daha çok planlama-örgütleme; **alt kademe** daha çok yöneltme-denetim (yürütme) yapar.\n\n## Strateji, plan, taktik, politika\n- **Plan:** statik; ne yapılacağının yol haritası. **Strateji = plan + olası rakip davranışları** → dinamik (SpaceX örneği).\n- **Taktik:** kısa vadeli, nihai sonuca değil anlık hedefe odaklı hamle (ör. *Efsane Günler* kampanyası).\n- **Politika:** kararlara yön veren **rehber/pusula** (çevre politikası, Google'ın %20 serbest zaman politikası).\n- *TazeGelecek vakası* sıralaması: 1 strateji → 2 politika → 3 plan → 4 taktik.\n- **Amaçlanan** (planlanan) strateji + yolda **oluşan** (emergent) strateji → **gerçekleşen** strateji. Amaçlananın bir kısmı gerçekleşmeyebilir.\n\n## Çevre türüne göre strateji düzeyleri\n- **Ansoff'un 5 düzeyi:**\n  1. Tekrarlayan çevre → **kuralcı** (mahalle fırını)\n  2. Tekrarlamayan/yavaş değişen → **deneyimci** (süpermarketin viral kampanyası)\n  3. Farkedilen değişim → **uzantıcı** (otomotivde EV'ye geçiş)\n  4. Devamlı değişim → **ileri tahminci** (akıllı telefon)\n  5. Karmaşık/sürprizli → **yaratıcı** (üretken yapay zekâ)\n- **Mintzberg:** iki eksen — **değişim hızı × karmaşıklık**. Hızlı + karmaşık: YZ, biyoteknoloji; hızlı + basit: hızlı moda; yavaş + karmaşık: hastane, üniversite; yavaş + basit: kağıt, madencilik.\n- **D'Aveni:** hiper-rekabette kalıcı avantaj yoktur; **seri (art arda) manevralarla** geçici avantajlar zinciri kurulur.\n- Güncel örnek tablo: BYD, Shein, Intel, VW, üretken YZ.\n\n# Konu 4 — Slayt Bölüm 2: Dinamik süreç, stratejist ve yönlendirme\n\n## Stratejik yönetim neden dinamik?\n- Çevre sürekli değişir, rakipler sürekli hamle yapar → süreç döngüseldir, kontrol sonuçları başa döner.\n- **Değişimi okuyamayanlar:** Kodak (dijital fotoğraf), Blockbuster (Netflix), Yahoo, Toys \"R\" Us (e-ticaret), BlackBerry ve Nokia (akıllı telefon).\n- *NVIDIA CUDA (2006):* oyun dışı hesaplama için başlatıldı; YZ patlamasıyla değer kazandı → amaçlanan mı oluşan mı tartışması (amaçlanan bir yatırımın beklenmedik oluşan sonucu).\n\n## Uzman stratejist\n- Çevreyi okuyan, ileriyi gören, belirsizlikte karar alabilen, öğrenen ve değişime liderlik eden yönetici.\n\n## Stratejik yönlendirme\n- **Misyon:** örgütün **varoluş nedeni** (neden varız?).\n- **Vizyon:** **arzulanan gelecek durum** (nereye gitmek istiyoruz?).\n- **Amaç/hedef:** vizyonun **zamanlanmış, somut** hali.\n- **McKinsey 7-S:** strateji, yapı, sistemler (katı S'ler) + paylaşılan değerler, stil, personel, beceriler (yumuşak S'ler).\n- **Pivot** (stratejik yön değişikliği): Instagram (Burbn'den), Slack (Glitch oyunundan), YouTube (flört sitesi fikrinden).\n\n## Fırsat yaklaşımı vs kaynak yaklaşımı\n- **Fırsat (dıştan içe):** önce çevredeki fırsat, sonra kaynak (OpenAI: ChatGPT ile pazar fırsatı).\n- **Kaynak (içten dışa):** önce sahip olunan eşsiz kaynak/yetenek, sonra pazar (NVIDIA: GPU yetkinliği).\n- *Microsoft:* Linux ile entegrasyon, \"Önce Bulut, Önce Mobil\", **growth mindset** kültürü → yeniden yönlendirme örneği.\n\n# Konu 5 — Slayt Bölüm 3: Genel (uzak) çevre analizi\n\n## Çevre kavramı\n- **Çevre:** örgütün faaliyetlerini etkileyen tüm unsurlar; örgüt çevrenin istediği çıktıyı ürettikçe **meşruiyet** kazanır. Çevre hem **destekleyici hem sınırlayıcıdır**.\n- **İç çevre:** örgüt içi unsurlar (kaynak, yetenek, faaliyet — denetim altında). **Dış çevre:** sınırlar dışında, örgütü etkileyen/etkileme ihtimali olan, **denetlenmesi zor** unsurlar.\n- Dış çevre = **genel (uzak)** + **sektör/iş (yakın)** çevre. Dış çevrenin iki etkisi: **belirsizlik kaynağı** ve **kaynak deposu** olması.\n- **Çevresel belirsizlik** iki şeye bağlı: **değişen faktör sayısı** ve **değişme hızı**. İkisi de yüksekse yüksek belirsizlik, ikisi düşükse düşük, karışıksa orta.\n\n## Reaktif ve proaktif yaklaşım\n- **Uyumcul/reaktif:** işletme çevreye uyup **kendini değiştirir** (Kodak geçmişte, LCW online alışverişte, McDonald's vejetaryen burger).\n- **Düzenleyici/proaktif:** işletme **çevreyi değiştirir** (Tesla, Apple, Getir, Amazon, Arçelik, Starbucks).\n\n## Genel çevrenin 8 unsuru\nPolitik · Yasal · Ekonomik · Sosyokültürel · Demografik · Teknolojik · Uluslararası · Doğal. İşletmeyle doğrudan temas etmez ama dolaylı etkiler; amaç **fırsat mı tehdit mi** olduğunu ve gelecekteki değişimi tahmin etmek. Süreç her işletmede aynı değildir; her işletme kendine göre sınıflamalıdır.\n\n1. **Politik:** resmi makamların siyasi otoritesini kullandığı ortam — hükümet şekli, rejim, seçimler, istikrar, devletin iş hayatına müdahalesi (özelleştirme/devletleştirme).\n2. **Yasal:** **politik unsurların somut kurallara dönüşmüş hali** — yasalar, teşvikler, yönetmelikler, içtihatlar. Örn. engelli çalıştırma (%3 özel, %4 kamu), sosyal güvenlik izinleri. En çok: ticaret, borçlar, eşya, icra-iflas, vergi, iş hukuku. *TOGG örneği:* politik → yerli üretim ve enerji dönüşümü teşvikleri; yasal → şarj istasyonu mevzuatı (ZES, Sharz.net'e fırsat).\n3. **Ekonomik:** sınırlı kaynakla üretim, tüketim ve bölüşüm ortamı. Alt başlıklar aşağıda.\n4. **Sosyokültürel:** değer yargıları, tutumlar, davranış, yaşam biçimi, kültürel alışkanlıklar (\"**nasıl** yaşıyor, neye değer veriyor?\").\n5. **Demografik:** nüfusun **ölçülebilir** yapısı — sayı, cinsiyet, yaş, eğitim, bölgesel ve gelir dağılımı (\"**kaç** kişi, kim?\"). *Disney+ örneği:* demografik → 20–30 milyon genç dijital abone adayı; sosyokültürel → yerel aile/mahalle dizilerine ilgi → yerel yapım.\n6. **Teknolojik:** Ar-Ge, yenilik, iletişim, bilgi işleme, yapay zekâ.\n7. **Uluslararası:** ülkenin üst sistemi olan dünya — serbest ticaret, gümrük birliği; savaşlar, çip savaşları, yaptırımlar, AB ürün kriterleri, salgınlar.\n8. **Doğal:** doğa dengesinin örgüte etkisi. **Ani krizler → reaktif** (6 Şubat depremi, COVID-19); **yavaş ölçülebilir değişim (iklim) → proaktif** (Denizli tekstilinde su geri kazanımı; sigortacıların riskli bölgeleri sigortalamaması).\n\n## Ekonomik çevrenin alt başlıkları\n- **Konjonktür devreleri:** Kriz (nakit akışı, maliyet kısma) → Canlanma (yeni pazar, büyüme yatırımı) → Refah (rekabet avantajı, marka, uluslararası açılım) → Gerileme (maliyet kontrolü, ürün çeşitliliğini gözden geçirme, risk yönetimi).\n- **Para politikası** (para arzı; TCMB) / **maliye politikası** (vergi ve kamu harcaması; Hazine ve Maliye Bakanlığı).\n- **Enflasyon:** fiyatlar genel düzeyinin sürekli artışı. Ilımlı/yüksek/hiper; kaynağı **talep** (talep>arz) veya **maliyet** (girdi fiyatları). Çok yüksekse gelir dağılımı bozulur, bütçe/ödemeler dengesi bozulur, tasarruf-yatırım kararları değişir.\n- **Milli gelir:** **GSYİH** = üretim **nerede**? (toprak ilkesi; Türkiye'deki Alman fabrikası dahil). **GSMH** = üretimi **kim** yaptı? (vatandaşlık; Türk müteahhidin Katar projesi dahil). İrlanda'da GSYİH ≫ GSMH (yabancı teknoloji devleri, kâr dışarı). Kişi başı = toplam / nüfus; SAGP fiyat farkını eşitler (Türkiye 2026: ~18.500 $ nominal, ~46.670 $ SAGP).\n- **Üretim faktörleri ve karşılıkları:** doğal kaynak → **rant**, emek → **ücret**, sermaye → **faiz**, girişimcilik → **kâr** (tekstil atölyesi örneği).\n- **Dış ödemeler bilançosu (cari işlemler):** ülkenin döviz gelir–giderleri.\n\n## Genel çevre ölçümleme\nUnsurun **olasılık** derecesi · işletmeye **etki** derecesi · **önem** derecesi · işletmenin **hazırlıklı olup olmadığı** · kullanılabilecek **kaynaklar**.\n\n# Konu 6 — Slayt Bölüm 4: İş çevresi (sektör / yakın çevre) analizi\n\n## İş çevresi\n- Girdilerin temin edildiği, ürünlerin satıldığı, rakiplerle mücadele edilen, işletmeyi **doğrudan** etkileyen ve ondan doğrudan etkilenen çevre.\n- **Tüketiciler:** ürünü satın alıp tüketen grup. **Müşteriler:** satın alıp tüketiciye ulaştıran **aracılar** — doğrudan ilişkideki en önemli grup. **Rakipler:** aynı/benzer ürünü aynı müşteriye satanlar. **Tedarikçiler:** iş gücü, sermaye, kredi, hammadde, bilgi sağlayanlar.\n\n## 1) Ana pazar analizi (3 açı)\n- **a. Pazar sınırları:** ürün yapısı (misyondaki ürünler) + coğrafi konum.\n- **b. Pazar yapısı:** firma sayısı, rekabet durumu, giriş-çıkış zorluğu.\n\n| Yapı | Özellik | Örnek |\n|---|---|---|\n| Monopol | Tek firma, giriş yok, fiyatta tam kontrol | TCDD, AYDEM, İSKİ |\n| Oligopol | Birkaç büyük firma, giriş zor | Otomotiv, cep telefonu, THY-Pegasus |\n| Tam rekabet | Çok firma, benzer ürün, kolay giriş, fiyat kontrolü yok | Buğday, borsa |\n| Monopollü rekabet | Çok firma ama farklılaşma (marka, tasarım) | Starbucks, Kahve Dünyası |\n\n- **c. Pazar gelişim hızı** = (cari yıl satışları − geçmiş yıl satışları) / geçmiş yıl satışları × 100; sonuç **ülkenin büyüme hızıyla** kıyaslanır. Örn. 120 → 138 milyon: %15. Yaşam evreleri: başlangıç (negatif nakit) → büyüme → olgunluk → düşüş.\n\n## 2) Rekabet analizi — Porter'ın 5 gücü (slayt ayrıntıları)\n1. **Olası rakiplerin (yeni girişlerin) tehdidi:** çekici sektör (yüksek büyüme ve kârlılık, düşük rekabet) girişi teşvik eder. Bakılır: **giriş engelleri** (dağıtım kanalı, yüksek sermaye, ölçek ekonomisi, marka bağlılığı, maliyet avantajı, geçiş maliyeti, devlet politikası) ve **misilleme** beklentisi.\n2. **İkame ürün tehdidi:** başka sektörde üretilen, aynı ihtiyacı farklı yoldan karşılayan ürün (SMS → WhatsApp, taksi → Uber/Martı TAG, otel → Airbnb, kablolu TV → Netflix, et → bitkisel et). Etkenler: tüketici eğilimleri, geçiş maliyeti, yarar/fiyat/kalite üstünlüğü.\n3. **Tedarikçilerin pazarlık gücü yüksek** olur: tek/farklılaşmış tedarikçi, geçiş maliyeti yüksek, ikamesi yok, bizim sektör onun cirosunda önemsiz, **ileriye doğru entegrasyon** tehdidi var (çip üreticileri, batarya üreticileri, OPEC).\n4. **Müşterilerin pazarlık gücü yüksek** olur: alım miktarı ciroda büyük pay, ürün standart, **geriye doğru entegrasyon** tehdidi, müşteri bilgili, değiştirme maliyeti düşük (havayolu, e-ticaret, GSM numara taşıma, Zara/H&M'ye fason üretim).\n5. **Rakipler arası rekabetin şiddeti:** eş güçte firma sayısı, **düşük pazar büyümesi**, **yüksek çıkış engelleri**, ürünlerin standart olması (BİM-A101-Şok, GSM, kargo).\n\n- **Çekici sektör:** giriş engeli çok, ikame zayıf, tedarikçi ve müşteri gücü düşük, rekabet şiddetsiz. Tersi → çekici değil.\n- *Elektrikli araç 5 güç tablosu:* rekabet **yüksek** (Tesla-BYD-VW fiyat savaşı); yeni giriş **orta-düşük** (Rivian/Lucid zorlanıyor, ama Xiaomi/Huawei girebildi); ikame **orta-yüksek** (hibrit, 2. el ICE, mikromobilite); tedarikçi **yüksek** (batarya maliyetin %30–40'ı, CATL); alıcı **orta-yüksek** (geçiş maliyeti düşük).\n\n## 3) Rakip firma analizi\n- Esas rakip: Coca-Cola–Pepsi, Mercedes–BMW, AWS–Azure, iOS–Android. Analiz: rakibin **gelecek amaçları, varsayımları, mevcut stratejileri, yetenekleri**.\n\n## Dış çevre analizinde teknikler\n1. **Bilgi toplamak** (genel çevre, sektör, rakipler) → 2. **Varsayım geliştirmek** (kontrol dışı gelecek olay hakkında fikir yürütme) → 3. **Tahmin teknikleri** (tespit değil, geleceği anlama süreci).\n\n## İş çevresi ile ilişkilerin yönetimi\n- **Korunma yaklaşımı:** girdi kontrolleri, stoklama, düzenleyici davranışlar, tahmin ve öngörü, ölçek değiştirme.\n- **İşbirliği yaklaşımı:** pazarlık, sözleşme, içeriden ilişki, ortak girişim, stratejik ortaklık, birleşme ve satın alma, meslek birlikleri, resmi makamlarla ilişki.\n- **Stratejik esneklik:** iki yaklaşımı **terazi** gibi dengelemek. Yalnız korunma → hantallık, yüksek maliyet, inovasyonu kaçırma; yalnız işbirliği → bağımsızlık kaybı, aşırı bağımlılık.\n- *Apple:* M çipleri ve iOS'ta **korunma** (\"kale\"), üretimde TSMC ve Foxconn ile **işbirliği** (\"köprü\").\n";
const COURSE = {"title": "Stratejik Yönetim", "sub": "Ders 1–2 kayıtları + Bölüm 1–4 slaytları: temel kavramlar, yönlendirme, genel çevre ve sektör analizi", "unit": "Konu", "ders": {"1": "Konu 1 · Ders 1 kaydı: süreç, bilinç, stratejistler", "2": "Konu 2 · Ders 2 kaydı: dış çevre ve Porter", "3": "Konu 3 · Bölüm 1: örgüt, yönetim, strateji kavramları", "4": "Konu 4 · Bölüm 2: dinamik süreç ve yönlendirme", "5": "Konu 5 · Bölüm 3: genel (uzak) çevre analizi", "6": "Konu 6 · Bölüm 4: iş çevresi / sektör analizi"}, "gen": ["pazarhiz", "gsyih"], "extra": ["Hocanın vurguladığı iki konuyu hafızadan yaz: stratejik bilinç (3 madde) ve yönetici/uzman stratejist farkı; ardından Nokia ve Microsoft vakasını bu iki kavramla yorumla", "Seçtiğin bir sektör için Porter 5 gücü tablo yap (her güç: yüksek/düşük + gerekçe) ve sektörün cazip olup olmadığına karar ver", "Genel çevrenin 8 unsurunu (PYESDTUD) seçtiğin bir şirket için birer örnekle doldur", "Alıştırma sekmesinde pazar gelişim hızı ve GSYİH/GSMH sınıflama sorularından en az 8 tane çöz"], "id": "stratejik"};
const DERS = COURSE.ders, NS = Object.keys(DERS).map(Number), U = COURSE.unit||'Ders', GENS = COURSE.gen||[];
const PLAN = (()=>{
  const p=[];
  NS.forEach((n,i)=>p.push({g:`Gün ${i+1} · ${U} ${n}`,t:[`${U} ${n} notlarını oku (25 dk) — bitince kapat, 5 anahtar kavramı kâğıda hatırladığın kadar yaz`,`${U} ${n} kartlarını çalış (15 dk)`,`${U} ${n} testi (10 soru)`].concat(i?['Önceki günlerin bekleyen kartları']:[])}));
  let g=NS.length;
  p.push({g:`Gün ${++g} · Birleştir`,t:['Tüm bekleyen kartlar','Karışık test (20 soru)','Yanlışlarım testini çöz'].concat(GENS.length?['Alıştırma sekmesinde karışık 10 soru çöz']:[])});
  p.push({g:`Gün ${++g} · Aktif hatırlama`,t:[`Her ${U.toLowerCase()} için notlara bakmadan 10 satırlık özet yaz, sonra notlarla karşılaştır`,'Eksik çıkan kavramların kartlarını çalış'].concat(COURSE.extra||[])});
  p.push({g:`Gün ${++g} · Zayıf noktalar`,t:["İlerleme sekmesinde Kutu 1-2'deki kartlara odaklan",'Yanlışlarım testini tekrar et']});
  p.push({g:`Gün ${++g} · Final`,t:['Karışık test (hepsi)','Yanlışlarım testi','2 hafta sonrası için kendine hatırlatma kur: bekleyen kartlar + 1 karışık test']});
  return p;
})();
const $ = (s,r=document)=>r.querySelector(s);
const K=k=>COURSE.id+':'+k;
const store = {
  get(k,d){try{const v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}
};
const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5, INTERVALS=[0,0,1,3,7,14]; // box index → days

const TABS=[["plan",`${PLAN.length} Günlük Plan`],["notes","Notlar"],["cards","Kartlar"],["quiz","Test"]].concat(GENS.length?[["gen","Alıştırma"]]:[],[["prog","İlerleme"]]);
const nav=$('#nav');
TABS.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});

function renderPlan(){
  const done=store.get('pz_plan',{});
  const total=PLAN.reduce((n,d)=>n+d.t.length,0), n=Object.values(done).filter(Boolean).length;
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><b>İlerleme</b><span class="mute">${n}/${total}</span></div><div class="bar" style="margin-top:8px"><i style="width:${n/total*100}%"></i></div>
  <p class="mute" style="margin:10px 0 0">Kural: önce notları <b>bir kez</b> oku, sonra kapatıp kendini sına. Tekrar okumak değil, hatırlamaya çalışmak öğretir.</p></div>`;
  PLAN.forEach((d,i)=>{h+=`<div class="card plan"><b>${d.g}</b>`+d.t.map((x,j)=>{const k=i+'-'+j;return `<label><input type="checkbox" data-k="${k}" ${done[k]?'checked':''}><span class="${done[k]?'done':''}">${esc(x)}</span></label>`}).join('')+`</div>`});
  $('#p-plan').innerHTML=h;
  $('#p-plan').querySelectorAll('input').forEach(c=>c.onchange=()=>{const d=store.get('pz_plan',{});d[c.dataset.k]=c.checked;store.set('pz_plan',d);renderPlan()});
}

function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

/* ---------- flashcards (Leitner) ---------- */
let cardFilter=store.get('pz_filter',0), session=[], sIdx=0, flipped=false;
const cs=()=>store.get('pz_cards',{});
function cardState(id){return cs()[id]||{box:1,due:0}}
function dueList(f){const s=cs(),now=Date.now();return CARDS.map((c,i)=>({...c,id:i})).filter(c=>(!f||c.d===f)&&((s[c.id]||{due:0}).due<=now))}
function renderCards(){
  const el=$('#p-cards');
  let h=`<div class="row" style="margin-bottom:14px">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${cardFilter===f}" data-f="${f}">${f?U+' '+f:'Hepsi'} (${dueList(f).length})</button>`).join('')+`</div><div id="sess"></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cardFilter=+b.dataset.f;store.set('pz_filter',cardFilter);session=[];renderCards()});
  if(!session.length||sIdx>=session.length){session=shuffle(dueList(cardFilter));sIdx=0}
  drawCard();
}
function drawCard(){
  const box=$('#sess');if(!box)return;
  if(!session.length){box.innerHTML=`<div class="card" style="text-align:center"><b>Bekleyen kart yok 🎉</b><p class="mute">Bu filtre için bugün çalışılacak kart kalmadı. Yarın tekrar gel ya da başka bir ${U.toLowerCase()} seç.</p><button class="btn alt" id="all">Yine de hepsini karıştır</button></div>`;
    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>!cardFilter||c.d===cardFilter));sIdx=0;drawCard()};return}
  const c=session[sIdx];flipped=false;
  box.innerHTML=`<div class="mute" style="margin-bottom:6px">${sIdx+1} / ${session.length} · Kutu ${cardState(c.id).box}</div><div class="bar" style="margin-bottom:12px"><i style="width:${sIdx/session.length*100}%"></i></div>
  <div class="card flash" id="fl" tabindex="0"><div class="tag">${esc(DERS[c.d])} · ${esc(c.t)}</div><div class="q">${esc(c.f)}</div><div class="a" id="ans" hidden>${esc(c.b)}</div><div class="mute" id="hint" style="margin-top:12px">Cevabı düşün, sonra çevirmek için dokun (Boşluk)</div></div>
  <div class="row" id="grade" hidden><button class="btn bad" data-g="0">Bilemedim</button><button class="btn alt" data-g="1">Zor</button><button class="btn ok" data-g="2">Bildim</button></div>`;
  const flip=()=>{if(flipped)return;flipped=true;$('#ans').hidden=false;$('#hint').hidden=true;$('#grade').hidden=false};
  $('#fl').onclick=flip;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(c,+b.dataset.g));
  window._flip=flip;
}
function grade(c,g){
  const s=cs(),st=s[c.id]||{box:1,due:0};
  if(g===0)st.box=1;else if(g===2)st.box=Math.min(5,st.box+1);
  st.due=Date.now()+(g===0?0:INTERVALS[st.box]*DAY);
  s[c.id]=st;store.set('pz_cards',s);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(g===0)session.push(c);
  sIdx++;
  if(sIdx>=session.length){session=[];renderCards()}else drawCard();
}
document.addEventListener('keydown',e=>{
  if($('#p-cards').classList.contains('on')&&$('#fl')){
    if(e.code==='Space'){e.preventDefault();window._flip&&window._flip()}
    else if(flipped&&['Digit1','Digit2','Digit3'].includes(e.code))$('#grade').querySelectorAll('[data-g]')[+e.code.slice(-1)-1].click();
  }
});

let qz=null;
function renderQuizHome(){
  const wrong=store.get('pz_wrong',[]),best=store.get('pz_best',{});
  $('#p-quiz').innerHTML=`<div class="card"><b>Test oluştur</b><div class="row" style="margin:12px 0" id="qd">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${(qz&&qz.f||0)===f}" data-f="${f}">${f?U+' '+f:'Karışık'}</button>`).join('')+`</div>
  <div class="row"><button class="btn" id="go10">10 soru</button><button class="btn alt" id="go20">20 soru</button><button class="btn alt" id="goall">Hepsi</button><button class="btn alt" id="gow" ${wrong.length?'':'disabled'}>Yanlışlarım (${wrong.length})</button></div>
  <p class="mute" style="margin:12px 0 0">Şıklar her seferinde karışır. Yanlış yaptıkların "Yanlışlarım"a eklenir, doğru yapınca çıkar.</p></div>
  <div class="card mute">En iyi skorlar: ${[0,...NS].map(f=>`${f?U+' '+f:'Karışık'}:${best[f]!=null?best[f]+'%':'—'}`).join(' · ')}</div>`;
  let f=0;

  const start=n=>startQuiz(f,n);
  $('#go10').onclick=()=>start(10);$('#go20').onclick=()=>start(20);$('#goall').onclick=()=>start(999);
  $('#gow').onclick=()=>startQuiz(0,999,true);
}
function startQuiz(f,n,wrongOnly){
  const W=store.get('pz_wrong',[]);
  let pool=QUIZ.map((q,i)=>({...q,id:i})).filter(q=>wrongOnly?W.includes(q.id):(!f||q.d===f));
  pool=shuffle(pool).slice(0,n);
  qz={f,items:pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,order:idx,ans:idx.indexOf(q.a)}}),i:0,score:0,done:false,wrongOnly};
  drawQ();
}
function drawQ(){
  const el=$('#p-quiz');
  if(qz.i>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100);
    if(!qz.wrongOnly){const b=store.get('pz_best',{});if(b[qz.f]==null||pct>b[qz.f]){b[qz.f]=pct;store.set('pz_best',b)}}
    el.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Sonuç</div><div style="font:700 48px Georgia,serif">${qz.score}/${qz.items.length}</div><p class="mute">%${pct} · ${pct>=85?'Güçlü — tekrar aralığını uzatabilirsin.':pct>=60?'İyi gidiyor — yanlışların kartlarını çalış.':'Notlara dön, ilgili kartları çalış, sonra tekrar dene.'}</p><button class="btn" id="again">Yeni test</button></div>`;
    $('#again').onclick=()=>{qz=null;renderQuizHome()};return;
  }
  const q=qz.items[qz.i];
  el.innerHTML=`<div class="mute" style="margin-bottom:6px">${qz.i+1} / ${qz.items.length} · ${esc(DERS[q.d])}</div><div class="bar" style="margin-bottom:12px"><i style="width:${qz.i/qz.items.length*100}%"></i></div>
  <div class="card"><div style="font:600 18px/1.45 Georgia,serif;margin-bottom:8px">${esc(q.q)}</div><div id="opts">${q.order.map((oi,k)=>`<button class="opt" data-k="${k}">${esc(q.o[oi])}</button>`).join('')}</div><div id="fb" hidden></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    el.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)qz.score++;
    const W=store.get('pz_wrong',[]),has=W.includes(q.id);
    if(!ok&&!has)W.push(q.id);if(ok&&has)W.splice(W.indexOf(q.id),1);store.set('pz_wrong',W);
    const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<p style="margin:12px 0 4px"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':'Yanlış'}</b> — ${esc(q.w)}</p><button class="btn" id="nx">${qz.i+1>=qz.items.length?'Sonucu gör':'Sonraki'}</button>`;
    $('#nx').onclick=()=>{qz.i++;drawQ()};$('#nx').focus();
  });
}

/* ---------- practice (procedural generators) ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmt=x=>String(Math.round(x*1000)/1000).replace('.',','), N=x=>x.toLocaleString('tr-TR');
const sum=a=>a.reduce((s,x)=>s+x,0);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mcq=o=>{const s=shuf(o.map((t,i)=>[t,i]));return{opts:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===0)}}; // doğru şık o[0]
const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);if(t.l.op&&PR[t.l.op]<PR[t.op])a=`(${a})`;if(t.r.op&&PR[t.r.op]<=PR[t.op])b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const tbl=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

const GEN={
  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder (kök–sol–sağ)',T.pre],['inorder (sol–kök–sağ)',T.ino],['postorder (sol–sağ–kök)',T.post],['level order (seviye seviye)',T.lvl]]),a=fn(t);
    return{q:`Aşağıdaki ikili ağacın <b>${nm}</b> dolaşma sırasını yaz.`+T.svg(t),type:'txt',a:a.join(''),show:a.join(', '),sol:`Sıra: <b>${a.join(', ')}</b>`}}},
  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(7,9));let t=null;v.forEach(x=>t=T.ins(t,x));
    const ns=T.nodes(t),k=R(0,4),lead=`Boş bir ikili arama ağacına sırasıyla <b>${v.join(', ')}</b> ekleniyor. `;let q,a,type='num';
    if(k===0){a=T.pre(t);q='Ağacın <b>preorder</b> dolaşımını yaz.';type='txt'}
    else if(k===1){a=T.post(t);q='Ağacın <b>postorder</b> dolaşımını yaz.';type='txt'}
    else if(k===2){const c=pick(ns.filter(x=>x.p));a=c.p.v;q=`<b>${c.n.v}</b> düğümünün ebeveyni hangisidir?`}
    else if(k===3){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> vardır?'}
    else{a=Math.max(...ns.map(x=>x.d));q='En derin düğümün <b>derinliği</b> kaçtır? (kök = 0)'}
    const arr=Array.isArray(a);return{q:lead+q,type,a:arr?a.join(''):a,show:arr?a.join(', '):a,sol:'Kural: küçükse sola, büyük veya eşitse sağa. Oluşan ağaç:'+T.svg(t)+(arr?`Cevap: <b>${a.join(', ')}</b>`:'')}}},
  treeprops:{label:'Ağaç terimleri',f(){const t=T.rand(R(7,10)),ns=T.nodes(t),c=pick(ns),k=R(0,4);let q,a;
    if(k===0){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> düğüm vardır?'}
    else if(k===1){a=c.d;q=`<b>${c.n.v}</b> düğümünün <b>derinliği</b> kaçtır? (kökten kenar sayısı, kök = 0)`}
    else if(k===2){a=c.d+1;q=`<b>${c.n.v}</b> düğümünün <b>seviyesi</b> kaçtır? (kök = 1)`}
    else if(k===3){a=(c.n.l?1:0)+(c.n.r?1:0);q=`<b>${c.n.v}</b> düğümünün <b>derecesi</b> (çocuk sayısı) kaçtır?`}
    else{a=ns.filter(x=>x.n.l||x.n.r).length;q='Ağaçta kaç <b>dahili</b> (yaprak olmayan) düğüm vardır?'}
    return{q:q+T.svg(t),type:'num',a,sol:`Cevap: <b>${a}</b>. Derinlik = kökten kenar sayısı, seviye = derinlik + 1, derece = çocuk sayısı, yaprak = çocuğu olmayan düğüm.`}}},
  postfix:{label:'Infix → postfix/prefix',f(){let i=0;const t=exprT(R(3,5),()=>'ABCDEFG'[i++],Object.keys(PR)),pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');
    return{q:`<b>${inf(t)}</b> ifadesinin <b>${pre?'prefix':'postfix'}</b> karşılığını yaz.`,type:'txt',a,show:a,sol:`${pre?'Prefix':'Postfix'}: <b>${a}</b>. En son yapılan işlem (${t.op}) ${pre?'en başa':'en sona'} yazılır; parantez içleri önce kendi ${pre?'prefix':'postfix'} haline getirilir.`}}},
  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);
    const tk=pst(t),st=[],steps=[];tk.forEach(x=>{if(typeof x==='number')st.push(x);else{const b=st.pop(),a=st.pop(),r=ev({op:x,l:{v:a},r:{v:b}});st.push(r);steps.push(`${a} ${x} ${b} = ${r} → yığın: [${st.join(', ')}]`)}});
    return{q:`<b>${tk.join(' ')}</b> postfix ifadesinin değeri kaçtır?`,type:'num',a:v,sol:'Sayıları yığına at; operatör gelince iki eleman çıkar (ikinci çıkan soldadır), sonucu geri at:<br>'+steps.join('<br>')}}},
  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;
    for(let i=0,n=R(6,9);i<n;i++){if(ds.length&&Math.random()<.35){last=S?ds.pop():ds.shift();ops.push(S?'pop()':'dequeue()')}else{const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}}
    if(!ds.length){const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}
    const k=last!=null?R(0,2):R(0,1),q=[S?'Tepede (top) hangi eleman vardır?':'Önde (front) hangi eleman vardır?','Yapıda kaç eleman kalmıştır?',`Son ${S?'pop':'dequeue'} işlemi hangi elemanı çıkarmıştır?`][k];
    return{q:`Boş bir ${S?'yığına (stack)':'kuyruğa (queue)'} sırasıyla şu işlemler uygulanıyor:<div class="raw">${ops.join(', ')}</div>${q}`,type:'num',a:[S?ds[ds.length-1]:ds[0],ds.length,last][k],sol:`Son durum (${S?'alttan tepeye':'önden arkaya'}): [${ds.join(', ')}]. ${S?'LIFO: son giren ilk çıkar.':'FIFO: ilk giren ilk çıkar.'}`}}},
  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,3);
    if(k===0){const v=R(20,200)*1000,s=Math.round(v*R(5,40)/1000),a=s/v*100;return{q:`Bir e-ticaret sitesi ayda <b>${N(v)}</b> ziyaret ve <b>${N(s)}</b> sipariş alıyor. <b>Dönüşüm oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Dönüşüm = sipariş / ziyaret × 100 = ${N(s)} / ${N(v)} × 100 = %${fmt(a)}`}}
    if(k===1){const o=R(5,50)*100,a=R(15,120)*10;return{q:`Aylık gelir <b>${N(o*a)} TL</b>, sipariş sayısı <b>${N(o)}</b>. <b>Ortalama sipariş değeri (AOV)</b> kaç TL'dir?`,type:'num',a,sol:`AOV = gelir / sipariş = ${N(o*a)} / ${N(o)} = ${N(a)} TL`}}
    if(k===2){const m=R(5,40)*100,a=R(5,60)*10;return{q:`Pazarlamaya <b>${N(m*a)} TL</b> harcanarak <b>${N(m)}</b> yeni müşteri kazanıldı. <b>Müşteri edinme maliyeti (CAC)</b> kaç TL'dir?`,type:'num',a,sol:`CAC = pazarlama harcaması / yeni müşteri = ${N(m*a)} / ${N(m)} = ${N(a)} TL`}}
    const s=R(10,80)*100,o=Math.round(s*R(20,80)/100),a=(s-o)/s*100;return{q:`<b>${N(s)}</b> sepet oluşturuldu, bunların <b>${N(o)}</b> tanesi siparişe döndü. <b>Sepet terk oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Sepet terk = (sepet − sipariş) / sepet × 100 = (${N(s)} − ${N(o)}) / ${N(s)} × 100 = %${fmt(a)}`}}},
  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);

  freq:{label:'Frekans tablosu',f(){const n=R(15,20),d=[...Array(n)].map(()=>R(0,5)),cnt=[0,1,2,3,4,5].map(v=>d.filter(x=>x===v).length),v=R(0,4),k=R(0,2);

  weighted:{label:'Ağırlıklı ortalama',f(){const k=R(0,4),wm=(x,w)=>sum(x.map((v,i)=>v*w[i]))/sum(w),

  spread:{label:'Ranj · OMS · varyans · s.sapma',f(){let d,n;do{n=R(4,6);d=[...Array(n)].map(()=>R(1,20))}while(sum(d)%n);

  zscore:{label:'z skoru',f(){const mu=R(40,70),sd=R(5,15),k=R(0,6),Z=()=>pick([-2,-1.5,-1,-.5,.5,1,1.5,2,2.5]);

    if(k===5){const P=[-1,-.5,0,.5,1,1.5,2],ma=R(10,14)*5,mb=R(10,14)*5,sa=2*R(3,7),sb=2*R(3,7);let za,zb;do{za=pick(P);zb=pick(P)}while(za===zb);const xa=ma+za*sa,xb=mb+zb*sb;

  empirical:{label:'Normal dağılım görgül kural',f(){const mu=R(10,14)*5,sd=pick([5,8,10,12,15]),n=pick([200,400,1000,2000,4000]),k=R(0,4),

let gq=null,gsel=store.get('pz_gsel','all');

function renderGen(){
  const st=store.get('pz_gen',{});

  <p class="mute" style="margin:10px 0 0">Sorular her seferinde rastgele sayılarla yeniden üretilir — sınırsız alıştırma. Ondalıkta virgül ya da nokta kullanabilirsin; nihai cevabı virgülden sonra 3 basamağa yuvarla.</p></div><div id="gbox"></div>`;
  $('#gch').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gsel=b.dataset.g;store.set('pz_gsel',gsel);gq=null;renderGen()});
