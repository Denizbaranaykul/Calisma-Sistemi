function newGen(){const g=gsel==='all'?pick(GENS):gsel;gq={g,...GEN[g].f(),done:false}}
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9+\-*/]/g,'');
function parseNum(s){s=String(s).trim().replace(/[%\s]/g,'').replace('−','-');if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))}
function drawGen(){
  const q=gq,b=$('#gbox');
  const inp=q.type==='mc'?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :q.type==='multi'?`<div class="mf">${q.fields.map(([l],i)=>`<label>${esc(l)}<input class="gin" data-f="${i}" autocomplete="off" inputmode="decimal" placeholder="Sayı"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="gchk">Kontrol et</button></div>`
    :`<div class="row"><input id="gin" class="gin" autocomplete="off" inputmode="${q.type==='num'?'decimal':'text'}" placeholder="${q.type==='num'?'Sayı (ör. 2,5)':'Cevabın (ör. A, B, C)'}"><button class="btn" id="gchk">Kontrol et</button></div>`;
  b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div>${inp}<div id="gfb"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>checkGen(+x.dataset.i));
  const gin=$('#gin'),mi=[...b.querySelectorAll('[data-f]')];
  if(mi.length){const vals=()=>mi.map(x=>x.value);$('#gchk').onclick=()=>checkGen(vals());
    mi.forEach((x,i)=>x.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(gq.done)return nextGen();const empty=mi.find(y=>!y.value.trim());empty?empty.focus():checkGen(vals())});mi[0].focus()}
  if(gin){$('#gchk').onclick=()=>checkGen(gin.value);gin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gq.done?nextGen():checkGen(gin.value)}};gin.focus()}
  $('#gshow').onclick=()=>{gq.done=true;showSol(null)};$('#gnext').onclick=nextGen;
}
function nextGen(){newGen();renderGen()}
function checkGen(v){
  if(gq.done)return;
  const numOk=(s,a)=>Math.abs(parseNum(s)-a)<=Math.max(.0015,Math.abs(a)*1e-4);
  if(gq.type==='multi'){const mi=[...$('#gbox').querySelectorAll('[data-f]')],e=mi.find(x=>!x.value.trim());if(e)return e.focus()}
  else if(gq.type!=='mc'&&String(v).trim()==='')return;
  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){
  const s=cs(),counts=[0,0,0,0,0,0];
  CARDS.forEach((_,i)=>counts[(s[i]||{box:1}).box]++);
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));
  const weak=CARDS.map((c,i)=>({...c,id:i,box:(s[i]||{box:1}).box})).filter(c=>c.box<=2&&s[c.id]).slice(0,8);
  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=()=>{if(confirm('Kart, test, alıştırma ve plan ilerlemesi silinsin mi?')){['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
