const NOTES = "# Konu 1 — Ders 1 kaydı: Stratejik yönetim sürecine genel bakış\n\n## Stratejik yönetim nedir?\n- Örgütün **uzun dönemde varlığını sürdürmesi** ve nihai amacına ulaşması; bunu **sürdürülebilir rekabet avantajı** ve **ortalamanın üzerinde getiri** ile sağlar.\n- \"Ortalamanın üzerinde getiri\": pazarda rakiplerin ortalamasından fazla kazanmak; rekabetin devamlılığı buna bağlıdır.\n- Süreç gelişigüzel değil, **yönetilmesi gereken analitik ve dinamik** bir süreçtir (bilgi topla → analiz et → strateji belirle → seç → uygula → kontrol et). Günlük kararlar ayrıdır; stratejik yönetim uzun dönemli ve rekabete dayalı bakar.\n- **Durumsallık yaklaşımı:** tek doğru yoktur, yöntem ve kararlar duruma göre değişir.\n- **Strateji** = bugünkü noktadan (A) ulaşmak istediğimiz noktaya (B) götüren **dinamik plan**.\n\n## Sürecin aşamaları (bütün resim)\n1. **Stratejik bilinç** (yöneticilerde) 2. **Stratejistlerin seçimi ve görevlendirilmesi** → *bu ikisine bir daha dönülmüyor ama sınavda mutlaka soru gelir*\n3. **Stratejik analiz:** dış çevre (genel/uzak çevre + yakın çevre) ve iç çevre (varlık ve yetenekler) → **fırsat-tehdit / güçlü-zayıf yön** → **SWOT** ve durum belirleme matrisleri\n4. **Stratejik yönlendirme:** misyon, vizyon, temel amaç/hedefler, değerler, işin tanımı (\"kutup yıldızı\"; bazı kitaplar başa koyar, aşamalar dinamik olduğu için çok önemli değil)\n5. **Strateji oluşturma:** temel stratejiler + yönetim düzeyine göre stratejiler; alternatifler → **seçim kriteri** → seçim\n6. **Strateji uygulama:** örgüt yapısı, sistemler, insan kaynağı (eğitim/seçim), kültür, liderlik, iletişim → **McKinsey 7S** (strateji, structure/yapı, systems/sistemler, style/yönetim tarzı, staff/personel, skills/yetenekler, shared values/paylaşılan değerler)\n7. **Stratejik kontrol:** son aşama gibi görünse de **her aşamada eş zamanlı** işler; geri/ileri besleme.\n\n## Stratejik bilinç (sınavda kesin)\n- Yöneticilerin şu üç şeyin **farkında olması**:\n  1. İşletmenin çevresi ve dahil olduğu tüm sistemler **sürekli değişiyor**\n  2. **Rakipler** de bu değişime karşı **sürekli strateji geliştiriyor/uygulamalarını değiştiriyor**\n  3. Bu değişimi yönetmek ve rekabet edebilmek için kendi strateji ve uygulamalarını **ona göre ayarlayıp geliştirmek** gerekir\n- Tuzak: **Stratejik körlük ve katılık** — özellikle lider ve kârlı şirketler başarının rehaveti/kibriyle dış çevreyi izlemez, ürününe ve mevcut temel yeteneğine odaklanır (Nokia, Microsoft–Ballmer dönemi).\n\n## Stratejistler (sınavda kesin)\n- Stratejist = sürecte aktif görev yapan, stratejileri belirleyen ve uygulayan kişi.\n- **İki tür:**\n  - **Yönetici stratejistler:** üst, orta, alt düzey **tüm yöneticiler**. **Her yönetici bir stratejisttir** (varsayılan olarak). Son kararı (hangi stratejinin seçileceği ve uygulanması) onlar verir.\n  - **Uzman stratejistler:** işi meslek olarak yapan profesyoneller; bilgi toplar, analiz eder, planlama yapar, alternatif ve **tavsiye** sunar; **karar vermez**. Şirket içinden (stratejik planlama departmanı) veya dışından (danışmanlık firması, serbest uzman, akademisyen) olabilir. Her şirket uzman stratejist istihdam etmek zorunda değil.\n- **Her yönetici stratejisttir ama her stratejist yönetici olmak zorunda değildir.**\n- Üst yönetim: işletme sahipleri, yönetim kurulu, genel müdür/CEO, C-suite (CFO, CTO, CHRO...). Orta: departman müdürleri. Alt: şef, yönetmen, usta.\n- **Nokia vakası:** 2004'te stratejik planlama uzmanları dokunmatik ekranlı internet odaklı bir prototip geliştirdi ve pazarın mobil veri/deneyime kayacağını öngördü; ancak **üst yönetim** maliyeti yüksek buldu, mevcut tuşlu telefon satışlarını baltalamak istemedi, Symbian'a bağlı kaldı (Android'e geçmedi). Uzman analiz yaptı, seçimi yönetim yaptı → sorumluluk yönetimde. Nokia bugün telefon liderliği değil, farklı alanlarda faaliyet gösteriyor.\n- **Microsoft vakası:** Ballmer döneminde akıllı telefon ve bulut dönüşümü yanlış okundu (PC ve Windows'a bağımlılık, stratejik körlük; Nokia satın alımı yanlış platformda başarısız). Yönetim kurulu yeni stratejist olarak **Satya Nadella**'yı seçti (içeriden, bulut bilişimi bilen, öğrenmeye açık, empatik, değişimi okuyabilen). Stratejik bilinç yeniden kuruldu: rakiple savaşmak yerine iş birliği (2016 sonrası), değişim odağa konuldu; şirket yeniden dünyanın en değerlilerinden biri oldu. Üst yönetim değişince tüm stratejiler yeniden hizalanır.\n\n## Strateji türleri (sonraki konular)\n- **Temel (büyüme) stratejileri:** büyüme, küçülme, durağanlık (istikrar), karma. Büyümede ilişkili/ilişkisiz, yatay/dikey alt türler.\n- **Yönetim düzeyine göre:**\n  - *Üst düzey (kurumsal):* ne üreteceğiz, çeşitlendirme/çekilme (artır-azalt-karma)\n  - *Orta düzey (rekabet/iş):* pazarda nasıl rekabet edeceğiz → **maliyet liderliği, farklılaştırma, odaklanma, birleşik** (Porter)\n  - *Alt düzey (işlevsel):* üretim, İK, tedarik, pazarlama departman stratejileri; **bir üst düzeye uygun hizalanmalı**\n- Karar vermek = **birden fazla alternatif arasından seçmek**. Seçim kriteri kişiye/şirkete/önceliklere göre değişir.\n\n## Stratejik kontrol ve açık (gap) analizi\n- **Amaçlanan strateji** (T+1'de ulaşmak istediğimiz durum) ile **gerçekleşen strateji** (mevcut gidişle ulaşacağımız durum) arasındaki fark = **açık**.\n- Üç koşul: açık **önemli mi**, stratejist açığı kapatmak **istekli (arzulu)** mi, kapatılabileceğine **inanıyor** mu? Üçü varsa → stratejileri, uygulamaları veya amaçları gözden geçirip değiştir.\n- Açık **mevcut yöntemlerle kapatılamıyorsa** (çevre öngörülenden bambaşka bir yere gidiyor) → **stratejik pivot**: zamanında, köklü odak/yön değişikliği (Instagram ve Slack başarılı pivot örnekleri).\n- **Pivot başarısızlık itirafı değildir**; dinamik stratejik yönetimin gereğidir. Nokia pivot yapamadığı için değil, **doğru zamanda doğru yönetimi yapamadığı** için geriledi. Pivot: \"mevcut yolun tıkalı olduğunu görüp yeni yol inşa etme becerisi\".\n\n## Fırsat yaklaşımı vs kaynak temelli yaklaşım\n- **Fırsat (dış çevre) yaklaşımı:** dış çevrede boşluk/potansiyel pazar/müşteri segmenti bulup varlık ve yetenekleri ona göre dönüştürmek; stratejinin merkezinde **dış çevre fırsatı** var. Çevik, yenilikçi, risk alan firmalar benimser (örn. OpenAI).\n- **Kaynak temelli yaklaşım:** sürdürülebilir rekabet avantajı şirketin **benzersiz varlık ve yeteneklerinden** gelir; stratejinin merkezinde **içsel yetenekler** var (örn. NVIDIA GPU + yazılım ekosistemi). Ağırlıklı olarak biri; karma da olabilir.\n- Kaynak temelli odak, dış değişimi göz ardı ettiğinde stratejik bilinç/körlük sorununa yol açabilir (kârlı mevcut yetenekler seni katılaştırır).\n\n---\n\n# Konu 2 — Ders 2 kaydı: Dış çevre analizi: genel (uzak) çevre ve yakın çevre\n\n## Dış çevre iki katman\n- **Genel (uzak) çevre:** işletmenin faaliyetlerini doğrudan etkilemeyen ama varlığı için tehdit ve fırsat barındıran unsurlar. Derste sayılanlar: **yasal/politik, ekonomik, sosyo-kültürel (demografik), teknolojik, doğal çevre** (transkriptte \"sekiz aktör\" deniyor ancak tamamı net değil; kitabını/slaytı kontrol et).\n- **Yakın çevre = sektör çevresi = iş çevresi** (üçü aynı anlama gelir; **sınavda üç adla da karşılaşabilirsin**). İşletmenin faaliyetlerini **doğrudan etkileyen ve işletmenin de doğrudan etkilediği** unsurlar; günlük rekabet ve yaşam alanı.\n- Yakın çevre aktörleri: **tedarikçiler, müşteriler, rakipler**, ayrıca **olası (potansiyel) rakipler** ve **ikame ürünler**.\n  - **Müşteri/tüketici:** ürünü satın alan; işletmeler ağırlıklı olarak müşterilerle (aracılarla) çalışır, tüketici nihai kullanıcıdır; gelir buradan gelir.\n  - **Tedarikçi:** ham madde değil; iş gücü, bakım hizmeti, banka (sermaye/kredi), teknoloji dahil girdi sağlayan herkes.\n  - **Rakip:** aynı ya da benzer ürün/hizmeti üretenler. **İkame:** aynı ihtiyacı **farklı şekilde** karşılayan ürün/hizmet.\n\n## Yakın çevre analizinin 3 başlığı\n1. **Ana pazar analizi** 2. **Rekabet analizi** (Porter 5 güç) 3. **Esas rakip (esas firma) analizi**\n\n### 1) Ana pazar analizi\n- **Ana pazar:** ürün ve hizmeti sattığımız, müşterilere ulaştığımız, gelir elde ettiğimiz ve rakiplerle rekabet ettiğimiz yer. **Ana pazarda tedarikçi yoktur** (müşteri ve rakipler vardır).\n- Üç inceleme konusu:\n  1. **Pazar sınırlarının belirlenmesi:** ürün yapısına (ne üretiyoruz; misyonda yazar) veya **coğrafi** sınıra (Denizli, Ege, Türkiye, Avrupa) göre; ikisi birlikte de olur. Sınır değişince müşteri ve rakip sayısı değişir.\n  2. **Pazar yapısı** (firma sayısı, özellikleri, rekabet durumu, giriş-çıkış kolaylığına göre dört tip):\n     - **Monopol:** tek firma, rekabet yok, giriş çok zor (Devlet Demiryolları, bölgesel elektrik/gaz dağıtım, savunma sanayi)\n     - **Oligopol:** birkaç büyük güçlü firma, giriş zor, fiyatlar üzerinde gizli hakimiyet (telekomünikasyon, çip, otomotiv, akaryakıt); sermaye/teknoloji yoğun\n     - **Tam rekabet:** çok sayıda firma, fiyat arz-talepten oluşur, giriş-çıkış kolay (tarım ürünleri, altın/emtia)\n     - **Monopolcü (tekelci) rekabet:** çok firma, giriş kolay ama **farklılaşan** firmalar fiyatlarda kısmen kontrol sahibi (hazır giyim/tekstil, kozmetik, marketler)\n  3. **Pazarın büyüme hızı ve hayat evresi**\n     - **Büyüme hızı** = (bu yılın sektör cirosu − geçen yılın cirosu) / geçen yılın cirosu × 100; **ülkenin büyüme hızıyla karşılaştırılarak** sektörün büyüyüp küçüldüğüne karar verilir.\n     - **Hayat evreleri:** başlangıç (Ar-Ge/yatırım yüksek, nakit akışı eksi), büyüme (satışlar hızla artar; nakit akışı pozitif olmalı, değilse tehlike çanları), olgunluk (doygun, arz-talep dengeli, Ar-Ge düşük, nakit akışı sabit), düşüş (satışlar azalır → çıkış/exit ya da pivot).\n\n### 2) Rekabet analizi — Michael Porter'ın 5 gücü\n- Standart zorunlu bir model değildir; ama en geniş çerçeveyi veren, en yaygın araçtır. Sektörün **karlı mı kanlı mı** olduğunu belirleyen beş güç:\n  1. **Olası (yeni) rakiplerin tehdidi:** çekici sektöre giriş olasılığı yüksek. **Giriş engelleri:** dağıtım kanallarına erişememe, müşterilerin mevcut firmalara bağımlılığı, yüksek sermaye gereksinimi, ölçek ekonomisi, yasal engeller. Ayrıca mevcut rakiplerin **misilleme davranışı**.\n  2. **İkame ürünlerin tehdidi:** müşteri eğilimi ve düşük geçiş maliyeti; fayda–maliyet–kalite denklemi. (WhatsApp→SMS, benzin→elektrikli/hibrit, kablo TV→dijital platform, CD/DVD→Netflix/Blockbuster, fosil yakıt→güneş)\n  3. **Müşterilerin pazarlık gücü:** müşteri alımı işletme cirosunda büyük pay tutuyorsa (>%30 risk), bilinçliyse, ikameye kolay geçebiliyorsa, ürün standartsa/farklılaşmamışsa güçlüdür. (havayolu, e-ticaret, telekom; fason üreticilere karşı Zara/H&M)\n  4. **Tedarikçilerin pazarlık gücü:** tek/az sayıda tedarikçi, farklılaşmış ürün, ikamesi yok, işletme tedarikçinin cirosunda küçük pay, tedarikçinin **ileri entegrasyon** (müşterinin sektörüne girme) tehdidi → güçlüdür. (çip–otomotiv, ekran/pil–akıllı telefon, petrol, BYD batarya)\n  5. **Mevcut rakipler arası rekabetin şiddeti:** firma sayısı çok, pazar büyümesi yavaş, ürünler farklılaşmamış, **çıkış engelleri** yüksek (yasal, özelleşmiş varlık, sermaye yoğunluğu) → şiddetli. (e-ticaret, havayolu, GSM, gıda)\n- **Cazip (çekici) sektör:** olası rakip tehdidi düşük, ikame yok/zayıf, müşteri ve tedarikçi pazarlık gücü düşük, rakipler arası rekabet düşük. Tersi cazip değildir. Cazibeyi ayrıca büyüme hızı, kârlılık, arz-talep dengesi, çözülecek problemlerin karmaşıklığı belirler.\n- Farklı adlar: müşteri = alıcı; olası rakip = yeni girişimlerin tehdidi.\n\n### 3) Esas rakip (esas firma) analizi\n- Her işletmenin günlük kararlarında yakından izlediği bir veya birkaç rakibi vardır (Apple→Samsung, Adidas→Nike). Analiz edilecekler: **esas rakibin amaçları, varsayımları, mevcut stratejileri ve yetenekleri** (ne yapıyor, ne yapabilir, neye hazırlanıyor).\n- **Varsayım:** kontrolümüz dışındaki belirsiz geleceği (2027 büyümesi vb.) öngörme çabası; kör tahmin değil, **bilgiye dayalı** olmalı.\n\n## Bilgi kaynakları\n- Kendi **pazarlama ve satış görevlileri** (sahadan), **fuarlar** (rakip ve tedarikçilerle karşılaşma), **müşteriler**; ayrıca (kitaba göre) üretken yapay zekâ araçları.\n- Dış çevrede bilgi toplayıp **isabetli varsayımlarda** bulunmak hedeflenir.\n\n\n# Konu 3 — Slayt Bölüm 1: Temel kavramlar (örgüt, yönetim, strateji)\n\n## Örgüt ve yönetim\n- **Örgüt:** ortak amaçlar için bir araya gelmiş insanların oluşturduğu yapı; **yönetim:** bu amaçlara kaynakları kullanarak ulaşma süreci.\n- **Etkililik = doğru işi yapmak** (doğru hedefi seçmek); **verimlilik = işi doğru yapmak** (en az kaynakla). Drucker: etkililik olmadan verimlilik anlamsızdır. *HızlıTabak vakası:* paketleme çok verimli ama müşterinin istemediği ürün → verimli ama etkili değil.\n\n## Yönetimin 4 fonksiyonu\n| Fonksiyon | Soru | Ne yapılır? |\n|---|---|---|\n| Planlama | Ne yapmalıyız? | Hedef belirleme, karar verme |\n| Örgütleme | Nasıl yapacağız? | İşleri, kişileri, kaynakları yapılandırma |\n| Yöneltme | Onlara nasıl yaptırırız? | Motivasyon, iletişim, liderlik |\n| Denetim | Yaptık mı? | Ölçme, karşılaştırma, düzeltme |\n\n- *Trendyol Go vakası* bu dört fonksiyonla okunur. **Üst ve orta** kademe daha çok planlama-örgütleme; **alt kademe** daha çok yöneltme-denetim (yürütme) yapar.\n\n## Strateji, plan, taktik, politika\n- **Plan:** statik; ne yapılacağının yol haritası. **Strateji = plan + olası rakip davranışları** → dinamik (SpaceX örneği).\n- **Taktik:** kısa vadeli, nihai sonuca değil anlık hedefe odaklı hamle (ör. *Efsane Günler* kampanyası).\n- **Politika:** kararlara yön veren **rehber/pusula** (çevre politikası, Google'ın %20 serbest zaman politikası).\n- *TazeGelecek vakası* sıralaması: 1 strateji → 2 politika → 3 plan → 4 taktik.\n- **Amaçlanan** (planlanan) strateji + yolda **oluşan** (emergent) strateji → **gerçekleşen** strateji. Amaçlananın bir kısmı gerçekleşmeyebilir.\n\n## Çevre türüne göre strateji düzeyleri\n- **Ansoff'un 5 düzeyi:**\n  1. Tekrarlayan çevre → **kuralcı** (mahalle fırını)\n  2. Tekrarlamayan/yavaş değişen → **deneyimci** (süpermarketin viral kampanyası)\n  3. Farkedilen değişim → **uzantıcı** (otomotivde EV'ye geçiş)\n  4. Devamlı değişim → **ileri tahminci** (akıllı telefon)\n  5. Karmaşık/sürprizli → **yaratıcı** (üretken yapay zekâ)\n- **Mintzberg:** iki eksen — **değişim hızı × karmaşıklık**. Hızlı + karmaşık: YZ, biyoteknoloji; hızlı + basit: hızlı moda; yavaş + karmaşık: hastane, üniversite; yavaş + basit: kağıt, madencilik.\n- **D'Aveni:** hiper-rekabette kalıcı avantaj yoktur; **seri (art arda) manevralarla** geçici avantajlar zinciri kurulur.\n- Güncel örnek tablo: BYD, Shein, Intel, VW, üretken YZ.\n\n# Konu 4 — Slayt Bölüm 2: Dinamik süreç, stratejist ve yönlendirme\n\n## Stratejik yönetim neden dinamik?\n- Çevre sürekli değişir, rakipler sürekli hamle yapar → süreç döngüseldir, kontrol sonuçları başa döner.\n- **Değişimi okuyamayanlar:** Kodak (dijital fotoğraf), Blockbuster (Netflix), Yahoo, Toys \"R\" Us (e-ticaret), BlackBerry ve Nokia (akıllı telefon).\n- *NVIDIA CUDA (2006):* oyun dışı hesaplama için başlatıldı; YZ patlamasıyla değer kazandı → amaçlanan mı oluşan mı tartışması (amaçlanan bir yatırımın beklenmedik oluşan sonucu).\n\n## Uzman stratejist\n- Çevreyi okuyan, ileriyi gören, belirsizlikte karar alabilen, öğrenen ve değişime liderlik eden yönetici.\n\n## Stratejik yönlendirme\n- **Misyon:** örgütün **varoluş nedeni** (neden varız?).\n- **Vizyon:** **arzulanan gelecek durum** (nereye gitmek istiyoruz?).\n- **Amaç/hedef:** vizyonun **zamanlanmış, somut** hali.\n- **McKinsey 7-S:** strateji, yapı, sistemler (katı S'ler) + paylaşılan değerler, stil, personel, beceriler (yumuşak S'ler).\n- **Pivot** (stratejik yön değişikliği): Instagram (Burbn'den), Slack (Glitch oyunundan), YouTube (flört sitesi fikrinden).\n\n## Fırsat yaklaşımı vs kaynak yaklaşımı\n- **Fırsat (dıştan içe):** önce çevredeki fırsat, sonra kaynak (OpenAI: ChatGPT ile pazar fırsatı).\n- **Kaynak (içten dışa):** önce sahip olunan eşsiz kaynak/yetenek, sonra pazar (NVIDIA: GPU yetkinliği).\n- *Microsoft:* Linux ile entegrasyon, \"Önce Bulut, Önce Mobil\", **growth mindset** kültürü → yeniden yönlendirme örneği.\n\n# Konu 5 — Slayt Bölüm 3: Genel (uzak) çevre analizi\n\n## Çevre kavramı\n- **Çevre:** örgütün faaliyetlerini etkileyen tüm unsurlar; örgüt çevrenin istediği çıktıyı ürettikçe **meşruiyet** kazanır. Çevre hem **destekleyici hem sınırlayıcıdır**.\n- **İç çevre:** örgüt içi unsurlar (kaynak, yetenek, faaliyet — denetim altında). **Dış çevre:** sınırlar dışında, örgütü etkileyen/etkileme ihtimali olan, **denetlenmesi zor** unsurlar.\n- Dış çevre = **genel (uzak)** + **sektör/iş (yakın)** çevre. Dış çevrenin iki etkisi: **belirsizlik kaynağı** ve **kaynak deposu** olması.\n- **Çevresel belirsizlik** iki şeye bağlı: **değişen faktör sayısı** ve **değişme hızı**. İkisi de yüksekse yüksek belirsizlik, ikisi düşükse düşük, karışıksa orta.\n\n## Reaktif ve proaktif yaklaşım\n- **Uyumcul/reaktif:** işletme çevreye uyup **kendini değiştirir** (Kodak geçmişte, LCW online alışverişte, McDonald's vejetaryen burger).\n- **Düzenleyici/proaktif:** işletme **çevreyi değiştirir** (Tesla, Apple, Getir, Amazon, Arçelik, Starbucks).\n\n## Genel çevrenin 8 unsuru\nPolitik · Yasal · Ekonomik · Sosyokültürel · Demografik · Teknolojik · Uluslararası · Doğal. İşletmeyle doğrudan temas etmez ama dolaylı etkiler; amaç **fırsat mı tehdit mi** olduğunu ve gelecekteki değişimi tahmin etmek. Süreç her işletmede aynı değildir; her işletme kendine göre sınıflamalıdır.\n\n1. **Politik:** resmi makamların siyasi otoritesini kullandığı ortam — hükümet şekli, rejim, seçimler, istikrar, devletin iş hayatına müdahalesi (özelleştirme/devletleştirme).\n2. **Yasal:** **politik unsurların somut kurallara dönüşmüş hali** — yasalar, teşvikler, yönetmelikler, içtihatlar. Örn. engelli çalıştırma (%3 özel, %4 kamu), sosyal güvenlik izinleri. En çok: ticaret, borçlar, eşya, icra-iflas, vergi, iş hukuku. *TOGG örneği:* politik → yerli üretim ve enerji dönüşümü teşvikleri; yasal → şarj istasyonu mevzuatı (ZES, Sharz.net'e fırsat).\n3. **Ekonomik:** sınırlı kaynakla üretim, tüketim ve bölüşüm ortamı. Alt başlıklar aşağıda.\n4. **Sosyokültürel:** değer yargıları, tutumlar, davranış, yaşam biçimi, kültürel alışkanlıklar (\"**nasıl** yaşıyor, neye değer veriyor?\").\n5. **Demografik:** nüfusun **ölçülebilir** yapısı — sayı, cinsiyet, yaş, eğitim, bölgesel ve gelir dağılımı (\"**kaç** kişi, kim?\"). *Disney+ örneği:* demografik → 20–30 milyon genç dijital abone adayı; sosyokültürel → yerel aile/mahalle dizilerine ilgi → yerel yapım.\n6. **Teknolojik:** Ar-Ge, yenilik, iletişim, bilgi işleme, yapay zekâ.\n7. **Uluslararası:** ülkenin üst sistemi olan dünya — serbest ticaret, gümrük birliği; savaşlar, çip savaşları, yaptırımlar, AB ürün kriterleri, salgınlar.\n8. **Doğal:** doğa dengesinin örgüte etkisi. **Ani krizler → reaktif** (6 Şubat depremi, COVID-19); **yavaş ölçülebilir değişim (iklim) → proaktif** (Denizli tekstilinde su geri kazanımı; sigortacıların riskli bölgeleri sigortalamaması).\n\n## Ekonomik çevrenin alt başlıkları\n- **Konjonktür devreleri:** Kriz (nakit akışı, maliyet kısma) → Canlanma (yeni pazar, büyüme yatırımı) → Refah (rekabet avantajı, marka, uluslararası açılım) → Gerileme (maliyet kontrolü, ürün çeşitliliğini gözden geçirme, risk yönetimi).\n- **Para politikası** (para arzı; TCMB) / **maliye politikası** (vergi ve kamu harcaması; Hazine ve Maliye Bakanlığı).\n- **Enflasyon:** fiyatlar genel düzeyinin sürekli artışı. Ilımlı/yüksek/hiper; kaynağı **talep** (talep>arz) veya **maliyet** (girdi fiyatları). Çok yüksekse gelir dağılımı bozulur, bütçe/ödemeler dengesi bozulur, tasarruf-yatırım kararları değişir.\n- **Milli gelir:** **GSYİH** = üretim **nerede**? (toprak ilkesi; Türkiye'deki Alman fabrikası dahil). **GSMH** = üretimi **kim** yaptı? (vatandaşlık; Türk müteahhidin Katar projesi dahil). İrlanda'da GSYİH ≫ GSMH (yabancı teknoloji devleri, kâr dışarı). Kişi başı = toplam / nüfus; SAGP fiyat farkını eşitler (Türkiye 2026: ~18.500 $ nominal, ~46.670 $ SAGP).\n- **Üretim faktörleri ve karşılıkları:** doğal kaynak → **rant**, emek → **ücret**, sermaye → **faiz**, girişimcilik → **kâr** (tekstil atölyesi örneği).\n- **Dış ödemeler bilançosu (cari işlemler):** ülkenin döviz gelir–giderleri.\n\n## Genel çevre ölçümleme\nUnsurun **olasılık** derecesi · işletmeye **etki** derecesi · **önem** derecesi · işletmenin **hazırlıklı olup olmadığı** · kullanılabilecek **kaynaklar**.\n\n# Konu 6 — Slayt Bölüm 4: İş çevresi (sektör / yakın çevre) analizi\n\n## İş çevresi\n- Girdilerin temin edildiği, ürünlerin satıldığı, rakiplerle mücadele edilen, işletmeyi **doğrudan** etkileyen ve ondan doğrudan etkilenen çevre.\n- **Tüketiciler:** ürünü satın alıp tüketen grup. **Müşteriler:** satın alıp tüketiciye ulaştıran **aracılar** — doğrudan ilişkideki en önemli grup. **Rakipler:** aynı/benzer ürünü aynı müşteriye satanlar. **Tedarikçiler:** iş gücü, sermaye, kredi, hammadde, bilgi sağlayanlar.\n\n## 1) Ana pazar analizi (3 açı)\n- **a. Pazar sınırları:** ürün yapısı (misyondaki ürünler) + coğrafi konum.\n- **b. Pazar yapısı:** firma sayısı, rekabet durumu, giriş-çıkış zorluğu.\n\n| Yapı | Özellik | Örnek |\n|---|---|---|\n| Monopol | Tek firma, giriş yok, fiyatta tam kontrol | TCDD, AYDEM, İSKİ |\n| Oligopol | Birkaç büyük firma, giriş zor | Otomotiv, cep telefonu, THY-Pegasus |\n| Tam rekabet | Çok firma, benzer ürün, kolay giriş, fiyat kontrolü yok | Buğday, borsa |\n| Monopollü rekabet | Çok firma ama farklılaşma (marka, tasarım) | Starbucks, Kahve Dünyası |\n\n- **c. Pazar gelişim hızı** = (cari yıl satışları − geçmiş yıl satışları) / geçmiş yıl satışları × 100; sonuç **ülkenin büyüme hızıyla** kıyaslanır. Örn. 120 → 138 milyon: %15. Yaşam evreleri: başlangıç (negatif nakit) → büyüme → olgunluk → düşüş.\n\n## 2) Rekabet analizi — Porter'ın 5 gücü (slayt ayrıntıları)\n1. **Olası rakiplerin (yeni girişlerin) tehdidi:** çekici sektör (yüksek büyüme ve kârlılık, düşük rekabet) girişi teşvik eder. Bakılır: **giriş engelleri** (dağıtım kanalı, yüksek sermaye, ölçek ekonomisi, marka bağlılığı, maliyet avantajı, geçiş maliyeti, devlet politikası) ve **misilleme** beklentisi.\n2. **İkame ürün tehdidi:** başka sektörde üretilen, aynı ihtiyacı farklı yoldan karşılayan ürün (SMS → WhatsApp, taksi → Uber/Martı TAG, otel → Airbnb, kablolu TV → Netflix, et → bitkisel et). Etkenler: tüketici eğilimleri, geçiş maliyeti, yarar/fiyat/kalite üstünlüğü.\n3. **Tedarikçilerin pazarlık gücü yüksek** olur: tek/farklılaşmış tedarikçi, geçiş maliyeti yüksek, ikamesi yok, bizim sektör onun cirosunda önemsiz, **ileriye doğru entegrasyon** tehdidi var (çip üreticileri, batarya üreticileri, OPEC).\n4. **Müşterilerin pazarlık gücü yüksek** olur: alım miktarı ciroda büyük pay, ürün standart, **geriye doğru entegrasyon** tehdidi, müşteri bilgili, değiştirme maliyeti düşük (havayolu, e-ticaret, GSM numara taşıma, Zara/H&M'ye fason üretim).\n5. **Rakipler arası rekabetin şiddeti:** eş güçte firma sayısı, **düşük pazar büyümesi**, **yüksek çıkış engelleri**, ürünlerin standart olması (BİM-A101-Şok, GSM, kargo).\n\n- **Çekici sektör:** giriş engeli çok, ikame zayıf, tedarikçi ve müşteri gücü düşük, rekabet şiddetsiz. Tersi → çekici değil.\n- *Elektrikli araç 5 güç tablosu:* rekabet **yüksek** (Tesla-BYD-VW fiyat savaşı); yeni giriş **orta-düşük** (Rivian/Lucid zorlanıyor, ama Xiaomi/Huawei girebildi); ikame **orta-yüksek** (hibrit, 2. el ICE, mikromobilite); tedarikçi **yüksek** (batarya maliyetin %30–40'ı, CATL); alıcı **orta-yüksek** (geçiş maliyeti düşük).\n\n## 3) Rakip firma analizi\n- Esas rakip: Coca-Cola–Pepsi, Mercedes–BMW, AWS–Azure, iOS–Android. Analiz: rakibin **gelecek amaçları, varsayımları, mevcut stratejileri, yetenekleri**.\n\n## Dış çevre analizinde teknikler\n1. **Bilgi toplamak** (genel çevre, sektör, rakipler) → 2. **Varsayım geliştirmek** (kontrol dışı gelecek olay hakkında fikir yürütme) → 3. **Tahmin teknikleri** (tespit değil, geleceği anlama süreci).\n\n## İş çevresi ile ilişkilerin yönetimi\n- **Korunma yaklaşımı:** girdi kontrolleri, stoklama, düzenleyici davranışlar, tahmin ve öngörü, ölçek değiştirme.\n- **İşbirliği yaklaşımı:** pazarlık, sözleşme, içeriden ilişki, ortak girişim, stratejik ortaklık, birleşme ve satın alma, meslek birlikleri, resmi makamlarla ilişki.\n- **Stratejik esneklik:** iki yaklaşımı **terazi** gibi dengelemek. Yalnız korunma → hantallık, yüksek maliyet, inovasyonu kaçırma; yalnız işbirliği → bağımsızlık kaybı, aşırı bağımlılık.\n- *Apple:* M çipleri ve iOS'ta **korunma** (\"kale\"), üretimde TSMC ve Foxconn ile **işbirliği** (\"köprü\").\n\n\n# Konu 7 — Ders kaydı: İşletme içi çevre analizi (varlık, yetenek, temel ve dinamik yetenek)\n*Kaynak: ders kaydı (vize öncesi son hafta). Hoca: sınavda konu slaytının **30. sayfasına kadar** sorumlusunuz.*\n\n## Sınav için hatırlatmalar (hocanın tekrarı)\n- Stratejik yönetim: **sürdürülebilir rekabet üstünlüğü** ve **ortalamanın üzerinde getiri** için bilgi toplama → analiz → seçim/karar → uygulama süreci. Önce **stratejik bilinç** (vizyon) gerekir, sonra **stratejistler** seçilir (yönetici ve uzman stratejistler; **yöneticiler ekipte olmazsa olmaz**).\n- **Çevresel analiz = dış çevre + iç çevre analizi.**\n- **Uzak çevre = genel çevre** (aynı anlam; sınavda ikisi de çıkar). Faaliyetleri doğrudan etkilemez ama uzun dönemde varlığı etkiler; şirketi **proaktif** yapar. 8 unsur; özel işletme için en kritiği **ekonomik** çevre. Demografik ve sosyokültürel çevre farkını bil.\n- **Yakın çevre = sektör çevresi = iş çevresi** (üçü aynı; sınavda üç şekilde de çıkar). Aktörler: **tedarikçiler, müşteriler, rakipler**. Ana pazarda tedarikçiler **yoktur**. Porter rekabet analizine ana pazarda olmayan iki unsur ekler: **olası rakipler** (giriş engelleri ve misillemeye dikkat) ve **ikame ürünler** (benzer ürün değil, **aynı ihtiyacı** gideren alternatif). Ayrıca **esas rakip analizi** (varsayımlar, yetenekler, mevcut stratejiler).\n- Kariyer notu: stratejik bilinci olmayan şirkette ilk yıllarda beceri kazan, ama yeni iş bulmadan ayrılma.\n\n## İşletme analizi (iç çevre analizi)\n- **İşletme içi çevre analizi = işletme analizi** (aynı anlam). Metafor: şimdiye kadar canlının yaşadığı ortamı inceledik; şimdi **organlarını, kaslarını** inceliyoruz.\n- Amaç: işletmenin **mevcut durumunu rakiplerine göre** analiz etmek → dış çevreden gelen **fırsat ve tehditler** karşısında rakiplere göre **güçlü ve zayıf yönleri** ortaya çıkarmak (ileride durum belirleme matrisleri / SWOT).\n- **İşletme analizinin 5 alanı** (isim olarak bil; 4 ve 5'in detayından sorumlu değilsin):\n  1. Varlık ve yeteneklerin belirlenmesi\n  2. Bunların **temel yetenek** olup olmadığının belirlenmesi (değerli, nadir, ikame/taklit edilemez ya da zor)\n  3. Rakiplere göre durumun belirlenmesi → **üstünlükler ve zayıflıklar**\n  4. Temel işlevlerin ve finansal işlevlerin analizi (vizeden sonra)\n  5. **Kritik başarı faktörlerinin** analizi\n\n## Varlıklar\n- İşletmenin ürün/hizmet üretirken **sahip olduğu ve kullandığı tüm unsurlar** (üretilen ürün ve hizmetler dahil).\n- **Maddi varlıklar:** fiziksel, gözle görülebilen; **parayla elde edilebilen** unsurlar — makine, teçhizat, bina, ürünler. **Dikkat: iş gücünün SAYISI maddi varlıktır** (500 çalışan, 250 beyaz yaka + 250 mavi yaka).\n- **Maddi olmayan varlıklar:** görünmeyen, **yalnızca parayla elde edilemeyen**, taklidi zor ve **işletmeyi ayırt eden** unsurlar — yıllar içinde oluşan **itibar**, güvenilirlik, marka, patent, bilgi birikimi.\n\n## Yetenekler\n- **Yetenek = varlıkları amaca uygun, koordineli kullanabilme becerisi**; şirketin **insan kaynağının kapasitesine** bağlıdır.\n- *Hocanın deneyimi:* aynı şirketin Denizli, Adana ve Çorlu fabrikaları — aynı ürün, aynı hat, benzer işçi sayısı, aynı patent — ama Adana bir türlü aynı verimi yakalayamıyor. Farkı yaratan **yetenek** (doğru insan kaynağı, motivasyon).\n- Yetenek örnekleri: pazarlamada iyi bir **pazarlama araştırma sistemi**, dijital kanalları iyi kullanma; üretimde **yüksek kapasite kullanımı**, kaliteli üretim; **Ar-Ge**'de kendi Ar-Ge'sini yapıp dışarıya Ar-Ge hizmeti satabilme (yan gelir); finansta kriz dönemlerinde iyi **nakit akışı yönetimi**; İK'da doğru zamanda doğru yere doğru kişi.\n\n## Temel yetenekler\n- Herkesin elde edebileceği sıradan varlık ve yetenekler rekabet üstünlüğü için **yeterli değil** → **temel yetenekler**.\n- Ölçütler: **sektörde değerli** (müşterisi var; inovasyon ticarileşince inovasyondur), **nadir**, **ikame edilemez / taklit edilemez — ya da bunun zor olması** (bugünün teknolojisinde \"hiç taklit edilemez\" pek mümkün değil).\n- Örnekler: **IKEA** (erişilebilir maliyet + tasarım), **Coca-Cola** (rakiplerin kopyalayamadığı tat), **Apple** (görünen: telefon, bilgisayar, saat; gerçek temel yetenek: **kullanıcı deneyimini merkeze alan donanım–yazılım entegrasyonu ve estetik tasarım**; cihazlar arası kusursuz geçiş, yıllarca süren kapalı ekosistem kopyalanamıyor), **Zara** (tasarımdan mağazaya **~15 günlük** çevik tedarik zinciri; üretimin çoğunu yakın coğrafyada tutup mağaza müdürlerinden gelen anlık veriyle yönlendiriyor).\n- Temel yetenekler belirlenirken **doğru şirketlerle kıyaslama (benchmark)** yapılmalı; ortalamanın üzerinde kazananlara bakılmalı.\n- Temel yetenekler **güncellenmeli**: *Samsung* 1938'de balık, erişte, gıda şirketi olarak kuruldu; bugün teknoloji devi. Güncellenmezse → **yetenek tuzağı / temel yetenek kibri** (\"ben bir numarayım, bana ölüm yok\") → çok kârlıyken birkaç yılda yok olma. Gerektiğinde **stratejik pivot**.\n\n## Dinamik yetenekler\n- Kopyalama ve ikame artık çok hızlı; temel yeteneği korumak yetmez → **dinamik yetenek**: değişen ve **gelecekte değişecek** çevreyi görerek yeni yetenekler ekleyebilme, temel yeteneği dönüştürebilme, gerektiğinde yön değiştirebilme (**çeviklik**; evrim kuramı: en güçlü değil, uyum sağlayan ayakta kalır).\n- Dinamik yetenek yalnızca bugün neyi iyi yaptığını değil, **gelecekte hangi iş modeli, hangi pazar, hangi teknoloji** sorusunu yanıtlar.\n- **Nokia (başarısızlık):** sağlam, uzun pil ömürlü donanım ve dev tedarik zinciri yönetiminde dünyanın en iyisiydi; dokunmatik/yazılım odaklı rakiplerle (günde şarj biten telefonlarla) dalga geçti; tüm kültür donanıma odaklı olduğu için yazılıma geçişte çok geç kaldı → temel yeteneğini sürdürülebilir kılamadı.\n- **Microsoft (başarı):** eski temel yetenek masaüstü işletim sistemi ve kutulu lisans satışı; masaüstü tekelinin biteceğini sezdi, **Satya Nadella** ile bulut stratejisine geçti, Office'i rakip platformlara açtı, kurumsal **yapay zekâ** çözümlerine yöneldi.\n- **BYD:** batarya şirketi olarak kuruldu, bu teknolojiyi elektrikli araçlara taşıdı, **Tesla'yı geçti**; araç girdilerinin yaklaşık **%75'ini** kendi üreten dikey entegre yapı → maliyet ve hız avantajı.\n\n# Konu 8 — Ders kaydı: Değer zinciri analizi (Michael Porter)\n\n## Değer nedir?\n- Her faaliyet ve fonksiyon bir **maliyettir**. İşletme değer yaratan veya değere katkı sunan faaliyetleri tespit eder; değer yaratmayanları **elimine eder ya da iyileştirir**.\n- **Değer = müşterinin ödemeye razı olduğu bedel (gelir) − maliyet** → işletmenin cebine kalan (kâr). *Starbucks:* maliyeti ~5 TL olan kahveyi ~200 TL'ye satarak ~195 TL değer yaratır; değer zinciri analizi bu değerin hangi faaliyetlerde yaratıldığını gösterir.\n- Müşteri neden satın alır? Ya piyasadan **daha uygun fiyatlı** olduğunu bilir, ya da piyasadakinden **farklı** bir şey aldığına inanıp **daha fazla öder**.\n- Ortalama getirinin üstüne çıkmanın iki yolu: **maliyeti düşürmek** (fiyat piyasa ortalamasında) ya da **farklılaşarak** müşterinin ödemeye razı olduğu bedeli artırmak (maliyet aynı kalsa da). Stratejik yönetimde \"olduğun yerde saymak\" yok; hep değeri artırmaya çalışılır. Odak: ortalamanın üzerinde kazanan işletmeler.\n- Değer anlamlı olması için: **minimum maliyetle** yaratılmalı ve **rakiplerden fazla** olmalı. Faaliyetler bir **zincir** gibi birbirine bağlıdır (domino etkisi).\n- Porter'ı daha önce **5 güç analizinde** (yakın çevre/rekabet analizi) görmüştük — bağlantı kur!\n\n## Değer zinciri analizi\n- İşletmedeki tüm faaliyetlerin **değer yaratma bakımından sistematik olarak incelendiği**, **rakiplerle kıyaslandığı** analitik araç. Hangi faaliyetlerde maliyet düşürülecek, hangilerinde farklılaşılacak, hangileri elimine edilecek ya da dışarıdan alınacak kararlarını destekler.\n\n| Temel (birincil) faaliyetler — fiziksel üretim ve satışla doğrudan ilgili | Destek faaliyetler — temel faaliyetlerin sağlıklı yürümesini sağlar |\n|---|---|\n| 1. **İç (girdi) lojistik:** hammadde ve yardımcı malzemenin **fiziksel** teslim alınması, taşınması, stoklanması | 1. **Tedarik (satın alma):** girdinin **nereden, hangi şartlarla** alınacağı, spesifikasyon, sözleşme, satın alma departmanı (servis, yemek gibi tüm girdiler) |\n| 2. **Operasyon / üretim:** üretim süreçleri, montaj, kontrol | 2. **Teknoloji geliştirme:** Ar-Ge, süreç tasarımı ve iyileştirme, patentler, kullanılan teknolojiler |\n| 3. **Dış (çıktı) lojistik:** depolama, dağıtım kanalları, teslimat | 3. **İnsan kaynakları yönetimi:** gereken zamanda, gereken nitelikte insanın istihdamı, eğitim |\n| 4. **Pazarlama ve satış:** fiyatlandırma, tutundurma, tanıtım, marka yönetimi | 4. **Firma altyapısı:** yönetim (planlama, organizasyon, kontrol), finans, muhasebe, hukuk |\n| 5. **Satış sonrası hizmet:** garanti, bakım-onarım, müşteri eğitimi | |\n\n- **İnce ayrım (sınavda kesin):** cam üretiminde toprağın **nereden alınacağına karar vermek** → **tedarik (destek)**; toprağın fabrikaya **getirilmesi ve stoklanması** → **iç lojistik (temel)**.\n- Maliyet muhasebesi benzetmesi: ürüne doğrudan giren mavi yaka işçilik **direkt**, mühendis/yönetici **endirekt** (destek) sayılır.\n- Analiz adımları: temel ana ve alt faaliyetleri belirle → destek faaliyetleri belirle → maliyetlerini belirle → yarattıkları değeri belirle → kâr marjını artırmak için hangi faaliyette maliyet düşürülecek, hangisinde farklılaşılacak karar ver → elimine edilecekleri belirle → **rakiplerle kıyasla**. (Adımların detayı sınavda sorulmayacak; büyük resmi bil.)\n- *Apple'ın değer zinciri:* iç lojistik — küresel tedarikçilerden milyonlarca parçanın montaj merkezlerine sevki; operasyon — kendi üretim tesisi yok, tasarım ve test süreçlerine odaklanır; dış lojistik — lansman günü tüm dünyada aynı anda rafta olmak için hava kargo ve etkin depo yönetimi; pazarlama — minimalist, deneyim odaklı; satış sonrası — **Genius Bar, AppleCare**, uzun yazılım desteği → teknik desteği premium hizmete dönüştürür; donanım–yazılım bütünlüğü sayesinde müşteri üretim maliyetinin çok üstünde öder.\n\n## Derste çözülen vakalar (sınavda bu tarz 3–4 soru gelecek)\n- **Kronos (İsviçre, 80 yıllık mekanik saat firması):** Cenevre'de dev fabrika, 450 usta saat işçisi, elmas kesim makineleri, saat mekanizması üzerine 120 patent; en önemli gücü yalnızca kendi mühendislerinin bildiği **sürtünmesiz çark** üretimi. Akıllı saatlerle satışlar %60 düşer; eski yönetim \"bizim işimiz pil değil, mekanik sanat\" diyerek akıllı saate girmeyi reddeder. Yeni CEO mikro-mekanik bilgiyi medikal teknolojiyle birleştirip **pilsiz, vücut ısısıyla çalışan akıllı sağlık saati** üreterek şirketi kurtarır.\n  - Maddi varlıklar: fabrika, 450 usta işçi (sayı), makineler. Maddi olmayan: 80 yılda oluşan **güvenilirlik/itibar**, patentler, sürtünmesiz çark bilgisi. Temel yetenek: **sürtünmesiz çark** (nadir, taklidi zor).\n  - Eski yönetimin hatası: **dış çevre analizini** doğru yapmayıp temel yeteneği dönüştürmemek (**yetenek tuzağı**). Yeni CEO: temel yeteneği dönüştürdü → **dinamik yetenek**.\n- **Yerel kahve zinciri:** 1) Kolombiya'daki çiftçilerden aracısız çekirdek almak için uzman satın alma ekibi → **tedarik (destek)**; 2) çekirdeklerin ana depoya getirilmesi ve şubelere günlük sevkiyatı için soğuk zincir lojistiği → **lojistik (temel)**; 3) baristalara 6 aylık demleme ve iletişim eğitimi → **insan kaynakları (destek)**; 4) damak tadına göre kahve öneren yapay zekâ uygulaması → **teknoloji geliştirme (destek)**; 5) şubelerdeki espresso makinelerinin aylık bakım-onarımı için teknik ekip → kayıtta sınıflama net duyulmuyor (makineler şirketin kendi şubelerinde olduğu için operasyonu destekleyen bakım; hocaya teyit et). Odak: kalite ve deneyimle **farklılaşma** (son soru kayıtta tam duyulmuyor).\n";
const COURSE = {"title": "Stratejik Yönetim", "sub": "Ders kayıtları + Bölüm 1–4 slaytları: kavramlar, yönlendirme, genel ve sektör çevresi, işletme analizi, değer zinciri", "unit": "Konu", "ders": {"1": "Konu 1 · Ders 1 kaydı: süreç, bilinç, stratejistler", "2": "Konu 2 · Ders 2 kaydı: dış çevre ve Porter", "3": "Konu 3 · Bölüm 1: örgüt, yönetim, strateji kavramları", "4": "Konu 4 · Bölüm 2: dinamik süreç ve yönlendirme", "5": "Konu 5 · Bölüm 3: genel (uzak) çevre analizi", "6": "Konu 6 · Bölüm 4: iş çevresi / sektör analizi", "7": "Konu 7 · İşletme analizi: varlık, yetenek, temel ve dinamik yetenek", "8": "Konu 8 · Değer zinciri analizi"}, "gen": ["pazarhiz", "gsyih", "varlik", "degerzinciri"], "extra": ["Hocanın vurguladığı iki konuyu hafızadan yaz: stratejik bilinç (3 madde) ve yönetici/uzman stratejist farkı; ardından Nokia ve Microsoft vakasını bu iki kavramla yorumla", "Seçtiğin bir sektör için Porter 5 gücü tablo yap (her güç: yüksek/düşük + gerekçe) ve sektörün cazip olup olmadığına karar ver", "Genel çevrenin 8 unsurunu (PYESDTUD) seçtiğin bir şirket için birer örnekle doldur", "Alıştırma sekmesinde pazar gelişim hızı ve GSYİH/GSMH sınıflama sorularından en az 8 tane çöz", "Bir şirket seç (Zara, Apple, Starbucks…): maddi ve maddi olmayan varlıklarını, temel yeteneğini ve değer zincirinin 9 faaliyetinden birer örneği yaz"], "quizSplit": 98, "id": "stratejik"};

/* ---------- notes (mini markdown) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>VIS(c)&&(!cardFilter||c.d===cardFilter)));sIdx=0;drawCard()};return}

  });
}

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmt=x=>String(Math.round(x*1000)/1000).replace('.',','), N=x=>x.toLocaleString('tr-TR');
const sum=a=>a.reduce((s,x)=>s+x,0);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mcq=o=>{const s=shuf(o.map((t,i)=>[t,i]));return{opts:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===0)}}; // doğru şık o[0]
const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2,'^':3};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);const ra=t.op==='^';if(t.l.op&&(ra?PR[t.l.op]<=PR[t.op]:PR[t.l.op]<PR[t.op]))a=`(${a})`;if(t.r.op&&(ra?PR[t.r.op]<PR[t.op]:PR[t.r.op]<=PR[t.op]))b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const AVL={
  bf:n=>T.h(n.l)-T.h(n.r),
  ser:t=>t?`(${t.v} ${AVL.ser(t.l)} ${AVL.ser(t.r)})`:'-',

  turn(t,u,d){const f=AVL.find(t,u),g=AVL.find(t,f.p.v),nn=d==='R'?AVL.rotR(g.n):AVL.rotL(g.n);if(g.p)g.p[g.s]=nn;else t=nn;return t},
  // beklenen adımlar: her ekleme bir adım, her tek döndürme bir adım (çift döndürme = 2 adım)

  degerzinciri:{label:'Değer zinciri sınıflama',f(){const K=['İç (girdi) lojistik','Operasyon (üretim)','Dış (çıktı) lojistik','Pazarlama ve satış','Satış sonrası hizmet','Tedarik (satın alma)','Teknoloji geliştirme','İnsan kaynakları yönetimi','Firma altyapısı'];

  varlik:{label:'Varlık · yetenek · temel yetenek',f(){

  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder',T.pre],['inorder',T.ino],['postorder',T.post],['level order',T.lvl]]),a=fn(t);
    return{q:`Aşağıdaki ikili ağacın <b>${nm}</b> dolaşma sırasını yaz.`+T.svg(t),type:'seq',a:a.join(','),show:a.join(', '),sol:`Sıra: <b>${a.join(', ')}</b>`}}},
  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(10,20));let t=null;v.forEach(x=>t=T.ins(t,x));
    const ns=T.nodes(t),k=R(0,4),lead=`Boş bir ikili arama ağacına sırasıyla <b>${v.join(', ')}</b> ekleniyor. `;let q,a,type='num';
    if(k===0){a=T.pre(t);q='Ağacın <b>preorder</b> dolaşımını yaz.';type='seq'}
    else if(k===1){a=T.post(t);q='Ağacın <b>postorder</b> dolaşımını yaz.';type='seq'}

  treeprops:{label:'Ağaç terimleri',f(){const t=T.rand(R(7,10)),ns=T.nodes(t),H=n=>n?1+Math.max(H(n.l),H(n.r)):-1,
    c=pick(ns.filter(x=>x.p&&(x.n.l||x.n.r)).length?ns.filter(x=>x.p&&(x.n.l||x.n.r)):ns.filter(x=>x.p)),v=c.n.v,
    leaf=ns.filter(x=>!x.n.l&&!x.n.r).length,inn=ns.length-leaf,h=H(t),deg=(c.n.l?1:0)+(c.n.r?1:0),ch=H(c.n);

      fields:[['Yaprak sayısı',leaf],['Dahili düğüm sayısı',inn],['Ağacın yüksekliği',h],['Seviye sayısı',h+1],[`${v} derinliği`,c.d],[`${v} seviyesi`,c.d+1],[`${v} derecesi`,deg],[`${v} yüksekliği`,ch]],
      sol:`Yaprak = çocuğu olmayan düğüm → ${leaf} · Dahili = en az bir çocuğu olan → ${inn} (toplam ${ns.length} düğüm) · Ağacın yüksekliği = kökten en uzak yaprağa kenar sayısı → ${h} · Seviye sayısı = yükseklik + 1 → ${h+1}<br><b>${v}</b>: derinlik = kökten ${v}'ye kenar sayısı → ${c.d} · seviye = derinlik + 1 → ${c.d+1} · derece = çocuk sayısı → ${deg} · yükseklik = ${v}'den en uzak yaprağa kenar sayısı → ${ch}`}}},
  postfix:{label:'Infix → postfix/prefix',f(){let i,t,c=0;const has=t=>t.op&&(t.op==='^'||has(t.l)||has(t.r));
    // 4–5 işlem; çoğu soruda en az bir ^ olsun
    do{i=0;t=exprT(R(5,6),()=>'ABCDEFG'[i++],Object.keys(PR))}while(Math.random()<.85&&!has(t)&&++c<200);const pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');
    return{q:`<b>${inf(t)}</b> ifadesinin <b>${pre?'prefix':'postfix'}</b> karşılığını yaz.`,type:'txt',a,show:a,sol:`${pre?'Prefix':'Postfix'}: <b>${a}</b>. En son yapılan işlem (${t.op}) ${pre?'en başa':'en sona'} yazılır; parantez içleri önce kendi ${pre?'prefix':'postfix'} haline getirilir. Öncelik: ^ &gt; * / &gt; + −; ^ sağdan, diğerleri soldan gruplanır.`}}},
  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);
    const tk=pst(t),st=[],steps=[];tk.forEach(x=>{if(typeof x==='number')st.push(x);else{const b=st.pop(),a=st.pop(),r=ev({op:x,l:{v:a},r:{v:b}});st.push(r);steps.push(`${a} ${x} ${b} = ${r} → yığın: [${st.join(', ')}]`)}});
    return{q:`<b>${tk.join(' ')}</b> postfix ifadesinin değeri kaçtır?`,type:'num',a:v,sol:'Sayıları yığına at; operatör gelince iki eleman çıkar (ikinci çıkan soldadır), sonucu geri at:<br>'+steps.join('<br>')}}},
  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;
    for(let i=0,n=R(6,9);i<n;i++){if(ds.length&&Math.random()<.35){last=S?ds.pop():ds.shift();ops.push(S?'pop()':'dequeue()')}else{const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}}
    if(!ds.length){const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}
    const k=last!=null?R(0,2):R(0,1),q=[S?'Tepede (top) hangi eleman vardır?':'Önde (front) hangi eleman vardır?','Yapıda kaç eleman kalmıştır?',`Son ${S?'pop':'dequeue'} işlemi hangi elemanı çıkarmıştır?`][k];
    return{q:`Boş bir ${S?'yığına (stack)':'kuyruğa (queue)'} sırasıyla şu işlemler uygulanıyor:<div class="raw">${ops.join(', ')}</div>${q}`,type:'num',a:[S?ds[ds.length-1]:ds[0],ds.length,last][k],sol:`Son durum (${S?'alttan tepeye':'önden arkaya'}): [${ds.join(', ')}]. ${S?'LIFO: son giren ilk çıkar.':'FIFO: ilk giren ilk çıkar.'}`}}},

  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,5);

    if(k===1){const o=R(5,50)*100,a=R(15,120)*10;return{q:`Aylık gelir <b>${N(o*a)} TL</b>, sipariş sayısı <b>${N(o)}</b>. <b>Ortalama sipariş değeri (AOV)</b> kaç TL'dir?`,type:'num',a,sol:`AOV = gelir / sipariş = ${N(o*a)} / ${N(o)} = ${N(a)} TL`}}
    if(k===2){const m=R(5,40)*100,a=R(5,60)*10;return{q:`Pazarlamaya <b>${N(m*a)} TL</b> harcanarak <b>${N(m)}</b> yeni müşteri kazanıldı. <b>Müşteri edinme maliyeti (CAC)</b> kaç TL'dir?`,type:'num',a,sol:`CAC = pazarlama harcaması / yeni müşteri = ${N(m*a)} / ${N(m)} = ${N(a)} TL`}}

  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);

  if(!key){try{await navigator.clipboard.writeText(p)}catch(e){}
    window.open('https://claude.ai/new?q='+encodeURIComponent(p),'_blank','noopener');
    return show('Soru claude.ai\'de yeni sekmede hazır açıldı (metin panoya da kopyalandı). Cevabın burada yazılmasını istersen API anahtarını gir.')}
  q.aiBusy=true;$('#avAI').disabled=true;show('<span class="mute">Claude adımlarını inceliyor…</span>');
  let Anthropic;
  try{({default:Anthropic}=await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.136.0/+esm'))}
  catch(e){q.aiBusy=false;drawAvl();return show('<b style="color:var(--bad)">Claude kütüphanesi yüklenemedi</b> — internet bağlantını kontrol et.')}
  try{const client=new Anthropic({apiKey:key,dangerouslyAllowBrowser:true});
    const stream=client.beta.messages.stream({model:'claude-opus-5-5',max_tokens:16000,betas:['server-side-fallback-2026-07-01'],fallbacks:'default',messages:[{role:'user',content:p}]});
    let t='';stream.on('text',d=>{t+=d;show(aiMd(t))});
    const m=await stream.finalMessage();
    if(m.stop_reason==='refusal')show(aiMd(t)+'<p class="mute">Claude bu isteği yanıtlamadı.</p>');
    else if(m.stop_reason==='max_tokens')show(aiMd(t)+'<p class="mute">(Cevap uzunluk sınırında kesildi.)</p>')}
  catch(e){show(`<b style="color:var(--bad)">Claude'a ulaşılamadı:</b> ${e instanceof Anthropic.AuthenticationError?'API anahtarı geçersiz.':e instanceof Anthropic.PermissionDeniedError?'Bu anahtarın yetkisi yok.':e instanceof Anthropic.RateLimitError?'Hız sınırına takıldın, biraz sonra tekrar dene.':e instanceof Anthropic.APIConnectionError?'Bağlantı kurulamadı.':esc(String(e.message||e))}`)}
  q.aiBusy=false;if(gq===q)drawAvl()}
function drawGen(){
  const q=gq,b=$('#gbox');
  if(q.type==='avl'){b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div><div id="avlbox"></div><div id="gfb"></div>
    <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
    drawAvl();$('#gshow').onclick=()=>{gq.done=true;showSol(null);drawAvl()};$('#gnext').onclick=nextGen;return}
  const inp=q.type==='mc'?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :q.type==='multi'?`<div class="mf">${q.fields.map(([l],i)=>`<label>${esc(l)}<input class="gin" data-f="${i}" autocomplete="off" inputmode="decimal" placeholder="Sayı"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="gchk">Kontrol et</button></div>`
    :`<div class="row"><input id="gin" class="gin" autocomplete="off" inputmode="${q.type==='num'?'decimal':'text'}" placeholder="${q.type==='num'?'Sayı (ör. 2,5)':q.type==='seq'?'Sayılar (ör. 40, 25, 60)':'Cevabın (ör. A, B, C)'}"><button class="btn" id="gchk">Kontrol et</button></div>`;
  b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div>${inp}<div id="gfb"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>checkGen(+x.dataset.i));
  const gin=$('#gin'),mi=[...b.querySelectorAll('[data-f]')];
  if(mi.length){const vals=()=>mi.map(x=>x.value);$('#gchk').onclick=()=>checkGen(vals());
    mi.forEach((x,i)=>x.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(gq.done)return nextGen();const empty=mi.find(y=>!y.value.trim());empty?empty.focus():checkGen(vals())});mi[0].focus()}
  if(gin){$('#gchk').onclick=()=>checkGen(gin.value);gin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gq.done?nextGen():checkGen(gin.value)}};gin.focus()}
  $('#gshow').onclick=()=>{gq.done=true;showSol(null)};$('#gnext').onclick=nextGen;
}
function nextGen(){newGen();renderGen()}
function checkGen(v){
  if(gq.done)return;
  const numOk=(s,a)=>Math.abs(parseNum(s)-a)<=Math.max(.0015,Math.abs(a)*1e-4);
  if(gq.type==='multi'){const mi=[...$('#gbox').querySelectorAll('[data-f]')],e=mi.find(x=>!x.value.trim());if(e)return e.focus()}
  else if(gq.type!=='mc'&&String(v).trim()==='')return;
  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):gq.type==='seq'?((u,A)=>(u.match(/[A-Z0-9]+/g)||[]).join(',')===A||u.replace(/[^A-Z0-9]/g,'')===A.replace(/,/g,''))(String(v).toUpperCase(),gq.a.toUpperCase()):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){
  const s=cs(),counts=[0,0,0,0,0,0];
  CARDS.forEach((c,i)=>{if(VIS(c))counts[(s[i]||{box:1}).box]++});
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));
  const weak=CARDS.map((c,i)=>({...c,id:i,box:(s[i]||{box:1}).box})).filter(VIS).filter(c=>c.box<=2&&s[c.id]).slice(0,8);
  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.filter(VIS).length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Emin misin? Kart, test, alıştırma ve plan ilerlemesi silinecek — tekrar bas';return}{['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(HIDE.length?NOTES.split(/^(?=# )/m).filter(s=>!HIDE.some(h=>s.startsWith(`# ${U} ${h} `))).join(''):NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
</body>
