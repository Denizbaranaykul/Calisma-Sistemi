<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stratejik Yönetim</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.avl .nd{cursor:pointer}.avl .nd.sel circle{fill:var(--accent)}.avl .nd.sel text{fill:var(--accent-ink)}
.avl .nd.bad circle{stroke:var(--bad);stroke-width:3.5}.avl .bf{font-size:11px;fill:var(--mute);text-anchor:start}.avl .nd.bad .bf{fill:var(--bad);font-weight:700}
.avl.anim line{animation:avfade .4s ease .35s both}@keyframes avfade{from{opacity:0}}
.seqc{display:inline-block;min-width:30px;text-align:center;padding:2px 8px;border-radius:6px;margin:2px;background:var(--soft);font-weight:600}.seqc.done{opacity:.4;text-decoration:line-through}.seqc.next{background:var(--accent);color:var(--accent-ink)}
.seqc.ok{opacity:1;text-decoration:none;background:color-mix(in srgb,var(--ok) 22%,var(--soft))}.seqc.no{opacity:1;text-decoration:none;background:color-mix(in srgb,var(--bad) 22%,var(--soft))}
.avlog{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}.avs{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;background:var(--card)}.avs.ok{border-color:var(--ok)}.avs.no{border-color:var(--bad)}.avs svg{margin:4px auto 0;max-width:none}.avar{color:var(--mute)}
.avmsg{border-left:4px solid var(--line);padding:6px 12px;margin:8px 0;background:var(--soft);border-radius:0 8px 8px 0}.avmsg.ok{border-color:var(--ok)}.avmsg.no{border-color:var(--bad)}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
.xl{overflow-x:auto;margin:8px 0}.xl table{border-collapse:collapse;font:13px/1.3 Calibri,'Segoe UI',system-ui,sans-serif;background:#fff;color:#111}.xl th{background:#f3f3f3;color:#555;font-weight:400;border:1px solid #d4d4d4;padding:2px 6px;text-align:center;min-width:22px}.xl td{border:1px solid #d4d4d4;padding:3px 8px;white-space:nowrap;text-align:left}.xl td.n{text-align:right}.xl td.h{font-weight:700;background:#e9f2ea}
</style>
</head>

<script>
const CARDS = [{"d": 1, "t": "Temel", "f": "Stratejik yönetim neyi amaçlar ve nasıl sağlar?", "b": "Örgütün uzun dönemde varlığını sürdürmesini ve nihai amacına ulaşmasını; bunu sürdürülebilir rekabet avantajı ve ortalamanın üzerinde getiri elde ederek sağlar. Bilgi toplanır, analiz edilir, stratejiler belirlenir, seçilir, uygulanır ve kontrol edilir."}, {"d": 1, "t": "Temel", "f": "'Ortalamanın üzerinde getiri' ne demektir?", "b": "Faaliyet gösterilen pazardaki rakiplerin ortalamasından fazla kazanmak. Rekabetin ve işletmenin sürekliliği ortalamadan fazla kazanmaya bağlıdır."}, {"d": 1, "t": "Temel", "f": "Strateji nedir?", "b": "Bugünkü noktadan (A) ulaşmak istediğimiz noktaya (B) götüren dinamik plan. Plan 'durağan' değil, süreç içinde çevreye göre güncellenen bir plandır."}, {"d": 1, "t": "Temel", "f": "Durumsallık (contingency) yaklaşımı stratejik yönetimde ne anlama gelir?", "b": "Tek bir doğru yoktur; yöntem, yönetim aracı ve kararlar duruma/şirkete göre değişir."}, {"d": 1, "t": "Süreç", "f": "Stratejik yönetim sürecinin aşamalarını sırala.", "b": "Stratejik bilinç → stratejistlerin seçimi/görevlendirilmesi → stratejik analiz (dış çevre + iç çevre, SWOT) → stratejik yönlendirme (misyon, vizyon, amaç, değerler) → strateji oluşturma → strateji uygulama → stratejik kontrol (her aşamada eş zamanlı)."}, {"d": 1, "t": "Süreç", "f": "Stratejik analiz evresi hangi bilgileri üretir?", "b": "Dış çevreden fırsatlar ve tehditler, iç çevreden (varlık ve yetenekler) üstünlükler ve zayıflıklar. Sonuçta SWOT gibi durum belirleme matrisleri oluşur."}, {"d": 1, "t": "Süreç", "f": "Stratejik yönlendirme nedir, neleri içerir?", "b": "Stratejilere yön veren kavramlar: işin tanımı (hangi ürün/pazar/teknoloji), misyon (varlık nedeni), vizyon (ulaşılmak istenen son nokta), temel amaç ve hedefler, değerler. Stratejik yönetimin 'kutup yıldızıdır'; bazı kitaplar sürecin başına koyar."}, {"d": 1, "t": "Süreç", "f": "Strateji uygulama evresinde ne yapılır? 7S nedir?", "b": "Stratejiye uygun örgüt yapısı, sistemler, insan kaynağı (seçme, eğitim), liderlik/yönetim tarzı, iletişim ve örgüt kültürü oluşturulur. McKinsey 7S: strateji, yapı (structure), sistemler, yönetim tarzı (style), personel (staff), yetenekler (skills), paylaşılan değerler (shared values)."}, {"d": 1, "t": "Süreç", "f": "Stratejik kontrol sürecin son aşaması mıdır?", "b": "Son aşama gibi sıralansa da yıl sonunda yapılan bir işlem değildir; sürecin her aşamasında geri ve ileri besleme ile eş zamanlı yürür. Hedeflere ulaşıp ulaşmadığımızı sürekli kontrol eder."}, {"d": 1, "t": "Stratejik Bilinç", "f": "Stratejik bilinç nedir? Üç unsuru?", "b": "Yöneticilerin: 1) çevrenin ve işletmenin dahil olduğu sistemlerin sürekli değiştiğinin, 2) rakiplerin de bu değişime karşı sürekli strateji geliştirip uygulamalarını değiştirdiğinin farkında olması, 3) değişimi yönetmek ve rekabet etmek için kendi strateji ve uygulamalarını buna göre ayarlayıp geliştirmesi."}, {"d": 1, "t": "Stratejik Bilinç", "f": "Stratejik körlük ve katılık nedir, kimler düşer?", "b": "Çevredeki değişimi görememe ve mevcut yeteneğe/ürüne sıkı sıkıya bağlı kalma. Özellikle kendi alanında lider ve kârlı şirketler başarı rehaveti ve kibirle düşer (Nokia, Ballmer dönemi Microsoft). Stratejik bilincin zayıflamasıdır."}, {"d": 1, "t": "Stratejistler", "f": "Stratejist kimdir? İki türü nedir?", "b": "Süreçte aktif görev alan, stratejileri belirleyen ve uygulayan kişi. Türleri: yönetici stratejistler (tüm yöneticiler) ve uzman stratejistler (profesyoneller)."}, {"d": 1, "t": "Stratejistler", "f": "Yönetici stratejist ile uzman stratejist farkı nedir?", "b": "Yönetici stratejist: üst/orta/alt düzey her yönetici; karar verir (hangi strateji seçilecek, uygulama sorumluluğu). Uzman stratejist: bilgi toplar, analiz ve planlama yapar, alternatif ve tavsiye sunar; karar vermez. Şirket içinden veya dışından (danışman, serbest uzman, akademisyen) olabilir; her şirket uzman istihdam etmek zorunda değil."}, {"d": 1, "t": "Stratejistler", "f": "'Her yönetici stratejisttir' cümlesinin tersi doğru mudur?", "b": "Hayır. Her yönetici bir stratejisttir (varsayılan olarak) ama her stratejist yönetici olmak zorunda değildir (uzman stratejistler yönetici olmadan da stratejist sayılır). Sınavda kesin bilinmesi gereken bilgi."}, {"d": 1, "t": "Stratejistler", "f": "Yönetim düzeyleri ve üst yönetimde kimler yer alır?", "b": "Üst: işletme sahipleri, yönetim kurulu, genel müdür/CEO, C-suite (CFO, CTO, CHRO...). Orta: departman müdürleri. Alt: şef, yönetmen, usta. Nereye gideceğin son kararını üst yönetim verir."}, {"d": 1, "t": "Vaka", "f": "Nokia vakasında uzmanlar ve üst yönetim ne yaptı?", "b": "2004'te stratejik planlama uzmanları dokunmatik, internet odaklı prototip geliştirip pazarın mobil veri ve deneyime kayacağını öngördü. Üst yönetim maliyetli buldu, tuşlu telefon satışlarını baltalamak istemedi, mevcut işletim sisteminde kaldı. Analiz uzmanlarındı, seçim ve sorumluluk yönetimdeydi. (Şirket bugün farklı alanlarda faaliyet gösteriyor.)"}, {"d": 1, "t": "Vaka", "f": "Microsoft vakası: sorun, kırılma noktası ve çözüm?", "b": "Ballmer döneminde akıllı telefon ve bulut değişimi okunamadı; PC/Windows'a bağımlılık ve başarı rehaveti (stratejik körlük). Kırılma: yönetim kurulunun yeni stratejist seçimi. Nadella (içeriden, bulut bilen, öğrenmeye açık, empatik) seçildi, stratejik bilinç yeniden kuruldu: rakiple savaş yerine iş birliği, değişim odağa; Microsoft yeniden dünyanın en değerli şirketlerinden oldu."}, {"d": 1, "t": "Stratejiler", "f": "Strateji türlerinin iki ana sınıflaması nedir?", "b": "1) Temel stratejiler (büyüme, küçülme, durağanlık/istikrar, karma) 2) Yönetim düzeyine göre stratejiler (kurumsal, rekabet/iş, işlevsel)."}, {"d": 1, "t": "Stratejiler", "f": "Yönetim düzeylerine göre strateji farkı nedir?", "b": "Üst düzey (kurumsal): ne üreteceğiz, çeşitlendirme/çekilme. Orta düzey (rekabet): pazarda nasıl rekabet ederiz → maliyet liderliği, farklılaştırma, odaklanma, birleşik. Alt düzey (işlevsel): üretim, İK, tedarik gibi departman stratejileri. Alt stratejiler bir üstteki stratejiye uygun hizalanmalıdır."}, {"d": 1, "t": "Stratejiler", "f": "Karar verme nedir? Alternatif ve seçim kriteri ilişkisi?", "b": "Birden fazla alternatif arasından birini seçmektir; alternatif yoksa karar yoktur (zorunlu seçmeli). Seçim kriteri şirkete, önceliklere, değerlere ve kişiye göre değişir; bu yüzden farklı kişiler aynı alternatiflerden farklı seçim yapar."}, {"d": 1, "t": "Kontrol", "f": "Açık (gap) analizi nedir?", "b": "Amaçlanan stratejiyle (T+1'de ulaşmak istediğimiz durum) mevcut gidişle gerçekleşeceği öngörülen strateji arasındaki farkın analizidir. Bir stratejik kontrol mekanizmasıdır."}, {"d": 1, "t": "Kontrol", "f": "Açık analizinde açığı kapatmak için hangi üç koşul aranır, sonra ne yapılır?", "b": "Açık önemli olmalı; stratejist kapatmak konusunda istekli/arzulu olmalı; kapatılabileceğine inancı olmalı. Üçü varsa stratejiyi, uygulamaları (uygulama sorunu) ya da amaçları değiştirmek gerekir."}, {"d": 1, "t": "Kontrol", "f": "Stratejik pivot nedir? Başarısızlık itirafı mıdır?", "b": "Çevre öngörülenden bambaşka bir yöne gidince, mevcut yöntemlerle açık kapanmayacaksa zamanında yapılan köklü odak/yön değişikliği. Başarısızlık itirafı değil, dinamik stratejik yönetimin gereğidir ('yolun tıkalı olduğunu görüp yeni yol inşa etme'). Örnekler: Instagram, Slack."}, {"d": 1, "t": "Kontrol", "f": "Nokia pivot yapamadığı için mi geriledi?", "b": "Hayır; pivot yapmadığı için değil, doğru zamanda doğru yönelimi yapamadığı için. Pivot erken ve doğru zamanda yapılmalı; piyasa olgunlaşıp herkes geçtikten sonra yapılan geçiş sürdürülebilir rekabet avantajı/ortalama üstü getiri sağlamaz."}, {"d": 1, "t": "Yaklaşımlar", "f": "Fırsat yaklaşımı ile kaynak temelli yaklaşımı karşılaştır.", "b": "Fırsat yaklaşımı: dış çevrede boşluk/potansiyel pazar bulup varlık ve yetenekleri ona göre dönüştürmek; merkezde dış fırsat; çevik, yenilikçi, riski sever firmalar (örn. OpenAI). Kaynak temelli: sürdürülebilir avantaj şirketin benzersiz varlık ve yeteneklerinden gelir; merkezde içsel yetenek (örn. NVIDIA). Ağırlık değişir, karma olabilir."}, {"d": 2, "t": "Dış Çevre", "f": "Dış çevrenin iki katmanı nedir?", "b": "Genel (uzak) çevre: işletmeyi doğrudan etkilemeyen ama tehdit/fırsat barındıran unsurlar (yasal/politik, ekonomik, sosyo-kültürel ve demografik, teknolojik, doğal). Yakın çevre (sektör/iş çevresi): faaliyetleri doğrudan etkileyen ve işletmenin de doğrudan etkilediği unsurlar."}, {"d": 2, "t": "Dış Çevre", "f": "Yakın çevre, sektör çevresi ve iş çevresi arasındaki ilişki nedir?", "b": "Üçü aynı anlama gelir. Sınavda yakın çevre analizi, sektör çevresi analizi veya iş çevresi analizi adlarıyla karşılaşılabilir."}, {"d": 2, "t": "Dış Çevre", "f": "Yakın çevrede hangi aktörler yer alır?", "b": "Tedarikçiler, müşteriler, rakipler, olası (potansiyel) rakipler ve ikame ürünler. Günlük rekabetin ve yaşamın geçtiği alandır."}, {"d": 2, "t": "Dış Çevre", "f": "Müşteri, tüketici, tedarikçi, rakip ve ikame ürün tanımları?", "b": "Müşteri/tüketici: ürünü alan (işletmeler çoğunlukla aracı müşterilerle çalışır); gelir kaynağı. Tedarikçi: girdi sağlayan herkes (ham madde, iş gücü, bakım, banka/sermaye, teknoloji). Rakip: aynı/benzer ürünü üreten. İkame: aynı ihtiyacı farklı şekilde karşılayan ürün/hizmet."}, {"d": 2, "t": "Dış Çevre", "f": "Yakın çevre analizinin 3 başlığı nedir?", "b": "1) Ana pazar analizi 2) Rekabet analizi (Porter 5 güç) 3) Esas rakip (esas firma) analizi."}, {"d": 2, "t": "Ana Pazar", "f": "Ana pazar nedir, ana pazarda kim yer almaz?", "b": "Ürün ve hizmetleri sattığımız, müşterilere ulaştığımız, gelir elde ettiğimiz ve rakiplerle rekabet ettiğimiz yer. Ana pazarda tedarikçiler yoktur."}, {"d": 2, "t": "Ana Pazar", "f": "Ana pazar analizinin üç konusu nedir?", "b": "1) Pazar sınırlarının belirlenmesi 2) Pazar yapısı (monopol, oligopol, tam rekabet, monopolcü rekabet) 3) Pazarın büyüme hızı ve hayat evresi."}, {"d": 2, "t": "Ana Pazar", "f": "Pazar sınırı nasıl belirlenir? Sınırı değiştirmek neyi değiştirir?", "b": "Ürün yapısına (ne ürettiğimiz; misyonda yazar) veya coğrafi sınıra (Denizli, Ege, Türkiye, Avrupa) göre; ikisi birlikte de olabilir. Sınır değişince müşteri sayısı ve rakipler değişir; işletme kapasitesine ve sektörüne göre seçer, genişletebilir."}, {"d": 2, "t": "Pazar Yapısı", "f": "Monopol pazarın özellikleri ve örnekleri?", "b": "Tek firma, rekabet yok, giriş çok zor/yok. Çoğunlukla devlet/regülasyon: Devlet Demiryolları, savunma sanayi, bölgesel elektrik ve gaz dağıtım şirketleri (coğrafi tekel)."}, {"d": 2, "t": "Pazar Yapısı", "f": "Oligopol pazar nedir?", "b": "Sektöre hakim birkaç büyük ve güçlü firma; sektörün kararları ve fiyatlar üzerinde gizli hakimiyet; giriş çıkış zor (sermaye/teknoloji yoğun); küçük firmalar etkisiz. Örnekler: telekomünikasyon, çip, otomotiv, akaryakıt, havayolu."}, {"d": 2, "t": "Pazar Yapısı", "f": "Tam rekabet pazarı nedir?", "b": "Çok sayıda firma, fiyat üzerinde kimsenin hakimiyeti yok; fiyat arz-talepten kendiliğinden oluşur; giriş çıkış kolay. Örnekler: tarım ürünleri, altın ve emtia piyasaları. Günlük ürünlerde pek görülmez."}, {"d": 2, "t": "Pazar Yapısı", "f": "Monopolcü (tekelci) rekabet pazarı nedir?", "b": "Benzer ürünü üreten çok firma ve kolay giriş; ama tasarım, ambalaj, marka/değer ile farklılaşan firmalar fiyat üzerinde kısmen kontrol sahibi olur. Örnekler: hazır giyim/tekstil, kozmetik, perakende/marketler."}, {"d": 2, "t": "Ana Pazar", "f": "Pazar büyüme hızı nasıl hesaplanır ve nasıl yorumlanır?", "b": "(Cari dönem sektör cirosu − önceki dönem cirosu) / önceki dönem cirosu × 100. Tek başına anlamsızdır; ülkenin büyüme hızıyla karşılaştırılarak sektörün büyüyüp küçüldüğü yorumlanır. Büyüyen pazar fırsat, daralan pazar olumsuzluk taşır."}, {"d": 2, "t": "Ana Pazar", "f": "Pazarın hayat evreleri ve her evrede nakit akışı/maliyet durumu?", "b": "Başlangıç: Ar-Ge ve yatırım maliyeti yüksek, ölçek yok, nakit akışı eksi. Büyüme: satışlar hızla artar, nakit akışı pozitif olmalı (değilse tehlike çanları). Olgunluk: doygun, arz-talep dengesi, Ar-Ge düşük, nakit akışı sabit. Düşüş: satışlar azalır → çıkış (exit) ya da pivot."}, {"d": 2, "t": "Porter", "f": "Porter'ın 5 gücü nelerdir?", "b": "1) Olası (yeni) rakiplerin tehdidi 2) İkame ürünlerin tehdidi 3) Müşterilerin pazarlık gücü 4) Tedarikçilerin pazarlık gücü 5) Mevcut rakipler arası rekabetin şiddeti. Sektörün 'karlı mı kanlı mı' olduğunu belirler."}, {"d": 2, "t": "Porter", "f": "5 güç analizi zorunlu bir standart mıdır?", "b": "Hayır; rekabet analizinde farklı yöntemler kullanılabilir. Ancak Porter'ın modeli literatürde ve uygulamada en geniş çerçeveyi veren ve en çok kullanılan modeldir; çünkü sadece rakipleri ve müşterileri değil, olası rakipleri ve ikameleri de kapsar. (Sınavda diğer adları da çıkabilir: müşteri = alıcı, olası rakip = yeni girişimlerin tehdidi.)"}, {"d": 2, "t": "Porter", "f": "Olası rakiplerin tehdidi ne zaman yüksektir? Giriş engelleri nelerdir?", "b": "Sektör çekici, giriş engelleri az ve mevcut rakiplerin misilleme davranışı düşükse yüksektir (büyüyen, kârlı pazara girilir). Giriş engelleri: dağıtım kanallarına erişememe, müşterilerin mevcut firmalara bağımlılığı, yüksek sermaye gereksinimi, rakiplerin ölçek ekonomisi, yasal engeller."}, {"d": 2, "t": "Porter", "f": "İkame ürünlerin tehdidi neye bağlıdır? Örnekler?", "b": "Tüketici eğilimi, düşük geçiş maliyeti ve fayda–maliyet–kalite denkleminde ikamenin daha güçlü olması. Örnekler: WhatsApp→SMS, benzin→elektrikli/hibrit, kablo TV→dijital platform, CD/DVD→Netflix (Blockbuster), gazlı içecek→soda/su, fosil yakıt→güneş."}, {"d": 2, "t": "Porter", "f": "Müşterinin pazarlık gücü ne zaman yüksektir?", "b": "Alımı işletmenin cirosunda büyük pay tutuyorsa (örn. %30 üzeri risk), bilinçliyse, ikame ürüne kolay geçiyorsa veya ürün farklılaşmamışsa/alternatif firma varsa. Havayolu, e-ticaret, telekomda yüksek; Zara/H&M karşısında fason üretici zayıf. Çözüm: farklılaşma ve başka müşteri bulma."}, {"d": 2, "t": "Porter", "f": "Tedarikçinin pazarlık gücü ne zaman yüksektir?", "b": "Tek/az tedarikçi veya ürün önemli ölçüde farklılaşmışsa, ikamesi yoksa, sektörün alımı tedarikçinin cirosunda küçük yer tutuyorsa, geçiş maliyeti yüksekse ve tedarikçi ileri entegrasyonla sektöre girebiliyorsa (BYD'nin batarya üretiminden elektrikli araca girmesi). Örnekler: çip→otomotiv, ekran/pil→akıllı telefon, petrol→enerji."}, {"d": 2, "t": "Porter", "f": "Rakipler arası rekabetin şiddetini hangi faktörler artırır?", "b": "Çok sayıda ve benzer güçte firma, yavaş büyüyen/doygun pazar (pay almak için çarpışma), farklılaşmamış ürün/hizmet ve yüksek çıkış engelleri (yasal, özelleşmiş varlık, sermaye yoğunluğu). Örnekler: e-ticaret, hava taşımacılığı, GSM, gıda."}, {"d": 2, "t": "Porter", "f": "5 güç sonucuna göre cazip (çekici) sektör nasıl bir sektördür?", "b": "Olası rakiplerin girme olasılığı düşük, ikame yok ya da geçiş mantıksız, müşteri ve tedarikçi pazarlık gücü düşük, rakipler arası rekabet düşük. Tersi cazip değildir. Ek olarak büyüme hızı, kârlılık, arz-talep dengesi ve çözülecek problemlerin karmaşıklığı da cazibeyi etkiler."}, {"d": 2, "t": "Esas Rakip", "f": "Esas rakip (esas firma) analizi nedir, neleri inceler?", "b": "Her işletmenin günlük davranışlarında yakından izlediği bir ya da birkaç rakibi vardır (Apple→Samsung, Adidas→Nike). Analiz edilenler: esas rakibin amaçları, varsayımları, mevcut stratejileri ve yetenekleri (ne yapıyor, ne yapabilir, neye hazırlanıyor)."}, {"d": 2, "t": "Esas Rakip", "f": "Varsayım nedir, nasıl yapılmalıdır?", "b": "Kontrolümüz dışındaki belirsiz geleceği (örn. 2027 ekonomik büyümesi) öngörme çabası. Belirsiz çevreyi daha belirli hale getirir; kör tahmin değil, nitelikli bilgi toplayarak yapılır. İşletme sadece kendisi değil, esas rakibin varsayımlarını da tahmin etmelidir."}, {"d": 2, "t": "Bilgi Kaynağı", "f": "İşletme dış çevre bilgisini nereden toplar?", "b": "Kendi pazarlama ve satış görevlilerinden (sahadan), fuarlardan (rakip ve tedarikçiler orada olur), müşterilerden; ayrıca (kitaba göre) üretken yapay zekâ araçlarından. Amaç isabetli varsayımlar yapmak."}, {"d": 3, "t": "Kavram", "f": "Etkililik ile verimlilik farkı nedir? (Drucker)", "b": "Etkililik = doğru işi yapmak (doğru hedef). Verimlilik = işi doğru yapmak (en az kaynakla). Etkililik olmadan verimlilik anlamsızdır (HızlıTabak: verimli paketleme ama istenmeyen ürün)."}, {"d": 3, "t": "Fonksiyon", "f": "Yönetimin 4 fonksiyonu ve sordukları sorular?", "b": "Planlama – Ne yapmalıyız? · Örgütleme – Nasıl yapacağız? · Yöneltme – Onlara nasıl yaptırırız? · Denetim – Yaptık mı?"}, {"d": 3, "t": "Fonksiyon", "f": "Denetim fonksiyonunun üç adımı?", "b": "Ölçmek, (standartla) karşılaştırmak, düzeltmek."}, {"d": 3, "t": "Fonksiyon", "f": "Hangi yönetim kademesi hangi fonksiyonlara daha çok zaman ayırır?", "b": "Üst ve orta kademe: planlama ve örgütleme. Alt kademe: yöneltme ve denetim (yürütme)."}, {"d": 3, "t": "Kavram", "f": "Plan ile strateji arasındaki fark?", "b": "Plan statiktir (yol haritası). Strateji = plan + olası rakip davranışları → dinamiktir (SpaceX örneği)."}, {"d": 3, "t": "Kavram", "f": "Taktik nedir? Örnek?", "b": "Kısa vadeli, nihai sonuca değil anlık hedefe odaklı hamle. Örn. Efsane Günler kampanyası."}, {"d": 3, "t": "Kavram", "f": "Politika nedir? Örnek?", "b": "Kararlara yön veren rehber/pusula. Örn. çevre politikası, Google'ın çalışanlara %20 serbest zaman politikası."}, {"d": 3, "t": "Kavram", "f": "Amaçlanan, oluşan ve gerçekleşen strateji ilişkisi?", "b": "Amaçlanan (planlanan) stratejinin gerçekleşen kısmı + süreçte kendiliğinden oluşan (emergent) strateji = gerçekleşen strateji."}, {"d": 3, "t": "Ansoff", "f": "Ansoff'un 5 strateji düzeyi (çevre → strateji)?", "b": "Tekrarlayan → kuralcı (mahalle fırını); tekrarlamayan → deneyimci; farkedilen değişim → uzantıcı (EV'ye geçiş); devamlı değişim → ileri tahminci (akıllı telefon); karmaşık → yaratıcı (üretken YZ)."}, {"d": 3, "t": "Mintzberg", "f": "Mintzberg çevreyi hangi iki eksenle sınıflar? Örnekler?", "b": "Değişim hızı × karmaşıklık. Hızlı-karmaşık: YZ, biyotek; hızlı-basit: hızlı moda; yavaş-karmaşık: hastane, üniversite; yavaş-basit: kağıt, madencilik."}, {"d": 3, "t": "D'Aveni", "f": "D'Aveni'nin hiper-rekabet görüşü?", "b": "Kalıcı rekabet avantajı yoktur; art arda yapılan seri manevralarla geçici avantajlar zinciri kurulur."}, {"d": 4, "t": "Dinamik", "f": "Değişimi okuyamayıp geride kalan şirket örnekleri?", "b": "Kodak, Blockbuster, Yahoo, Toys \"R\" Us, BlackBerry, Nokia."}, {"d": 4, "t": "Dinamik", "f": "NVIDIA CUDA (2006) neden amaçlanan/oluşan strateji tartışmasına örnektir?", "b": "Oyun dışı paralel hesaplama için amaçlanan bir yatırımdı; yapay zekâ patlamasıyla beklenmedik biçimde şirketin ana avantajına dönüştü (oluşan sonuç)."}, {"d": 4, "t": "Yönlendirme", "f": "Misyon, vizyon ve amaç/hedef tanımları?", "b": "Misyon: varoluş nedeni (neden varız?). Vizyon: arzulanan gelecek durum. Amaç/hedef: vizyonun zamanlanmış, somut hali."}, {"d": 4, "t": "Yönlendirme", "f": "McKinsey 7-S'nin unsurları?", "b": "Katı: strateji, yapı, sistemler. Yumuşak: paylaşılan değerler, stil, personel (staff), beceriler (skills)."}, {"d": 4, "t": "Yönlendirme", "f": "Pivot nedir? Örnekler?", "b": "Stratejik yön değişikliği. Instagram (Burbn'den), Slack (Glitch oyunundan), YouTube (flört sitesi fikrinden)."}, {"d": 4, "t": "Yaklaşım", "f": "Fırsat yaklaşımı ile kaynak yaklaşımı farkı ve örnekleri?", "b": "Fırsat: dıştan içe, önce çevredeki fırsat (OpenAI-ChatGPT). Kaynak: içten dışa, önce sahip olunan eşsiz yetenek (NVIDIA-GPU)."}, {"d": 4, "t": "Vaka", "f": "Microsoft'un yeniden yönlendirmesinde öne çıkan üç hamle?", "b": "Linux ile entegrasyon (rakiple işbirliği), \"Önce Bulut, Önce Mobil\" stratejisi, growth mindset (gelişim zihniyeti) kültürü."}, {"d": 5, "t": "Çevre", "f": "Çevre örgüt için neden hem destekleyici hem sınırlayıcıdır?", "b": "Örgüt çevrenin istediği çıktıyı ürettikçe meşruiyet ve kaynak kazanır (destek); çevre aynı zamanda faaliyet sınırlarını belirler (sınır)."}, {"d": 5, "t": "Çevre", "f": "Dış çevrenin işletme üzerindeki iki temel etkisi?", "b": "Belirsizlik kaynağı olması ve kaynak deposu olması."}, {"d": 5, "t": "Çevre", "f": "Çevresel belirsizliği belirleyen iki faktör?", "b": "Değişen faktörlerin sayısı ve faktörlerin değişme hızı. İkisi yüksek → yüksek belirsizlik; ikisi düşük → düşük; karışık → orta."}, {"d": 5, "t": "Yaklaşım", "f": "Reaktif (uyumcul) ve proaktif (düzenleyici) yaklaşım farkı ve örnekleri?", "b": "Reaktif: işletme kendini çevreye uydurur (Kodak geçmişte, LCW online, McDonald's vejetaryen burger). Proaktif: işletme çevreyi değiştirir (Tesla, Apple, Getir, Amazon, Starbucks)."}, {"d": 5, "t": "Genel çevre", "f": "Genel çevrenin 8 unsuru?", "b": "Politik, yasal, ekonomik, sosyokültürel, demografik, teknolojik, uluslararası, doğal."}, {"d": 5, "t": "Genel çevre", "f": "Yasal çevre nasıl tanımlanır? Örnek?", "b": "Politik çevre unsurlarının somut kurallara dönüşmüş hali. Örn. engelli çalıştırma (%3 özel, %4 kamu), TOGG için şarj istasyonu mevzuatı."}, {"d": 5, "t": "Ekonomik", "f": "Ekonomik konjonktürün 4 dönemi ve stratejik yaklaşımları?", "b": "Kriz: nakit akışı, maliyet kısma. Canlanma: yeni pazar, büyüme yatırımı. Refah: rekabet avantajı, marka, uluslararası açılım. Gerileme: maliyet kontrolü, ürün çeşitliliğini gözden geçirme, risk yönetimi."}, {"d": 5, "t": "Ekonomik", "f": "Para politikası ve maliye politikası: araçları ve yürütücüleri?", "b": "Para politikası: para arzı – TCMB. Maliye politikası: vergi ve kamu harcamaları – Hazine ve Maliye Bakanlığı."}, {"d": 5, "t": "Ekonomik", "f": "Enflasyonun iki kaynağı?", "b": "Talep enflasyonu (talep fazla, arz az) ve maliyet enflasyonu (üretim faktörü fiyatlarının artması)."}, {"d": 5, "t": "Ekonomik", "f": "GSYİH ile GSMH farkı?", "b": "GSYİH: üretim nerede yapıldı? (toprak ilkesi – Türkiye'deki Alman fabrikası dahil). GSMH: üretimi kim yaptı? (vatandaşlık – Türk müteahhidin Katar projesi dahil)."}, {"d": 5, "t": "Ekonomik", "f": "İrlanda'da GSYİH neden GSMH'den çok yüksektir?", "b": "Yabancı teknoloji devleri (Google, Apple) orada üretim yapar ama kârın büyük kısmı yurt dışına transfer edilir."}, {"d": 5, "t": "Ekonomik", "f": "Üretim faktörleri ve karşılıkları?", "b": "Doğal kaynak → rant, emek → ücret, sermaye → faiz, girişimcilik → kâr."}, {"d": 5, "t": "Genel çevre", "f": "Demografik ve sosyokültürel çevre farkı (Disney+ örneği)?", "b": "Demografik: ölçülebilir nüfus verisi – kaç kişi, yaş, eğitim (20–30 milyon genç abone adayı). Sosyokültürel: nasıl yaşıyor, neye değer veriyor (aile/mahalle dizilerine ilgi → yerel yapım)."}, {"d": 5, "t": "Genel çevre", "f": "Doğal çevrede reaktif ve proaktif örnekler?", "b": "Ani krizler → reaktif: 6 Şubat depremi, COVID-19. Yavaş ölçülebilir iklim değişimi → proaktif: Denizli tekstilinde su geri kazanımı, sigortacıların riskli bölgeleri sigortalamaması."}, {"d": 5, "t": "Ölçüm", "f": "Genel çevre ölçümleme teknikleri (5)?", "b": "Unsurun olasılık derecesi, işletmeye etki derecesi, önem derecesi, işletmenin hazırlıklı olup olmadığı, kullanılabilecek kaynaklar."}, {"d": 6, "t": "İş çevresi", "f": "Tüketici ile müşteri farkı?", "b": "Tüketici: ürünü satın alıp tüketen grup. Müşteri: ürünü satın alıp tüketiciye ulaştıran aracı; işletmenin doğrudan ilişkideki en önemli grubu."}, {"d": 6, "t": "Ana pazar", "f": "Ana pazar hangi 3 açıdan analiz edilir?", "b": "a) Pazar sınırları (ürün yapısı + coğrafya), b) pazarın yapısı (firma sayısı, rekabet, giriş-çıkış), c) pazarın gelişme hızı / yaşam evresi."}, {"d": 6, "t": "Ana pazar", "f": "4 pazar yapısı ve örnekleri?", "b": "Monopol: TCDD, İSKİ, AYDEM. Oligopol: otomotiv, cep telefonu, havayolu. Tam rekabet: buğday, borsa. Monopollü rekabet: kahve zincirleri (Starbucks, Kahve Dünyası)."}, {"d": 6, "t": "Ana pazar", "f": "Pazar gelişim hızı formülü ve yorumu?", "b": "(Cari yıl satışları − geçmiş yıl satışları) / geçmiş yıl satışları × 100. Sonuç ülkenin büyüme hızıyla kıyaslanır."}, {"d": 6, "t": "Porter", "f": "Sektöre giriş engelleri?", "b": "Dağıtım kanalına erişememe, yüksek sermaye, ölçek ekonomisi, marka bağlılığı/farklılaşma zorluğu, mevcut firmaların maliyet avantajı, yüksek geçiş maliyeti, devlet politikaları."}, {"d": 6, "t": "Porter", "f": "İkame ürün nedir? Rakip olup olmaması neye bağlıdır?", "b": "Başka sektörde üretilen, aynı ihtiyacı farklı yoldan karşılayan ürün (SMS→WhatsApp). Bağlı: tüketici eğilimleri, geçiş maliyeti, yarar/fiyat/kalite üstünlüğü."}, {"d": 6, "t": "Porter", "f": "Rakipler arası rekabetin şiddetini artıran koşullar?", "b": "Eş güçte çok firma, düşük pazar büyümesi, yüksek çıkış engelleri, standart ürünler."}, {"d": 6, "t": "Porter", "f": "Elektrikli araç sektöründe en yüksek iki güç ve nedeni?", "b": "Mevcut rekabet (Tesla-BYD-VW fiyat savaşı) ve tedarikçi gücü (batarya maliyetin %30–40'ı, CATL/BYD/LG'de yoğunlaşma)."}, {"d": 6, "t": "Teknik", "f": "Dış çevre analizinde kullanılan 3 teknik?", "b": "Bilgi toplamak, varsayım geliştirmek, tahmin tekniklerinden yararlanmak."}, {"d": 6, "t": "İlişki", "f": "Korunma ve işbirliği yaklaşımlarının araçları?", "b": "Korunma: girdi kontrolü, stoklama, düzenleyici davranış, tahmin, ölçek değiştirme. İşbirliği: pazarlık, sözleşme, içeriden ilişki, ortak girişim, stratejik ortaklık, birleşme/satın alma, meslek birlikleri, resmi makamlarla ilişki."}, {"d": 6, "t": "İlişki", "f": "Stratejik esneklik nedir? Apple örneği?", "b": "Korunma ve işbirliğini terazi gibi dengelemek. Apple: M çipleri ve iOS'ta korunma (kale), üretimde TSMC ve Foxconn ile işbirliği (köprü)."}, {"d": 7, "t": "Terim", "f": "Sınavda eş anlamlı çıkacak çevre terimleri?", "b": "Uzak çevre = genel çevre. Yakın çevre = sektör çevresi = iş çevresi. İşletme içi çevre analizi = işletme analizi."}, {"d": 7, "t": "Yakın çevre", "f": "Ana pazarda olmayan ama Porter'ın rekabet analizine eklediği iki unsur?", "b": "Olası rakipler (giriş engelleri ve misillemeye dikkat) ve ikame ürünler (aynı ihtiyacı gideren alternatifler). Tedarikçiler de yakın çevrededir ama ana pazarda değildir."}, {"d": 7, "t": "İşletme analizi", "f": "İşletme analizinin amacı nedir?", "b": "İşletmenin mevcut durumunu rakiplerine göre analiz edip dış çevredeki fırsat ve tehditler karşısında güçlü ve zayıf yönlerini (üstünlük/zayıflık) belirlemek."}, {"d": 7, "t": "İşletme analizi", "f": "İşletme analizinin 5 alanı?", "b": "1) Varlık ve yeteneklerin belirlenmesi, 2) temel yetenek olup olmadıkları, 3) rakiplere göre üstünlük ve zayıflıklar, 4) temel ve finansal işlevlerin analizi, 5) kritik başarı faktörleri."}, {"d": 7, "t": "Varlık", "f": "Maddi ve maddi olmayan varlık farkı?", "b": "Maddi: fiziksel, görülebilir, parayla elde edilebilir (makine, bina, ürünler, çalışan sayısı). Maddi olmayan: görünmeyen, yalnızca parayla elde edilemeyen, işletmeyi ayırt eden (itibar, güven, marka, patent, bilgi birikimi)."}, {"d": 7, "t": "Varlık", "f": "İşletmede 500 çalışan bulunması hangi tür varlıktır?", "b": "Maddi varlık (iş gücünün sayısal büyüklüğü). Bu çalışanların becerisi ise yetenekle ilgilidir."}, {"d": 7, "t": "Yetenek", "f": "Yetenek nedir? Aynı varlıklara sahip üç fabrikanın farklı verimliliği neyle açıklanır?", "b": "Varlıkları amaca uygun, koordineli kullanabilme becerisi; insan kaynağının kapasitesine bağlıdır. Fabrikalar arası fark yetenekten (doğru insan, motivasyon) kaynaklanır."}, {"d": 7, "t": "Temel yetenek", "f": "Bir yeteneğin temel yetenek sayılmasının ölçütleri?", "b": "Sektörde değerli olması (müşterisi olması), nadir olması, ikame veya taklit edilememesi ya da edilmesinin zor olması."}, {"d": 7, "t": "Temel yetenek", "f": "Apple'ın görünen ürünleri ve gerçek temel yeteneği?", "b": "Görünen: telefon, bilgisayar, saat. Temel yetenek: kullanıcı deneyimini merkeze alan donanım–yazılım entegrasyonu ve estetik tasarım (kapalı ekosistem, cihazlar arası kusursuz geçiş)."}, {"d": 7, "t": "Temel yetenek", "f": "Zara'nın temel yeteneği nedir, neden kopyalanamaz?", "b": "Tasarımdan mağazaya ~15 günlük çevik tedarik zinciri. Üretimin çoğunu yakın coğrafyada tutar ve mağaza müdürlerinden gelen anlık verilerle yönlendirir; yıllar içinde kurulmuş bir sistemdir."}, {"d": 7, "t": "Temel yetenek", "f": "Yetenek tuzağı (temel yetenek kibri) nedir? Örnek?", "b": "Para kazandıran temel yeteneğe güvenip onu güncellememek ('bana ölüm yok'). Nokia donanımda en iyiydi ama yazılıma geçişi kaçırdı."}, {"d": 7, "t": "Dinamik yetenek", "f": "Dinamik yetenek nedir?", "b": "Değişen ve gelecekte değişecek çevreyi görerek yeni yetenekler geliştirme, temel yeteneği dönüştürme ve gerekirse yön değiştirme (pivot) becerisi; gelecekteki iş modeli, pazar ve teknoloji sorularını yanıtlar."}, {"d": 7, "t": "Dinamik yetenek", "f": "Microsoft dinamik yeteneği nasıl gösterdi?", "b": "Masaüstü işletim sistemi ve kutulu lisans gelirinin biteceğini sezdi; Satya Nadella ile buluta geçti, Office'i rakip platformlara açtı, kurumsal yapay zekâ çözümlerine yöneldi."}, {"d": 7, "t": "Dinamik yetenek", "f": "BYD ve Samsung örnekleri neyi gösterir?", "b": "Temel yeteneğin dönüştürülmesini: BYD batarya üreticisiyken elektrikli araç lideri oldu (girdilerin ~%75'i kendi üretimi); Samsung 1938'de gıda şirketi olarak kuruldu, bugün teknoloji devi."}, {"d": 8, "t": "Değer", "f": "Değer zincirinde 'değer' nasıl tanımlanır? Starbucks örneği?", "b": "Değer = müşterinin ödemeye razı olduğu bedel − maliyet. Starbucks ~5 TL maliyetli kahveyi ~200 TL'ye satarak ~195 TL değer yaratır."}, {"d": 8, "t": "Değer", "f": "Ortalama getirinin üstüne çıkmanın iki yolu?", "b": "Maliyeti rakiplerden düşük tutmak (fiyat piyasa ortalamasındayken) ya da farklılaşarak müşterinin ödemeye razı olduğu bedeli artırmak."}, {"d": 8, "t": "Değer zinciri", "f": "Değer zinciri analizi nedir, kime aittir?", "b": "Michael Porter'ın aracı: işletmedeki tüm faaliyetleri değer yaratma açısından sistematik inceleyip rakiplerle kıyaslar; nerede maliyet düşürüleceğine, nerede farklılaşılacağına, neyin elimine edileceğine karar verdirir."}, {"d": 8, "t": "Değer zinciri", "f": "Değer zincirinin 5 temel (birincil) faaliyeti?", "b": "İç (girdi) lojistik, operasyon/üretim, dış (çıktı) lojistik, pazarlama ve satış, satış sonrası hizmet."}, {"d": 8, "t": "Değer zinciri", "f": "Değer zincirinin 4 destek faaliyeti?", "b": "Tedarik (satın alma), teknoloji geliştirme (Ar-Ge), insan kaynakları yönetimi, firma altyapısı (yönetim, finans, muhasebe, hukuk)."}, {"d": 8, "t": "Değer zinciri", "f": "İç lojistik ile tedarik arasındaki ince fark?", "b": "Girdinin nereden ve hangi şartlarla alınacağına karar vermek tedariktir (destek); girdinin fabrikaya fiziksel olarak taşınması ve stoklanması iç lojistiktir (temel)."}, {"d": 8, "t": "Değer zinciri", "f": "Apple'ın değer zincirinde satış sonrası hizmet örneği?", "b": "Genius Bar, AppleCare ve uzun yazılım desteği; teknik desteği premium hizmete dönüştürür."}, {"d": 8, "t": "Vaka", "f": "Kronos vakası: temel yetenek, eski yönetimin hatası, yeni CEO'nun yaptığı?", "b": "Temel yetenek: yalnızca kendi mühendislerinin bildiği sürtünmesiz çark. Eski yönetim dış çevreyi okuyamayıp akıllı saati reddetti (yetenek tuzağı). Yeni CEO mikro-mekaniği medikal teknolojiyle birleştirip pilsiz akıllı sağlık saati üretti (dinamik yetenek)."}, {"d": 8, "t": "Vaka", "f": "Kahve zinciri vakası: uzman satın alma ekibi, soğuk zincir sevkiyatı, barista eğitimi, YZ uygulaması hangi faaliyetler?", "b": "Satın alma ekibi → tedarik (destek); depoya getirme ve şubelere sevkiyat → lojistik (temel); barista eğitimi → insan kaynakları (destek); YZ kahve öneri uygulaması → teknoloji geliştirme (destek)."}];
const QUIZ = [{"d": 1, "q": "Stratejik yönetimin temel amacı hangi seçenekte doğru verilmiştir?", "o": ["Günlük işleri yönetmek", "Uzun dönemde varlığını sürdürmek; sürdürülebilir rekabet avantajı ve ortalama üstü getiri elde etmek", "Maliyetleri sıfırlamak", "Rakipleri pazardan silmek"], "a": 1, "w": "Stratejik yönetim uzun dönemli, rekabete dayalı ve ortalama üstü getiriyi hedefler."}, {"d": 1, "q": "Aşağıdakilerden hangisi stratejik bilincin unsurlarından biri DEĞİLDİR?", "o": ["Çevrenin sürekli değiştiğinin farkında olmak", "Rakiplerin de sürekli strateji geliştirdiğinin farkında olmak", "Strateji ve uygulamaları değişime göre ayarlamak", "Bugünkü başarılı ürüne odaklanıp dış çevreyi izlememek"], "a": 3, "w": "Dış çevreyi izlememek stratejik körlüktür; bilinç, değişimin ve rakiplerin farkında olmaktır."}, {"d": 1, "q": "Özellikle lider ve kârlı şirketlerin düştüğü, başarı rehaveti kaynaklı değişimi görememe durumuna ne denir?", "o": ["Stratejik pivot", "Stratejik körlük ve katılık", "Açık analizi", "Esas rakip analizi"], "a": 1, "w": "Başarılı şirketler dış çevreyi izlemeyip mevcut yeteneğe takılabilir (Nokia, Ballmer dönemi Microsoft)."}, {"d": 1, "q": "Hangi cümle doğrudur?", "o": ["Her stratejist bir yöneticidir", "Her yönetici bir stratejisttir ama her stratejist yönetici olmak zorunda değildir", "Yalnızca üst yönetim stratejisttir", "Uzman stratejist her zaman son karar verendir"], "a": 1, "w": "Yöneticiler default stratejisttir; uzman stratejistler yönetici olmadan da stratejisttir."}, {"d": 1, "q": "Uzman stratejistlerin sürece katkısı hangisidir?", "o": ["Hangi stratejinin seçileceğine son kararı vermek", "Bilgi toplamak, analiz ve planlama yapmak, alternatif/tavsiye sunmak", "Stratejileri uygulamak", "Sadece muhasebe tutmak"], "a": 1, "w": "Uzmanlar analiz ve öneri sunar; seçim ve uygulama sorumluluğu yöneticilerdedir."}, {"d": 1, "q": "Nokia vakasında uzman stratejistler ile üst yönetim arasındaki ilişki nasıldı?", "o": ["Uzmanlar yanlış analiz yaptı", ğişime göre sürekli yeni hamleler yaptığını bilip kendi stratejilerini buna göre ayarlıyorsa hangi kavram işliyor demektir?", "o": ["Stratejik körlük", "Stratejik katılık", "Durumsallık yaklaşımı", "Stratejik bilinç"], "a": 3, "w": "Stratejik bilinç: çevrenin değiştiğinin, rakiplerin de buna göre strateji geliştirdiğinin ve kendi stratejini ayarlaman gerektiğinin farkında olmak."}, {"d": 1, "q": "Stratejik yönetim sürecinde 'bir daha dönülmeyen ama sınavda mutlaka sorulan' ilk iki aşama hangileridir?", "o": ["Stratejik bilinç ve stratejistlerin seçimi", "Stratejik analiz ve SWOT", "Strateji uygulama ve kontrol", "Misyon ve vizyon belirleme"], "a": 0, "w": "Süreç: 1) stratejik bilinç 2) stratejistlerin seçimi → sonra analiz, yönlendirme, oluşturma, uygulama, kontrol."}, {"d": 1, "q": "Stratejik kontrol aşaması için hangisi doğrudur?", "o": ["Yalnızca strateji uygulandıktan sonra yapılır", "Son aşama gibi görünse de her aşamada eş zamanlı işler", "Yalnızca uzman stratejistlerin görevidir", "Sadece finansal sonuçları ölçer"], "a": 1, "w": "Kontrol geri/ileri beslemeyle sürecin her aşamasında işler."}, {"d": 1, "q": "Bir danışmanlık firması şirket için üç strateji alternatifi hazırlayıp sunuyor; hangisinin uygulanacağına kim karar verir?", "o": ["Danışmanlık firması", "Stratejik planlama departmanı", "Yönetici stratejistler (üst yönetim)", "Hissedar olmayan uzmanlar"], "a": 2, "w": "Uzman stratejist tavsiye sunar, karar vermez; son kararı yönetici stratejistler verir."}, {"d": 1, "q": "Gap (açık) analizinde açığı kapatmak için stratejist açığın önemli olduğunu düşünüyor ve kapatmak istiyor, ama kapatılabileceğine inanmıyor. Ne olur?", "o": ["Üç koşul sağlanmadığı için değişiklik süreci başlamaz", "Hemen stratejik pivot yapılır", "Amaçlar otomatik olarak düşürülür", "Uzman stratejist kararı devralır"], "a": 0, "w": "Üç koşul birlikte gerekir: açık önemli, stratejist istekli ve kapatılabileceğine inanıyor."}, {"d": 1, "q": "Gap analizinde 'amaçlanan strateji' neyi ifade eder?", "o": ["Mevcut gidişle ulaşacağımız durumu", "Rakibin hedeflediği durumu", "T+1 döneminde ulaşmak istediğimiz durumu", "Geçen yıl gerçekleşen durumu"], "a": 2, "w": "Amaçlanan = ulaşmak istediğimiz; gerçekleşen = mevcut gidişle ulaşacağımız. Fark = açık."}, {"d": 1, "q": "Nokia'nın gerilemesinin asıl nedeni derste nasıl açıklandı?", "o": ["Uzman stratejistlerinin hiç analiz yapmaması", "Pivot yapmanın başarısızlık itirafı olması", "Pazarın tam rekabet yapısında olması", "Doğru zamanda doğru yönetimi (seçimi) yapamaması"], "a": 3, "w": "Uzmanlar dokunmatik prototipi önerdi; üst yönetim reddetti. Sorun zamanında doğru kararı verememek."}, {"d": 1, "q": "'Tek doğru yoktur, yöntem ve kararlar duruma göre değişir' görüşü hangisidir?", "o": ["Kaynak temelli yaklaşım", "Durumsallık yaklaşımı", "Fırsat yaklaşımı", "Stratejik körlük"], "a": 1, "w": "Durumsallık yaklaşımı: duruma göre değişen doğrular."}, {"d": 1, "q": "Alt düzey (işlevsel) stratejiler için hangisi doğrudur?", "o": ["Ne üreteceğimize karar verir", "Maliyet liderliği ve farklılaştırmayı belirler", "Üretim, İK, pazarlama gibi departman stratejileridir ve bir üst düzeye uygun hizalanmalıdır", "Yönetim kurulunca belirlenir ve üst düzeyden bağımsızdır"], "a": 2, "w": "İşlevsel stratejiler departman düzeyindedir ve rekabet/kurumsal stratejiyle hizalanır."}, {"d": 1, "q": "McKinsey 7S modeli stratejik yönetim sürecinin hangi aşamasında kullanılır?", "o": ["Stratejik analiz", "Stratejik bilinç", "Strateji uygulama", "Stratejistlerin seçimi"], "a": 2, "w": "7S: strateji, yapı, sistemler, stil, personel, yetenekler, paylaşılan değerler → uygulama aşaması."}, {"d": 2, "q": "Bir bankanın işletmeye kredi sağlaması yakın çevrede hangi aktör rolüdür?", "o": ["Müşteri", "Rakip", "İkame", "Tedarikçi"], "a": 3, "w": "Tedarikçi yalnızca hammadde değil; sermaye/kredi, iş gücü, teknoloji sağlayan herkes."}, {"d": 2, "q": "Pazar sınırları Denizli'den tüm Türkiye'ye genişletilirse ne olur?", "o": ["Pazar yapısı mutlaka monopo gücüne örnektir?", "o": ["Olası rakiplerin tehdidi", "Müşterilerin pazarlık gücü", "Rakipler arası rekabet", "İkame ürünlerin tehdidi"], "a": 3, "w": "Aynı ihtiyacı (konaklama) farklı yoldan karşılıyor → ikame."}, {"d": 2, "q": "Bir otomobil üreticisinin, ihtiyaç duyduğu çipi dünyada yalnızca iki firmanın üretmesi hangi gücü artırır?", "o": ["Müşterilerin pazarlık gücü", "Tedarikçilerin pazarlık gücü", "İkame tehdidi", "Olası rakip tehdidi"], "a": 1, "w": "Az sayıda ve farklılaşmış tedarikçi → tedarikçi gücü yüksek."}, {"d": 2, "q": "Büyük bir perakendecinin kendi markalı ürünlerini üretmeye başlama tehdidi hangi gücü artırır?", "o": ["Tedarikçilerin pazarlık gücü (ileriye entegrasyon)", "Müşterilerin pazarlık gücü (geriye doğru entegrasyon)", "İkame ürün tehdidi", "Rakipler arası rekabet"], "a": 1, "w": "Müşterinin tedarikçinin işine girmesi = geriye doğru entegrasyon → müşteri gücü artar."}, {"d": 2, "q": "Hangisi bir sektörü cazip (çekici) KILMAZ?", "o": ["Müşterilerin pazarlık gücünün yüksek olması", "Giriş engellerinin yüksek olması", "İkamelerin zayıf olması", "Rakipler arası rekabetin düşük olması"], "a": 0, "w": "Cazip sektör: giriş engeli yüksek, ikame zayıf, müşteri/tedarikçi gücü düşük, rekabet düşük."}, {"d": 2, "q": "Esas rakip analizinde rakibin 'varsayımları' neyi ifade eder?", "o": ["Rakibin bilançosundaki varlıklarını", "Rakibin kontrol dışındaki gelecek hakkındaki bilgiye dayalı öngörülerini", "Rakibin geçmiş satış rakamlarını", "Rakibin tedarikçi listesini"], "a": 1, "w": "Varsayım: belirsiz gelecek hakkında bilgiye dayalı öngörü."}, {"d": 6, "q": "Bir sektörde batarya maliyeti ürün maliyetinin %30–40'ını oluşturuyor ve birkaç dev üretici var. Elektrikli araç 5 güç tablosunda tedarikçi gücü nasıl değerlendirildi?", "o": ["Düşük", "Orta-düşük", "Yüksek", "Yok"], "a": 2, "w": "EV tablosu: tedarikçi gücü yüksek (CATL vb.)."}, {"d": 6, "q": "Elektrikli araç sektöründe Rivian/Lucid'in zorlanması ama Xiaomi/Huawei'nin girebilmesi hangi gücün 'orta-düşük
