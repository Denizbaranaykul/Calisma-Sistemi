const NOTES = "# Hafta 2 — Elektronik ticaretin tanımı, türleri, süreç, gelir modelleri ve göstergeler\n\n## Tanım (Bölüm 3)\n- **Belirleyici unsur: siparişin özel olarak tasarlanmış bir elektronik sistem üzerinden verilmesi.**\n- Bir işlemi e-ticaret yapan **üç ölçüt**:\n  1. **Ekonomik değer:** mal, hizmet veya bilgi ekonomik değere sahip olmalı.\n  2. **En az iki taraf:** satın alma, satış veya değişim işlemi gerçekleşmeli.\n  3. **Elektronik sipariş sistemi:** sipariş bu amaçla tasarlanmış bilgisayar ağı üzerinden oluşturulmalı (web sitesi, mobil uygulama, pazar yeri, EDI, işletmeler arası sipariş portalları).\n- **Sipariş belirleyicidir; ödeme ve teslimat değişebilir:**\n\n| Aşama | Elektronik olması zorunlu mu? | Örnek |\n|---|---|---|\n| Sipariş | **Evet** | İnternet sitesindeki alışveriş sepeti |\n| Ödeme | Hayır | Çevrim içi kart ödemesi veya kapıda ödeme |\n| Teslimat | Hayır | Dosya indirme veya kargo |\n- İnternetten sipariş edilen masa, ödeme teslimatta yapılsa bile **e-ticarettir**. Ürün internette görülüp sipariş mağazada verilirse (dar istatistiksel tanıma göre) **e-ticaret değildir**.\n\n## E-ticaret ve e-işletmecilik (Bölüm 4)\n- **E-ticaret:** dış çevreyle alım-satım işlemleri. **E-işletmecilik:** işletmenin bütün iç ve dış süreçleri (üretim, stok, tedarik, finans, İK, CRM, müşteri hizmetleri).\n- **E-ticaret, e-işletmeciliğin (daha dar) bir alt alanıdır.**\n\n## Ekonomik büyüklük (Bölüm 5)\n- E-ticaret yalnızca tüketici alışverişi değildir; **işletmeler arası (B2B) işlemler toplam hacmin önemli bölümünü** oluşturur.\n- **27 trilyon ABD doları:** 43 ekonomide işletmelerin 2022 e-ticaret satışları. **%60:** 2016–2022 dönemindeki yaklaşık büyüme. Sınır: veri dünyanın tamamını değil, raporlanan 43 ekonomiyi kapsar.\n\n## Taraflarına göre türler (Bölüm 6)\n| Boyut | B2B (işletmeden işletmeye) | B2C (işletmeden tüketiciye) |\n|---|---|---|\n| Taraflar | İki işletme | İşletme ve nihai tüketici |\n| İlişki | Daha sürekli, sözleşme ağırlıklı | Daha geniş müşteri kitlesi |\n| Fiyat | Müzakere, miktar indirimi, vade | Çoğunlukla ilan edilen fiyat |\n| Kritik başarı | Entegrasyon, güvenilirlik, teslim koşulları | Deneyim, güven, ödeme, teslimat ve iade |\n- B2B siparişleri çoğunlukla daha yüksek tutarlı; B2C'de kullanıcı deneyimi daha belirleyici.\n- **C2C (tüketiciden tüketiciye):** bireyler başka bireylere ürün/hizmet sunar; platform ilan, ödeme, kimlik doğrulama, puanlama ve uyuşmazlık çözümü sağlayabilir (ikinci el ürünün çevrim içi pazar yerinde satılması).\n- **C2B (tüketiciden işletmeye):** birey işletmeye ekonomik değeri olan içerik/hizmet/ürün sunar; satıcı-alıcı rolleri tersine döner (serbest çalışanın işletmeye çevrim içi tasarım hizmeti).\n- **Kamu bağlantılı:** **B2G** işletmeden kamuya (e-kamu ihalesine teklif), **G2B** kamudan işletmeye (kamu kurumunun ücretli veri/hizmet sunması), **G2C** kamudan vatandaşa (ücretli belge, ulaşım, kamu hizmeti). **Her elektronik kamu hizmeti e-ticaret değildir**; ekonomik bir sipariş veya değişim işlemi bulunmalı.\n\n## Ürün ve teslimat biçimine göre (Bölüm 7)\n- **Fiziksel ürün:** sipariş elektronik, teslimat fiziksel; stok, depo, kargo, son kilometre teslimatı ve iade yönetimi önem kazanır (kitap, mobilya, gıda, giyim).\n- **Dijital ürün:** sipariş ve teslimat elektronik; **marjinal çoğaltma maliyeti düşebilir**; telif, erişim kontrolü ve dijital hak yönetimi kritik (e-kitap, yazılım, dijital oyun).\n- **Hizmet:** sipariş elektronik; hizmet fiziksel ya da dijital (danışmanlık dijital, uçuş fiziksel, yemek üretim ve teslimata bağlı).\n- **Tam e-ticaret:** ürün, işlem ve teslimat dijital (e-kitap). **Kısmi e-ticaret:** sürecin yalnızca bazı bölümleri dijital (çevrim içi alınan ayakkabının kargoyla gelmesi).\n\n## Kanallar (Bölüm 8)\n- Kanal seçimi kontrol, erişim, maliyet, veri sahipliği ve aracının rolünü değiştirir.\n- **İşletmeye ait e-mağaza:** yüksek kontrol (fiyatlandırma, marka sunumu, müşteri verisi, hizmet koşulları) + yüksek sorumluluk (ziyaretçi çekme; yazılım, güvenlik, ödeme altyapısı).\n- **E-pazar yeri:** çok taraflı erişim (bağımsız satıcı ve alıcıları buluşturma; işlem, ödeme, görünürlük kolaylığı); gelir: komisyon, ilan, reklam, lojistik.\n- **Pazar yeri ile perakendeci arasındaki kritik fark: fiyat ve hizmet kararları üzerindeki kontrol kimdedir?**\n- **Mobil ticaret:** işlemin akıllı telefon/tablet üzerinden yapılması; ayrı bir işlem türünden çok **cihaza göre sınıflandırma** (uygulamalar, mobil siteler, dijital cüzdanlar, uygulama içi satın alma).\n- **Sosyal ticaret:** ürün keşfi, değerlendirme, tavsiye, satış veya müşteri iletişiminin sosyal medyayla bütünleşmesi. **Yalnızca reklam göstermek e-ticaret değildir; elektronik sipariş tamamlanmalı.**\n- **EDI (Electronic Data Interchange):** e-ticaret internet mağazalarından önce de vardı. Alıcı sistemi (sipariş) ↔ standart mesaj (EDI) ↔ tedarikçi sistemi (fatura/sevk). Sipariş, fatura, sevk ve stok bilgileri insan müdahalesi azaltılarak sistemler arasında aktarılır.\n\n## İşlem süreci (Bölüm 9)\n- Uçtan uca 6 aşama: **1 Keşif → 2 Değerlendirme → 3 Sipariş → 4 Ödeme → 5 Karşılama → 6 Satış sonrası.** Her aşamadaki kopuş toplam dönüşümü ve müşteri deneyimini etkiler.\n- Keşif: arama motorları, sosyal medya, pazar yerleri, reklamlar, yorumlar, tavsiyeler. Değerlendirme: fiyat, özellik, satıcı puanı, teslimat, garanti, iade, ödeme seçenekleri; **arama maliyeti azalabilir, karar yükü artabilir.** Sipariş: stok kontrolü, doğru fiyat ve vergi, teslimat bedeli, kampanyalar, sipariş özeti hatasız çalışmalı.\n- Ödeme: kart, transfer, dijital cüzdan, mobil, kapıda; gizlilik, doğrulama, güvenlik, hata yönetimi kritik. Karşılama: sipariş doğrulanır, stok ayrılır, ürün toplanır, paketlenir, taşıyıcıya aktarılır, takip bilgisi paylaşılır. Satış sonrası: iade, değişim, garanti, şikâyet, teknik destek, memnuniyet → tekrar satın alma kararı.\n\n## İş ve gelir modelleri (Bölüm 10)\n| Model | Gelirin kaynağı | Tipik kullanım |\n|---|---|---|\n| Doğrudan satış | Ürünün müşteriye satılması | E-mağaza |\n| Komisyon | Gerçekleşen işlemden pay | E-pazar yeri |\n| Abonelik | Dönemsel ücret | Dijital yayın platformu |\n| Kullanım başına | Tüketilen hizmet kadar ödeme | Bulut bilişim |\n| Reklam | Kullanıcı erişiminin reklamverene sunulması | İçerik platformu |\n- Birlikte kullanılabilir: **freemium** (temel ücretsiz, gelişmiş ücretli), **ilan ücreti** (satıcı listelemek için öder), **satış ortaklığı** (yönlendirilen satıştan pay), **ek hizmet** (lojistik, ödeme, depolama, reklam ayrıca satılır).\n- **Sürdürülebilir iş modeli = müşteriye sunulan değer + bu değerden gelir elde etme mantığı.**\n\n## Değer yaratma (Bölüm 11)\n- Teknoloji ancak arama, işlem ve koordinasyon maliyetlerini azaltan ya da yeni değer önerisi kuran mekanizmalarla anlam kazanır.\n- **Dört kaynak:** **Verimlilik** (arama, iletişim, sipariş, koordinasyon maliyetini azaltma; siparişin stoka otomatik aktarılması) · **Tamamlayıcılık** (birlikte sunulan unsurlarla daha yüksek değer; ürün + ödeme + teslimat + destek paketi) · **Bağlanma / kilitlenme** (ilişkinin gönüllü sürmesini kolaylaştırma; kayıtlı tercihler, sadakat, abonelik; müşterinin özgür seçimini ortadan kaldırmamalı) · **Yenilik** (yeni ürün, hizmet, işlem biçimi veya ilişki; küçük üreticiyi müşteriye bağlayan platform).\n\n## Güven ve algılanan risk (Bölüm 12)\n- Fiziksel uzaklık ve **bilgi asimetrisi** satın alma kararında güveni ve algılanan riski görünür kılar.\n- **8 risk:** ürün (açıklamaya uymama), teslimat (teslim edilmeme), ödeme (bilgilerin kötüye kullanılması), mahremiyet (verinin izinsiz kullanılması), itibar (sahte yorum/puan), satıcı (kimliğin belirsizliği), iade (sürecin işlememesi), sistem (kesinti veya siber saldırı).\n- Güveni destekleyen uygulamalar: satıcı kimliğini açıkça belirtmek, doğru ürün ve fiyat bilgisi, güvenli ödeme ve kimlik doğrulama, şeffaf teslimat süresi, açık iade ve garanti, doğrulanmış değerlendirmeleri ayırmak, erişilebilir müşteri hizmetleri, kişisel veriyi ölçülü ve amaçla sınırlı kullanmak.\n- **Güven, algılanan fayda ve kullanım kolaylığıyla birlikte satın alma niyetini etkiler.**\n\n## Başarı koşulları (Bölüm 13)\n- **Açık değer önerisi** (müşteri neden bu işletmeden almalı? fiyat, çeşit, hız, uzmanlık, kişiselleştirme, erişim kolaylığı) · **Kullanılabilir sistem** (hızlı, anlaşılır, erişilebilir; arama, filtreleme, sepet, ödeme gereksiz karmaşık olmamalı) · **Sistem bütünleşmesi** (satış kanalı stok, muhasebe, ödeme, CRM, lojistikle uyumlu; aksi hâlde yanlış fiyat, stok, gecikme).\n- **Lojistik ve karşılama** (doğru ürünün hasarsız, zamanında teslimi) · **Güven ve hizmet** (sorun yaşayan müşterinin ulaşabileceği muhatap) · **Veri temelli iyileştirme** (ziyaret, arama, sepet, satış, iade, şikâyet verileri; gizlilik, güvenlik, etikle sınırlı).\n- **DeLone–McLean başarı yaklaşımı:** girdi kaliteleri (**sistem, bilgi, hizmet kalitesi**) → kullanım deneyimi (**kullanım, kullanıcı memnuniyeti**) → sonuç (**net faydalar**). Başarı yalnızca satış miktarı değildir.\n\n## Temel performans göstergeleri (Bölüm 14)\n| Gösterge | Formül | Ders örneği |\n|---|---|---|\n| **Dönüşüm oranı** | sipariş sayısı / ziyaret (oturum) sayısı × 100 | 2.500 / 100.000 × 100 = **%2,5** |\n| **Ortalama sipariş değeri** | toplam satış geliri / sipariş sayısı | 1.500.000 TL / 2.500 = **600 TL** |\n| **Müşteri edinme maliyeti** | edinme harcaması / yeni müşteri sayısı | 300.000 TL / 2.000 = **150 TL** |\n| **Sepet terk oranı** | (başlatılan sepet − sipariş) / başlatılan sepet × 100 | (4.000 − 2.500) / 4.000 × 100 = **%37,5** |\n- Birlikte değerlendirilmesi gerekenler: tekrar satın alma oranı, iade oranı, sipariş karşılama süresi, zamanında teslimat oranı, şikâyet oranı, **müşteri yaşam boyu değeri**, brüt kâr marjı, kanal/kampanya dönüşümü.\n- **Yoğun indirim dönüşümü yükseltirken kârlılığı azaltabilir. Tek gösterge genel başarının tamamını açıklamaz.**\n\n---\n\n# Hafta 3 — Elektronik işletmecilik aşamaları ve hazırlık\n*(Ders sunusu 3–9. bölümler; fotoğraflar 6. bölümün başlığında bittiği için 6–9 eksik.)*\n\n## E-işletmeciliğe geçiş (Bölüm 3)\n- Geçiş **tek bir teknoloji alımından çok örgütün zaman içinde geliştirdiği yeteneklere** dayanır: \"tek seferlik yatırım\" değil, **\"sürekli gelişen örgütsel yetenek\"**.\n- Kapsam: tedarik ve üretim; pazarlama, satış ve ödeme; lojistik ve müşteri ilişkileri; finans ve İK.\n- Geçişin niteliği: **iletişimle başlayan gelişim → süreçlerin bütünleşmesi → iş modelinin dönüşümü.**\n- Aşama modellerinin kullanım alanı: **01 Mevcut düzey** (dijital olgunluk ve mevcut yetenekler) · **02 Sonraki adım** (gerekli yatırım, beceri, yönetsel kapasite) · **03 Stratejik bağlantı** (teknoloji yatırımlarını hedefler ve performans göstergeleriyle ilişkilendirmek). İşletmeler aşamaları farklı hızlarda yaşayabilir, birlikte yürütebilir veya atlayabilir.\n\n## Sayısallaştırma, dijitalleşme, dijital dönüşüm (Bölüm 4)\n| Kavram | Temel değişim | Örnek |\n|---|---|---|\n| **Sayısallaştırma** (digitization) | Bilginin biçimi değişir | Kâğıt faturanın elektronik belgeye çevrilmesi |\n| **Dijitalleşme** (digitalization) | Mevcut süreç iyileştirilir | Siparişlerin çevrim içi alınması |\n| **Dijital dönüşüm** | Süreç, yapı veya iş modeli yeniden tasarlanır | Perakendecinin veri temelli çok kanallı platforma dönüşmesi |\n- **Her teknoloji kullanımı dijital dönüşüm anlamına gelmez.**\n- **Dijital işletme stratejisi** = bilgi teknolojileri stratejisi ∩ işletme stratejisi; dönüşüm ilerledikçe ikisi arasındaki sınır zayıflar.\n\n## E-hazırlık / e-readiness (Bölüm 5)\n- İşletmenin yeni bir olgunluk düzeyine geçmek için gerekli **iç kaynaklara ve dış çevre koşullarına** sahip olup olmadığını gösterir.\n- **Örgütsel hazırlık:** finansal kaynaklar, insan kaynağı ve dijital bilgi, teknoloji altyapısı, üst yönetim desteği. **Dış çevre hazırlığı:** müşteri ve tedarikçi uyumu, finans ve ödeme altyapısı, iletişim ve lojistik altyapısı, devlet kurumları ve hukuki çevre.\n- Boyutlar: **Stratejik** (dijital hedefler, bütçe, yönetim desteği, sorumluluklar) · **Teknolojik** (internet, yazılım, donanım, veri, entegrasyon, güvenlik) · **İnsan kaynağı** (dijital beceri, eğitim, öğrenme kapasitesi, değişime açıklık) · **Süreç** (tanımlama, standartlaştırma, ölçme) · **Finansal** (yatırım, bakım, lisans, eğitim maliyetleri) · **Dış çevre ve hukuk** (talep, tedarikçi uyumu, ödeme, lojistik, yasal yükümlülükler).\n- **Süreç hazırlığı teknoloji yatırımından önce gelir:** 1 süreci tanımlama → 2 gereksiz adımları kaldırma → 3 sorumlulukları belirleme → 4 teknolojiyi uygulama. **\"Düzensiz bir sürecin otomasyonu, düzensizliği daha hızlı üretir.\"**\n\n## Gelişim aşamaları (Bölüm 6)\n- **Earl'ün altı aşamalı modeli:** dış iletişimden elektronik işletmeye ve iş modelinin dönüşümüne uzanan gelişimi açıklar. *(Aşamaların ayrıntı slaytı fotoğraflanmamış; ders kitabından/slayttan tamamla.)*\n\n---\n\n# Hafta 4 — E-ticaretin geleneksel ticaretle karşılaştırılması\n*(Bölüm 9–20; 3–8 fotoğraflanmamış.)*\n\n## Ürün çeşitliliği ve raf sınırlaması (Bölüm 9)\n- E-mağaza fiziksel teşhir alanına daha az bağımlıdır; **çeşitlilik ancak arama, sınıflandırma ve stok bilgisiyle değer yaratır.**\n- Fiziksel mağaza: sınırlı raf/depo/teşhir, yerel talebe göre seçim, az talep gören ürünü sergileme güçlüğü. E-mağaza: merkezi depo ve tedarikçi stoku, sipariş üzerine üretim, **daha geniş ve niş çeşit**.\n- Çevrim içi kitap satışlarında **çeşitlilikten doğan tüketici yararı, düşük fiyattan doğan yarardan daha yüksek** bulunmuştur (belirli dönem/kategoriye ait). Genel ilke: dijital pazar niş ürünlere erişimi kolaylaştırır.\n- Geniş çeşitliliğin yönetim koşulları: **sınıflandırma, arama, filtreleme, stok doğruluğu, öneri sistemi**; eksikse geniş katalog değer yerine karmaşıklık üretir.\n\n## Fiyatlandırma ve şeffaflık (Bölüm 10)\n- Geleneksel: fiziksel etiket değiştirme, mağaza sistemlerini güncelleme, çalışanları bilgilendirme, yerel fiyat. Elektronik: **merkezi güncelleme, daha sık ve küçük değişiklikler, rakip fiyatlarının hızlı karşılaştırılması, kampanyaların hızla uygulanması.**\n- İnternet fiyatları her zaman daha düşük değildir: kitap/müzik araştırmalarında daha düşük ve daha küçük değişiklikler görülmüş; ama **fiyat farklılıkları ortadan kalkmamıştır.**\n- **Toplam müşteri maliyeti = ürün fiyatı + teslimat + zaman + arama + algılanan risk.** Kanallar ancak tüm bileşenlerle karşılaştırılabilir.\n\n## Satın alma, ödeme ve teslimat (Bölüm 11)\n- Geleneksel akış: mağaza → inceleme → ödeme → **hemen teslim**. Elektronik akış: seçim → sipariş → ödeme → **hazırlama → teslim** (aradaki bekleme).\n- Dijital üründe teslim anında olabilir; **fiziksel üründe teslimat süresi müşteri değerinin parçasıdır.**\n- E-siparişin operasyon zinciri: **sipariş → ödeme (tercih ve doğrulama) → hazırlama (depo, paketleme) → taşıma (teslimat kuruluşu) → teslim.** **Müşteri deneyimi yalnız internet sitesinde oluşmaz.**\n\n## Maliyet yapısı (Bölüm 12)\n- **E-ticaret maliyetsiz değildir; maliyet ortadan kalkmaz, bileşimi değişir:** ağırlık mağaza ve fiziksel personelden **teknoloji, veri, pazarlama ve lojistiğe** kayar.\n| Geleneksel | Elektronik |\n|---|---|\n| Mağaza kirası ve dekorasyon | İnternet sitesi, uygulama, yazılım lisansları |\n| Fiziksel teşhir ve mağaza personeli | Teknik personel, bulut hizmeti, siber güvenlik |\n| Enerji, güvenlik, mağaza bazlı stok | Elektronik ödeme ve pazar yeri komisyonları |\n| Fiziksel reklam materyalleri | Dijital reklam ve müşteri edinme giderleri |\n| Yeni satış noktası açma | Depolama, paketleme, kargo ve iade lojistiği |\n\n## Satıcı–müşteri etkileşimi (Bölüm 13)\n- Yüz yüze: soruları anında yanıtlama, tepkileri gözlemleme, öneriyi anında uyarlama, karmaşık kararlarda açıklama ve güven. Dijital: ürün önerileri ve kişiselleştirilmiş içerik, chatbot ve canlı destek, e-posta ve mobil bildirim, çağrı merkezi. **Karmaşık alışverişlerde insan desteği önemini korur.**\n- **Kişiselleştirme–mahremiyet dengesi:** müşteri faydası (ilgili öneriler, hızlı bulma) vs mahremiyet kaygısı (aşırı veri toplama, izlenme hissi, amaç dışı kullanım). Gerekli ve gereksiz veri arasındaki sınır açıkça belirlenmeli.\n\n## Güven ve risk (Bölüm 14)\n- Fiziksel varlık belirsizliği azaltabilir; e-ticarette **satıcı kimliği, ödeme, teslimat, veri kullanımı ve iade** güvenin temel bileşenleri.\n- Risk kaynakları (6): satıcı kimliği, ürün uygunluğu, ödeme güvenliği, teslimat, kişisel veri, iade ve uyuşmazlık.\n- Güveni destekleyen: **şeffaflık** (satıcı kimliği ve iletişim; doğru ürün, fiyat, teslimat, stok bilgisi; açık iade, garanti, uyuşmazlık koşulları) + **güvenli işleyiş** (güvenli ödeme ve kimlik doğrulama; doğrulanmış yorum ve güvenilir satıcı puanı; erişilebilir müşteri hizmetleri ve veri güvenliği).\n\n## Veri ve performans (Bölüm 15)\n- Dijital müşteri yolculuğunda veri: **trafik** (kaynak, ziyaret) → **arama** (ifadeler) → **inceleme** (ürün görüntüleme) → **sepet** (ekleme, terk) → **sipariş** (satın alma, iade). Davranışsal ve işlemsel veriler süreç iyileştirmeyi destekler.\n- Göstergeler: dönüşüm oranı (ziyaretin siparişe dönüşmesi), sepet terk oranı (başlayan sepetin tamamlanmaması), tekrar satın alma, iade oranı, şikâyet (türü ve sıklığı), trafik kaynağı (müşterinin geldiği kanal).\n- **Ölçülebilir olan her veri toplanmamalıdır:** 01 **amaç** (hangi sorun için) · 02 **gereklilik** (yalnız gerekli veri) · 03 **güvenlik** (koruma, erişim kontrolü) · 04 **hukuk ve etik** (uygun kullanım, ayrımcılığın önlenmesi).\n\n## Pazarlama iletişimi (Bölüm 16)\n- E-pazarlama reklam ile sipariş arasındaki mesafeyi kısaltabilir: **reklam → ürün sayfası → sepet → sipariş.** Kısa yol dönüşümü kolaylaştırır; çok satıcı arasında **görünürlük ve dikkat** stratejik kaynak olur.\n- Geleneksel kanallar: TV ve radyo, gazete ve açık hava, mağaza içi iletişim, basılı katalog. Elektronik: arama motoru ve sosyal medya, içerik pazarlaması ve e-posta, mobil bildirim ve **yeniden hedefleme**, satış ortaklığı.\n\n## Aracılar ve platformlar (Bölüm 17)\n- E-ticaret aracıları ortadan kaldırmamıştır; yeni aracılar: **pazar yerleri, arama motorları, fiyat karşılaştırma, ödeme kuruluşları, lojistik platformları, reklam ve değerlendirme ağları.** Aracı sayısı azalmak zorunda değildir; **işlevi ve pazardaki gücü değişir.**\n- **Aracısızlaşma (disintermediation):** üretici ile tüketicinin doğrudan buluşması, geleneksel aracıların rolünün azalması, doğrudan satış kanalı. **Yeniden aracılanma (reintermediation):** yeni dijital aracılar, platformların görünürlük ve işlem rolü, aracıların güç ve teknolojisinin değişmesi.\n\n## Tüketici açısından (Bölüm 18)\n| Üstünlükler | Sınırlılıklar |\n|---|---|\n| Zaman ve mekân esnekliği | Ürünü fiziksel olarak inceleyememe |\n| Kolay fiyat ve ürün karşılaştırması | Teslimatı bekleme ve kargo maliyeti |\n| Geniş ürün ve satıcı çeşidi | Yanıltıcı bilgi veya sahte yorum riski |\n| Mağazaya gitme gereğinin azalması | Ödeme ve veri güvenliği kaygısı |\n| Kullanıcı yorumlarına erişim | İade ve uyuşmazlık sorunları |\n| Kişiselleştirilmiş öneriler | Mahremiyet ve izlenme kaygısı |\n- **Ürün kategorisi kanal üstünlüğünü değiştirir:** standart ürün (elektronik cihaz; dijitalde kolay değerlendirilir) · duyusal ürün (parfüm, kişiye özel giyim; fiziksel deneyim önemli) · hibrit yol (bir kanalda araştır, diğerinde dene/al/iade et).\n\n## İşletme açısından (Bölüm 19)\n| Üstünlükler | Sınırlılıklar |\n|---|---|\n| Daha geniş pazara erişim | Yoğun fiyat ve görünürlük rekabeti |\n| 7/24 sipariş kabulü | Teknoloji ve güvenlik yatırımı |\n| Müşteri davranışlarının ölçülmesi | Lojistik ve iade yönetimi |\n| Hızlı fiyat ve kampanya değişikliği | Pazar yeri, ödeme ve reklam maliyetleri |\n| Süreçlerin otomatikleştirilmesi | Sistem kesintisi ve siber saldırı riski |\n| Ölçeklenme potansiyeli | Platform ve teknoloji sağlayıcısına bağımlılık |\n- **Yetenek–bağımlılık dengesi:** yetenekler (teknoloji ve güvenlik, lojistik ve iade, dijital pazarlama, veri ve ölçüm, müşteri hizmetleri) vs bağımlılıklar (pazar yeri kuralları, ödeme kuruluşları, bulut ve yazılım sağlayıcıları, lojistik ortakları, reklam platformları).\n\n## Bütünleşme (Bölüm 20)\n- Müşteri yolculuğu kanallar arasında ilerler; işletme tek kanalı değil **bütün temas noktalarını** yönetir: araştırma (web, uygulama, mağaza) → değerlendirme (yorum, deneme, danışmanlık) → satın alma (mağaza/e-kanal) → teslim (kargo/mağaza) → iade ve destek (her iki kanal).\n- **Bütünleşik ticaretin 4 biçimi:**\n  - **Webrooming:** internetten araştır, mağazada incele ve satın al.\n  - **Showrooming:** mağazada gör/dene, elektronik kanaldan sipariş ver.\n  - **Tıkla ve teslim al (click & collect):** internetten sipariş, mağazadan teslim.\n  - **Mağazada iade:** internetten alınanı fiziksel mağazaya iade.\n- Ana çıkarımlar: fazla seçenek **bilgi yükü** yaratabilir; fiziksel mağaza duyusal deneyim ve yüz yüze güvende güçlü; veri ve kişiselleştirme değer yaratır ama amaç, güvenlik, hukuk, etik sınırlar gerekir; rekabet fiziksel ve dijital kanalları tek müşteri yolculuğunda bütünleştirmeyi gerektirir.\n\n---\n\n# Hafta 5 — Elektronik perakendecilik\n*(Bölüm 3–19; 6–19. bölümler 31 Ekim'de gelen fotoğraflardan.)*\n\n## Tanım ve kapsam (Bölüm 3)\n- **E-perakendecilik: nihai tüketiciye yönelik satışın dijital kanallar üzerinden yürütülmesi.**\n- Kapsam: **dijital satış alanı** (site, uygulama, pazar yeri, sosyal medya mağazası = görünen temas noktası) · **işlem süreci** (arama, karşılaştırma, sipariş, ödeme dijital) · **operasyon** (stok, depo, lojistik, müşteri hizmetleri, iade, satış sonrası ayrılmaz parçalar).\n- **Ekranın önü:** ürün bilgisi ve görseller, arama ve karşılaştırma, sepet-ödeme-sipariş takibi, destek-değişim-iade. **Arka plan:** stok ve sipariş yönetimi, ödeme ve **sahtekârlık kontrolü**, depo-paketleme-lojistik, veri ve müşteri hizmetleri.\n\n## E-ticaret ile ilişkisi (Bölüm 4)\n- **E-perakendecilik, e-ticaretin nihai tüketiciye satışa odaklanan alt alanıdır** (e-işletmecilik ⊃ e-ticaret ⊃ e-perakendecilik).\n| E-ticaret | E-perakendecilik |\n|---|---|\n| B2B, B2C, C2C ve diğer işlem türleri | Ağırlıklı olarak nihai tüketiciye satış |\n| Hammadde, ara malı, işletmeler arası hizmetler | Tüketim ürünleri ve nihai hizmetler |\n| Tedarik, belge paylaşımı, kurumlar arası süreçler | Ürün sunumu, sipariş, teslimat, satış sonrası |\n| Daha geniş ticari işlem alanı | E-ticaretin perakende alt alanı |\n- Örnekler: üreticinin başka işletmeden elektronik **hammadde alımı → e-ticaret** (e-perakende değil); üreticinin kendi sitesinden **nihai tüketiciye satışı → e-perakendecilik**. **Temel ölçüt: işlemin dijital olması kadar alıcının nihai tüketici olup olmadığı.**\n\n## Temel özellikler (Bölüm 5)\n- Ayırt edici: **dijital satış alanı, ölçülebilir müşteri davranışı, sipariş ile teslimat arasındaki operasyon.**\n- Müşteri arayüzü: dijital satış alanı; metin, görsel, video, yorumlarla sunum; günün her saati erişim; hızlı fiyat/kampanya güncelleme; fiziksel teşhire az bağımlılık. Operasyon ve risk: sipariş–teslimat arası süre; ayrıntılı davranış ölçümü; güven, veri güvenliği, mahremiyet; depo, paketleme, kargo, iade; **müşteri ile satıcının fiziksel olarak ayrılması**.\n- **Erişim olanağı tek başına başarı sağlamaz:** pazara erişim (coğrafi olarak geniş pazar) + **yerel uyum** (dil, ürün bilgisi, ödeme yöntemleri, müşteri desteği) + **yerine getirme** (teslimat kapasitesi ve marka güvenilirliği vaadi gerçek deneyime dönüştürür).\n\n## İş modelleri (Bölüm 6)\n- E-perakendeciler **kanal yapısı, aracılık rolü, müşteri ilişkisi ve gelir mantığı** bakımından farklı modeller kullanır.\n- **Mağaza yapısına göre:**\n  - **Pure-play (yalnız çevrim içi):** fiziksel mağaza olmadan site veya mobil uygulama üzerinden satış; merkezi stok ve geniş erişim avantajı.\n  - **Fiziksel ve dijital:** mağazalar deneyimleme, teslim, iade, yerel dağıtım ve müşteri hizmetleri noktası olarak kullanılır.\n  - **Pazar yeri:** bağımsız satıcılar ortak platformda buluşur; platform trafik, ödeme, değerlendirme ve bazen lojistik sağlar.\n- **Müşteri ilişkisine göre:**\n  - **Doğrudan tüketiciye (DTC):** üretici aracı kullanmadan kendi elektronik kanalından satar; veriye ve marka deneyimine daha fazla hâkim olur.\n  - **Abonelik:** düzenli teslimat veya dijital erişim karşılığında dönemsel ödeme; sürekli değer üretmek gerekir.\n  - **Sosyal ve mobil:** ürün keşfi, değerlendirme ve satın alma sosyal medya veya mobil cihazda yürür; arayüz küçük ekrana uyarlanır.\n\n| Model | Temel üstünlük | Başlıca yönetim sorunu |\n|---|---|---|\n| Pure-play | Düşük fiziksel mağaza bağımlılığı | Güven ve teslimat maliyeti |\n| Fiziksel ve dijital | Mağazanın teslim ve hizmet noktası olması | Stok, fiyat ve sipariş bütünleşmesi |\n| Pazar yeri | Hazır trafik ve işlem altyapısı | Komisyon ve platform bağımlılığı |\n| DTC | Müşteri verisi ve marka deneyimi üzerinde kontrol | Lojistik, iade ve bireysel hizmet yükü |\n| Abonelik | Tekrarlanan gelir | Müşteri kaybını önleyecek sürekli değer |\n| Sosyal ve mobil | Keşif ile satın alma arasındaki kısa yol | Platform kuralları ve küçük ekran tasarımı |\n\n## Değer önerisi (Bölüm 7)\n- **Değer önerisi:** müşterinin neden belirli bir elektronik mağazayı seçmesi gerektiğini açıklayan **yararlar bütünü**.\n- **İşlemsel yararlar:** düşük/rekabetçi fiyat, kolay ürün ve fiyat karşılaştırması, hızlı ve öngörülebilir teslimat, kolay iade ve güçlü müşteri hizmetleri. **Seçim ve deneyim:** geniş ürün çeşidi, nadir ürünlere erişim, güvenilir ve ayrıntılı bilgi, kişiselleştirilmiş öneriler.\n- **Ürün çeşitliliği ve bilgi yükü:** *tüketici refahı* tarafı — daha fazla seçenek, niş ürünler, çeşitlilikten doğan değer yalnız fiyat avantajını aşabilir; *karar güçlüğü* tarafı — yetersiz sınıflandırma, zayıf arama ve filtreleme, çok sayıda alternatifin oluşturduğu **bilgi yükü**.\n\n## Elektronik perakendecilik süreci (Bölüm 8)\n- Müşteri kazanımından satış sonrası ilişkiye kadar her aşama **tek bir deneyim zincirinin** parçasıdır.\n- **Yolculuğun ilk yarısı:** 1 Kazanım (reklam, arama, doğrudan ziyaret) → 2 Keşif (arama, kategori, filtre) → 3 Değerlendirme (fiyat, özellik, yorum, teslimat) → 4 Sepet → 5 Ödeme (adres, teslimat, ödeme bilgisi).\n- **Siparişten müşteri ilişkisine:** 1 Onay (stok ve ödemenin doğrulanması) → 2 Karşılama (bulma, hazırlama, paketleme) → 3 Teslimat → 4 Satış sonrası (destek, değişim, iade, geri ödeme) → 5 İlişki (memnuniyet, sadakat, tavsiye).\n- **Bir aşamadaki hata bütün deneyimi etkiler:** iyi tasarlanmış mağaza, yanlış gönderilen ya da geç teslim edilen siparişin etkisini tek başına ortadan kaldıramaz → arayüz, stok doğruluğu, sipariş karşılama, teslimat ve sorun çözümü **birlikte** yönetilmelidir.\n\n## Elektronik mağazanın tasarımı (Bölüm 9)\n- Ana sayfa, arama, ürün sayfası, sepet ve ödeme akışı müşterinin ürünü bulmasını ve işlemi **güvenle** tamamlamasını desteklemelidir.\n- **Ana sayfa:** işletmenin kimliğini açıkça göstermeli, temel kategorileri görünür kılmalı, değer önerisini anlaşılır sunmalı; **hareketli görsel ve kampanya kalabalığından kaçınmalı**. **Arama ve filtre:** aranan ürüne hızla ulaştırmalı, filtreler kategoriye uygun olmalı (giyimde beden-renk, elektronikte kapasite ve teknik özellik).\n- **Ürün sayfasındaki zorunlu bilgi alanları:** ürün adı, fiyat ve stok durumu; gerçekçi görseller ve teknik özellikler; ölçü/beden/malzeme/kapasite; teslimat tarihi ve maliyeti; iade koşulları ve garanti; müşteri değerlendirmeleri ve satıcının kimliği.\n- **Sepet ve ödeme sayfası — terki artıran unsurlar:** beklenmeyen teslimat bedeli, **zorunlu üyelik**, uzun ve karmaşık formlar, teknik hata veya yavaşlık. **Onay öncesi şeffaflık:** sipariş toplamı, teslimat seçeneği ve tarihi, ödeme yöntemi, iade koşulları.\n\n## Faydacı ve hazcı alışveriş değeri (Bölüm 10)\n- Elektronik alışveriş hem işlemi kolay tamamlama hem de keşif ve keyif arayışıyla şekillenir.\n\n| Faydacı değer | Hazcı değer |\n|---|---|\n| İhtiyacı kolay karşılama | Yeni ürün keşfi |\n| Fiyat karşılaştırma | Alışverişten keyif alma |\n| Zaman kazanma | Görsel ortamda gezinme |\n| İşlemi hatasız tamamlama | İlham alma ve deneyim |\n- **İşlev ve deneyim dengesi:** *hız ve kolaylık* (arama, filtre, ödeme akışı hedefe kısa sürede ulaştırır), *keşif* (içerik, görsel sunum, öneriler yeni ürünleri fark ettirir), *ölçülü çekicilik* (deneyim ilgi çekici olmalı ama işlemi zorlaştıran görsel kalabalık oluşturmamalı).\n\n## Elektronik hizmet kalitesi (Bölüm 11)\n- Kalite değerlendirmesi **internet sitesiyle başlar, teslimat ve sorun çözümüyle tamamlanır**.\n- **eTailQ modelinin dört boyutu:** 1) **internet sitesi tasarımı** (görünüm, kullanılabilirlik, arama ve gezinme kolaylığı), 2) **siparişin yerine getirilmesi** (doğru ürünün belirtilen koşullarda ve zamanında teslimi), 3) **gizlilik ve güvenlik** (ödeme bilgileri ve kişisel verilerin korunması), 4) **müşteri hizmetleri** (sorulara yanıt ve sorunların etkili çözümü).\n- **E-S-QUAL (normal hizmet):** etkinlik, sistem kullanılabilirliği, siparişin yerine getirilmesi, gizlilik. **E-RecS-QUAL (sorun sonrası hizmet):** yanıt verebilirlik, telafi, müşterinin işletmeyle iletişim kurabilmesi.\n- **Hizmet telafisi kalite değerlendirmesini değiştirir:** sorun öncesi (iyi çalışan site, doğru bilgi, zamanında sipariş) → sorun anı (hata bildirimi, yanıt hızı, iletişim kolaylığı) → telafi (adil çözüm, açık süreç, uygun geri ödeme). Müşteri sorun yaşadığında sunulan hizmet de e-perakende kalitesinin parçasıdır.\n\n## Güven ve algılanan risk (Bölüm 12)\n- Müşteri ürünü, satıcıyı ve ödeme sürecini **fiziksel olarak gözlemleyemediği** için güven satın alma kararında kritiktir.\n- **Algılanan risk kaynakları:** *ürün ve satıcı* (ürünün açıklamaya uymaması, sahte ürün, satıcı kimliği belirsizliği), *ödeme ve veri* (ödeme bilgilerinin kötüye kullanımı, kişisel verilerin izinsiz işlenmesi), *teslimat ve iade* (siparişin ulaşmaması, gecikme, iade ve geri ödeme sorunları).\n- **Güveni destekleyen uygulamalar:** *şeffaflık* (satıcı kimliği ve iletişim bilgileri, gerçekçi ürün bilgisi, açık teslimat ve iade koşulları, doğrulanmış müşteri yorumları); *güvenli ve adil işleyiş* (güvenli ödeme, siparişin izlenebilmesi, ulaşılabilir müşteri hizmetleri, şikâyetlere hızlı ve adil çözüm).\n\n## Kişiselleştirme ve veri kullanımı (Bölüm 13)\n- E-perakendeciler davranışsal ve işlemsel verileri öneri, tahmin ve müşteri ilişkisi amacıyla kullanabilir.\n- **Üretilen veri:** ziyaret edilen sayfalar, arama ifadeleri ve ürün görüntülemeleri, sepet hareketleri, geçmiş siparişler ve kampanya tepkileri. **Kullanım alanları:** ürün önerisi ve kişiselleştirilmiş ana sayfa, hedefli kampanya, stok ve talep tahmini, müşteri kaybı tahmini.\n- **Kişiselleştirme–mahremiyet dengesi:** *müşteri faydası* (ilgili ürünleri daha hızlı bulma), *mahremiyet riski* (aşırı ayrıntılı öneriler sürekli izlenme duygusu yaratabilir), *yönetim ilkesi* (veri belirli amaçla ve gerektiği kadar toplanmalı, güvenli saklanmalı, hukuka ve etik ilkelere uygun kullanılmalı).\n\n## Sipariş karşılama — e-fulfillment (Bölüm 14)\n- **E-fulfillment:** siparişin verilmesinden ürünün teslimine ve gerektiğinde iadesine kadar uzanan operasyonel faaliyetler bütünü.\n- **Sipariş karşılama zinciri:** 1 Doğrulama (sipariş ve ödeme) → 2 Stok (ürün bulunabilirliği) → 3 Toplama (depoda ürünü bulma) → 4 Paketleme (hazırlama, etiketleme) → 5 Taşıyıcı (kargoya aktarım) → 6 Teslim (izleme ve teslimat). Gerektiğinde iade süreci aynı zincire geri bağlanır.\n- **Sipariş karşılama kararları:** *kapasite ve ağ* (dağıtım ağı, depo konumu ve kapasitesi, teslimat planlaması, taşıyıcı seçimi); *stok ve hizmet sözü* (stok doğruluğu, siparişe ürün ayırma, hazırlama süresi, **teslimat sözünün lojistik kapasiteyle uyumu**).\n\n## Son kilometre teslimatı (Bölüm 15)\n- Dağıtım merkezinden müşteriye uzanan son aşama; **maliyetin ve müşteri deneyiminin en görünür** bölümlerinden biri.\n- **Teslimat seçenekleri:** *adrese teslim* (standart eve teslim, belirli saat aralığında, aynı gün); *alternatif teslim* (mağazadan teslim, teslimat dolabı, belirlenmiş teslim noktası).\n- **Başlıca sorunlar:** *adres ve zaman* (müşterinin adreste bulunmaması, dar teslimat aralığı talepleri rotayı zorlaştırır); *operasyon* (trafik, dağınık teslimat noktaları, kapasite kullanımı maliyeti artırır); *hizmet hatası* (hasarlı veya yanlış teslimat taşıyıcı kaynaklı olsa bile **perakendecinin hizmeti** olarak değerlendirilir).\n\n## İade ve tersine lojistik (Bölüm 16)\n- **Tersine lojistik** müşteriden depoya doğru ilerler; kontrol, yeniden satış, tasfiye ve geri ödeme kararlarını içerir.\n- Süreç: 1 Talep (iade bildirimi) → 2 Toplama (ürünün müşteriden alınması) → 3 Taşıma (depoya dönüş) → 4 Kontrol (durum ve uygunluk) → 5 Karar (yeniden satış veya tasfiye) → 6 Geri ödeme (müşteri hesabının kapatılması).\n- **Kolay iade politikasının iki yönü:** *müşteri değeri* (ilk siparişte algılanan riski azaltır, satın alma kararını kolaylaştırır, güven ve tekrar satın almayı destekler); *işletme maliyeti* (taşıma ve paketleme, iş gücü ve kontrol, ürün değer kaybı, kontrolsüz kullanım veya kötüye kullanım riski).\n\n## Çok kanallı ve bütünleşik (omnichannel) perakendecilik (Bölüm 17)\n- **Çok kanallı yapı** birden fazla satış kanalını kullanır; **omnichannel** bu kanallardaki stok, fiyat, müşteri ve sipariş bilgisini **bütünleştirir**.\n\n| Çok kanallı | Bütünleşik (omnichannel) |\n|---|---|\n| Mağaza, site ve mobil uygulama birlikte bulunur | Stok ve fiyat bilgisi kanallar arasında bağlanır |\n| Kanallar ayrı süreçlerle yönetilebilir | Müşteri hesabı ve sipariş geçmişi ortaklaşır |\n| Müşteri her kanalda farklı bilgiyle karşılaşabilir | Yolculuk kanal değiştirerek kesintisiz ilerler |\n- **Bütünleşik müşteri yolculuğu:** araştırma (web, uygulama, mağaza) → değerlendirme (yorum, deneme, karşılaştırma) → satın alma (fiziksel veya elektronik) → teslim (kargo, mağaza, teslim noktası) → iade ve destek (kanallar arası ortak hizmet). Kanallar **rakip iki işletme gibi değil, aynı deneyimin parçaları** olarak yönetilir.\n- **Uygulamalar:** internetten alıp mağazadan teslim alma; internetten alınanı mağazaya iade; mağazada olmayan ürünü internetten sipariş; mobil uygulamada mağaza stokunu görme; tüm kanallarda ortak müşteri hesabı; ortak sadakat puanı ve kampanya sistemi.\n\n## Performans göstergeleri (Bölüm 18)\n- Dönüşüm, sepet, sipariş değeri, iade ve teslimat göstergeleri **birlikte** değerlendirilmelidir.\n- **Dönüşüm oranı** = (sipariş sayısı / **tekil ziyaretçi** sayısı) × 100 · **Ortalama sipariş değeri** = toplam satış geliri / sipariş sayısı · **Sepeti terk oranı** = (siparişe dönüşmeyen sepet / toplam oluşturulan sepet) × 100.\n- **İade oranı** = (iade edilen ürün veya sipariş / satılan ürün veya sipariş) × 100 · **Zamanında teslimat oranı** = (söz verilen zamanda teslim edilen sipariş / toplam teslim edilen sipariş) × 100. Ayrıca müşteri edinme maliyeti, tekrar satın alma, müşteri yaşam boyu değeri, stokta bulunmama, şikâyet ve hazırlama süresi izlenebilir.\n- **Tek bir gösterge yeterli değildir:** agresif indirim dönüşümü yükseltebilir ama kârlılığı düşürebilir; kolay iade satışı destekler ama tersine lojistik maliyetini artırır; satış, maliyet, hizmet kalitesi ve müşteri ilişkisi birlikte yorumlanmalıdır.\n\n## Üstünlükler ve sınırlılıklar (Bölüm 19)\n| Üstünlükler | Sınırlılıklar |\n|---|---|\n| Zaman ve mekân esnekliği | Ürünü fiziksel olarak inceleyememe |\n| Geniş pazar erişimi ve ürün çeşitliliği | Teslimat bekleme süresi, kargo ve iade maliyeti |\n| Kolay fiyat ve ürün karşılaştırması | Güvenlik ve mahremiyet kaygısı |\n| Ayrıntılı müşteri verisi ve kişiselleştirme | Yoğun fiyat ve görünürlük rekabeti |\n| Hızlı kampanya değişikliği ve otomasyon | Teknolojiye ve platformlara bağımlılık |\n| Ölçeklenebilir süreçler | Sistem kesintisi, siber saldırı ve dijital erişim eşitsizliği |\n- **Gelecek:** *teknoloji* (yapay zekâ, mobil, artırılmış gerçeklik, otomasyon yeni karar ve deneyim biçimleri yaratır), *veri* (büyük veri talep, müşteri ve operasyon kararlarında daha ayrıntılı analiz sağlar), *bütünleşme* (rekabet teknolojiyi, müşteri deneyimini, kanal yönetimini ve kârlılığı birlikte ele almayı gerektirir).\n- **Bölüm 3–19 ana çıkarımlar:** e-perakendecilik dijital satışla birlikte stok, ödeme, lojistik ve satış sonrası sistemleri kapsar; iş modeli seçimi kanal yapısını, maliyeti, müşteri verisi üzerindeki kontrolü ve bağımlılıkları değiştirir; değer önerisi fiyatın yanında çeşitlilik, bilgi, teslimat, iade ve müşteri hizmetlerine dayanır; hizmet kalitesi site tasarımından siparişin yerine getirilmesine ve hizmet telafisine kadar uzanır; güven, veri kullanımı, son kilometre ve tersine lojistik deneyimi doğrudan etkiler; bütünleşik perakendecilik kanalları ortak stok, sipariş ve müşteri bilgisiyle bağlar; performans göstergeleri birlikte değerlendirilmelidir.\n\n---\n\n# Hafta 6 — E-işletmecilik, e-ticaret ve e-perakendeciliğin karşılaştırılması\n*(Bölüm 3–17; 2 Kasım dersinin slayt fotoğrafları.)*\n\n## Kavramsal giriş (Bölüm 3)\n- Aynı dijital kanal müşteri işlemlerini ve işletmenin arka plan süreçlerini birlikte yürütebilir.\n- **Aynı kanal, farklı faaliyetler:** *müşteri işlemleri* (ürün inceleme, sipariş, ödeme, teslimat takibi, iade talebi = e-perakendeciliğin **görünen yüzü**), *ticari işlem* (elektronik sipariş oluştuğunda faaliyet **e-ticaret** kapsamına girer), *arka plan süreçleri* (stok, depo, muhasebe, kargo aktarımı, analiz = **e-işletmeciliğin** daha geniş faaliyet alanı).\n- **Kavramları ayıran ölçüt:** temel farklılık **kullanılan teknoloji değil, teknolojinin desteklediği işletme faaliyetidir.** Bir internet sitesi aynı anda e-perakendecilik arayüzü, e-ticaret kanalı ve e-işletmecilik sisteminin parçası olabilir.\n\n## Elektronik işletmecilik (Bölüm 4)\n- **E-işletmecilik:** işletmenin **değer zincirindeki faaliyetleri** dijital teknolojilerle yürütmesi veya desteklemesi. Kapsamı **satış işlemlerinden daha geniştir**: iç süreçler, tedarikçi ilişkileri, müşteri hizmetleri, insan kaynakları, bilgi yönetimi ve karar sistemleri.\n- **Temel sorusu:** işletme faaliyetleri dijital teknolojilerle nasıl daha **bütünleşik ve verimli** yürütülebilir? Doğrudan satış işlemi bulunmayan bir faaliyet de elektronik ortamda yürütüldüğü için e-işletmecilik kapsamına girebilir.\n- **İşletme içi elektronik faaliyetler:** *çalışan ve kaynak yönetimi* (e-İK yönetimi, çevrim içi çalışan eğitimi, kurumsal kaynak planlaması, e-muhasebe ve finans); *süreç ve bilgi yönetimi* (dijital belge ve iş akışı, üretim planlama ve stok kontrolü, iş zekâsı ve raporlama, intranet ve uzaktan çalışma).\n- **İşletme dışı elektronik faaliyetler:** *tedarik ve iş ortakları* (elektronik tedarik ve bilgi paylaşımı, bayi ve dağıtıcı portalları, lojistik kuruluşlarıyla veri paylaşımı, ortak bilgi sistemleri); *müşteri, finans ve kamu* (elektronik müşteri ilişkileri, çevrim içi satış sonrası destek, banka ve ödeme entegrasyonu, kamu kurumlarına elektronik bildirim).\n\n| Sistem | Temel işlev |\n|---|---|\n| **ERP** | Finans, stok, üretim, satın alma ve diğer kaynakları bütünleştirir |\n| **CRM** | Müşteri bilgilerini ve müşteri ilişkilerini yönetir |\n| **SCM** | Tedarik zinciri faaliyetlerini planlar ve koordine eder |\n| **HRIS / e-HRM** | Çalışan bilgilerini ve İK süreçlerini yönetir |\n| **BI ve analitik** | Verileri raporlar ve karar desteği sağlar |\n| **Intranet** | İşletme içi bilgi ve iletişimi destekler |\n| **Extranet** | Tedarikçi, bayi ve iş ortaklarıyla güvenli bilgi paylaşır |\n| **Belge yönetimi** | Belgeleri elektronik oluşturur, onaylar ve saklar |\n\n## Elektronik ticaret (Bölüm 5)\n- **E-ticaret:** ürün veya hizmetle ilgili satış ve satın alma **siparişlerinin bilgisayar ağları üzerinden oluşturulmasına** odaklanır.\n- **Belirleyici unsur: siparişin bilgisayar ağı üzerinden oluşturulması.** OECD yaklaşımı sipariş alma/verme amacıyla tasarlanmış elektronik yöntemleri esas alır; **ödeme ve teslimat yöntemi sınıflandırmayı tek başına belirlemez.**\n- **Sipariş yöntemi ile ödeme yöntemi:** *e-ticarettir* — internetten sipariş + kapıda nakit ödeme; internetten sipariş + mağazada ödeme; elektronik sipariş + fiziksel teslimat. *Tek başına yeterli değil* — sipariş fiziksel mağazada oluşur, ödeme mobil bankacılıkla yapılır (**elektronik ödeme sipariş kanalını değiştirmez**).\n- **Sipariş, ödeme, teslimat:** sipariş **temel ölçüttür** (elektronik kanalda oluşur); ödeme elektronik, nakit veya mağazada olabilir; teslimat fiziksel veya dijital olabilir — ikisi de işlemin e-ticaret niteliğini ortadan kaldırmaz.\n- **Taraflar:** B2B (işletmeden işletmeye), B2C (işletmeden tüketiciye), C2C (tüketiciden tüketiciye), C2B (tüketicinin işletmeye ürün, hizmet veya değer sunması), B2G (işletme–kamu kurumu ticari işlemi), G2B/G2C (kamunun işletme veya bireylere elektronik hizmet sunması).\n- **E-ticaret yalnız tüketici alışverişi değildir:** bir üreticinin elektronik tedarik portalından **hammadde sipariş etmesi de e-ticarettir**. Zwass (1996) e-ticareti ticari bilgi paylaşımı, iş ilişkileri ve işlemlerin telekomünikasyon ağları üzerinden yürütülmesi olarak geniş ele alır.\n\n## Elektronik perakendecilik (Bölüm 6)\n- **E-perakendecilik:** ürün ve hizmetlerin dijital kanallar üzerinden **nihai tüketicilere** satılması; e-ticaretin **B2C alanındaki daha dar faaliyet biçimi**. Odak: nihai tüketiciye satış, alışveriş deneyimi, siparişin karşılanması ve satış sonrası ilişki.\n- **Müşteri yolculuğu:** 1 Mağaza (tasarım ve ürün sunumu) → 2 Keşif (arama, karşılaştırma) → 3 Sipariş (sepet, ödeme) → 4 Teslimat (sipariş karşılama) → 5 İlişki (iade, hizmet, sadakat).\n- **eTailQ:** internet sitesi tasarımı (bilgiye erişim, kullanılabilirlik), siparişin yerine getirilmesi (doğru ürün, zamanında teslimat), güvenlik ve gizlilik (ödeme ve kişisel veri), müşteri hizmetleri (sorun çözme, iade, iletişim).\n\n## Üç kavram arasındaki kapsam ilişkisi (Bölüm 7)\n- **Hiyerarşi:** e-işletmecilik ⊃ e-ticaret ⊃ e-perakendecilik (e-perakendecilik e-ticaretin, e-ticaret e-işletmeciliğin içinde).\n- **Daima doğru:** her e-perakendecilik faaliyeti e-ticarettir; her e-ticaret faaliyeti e-işletmeciliğin parçasıdır. **Daima doğru değil:** her e-işletmecilik faaliyeti e-ticaret değildir; her e-ticaret işlemi e-perakendecilik değildir.\n- **Literatürde sınırlar her zaman aynı çizilmez:** bazı çalışmalar e-ticareti sipariş ve alım satımla sınırlar, bazıları işlem destek süreçlerini de kapsar. **Bu derste:** e-işletmecilik = bütün dijital süreçler; e-ticaret = elektronik siparişe dayalı ticari işlemler; e-perakendecilik = nihai tüketiciye elektronik satış.\n\n## Temel karşılaştırma (Bölüm 8)\n| Boyut | E-işletmecilik | E-ticaret | E-perakendecilik |\n|---|---|---|---|\n| Kapsam | En geniş | Daha dar | En dar |\n| Temel amaç | Süreçleri dijital yürütmek ve bütünleştirmek | Elektronik ortamda ticari işlem | Nihai tüketiciye elektronik satış |\n| İşlem zorunluluğu | Hayır | Evet | Evet |\n| Temel taraflar | Çalışan, yönetici, tedarikçi, müşteri, ortak ve kamu | İşletme, tüketici ve kamu | Perakendeci ve nihai tüketici |\n| İşletme içi faaliyet | Kapsar | Temel odak değildir | Temel odak değildir |\n| İşletmeler arası faaliyet | Kapsar | B2B biçiminde kapsar | Temel alanı değildir |\n| Nihai tüketiciye satış | Kapsayabilir | B2C biçiminde kapsar | Temel faaliyetidir |\n| Temel sistemler | ERP, CRM, SCM, HRIS, analitik, intranet | Sipariş, ödeme, pazar ve tedarik sistemleri | Elektronik mağaza, sepet, teslimat ve iade |\n| Temel çıktı | Verimlilik, bütünleşme ve karar kalitesi | Başarılı ticari işlem | Satış, müşteri deneyimi ve sadakat |\n| Başlıca risk | Sistem bütünleşmesi ve örgütsel değişim | İşlem, ödeme ve taraf güvenliği | Ürün, teslimat, iade ve tüketici güveni |\n\n## İşlem bulunup bulunmamasına göre karşılaştırma (Bölüm 9)\n- Sınıflandırmada ilk soru: **elektronik ortamda satış veya satın alma siparişi oluşturuluyor mu?**\n- **Hayır →** e-işletmecilik olabilir, e-ticaret değildir. **Evet →** e-ticaret; siparişi **nihai tüketici** veriyorsa (ve satıcı bir işletme/perakendeciyse) e-perakendecilik.\n- *Sipariş yok:* çevrim içi izin talebi, ERP'de stok izleme, CRM'e şikâyet kaydı, çevrim içi çalışan eğitimi. *Sipariş var:* elektronik hammadde siparişi, bayi portalından ürün alımı, mobil uygulamadan yemek siparişi, C2C pazarında kullanılmış ürün alımı.\n- Siparişi nihai tüketici veriyorsa ve satıcı işletme/perakendeciyse → e-perakendecilik: internetten kitap, market ürünü, uçak bileti, konaklama hizmeti veya dijital yayın aboneliği.\n\n## Ön yüz ve arka yüz faaliyetleri (Bölüm 10)\n- Müşterinin gördüğü elektronik temas noktaları **ön yüzü**, işletme içinde çalışan sistemler **arka yüzü** oluşturur.\n- **Ön yüz:** site ve mobil uygulama; ürün sayfaları, arama ve filtreleme; sepet ve ödeme ekranı; sipariş izleme, canlı destek ve müşteri hesabı. **Arka yüz:** ERP, stok ve depo yönetimi; muhasebe ve satın alma; tedarikçi ve kargo entegrasyonu; İK ve veri analizi; iade ve geri ödeme yönetimi.\n- **Ön yüz vaatleri ve arka yüz kapasitesi:** müşterinin gördüğü (ürün bulunabilirliği, teslimat tarihi, fiyat ve kampanya, iade seçeneği) ↔ işletmenin yerine getirdiği (doğru stok verisi, depo ve kargo koordinasyonu, muhasebe ve fiyat kuralları, CRM ve geri ödeme süreci).\n- **Arka yüz bütünleşmesi değer yaratır:** 624 perakende işletmesini kapsayan araştırmada ön ve arka yüz yetenekleri e-işletmecilik değeriyle ilişkili; **Zhu ve Kraemer (2005)** arka yüz bütünleşmesinin işletmeler arasında daha güçlü bir farklılaştırıcı olabildiğini göstermiştir.\n\n## Değer zinciri açısından karşılaştırma (Bölüm 11)\n- Aynı değer zinciri faaliyeti üç kavramda farklı rol oynayabilir.\n\n| Faaliyet | E-işletmecilik | E-ticaret | E-perakendecilik |\n|---|---|---|---|\n| Elektronik tedarik | Kapsar | Sipariş varsa kapsar | Genellikle arka plan faaliyeti |\n| Üretim planlama | Kapsar | — | — |\n| Stok yönetimi | Kapsar | İşlemi destekler | Ürün bulunabilirliğini destekler |\n| Elektronik satış | Kapsar | Kapsar | Nihai tüketiciye ise kapsar |\n| Dijital pazarlama | Kapsar | İşlemi destekler | Müşteri kazanımında kullanılır |\n| Elektronik ödeme | Kapsar | İşlemi tamamlayabilir | Ödeme deneyiminin parçasıdır |\n| Teslimat yönetimi | Kapsar | İşlem sonrası süreç | Temel müşteri deneyimi unsurudur |\n| Müşteri ilişkileri | Kapsar | İşlem öncesi ve sonrası destek | Sadakat ve tekrar satın alma için kritik |\n| İnsan kaynakları | Kapsar | — | — |\n| Yönetim raporlaması | Kapsar | Ticari veriyi analiz eder | Perakende performansını analiz eder |\n\n## Değer yaratma biçimlerinin karşılaştırılması (Bölüm 12)\n- E-işletmecilikte değer tek bir satış anından değil **bütün faaliyet sisteminden** doğar.\n- **Dört değer kaynağı:** **etkinlik** (maliyet ve işlem süresinin azaltılması — siparişlerin otomatik işlenmesi, elektronik belge, eş zamanlı stok güncelleme, arama maliyetinin azalması), **tamamlayıcılıklar** (birlikte sunulan ürün, hizmet ve kanalların ek değeri — e-mağaza + fiziksel mağaza, ürün satışı + kurulum hizmeti, mobil uygulama + sadakat programı), **sistemde tutma** (müşteri ve iş ortağının aynı sistemle çalışmayı sürdürmesi — kişiselleştirilmiş hesap, sadakat programı ve kayıtlı tercihler, tedarikçi entegrasyonu, abonelik), **yenilik** (yeni işlem, hizmet veya iş modeli — elektronik pazar yerleri, dijital ürünler ve talep üzerine üretim, platform modelleri, yapay zekâ destekli alışveriş asistanları).\n- **İş modeli bir faaliyet sistemidir:** değer kaynakları satış anının ötesinde faaliyetlerin nasıl bağlandığını açıklar. **Zott, Amit ve Massa (2011):** iş modeli, işletmenin nasıl değer yarattığını ve bu değeri nasıl elde ettiğini açıklayan bütünsel bir faaliyet sistemi.\n\n## Gelir ve performans açısından karşılaştırma (Bölüm 13)\n- Her kavram farklı göstergeler gerektirir; doğrudan gelir yaratmayan süreçler de işletme değeri üretebilir.\n- **E-işletmecilik performansı:** süreç ve işlem maliyetleri, sipariş işleme ve karar verme süresi, stok doğruluğu ve üretim süresi, çalışan verimliliği ve veri kalitesi, sistemler arası entegrasyon, tedarikçi performansı.\n- **E-ticaret performansı:** elektronik işlem sayısı ve satış geliri, başarılı ödeme oranı, işlem maliyeti ve sipariş doğruluğu, B2B sipariş süresi, elektronik kanal kullanım oranı, işlem başına kâr.\n- **E-perakendecilik performansı:** dönüşüm ve sepeti terk oranı, ortalama sipariş değeri, müşteri edinme maliyeti, tekrar satın alma ve iade oranı, zamanında teslimat, müşteri memnuniyeti ve yaşam boyu değeri.\n- **Gelir ile işletme değeri aynı değildir:** *doğrudan gelir yaratmayabilir* ama değerlidir (e-İK sistemi, idari süre ve maliyet azalması, veri kalitesi ve karar hızı); *yüksek satış yeterli olmayabilir* (yanlış stok bilgisi, verimsiz teslimat, yüksek iade maliyeti).\n\n## Yönetim sorumluluğu açısından karşılaştırma (Bölüm 14)\n| Yönetim alanı | E-işletmecilik | E-ticaret | E-perakendecilik |\n|---|---|---|---|\n| Stratejik yönetim | Dijital strateji ve iş modeli | Elektronik kanal ve işlem stratejisi | Perakende ve müşteri deneyimi stratejisi |\n| Bilgi teknolojileri | Sistem mimarisi ve entegrasyon | Sipariş, ödeme ve platform altyapısı | Mağaza, uygulama ve kişiselleştirme |\n| Pazarlama | Veri ve müşteri yönetimi | Elektronik pazar ve kanal yönetimi | Ürün, fiyat, kampanya ve sadakat |\n| Operasyon | İş süreçlerinin dijitalleştirilmesi | Siparişin işlenmesi | Stok, paketleme, teslimat ve iade |\n| Finans | Elektronik muhasebe ve kontrol | Ödeme ve işlem gelirleri | Satış geliri, marj ve müşteri kârlılığı |\n| İnsan kaynakları | Dijital yetkinlik ve e-HRM | Elektronik işlem yetkinlikleri | Müşteri hizmetleri ve kanal yetkinlikleri |\n\n## Hukuki ve etik açıdan karşılaştırma (Bölüm 15)\n- Ortak ilkeler aynı olsa da etkilenen taraflar ve hukuki sorumluluklar faaliyetin türüne göre değişir.\n- **E-işletmecilik:** çalışan ve tedarikçi verileri, erişim yetkileri, ticari sırların güvenliği, otomatik kararların etik kullanımı. **E-ticaret:** elektronik sözleşme, ödeme güvenliği, kimlik doğrulama, vergilendirme, elektronik kayıtlar ve sınır ötesi işlemler. **E-perakendecilik:** tüketicinin bilgilendirilmesi, **mesafeli satış**, iade ve **cayma hakları**, fiyat ve ürün bilgisinin doğruluğu.\n- **Üç alanın ortak ilkeleri:** güvenlik, veri koruması, şeffaflık ve hesap verebilirlik (yükümlülüklerin kapsamı çalışan, tedarikçi, ticari taraf veya nihai tüketiciye göre değişebilir).\n\n## Dijitalleşme ile elektronik ticaret aynı şey değildir (Bölüm 16)\n- Dijital araç kullanımı e-işletmecilik yaratabilir, ancak **elektronik sipariş yoksa e-ticaret oluşmaz**.\n- *Dijitalleşme / e-işletmecilik:* faturaların PDF olarak saklanması, çalışanların e-posta kullanması, üretim raporlarının elektronik hazırlanması, müşteri bilgilerinin CRM'e kaydedilmesi. *E-ticaret için:* elektronik sipariş mekanizması gerekir; sipariş satış veya satın alma oluşturur; ödeme yöntemi tek başına yeterli değildir.\n- **Tanıtım sitesi ile elektronik mağaza farkı:** müşteri sipariş oluşturamıyorsa site **satış kanalı değil, dijital iletişim kanalıdır**. Ürünlerin internette görünmesi e-perakendecilik için yeterli değildir; elektronik mağaza sipariş oluşturma mekanizmasını ve onu destekleyen süreçleri gerektirir.\n\n## Faaliyetleri sınıflandırma örnekleri (Bölüm 17)\n- Sınıflandırma, faaliyetin **elektronik sipariş içerip içermediği** ve siparişin **nihai tüketiciye yönelik** olup olmadığıyla yapılır.\n\n| Faaliyet | E-işletmecilik | E-ticaret | E-perakendecilik |\n|---|---|---|---|\n| Çalışanın internetten izin talep etmesi | Evet | — | — |\n| ERP sisteminde stok izleme | Evet | — | — |\n| Tedarikçiden elektronik hammadde siparişi | Evet | Evet | — |\n| Bayinin üretici portalından ürün alması | Evet | Evet | — |\n| Mağaza siparişinin mobil bankacılıkla ödenmesi | Evet | Genellikle — | — |\n| Çalışanların çevrim içi eğitim alması | Evet | — | — |\n| Tüketicinin internetten kitap satın alması | Evet | Evet | Evet |\n| Tüketicinin uygulamadan yemek siparişi | Evet | Evet | Evet |\n| Müşterinin sitede yalnızca ürün incelemesi | Evet | Sipariş yoksa — | — |\n| C2C pazarında iki tüketicinin işlem yapması | Evet | Evet | Perakendeci yoksa — |\n| İnternetten alınan ürünün mağazaya iadesi | Evet | İşlem sonrası destek | Evet |\n| Dijital yayın aboneliğinin tüketiciye satılması | Evet | Evet | Evet |\n\n- **Hızlı sınıflandırma ölçütü:** 1) **Dijital faaliyet** — işletmenin bir faaliyeti dijital sistemle yürütülüyorsa e-işletmecilik kapsamı değerlendirilir; 2) **Elektronik sipariş** — satış veya satın alma siparişi elektronik kanalda oluşuyorsa e-ticaret vardır; 3) **Nihai tüketici** — işletme nihai tüketiciye elektronik satış yapıyorsa e-perakendecilik vardır.\n";

/* ---------- notes (mini markdown) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

let cardFilter=store.get('pz_filter',0), session=[], sIdx=0, flipped=false;
const cs=()=>store.get('pz_cards',{});
function cardState(id){return cs()[id]||{box:1,due:0}}
function dueList(f){const s=cs(),now=Date.now();return CARDS.map((c,i)=>({...c,id:i})).filter(c=>(!f||c.d===f)&&((s[c.id]||{due:0}).due<=now))}
function renderCards(){
  const el=$('#p-cards');
  let h=`<div class="row" style="margin-bottom:14px">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${cardFilter===f}" data-f="${f}">${f?U+' '+f:'Hepsi'} (${dueList(f).length})</button>`).join('')+`</div><div id="sess"></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cardFilter=+b.dataset.f;store.set('pz_filter',cardFilter);session=[];renderCards()});
  if(!session.length||sIdx>=session.length){session=shuffle(dueList(cardFilter));sIdx=0}
  drawCard();
}
function drawCard(){
  const box=$('#sess');if(!box)return;
  if(!session.length){box.innerHTML=`<div class="card" style="text-align:center"><b>Bekleyen kart yok 🎉</b><p class="mute">Bu filtre için bugün çalışılacak kart kalmadı. Yarın tekrar gel ya da başka bir ${U.toLowerCase()} seç.</p><button class="btn alt" id="all">Yine de hepsini karıştır</button></div>`;
    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>!cardFilter||c.d===cardFilter));sIdx=0;drawCard()};return}
  const c=session[sIdx];flipped=false;
  box.innerHTML=`<div class="mute" style="margin-bottom:6px">${sIdx+1} / ${session.length} · Kutu ${cardState(c.id).box}</div><div class="bar" style="margin-bottom:12px"><i style="width:${sIdx/session.length*100}%"></i></div>
  <div class="card flash" id="fl" tabindex="0"><div class="tag">${esc(DERS[c.d])} · ${esc(c.t)}</div><div class="q">${esc(c.f)}</div><div class="a" id="ans" hidden>${esc(c.b)}</div><div class="mute" id="hint" style="margin-top:12px">Cevabı düşün, sonra çevirmek için dokun (Boşluk)</div></div>
  <div class="row" id="grade" hidden><button class="btn bad" data-g="0">Bilemedim</button><button class="btn alt" data-g="1">Zor</button><button class="btn ok" data-g="2">Bildim</button></div>`;
  const flip=()=>{if(flipped)return;flipped=true;$('#ans').hidden=false;$('#hint').hidden=true;$('#grade').hidden=false};
  $('#fl').onclick=flip;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(c,+b.dataset.g));

}
function grade(c,g){
  const s=cs(),st=s[c.id]||{box:1,due:0};
  if(g===0)st.box=1;else if(g===2)st.box=Math.min(5,st.box+1);
  st.due=Date.now()+(g===0?0:INTERVALS[st.box]*DAY);
  s[c.id]=st;store.set('pz_cards',s);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(g===0)session.push(c);
  sIdx++;
  if(sIdx>=session.length){session=[];renderCards()}else drawCard();
}

function startQuiz(f,n,wrongOnly,part){
  const W=store.get('pz_wrong',[]);
  let pool=QUIZ.map((q,i)=>({...q,id:i})).filter(q=>wrongOnly?W.includes(q.id):(!f||q.d===f)&&(!part||(part===1)===(q.id<COURSE.quizSplit)));
  pool=shuffle(pool).slice(0,n);
  qz={f,items:pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,order:idx,ans:idx.indexOf(q.a)}}),i:0,score:0,done:false,wrongOnly};
  drawQ();
}
function drawQ(){
  const el=$('#p-quiz');
  if(qz.i>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100);
    if(!qz.wrongOnly){const b=store.get('pz_best',{});if(b[qz.f]==null||pct>b[qz.f]){b[qz.f]=pct;store.set('pz_best',b)}}
    el.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Sonuç</div><div style="font:700 48px Georgia,serif">${qz.score}/${qz.items.length}</div><p class="mute">%${pct} · ${pct>=85?'Güçlü — tekrar aralığını uzatabilirsin.':pct>=60?'İyi gidiyor — yanlışların kartlarını çalış.':'Notlara dön, ilgili kartları çalış, sonra tekrar dene.'}</p><button class="btn" id="again">Yeni test</button></div>`;
    $('#again').onclick=()=>{qz=null;renderQuizHome()};return;
  }
  const q=qz.items[qz.i];
  el.innerHTML=`<div class="mute" style="margin-bottom:6px">${qz.i+1} / ${qz.items.length} · ${esc(DERS[q.d])}</div><div class="bar" style="margin-bottom:12px"><i style="width:${qz.i/qz.items.length*100}%"></i></div>
  <div class="card"><div style="font:600 18px/1.45 Georgia,serif;margin-bottom:8px">${esc(q.q)}</div><div id="opts">${q.order.map((oi,k)=>`<button class="opt" data-k="${k}">${esc(q.o[oi])}</button>`).join('')}</div><div id="fb" hidden></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    el.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)qz.score++;
    const W=store.get('pz_wrong',[]),has=W.includes(q.id);
    if(!ok&&!has)W.push(q.id);if(ok&&has)W.splice(W.indexOf(q.id),1);store.set('pz_wrong',W);
    const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<p style="margin:12px 0 4px"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':'Yanlış'}</b> — ${esc(q.w)}</p><button class="btn" id="nx">${qz.i+1>=qz.items.length?'Sonucu gör':'Sonraki'}</button>`;
    $('#nx').onclick=()=>{qz.i++;drawQ()};$('#nx').focus();
  });
}

/* ---------- practice (procedural generators) ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmt=x=>String(Math.round(x*1000)/1000).replace('.',','), N=x=>x.toLocaleString('tr-TR');
const sum=a=>a.reduce((s,x)=>s+x,0);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mcq=o=>{const s=shuf(o.map((t,i)=>[t,i]));return{opts:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===0)}}; // doğru şık o[0]
const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2,'^':3};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);const ra=t.op==='^';if(t.l.op&&(ra?PR[t.l.op]<=PR[t.op]:PR[t.l.op]<PR[t.op]))a=`(${a})`;if(t.r.op&&(ra?PR[t.r.op]<PR[t.op]:PR[t.r.op]<=PR[t.op]))b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const AVL={
  bf:n=>T.h(n.l)-T.h(n.r),
  ser:t=>t?`(${t.v} ${AVL.ser(t.l)} ${AVL.ser(t.r)})`:'-',
  rotR(n){const l=n.l;n.l=l.r;l.r=n;return l},
  rotL(n){const r=n.r;n.r=r.l;r.l=n;return r},
  bad:t=>t?T.nodes(t).filter(x=>Math.abs(AVL.bf(x.n))>1).sort((a,b)=>b.d-a.d):[],
  find:(t,v,p=null,s=null)=>!t?null:t.v===v?{n:t,p,s}:AVL.find(v<t.v?t.l:t.r,v,t,v<t.v?'l':'r'),
  turn(t,u,d){const f=AVL.find(t,u),g=AVL.find(t,f.p.v),nn=d==='R'?AVL.rotR(g.n):AVL.rotL(g.n);if(g.p)g.p[g.s]=nn;else t=nn;return t},
  // beklenen adımlar: her ekleme bir adım, her tek döndürme bir adım (çift döndürme = 2 adım)
  plan(seq){let t=null;const S=[],J=t=>({ser:AVL.ser(t),json:JSON.stringify(t)});
    seq.forEach(v=>{const path=[];for(let p=t;p;p=v<p.v?p.l:p.r)path.push(`${v} ${v<p.v?'<':'>'} ${p.v} → ${v<p.v?'sol':'sağ'}`);
      t=T.ins(t,v);const b=AVL.bad(t)[0];let e=null;
      if(b){const z=b.n;if(AVL.bf(z)>1){const y=z.l;e=AVL.bf(y)>=0?{c:'LL',y:y.v}:{c:'LR',y:y.v,x:y.r.v}}else{const y=z.r;e=AVL.bf(y)<=0?{c:'RR',y:y.v}:{c:'RL',y:y.v,x:y.l.v}}Object.assign(e,{v,z:z.v,r:e.x==null?1:2})}
      S.push({k:'ins',v,path,e,...J(t)});
      if(e)(e.r===1?[[e.y,e.c==='LL'?'R':'L']]:[[e.x,e.c==='LR'?'L':'R'],[e.x,e.c==='LR'?'R':'L']]).forEach(([u,d],n)=>{t=AVL.turn(t,u,d);S.push({k:'rot',v,u,d,n:n+1,e,...J(t)})})});
    return S},
  ad:{LL:'Sol-sol (LL)',RR:'Sağ-sağ (RR)',LR:'Sol-sağ (LR)',RL:'Sağ-sol (RL)'},
  cap:s=>s.k==='ins'?`${s.v} eklendi`:`${s.u} ${s.d==='R'?'sağa':'sola'} döndürüldü`,
  say(s){const e=s.e,yon=s.d==='R'?'sağa':'sola';
    if(s.k==='ins')return `<b>${s.v}</b> eklenir: ${s.path.length?s.path.join(', '):'ağaç boş → kök olur'}. `+(e?`Denge bozuldu: <b>${e.z}</b> düğümünde BF = ${e.c[0]==='L'?'+2':'−2'} → ${AVL.ad[e.c]} durumu, ${e.r===2?'çift (2 adım)':'tek'} döndürme gerekir.`:'Tüm düğümlerde |BF| ≤ 1 → döndürme gerekmez.');
    if(e.r===1)return `${AVL.ad[e.c]}: <b>${s.u}</b> ${yon} döndürülür (${s.u} yukarı çıkar, ${e.z} aşağı iner). Ağaç yeniden dengeli.`;
    return s.n===1?`${AVL.ad[e.c]}, 1. döndürme: <b>${s.u}</b> ${yon} döndürülür (${e.y} düğümünün yerine çıkar). Şekil artık ${e.c==='LR'?'LL':'RR'} gibi; dengelemek için 2. döndürme gerekir.`
      :`${AVL.ad[e.c]}, 2. döndürme: <b>${s.u}</b> ${yon} döndürülür (${e.z} düğümünün yerine çıkar). Ağaç yeniden dengeli.`},

  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,5);

  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);

  gsyih:{label:'GSYİH/GSMH · faktörler',f(){

  freq:{label:'Frekans tablosu',f(){const n=R(15,20),d=[...Array(n)].map(()=>R(0,5)),cnt=[0,1,2,3,4,5].map(v=>d.filter(x=>x===v).length),v=R(0,4),k=R(0,2);

  central:{label:'Ortalama · medyan · mod',f(){let d,mode;do{d=[...Array(R(7,12))].map(()=>R(1,15));const c={};d.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c)),m=Object.keys(c).filter(k=>c[k]===mx);mode=m.length===1&&mx>1?+m[0]:null}while(mode==null);

  weighted:{label:'Ağırlıklı ortalama',f(){const k=R(0,4),wm=(x,w)=>sum(x.map((v,i)=>v*w[i]))/sum(w),

    if(k===1){const ds=shuf(['Matematik','İstatistik','Muhasebe','İktisat','Hukuk','Pazarlama','İşletme']).slice(0,R(3,5)),w=ds.map(()=>pick([2,3,4,5,6])),x=ds.map(()=>pick([1,1.5,2,2.5,3,3.5,4]));

  spread:{label:'Ranj · OMS · varyans · s.sapma',f(){let d,n;do{n=R(4,6);d=[...Array(n)].map(()=>R(1,20))}while(sum(d)%n);

  zscore:{label:'z skoru',f(){const mu=R(40,70),sd=R(5,15),k=R(0,6),Z=()=>pick([-2,-1.5,-1,-.5,.5,1,1.5,2,2.5]);
    if(k===0){const x=R(mu-2*sd,mu+2*sd),z=(x-mu)/sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. <b>${x}</b> alan öğrencinin <b>z skoru</b> kaçtır?`,type:'num',a:z,sol:`z = (X − μ) / σ = (${x} − ${mu}) / ${sd} = ${fmt(z)} → ${z>0?'ortalamanın üstünde':z<0?'ortalamanın altında':'tam ortalamada'}.`}}
    if(k===1){const z=Z(),x=mu+z*sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. z skoru <b>${fmt(z)}</b> olan öğrencinin <b>ham puanı</b> kaçtır?`,type:'num',a:x,sol:`X = μ + z·σ = ${mu} + (${fmt(z)}) × ${sd} = ${fmt(x)}`}}
    if(k===2){const z=Z(),x=mu+z*sd;return{q:`Bir sınavın ortalaması <b>${mu}</b>. <b>${fmt(x)}</b> alan öğrencinin z skoru <b>${fmt(z)}</b>. Sınavın <b>standart sapması</b> kaçtır?`,type:'num',a:sd,sol:`z = (X − μ) / σ → σ = (X − μ) / z = (${fmt(x)} − ${mu}) / ${fmt(z)} = ${fmt(x-mu)} / ${fmt(z)} = ${sd}`}}

    if(k===5){const P=[-1,-.5,0,.5,1,1.5,2],ma=R(10,14)*5,mb=R(10,14)*5,sa=2*R(3,7),sb=2*R(3,7);let za,zb;do{za=pick(P);zb=pick(P)}while(za===zb);const xa=ma+za*sa,xb=mb+zb*sb;

        sol:`z_mat = (${xa} − ${ma}) / ${sa} = ${fmt(za)} · z_tür = (${xb} − ${mb}) / ${sb} = ${fmt(zb)} → z'si büyük olan derste göreli olarak daha başarılıdır. Ham puanlar farklı ölçeklerde olduğu için doğrudan karşılaştırılmaz.`}}

      ['z skorunun birimi nedir?',['Birimsizdir','Ham puanla aynı birimdedir','Yüzdedir','Ham puan biriminin karesidir'],'(X − μ) / σ işleminde pay ile payda aynı birimde olduğu için birim sadeleşir. Bu sayede farklı ölçekler karşılaştırılabilir.'],

    return{q,type:'mc',...mcq(o),sol:s}}},
  empirical:{label:'Normal dağılım görgül kural',f(){const mu=R(10,14)*5,sd=pick([5,8,10,12,15]),n=pick([200,400,1000,2000,4000]),k=R(0,4),

  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):gq.type==='seq'?((u,A)=>(u.match(/[A-Z0-9]+/g)||[]).join(',')===A||u.replace(/[^A-Z0-9]/g,'')===A.replace(/,/g,''))(String(v).toUpperCase(),gq.a.toUpperCase()):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){
  const s=cs(),counts=[0,0,0,0,0,0];
  CARDS.forEach((_,i)=>counts[(s[i]||{box:1}).box]++);
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));
  const weak=CARDS.map((c,i)=>({...c,id:i,box:(s[i]||{box:1}).box})).filter(c=>c.box<=2&&s[c.id]).slice(0,8);
  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Emin misin? Kart, test, alıştırma ve plan ilerlemesi silinecek — tekrar bas';return}{['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
