<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Ticaret (E-İşletmecilik)</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>

<script>
const CARDS = [{"d": 2, "t": "Tanım", "f": "Elektronik ticarette belirleyici unsur nedir?", "b": "Siparişin özel olarak tasarlanmış bir elektronik sistem (bilgisayar ağı) üzerinden verilmesi. Ödeme ve teslimat elektronik olmak zorunda değildir."}, {"d": 2, "t": "Tanım", "f": "Bir işlemi e-ticaret yapan üç ölçüt nedir?", "b": "1) Ekonomik değer (mal, hizmet veya bilgi ekonomik değere sahip olmalı) 2) En az iki taraf (satın alma, satış veya değişim) 3) Elektronik sipariş sistemi (sipariş bu amaçla tasarlanmış ağ üzerinden oluşturulmalı)."}, {"d": 2, "t": "Tanım", "f": "Sipariş, ödeme ve teslimattan hangisinin elektronik olması zorunludur?", "b": "Yalnızca sipariş (ör. sitedeki alışveriş sepeti). Ödeme (kart veya kapıda) ve teslimat (dosya indirme veya kargo) elektronik olmayabilir."}, {"d": 2, "t": "Tanım", "f": "İnternetten sipariş verilip kapıda ödenen masa e-ticaret midir? İnternette görülüp mağazada sipariş verilen ürün?", "b": "Masa: evet, e-ticarettir (sipariş elektronik). İnternette görülüp sipariş mağazada verilirse dar istatistiksel tanıma göre e-ticaret değildir."}, {"d": 2, "t": "Tanım", "f": "E-ticaret ile e-işletmecilik farkı nedir?", "b": "E-ticaret dış çevreyle alım-satım işlemleridir. E-işletmecilik işletmenin bütün iç ve dış süreçlerine (üretim, stok, tedarik, finans, İK, CRM, müşteri hizmetleri) uzanır. E-ticaret, e-işletmeciliğin daha dar bir alt alanıdır."}, {"d": 2, "t": "Büyüklük", "f": "E-ticaretin ekonomik büyüklüğüne dair derste verilen iki rakam ve sınır nedir?", "b": "27 trilyon ABD doları: 43 ekonomide işletmelerin 2022 e-ticaret satışları. %60: 2016–2022 arası yaklaşık büyüme. Sınır: veri dünyanın tamamını değil raporlanan 43 ekonomiyi kapsar. B2B işlemler hacmin önemli bölümüdür."}, {"d": 2, "t": "Türler", "f": "B2B ve B2C'yi taraflar, ilişki, fiyat ve kritik başarı açısından karşılaştır.", "b": "B2B: iki işletme; sürekli ve sözleşme ağırlıklı; müzakere, miktar indirimi, vade; entegrasyon, güvenilirlik, teslim koşulları. B2C: işletme ve nihai tüketici; geniş müşteri kitlesi; ilan edilen fiyat; deneyim, güven, ödeme, teslimat ve iade."}, {"d": 2, "t": "Türler", "f": "C2C ve C2B nedir? Örnekleri?", "b": "C2C: bireyler başka bireylere ürün/hizmet sunar; platform ilan, ödeme, kimlik doğrulama, puanlama, uyuşmazlık çözümü sağlayabilir (ikinci el ürün satışı). C2B: birey işletmeye değer sunar, roller tersine döner (serbest çalışanın işletmeye çevrim içi tasarım hizmeti)."}, {"d": 2, "t": "Türler", "f": "B2G, G2B ve G2C nedir? Her elektronik kamu hizmeti e-ticaret midir?", "b": "B2G: işletmeden kamuya (e-kamu ihalesine teklif). G2B: kamudan işletmeye (ücretli veri/hizmet). G2C: kamudan vatandaşa (ücretli belge, ulaşım). Hayır; ekonomik bir sipariş veya değişim işlemi olmalı."}, {"d": 2, "t": "Türler", "f": "Fiziksel ürün, dijital ürün ve hizmette sipariş ve teslimat nasıldır?", "b": "Fiziksel: sipariş elektronik, teslimat fiziksel (stok, kargo, son kilometre, iade önemli). Dijital: sipariş ve teslimat elektronik (marjinal çoğaltma maliyeti düşük; telif, erişim kontrolü, dijital hak yönetimi kritik). Hizmet: sipariş elektronik, sunum fiziksel veya dijital."}, {"d": 2, "t": "Türler", "f": "Tam ve kısmi e-ticaret farkı nedir?", "b": "Tam: ürün, işlem ve teslimatın tümü dijital (e-kitap satın alma). Kısmi: sürecin yalnızca bazı bölümleri dijital (çevrim içi alınan ayakkabının kargoyla gelmesi)."}, {"d": 2, "t": "Kanal", "f": "İşletmeye ait e-mağaza ile e-pazar yerini karşılaştır.", "b": "E-mağaza: yüksek kontrol (fiyat, marka, müşteri verisi, hizmet koşulları) ama yüksek sorumluluk (ziyaretçi çekme; yazılım, güvenlik, ödeme altyapısı). Pazar yeri: bağımsız satıcı ve alıcıları buluşturur; işlem, ödeme, görünürlük kolaylığı; gelir: komisyon, ilan, reklam, lojistik."}, {"d": 2, "t": "Kanal", "f": "Pazar yeri ile perakendeci arasındaki kritik fark nedir?", "b": "Fiyat ve hizmet kararları üzerindeki kontrolün kimde olduğu (perakendecide işletmede, pazar yerinde bağımsız satıcılarda)."}, {"d": 2, "t": "Kanal", "f": "Mobil ticaret ve sosyal ticaret nedir?", "b": "Mobil ticaret: işlemin akıllı telefon/tablet üzerinden yapılması; ayrı işlem türü değil, cihaza göre sınıflandırma (uygulama, mobil site, dijital cüzdan, uygulama içi satın alma). Sosyal ticaret: keşif, değerlendirme, tavsiye, satış veya iletişimin sosyal medyayla bütünleşmesi; yalnızca reklam göstermek e-ticaret değildir, elektronik sipariş tamamlanmalı."}, {"d": 2, "t": "Kanal", "f": "EDI nedir?", "b": "Electronic Data Interchange: alıcı sistemi (sipariş) ile tedarikçi sistemi (fatura/sevk) arasında standart mesajla sipariş, fatura, sevk ve stok bilgilerinin insan müdahalesi azaltılarak aktarılması. E-ticaret internet mağazalarından önce de vardı."}, {"d": 2, "t": "Süreç", "f": "Uçtan uca e-ticaret sürecinin 6 aşaması nedir?", "b": "Keşif → değerlendirme → sipariş → ödeme → karşılama → satış sonrası. Her aşamadaki kopuş toplam dönüşümü ve müşteri deneyimini etkiler."}, {"d": 2, "t": "Süreç", "f": "Değerlendirme aşamasında arama maliyeti ve karar yükü nasıl değişir?", "b": "Fiyat, özellik, satıcı puanı, teslimat, garanti, iade ve ödeme seçenekleri karşılaştırılır. Arama maliyeti azalabilir, ancak karar yükü artabilir."}, {"d": 2, "t": "Süreç", "f": "Sipariş karşılama (fulfillment) aşamasında ne olur?", "b": "Sipariş doğrulanır, stok ayrılır, ürün toplanır, paketlenir, taşıyıcıya aktarılır ve takip bilgisi paylaşılır."}, {"d": 2, "t": "Gelir", "f": "Beş temel gelir modeli ve tipik kullanımları nedir?", "b": "Doğrudan satış (ürün satışı; e-mağaza), komisyon (işlemden pay; pazar yeri), abonelik (dönemsel ücret; dijital yayın), kullanım başına (tüketilen kadar; bulut bilişim), reklam (kullanıcı erişimini reklamverene sunma; içerik platformu)."}, {"d": 2, "t": "Gelir", "f": "Birlikte kullanılabilen gelir modelleri nelerdir? Sürdürülebilir iş modeli nedir?", "b": "Freemium (temel ücretsiz, gelişmiş ücretli), ilan ücreti (satıcı listeleme için öder), satış ortaklığı (yönlendirilen satıştan pay), ek hizmet (lojistik, ödeme, depolama, reklam ayrıca satılır). Sürdürülebilir iş modeli = müşteriye sunulan değer + bu değerden gelir elde etme mantığı."}, {"d": 2, "t": "Değer", "f": "Dört temel değer yaratma kaynağı nedir?", "b": "Verimlilik (arama, iletişim, sipariş, koordinasyon maliyetini azaltma; siparişin stoka otomatik aktarımı), tamamlayıcılık (ürün+ödeme+teslimat+destek paketi), bağlanma (kayıtlı tercihler, sadakat, abonelik; özgür seçimi ortadan kaldırmamalı), yenilik (küçük üreticiyi müşteriye bağlayan platform)."}, {"d": 2, "t": "Güven", "f": "Müşterinin algıladığı 8 risk nedir?", "b": "Ürün (açıklamaya uymama), teslimat (teslim edilmeme), ödeme (bilgilerin kötüye kullanılması), mahremiyet (verinin izinsiz kullanılması), itibar (sahte yorum/puan), satıcı (kimlik belirsizliği), iade (sürecin işlememesi), sistem (kesinti/siber saldırı)."}, {"d": 2, "t": "Güven", "f": "Güveni destekleyen uygulamalar nelerdir?", "b": "Satıcı kimliğini açıkça belirtmek, doğru ürün/fiyat bilgisi, güvenli ödeme ve kimlik doğrulama, şeffaf teslimat süresi, açık iade ve garanti, doğrulanmış değerlendirmeleri ayırmak, erişilebilir müşteri hizmetleri, kişisel veriyi ölçülü ve amaçla sınırlı kullanmak. Güven, algılanan fayda ve kullanım kolaylığıyla satın alma niyetini etkiler."}, {"d": 2, "t": "Başarı", "f": "E-ticarette başarı koşulları (6) nelerdir?", "b": "Açık değer önerisi, kullanılabilir sistem, sistem bütünleşmesi (stok, muhasebe, ödeme, CRM, lojistik), lojistik ve karşılama, güven ve hizmet (ulaşılabilir muhatap), veri temelli iyileştirme (gizlilik, güvenlik, etikle sınırlı)."}, {"d": 2, "t": "Başarı", "f": "DeLone–McLean e-ticaret başarı yaklaşımının bileşenleri nedir?", "b": "Girdi kaliteleri (sistem kalitesi, bilgi kalitesi, hizmet kalitesi) → kullanım deneyimi (kullanım, kullanıcı memnuniyeti) → sonuç (net faydalar). Başarı yalnızca satış miktarı değildir."}, {"d": 2, "t": "Gösterge", "f": "Dönüşüm oranı nasıl hesaplanır? Ders örneği?", "b": "Sipariş sayısı / ziyaret (oturum) sayısı × 100. 2.500 sipariş / 100.000 ziyaret × 100 = %2,5. Ziyaretlerin ne kadarının siparişle sonuçlandığını gösterir."}, {"d": 2, "t": "Gösterge", "f": "Ortalama sipariş değeri nasıl hesaplanır? Ders örneği?", "b": "Toplam satış geliri / sipariş sayısı. 1.500.000 TL / 2.500 = 600 TL. Bir siparişin ortalama parasal büyüklüğünü gösterir."}, {"d": 2, "t": "Gösterge", "f": "Müşteri edinme maliyeti nasıl hesaplanır? Ders örneği?", "b": "Edinme harcaması / yeni müşteri sayısı. 300.000 TL / 2.000 = 150 TL. Yeni müşteri kazanmak için yapılan ortalama harcama."}, {"d": 2, "t": "Gösterge", "f": "Sepet terk oranı nasıl hesaplanır? Ders örneği?", "b": "(Başlatılan sepetler − siparişler) / başlatılan sepetler × 100. (4.000 − 2.500) / 4.000 × 100 = %37,5."}, {"d": 2, "t": "Gösterge", "f": "Göstergeler neden birlikte değerlendirilmelidir?", "b": "Tek gösterge başarının tamamını açıklamaz; ör. yoğun indirim dönüşümü yükseltirken kârlılığı azaltabilir. Diğer göstergeler: tekrar satın alma, iade oranı, karşılama süresi, zamanında teslimat, şikâyet oranı, müşteri yaşam boyu değeri, brüt kâr marjı, kanal/kampanya dönüşümü."}, {"d": 3, "t": "Geçiş", "f": "E-işletmeciliğe geçişin niteliği nedir?", "b": "Tek bir teknoloji alımından (tek seferlik yatırım) çok, örgütün zaman içinde geliştirdiği sürekli gelişen örgütsel yeteneğe dayanır. İletişimle başlar, süreçlerin bütünleşmesine ve iş modelinin dönüşümüne doğru ilerler."}, {"d": 3, "t": "Geçiş", "f": "Aşama modelleri ne işe yarar?", "b": "01 Mevcut düzey: dijital olgunluk ve mevcut yetenekleri belirlemek. 02 Sonraki adım: gerekli yatırım, beceri ve yönetsel kapasiteyi tanımlamak. 03 Stratejik bağlantı: teknoloji yatırımlarını hedefler ve performans göstergeleriyle ilişkilendirmek. Aşamalar farklı hızda yaşanabilir, birlikte yürütülebilir veya atlanabilir."}, {"d": 3, "t": "Dönüşüm", "f": "Sayısallaştırma, dijitalleşme ve dijital dönüşüm farkı nedir?", "b": "Sayısallaştırma: bilginin biçimi değişir (kâğıt fatura → e-belge). Dijitalleşme: mevcut süreç iyileştirilir (siparişlerin çevrim içi alınması). Dijital dönüşüm: süreç, yapı veya iş modeli yeniden tasarlanır (perakendecinin veri temelli çok kanallı platforma dönüşmesi). Her teknoloji kullanımı dijital dönüşüm değildir."}, {"d": 3, "t": "Dönüşüm", "f": "Dijital işletme stratejisi nedir?", "b": "Bilgi teknolojileri stratejisi ile işletme stratejisinin kesişimi. Dönüşüm ilerledikçe teknoloji stratejisi ile işletme stratejisi arasındaki sınır zayıflar."}, {"d": 3, "t": "Hazırlık", "f": "Elektronik hazırlık (e-readiness) nedir? İki boyutu?", "b": "İşletmenin yeni bir olgunluk düzeyine geçmek için gerekli iç kaynaklara ve dış çevre koşullarına sahip olup olmadığı. Örgütsel hazırlık (finansal kaynak, insan kaynağı ve dijital bilgi, teknoloji altyapısı, üst yönetim desteği) ve dış çevre hazırlığı (müşteri/tedarikçi uyumu, finans ve ödeme, iletişim ve lojistik altyapısı, devlet ve hukuki çevre)."}, {"d": 3, "t": "Hazırlık", "f": "Elektronik hazırlığın altı boyutu nedir?", "b": "Stratejik (hedef, bütçe, yönetim desteği, sorumluluk), teknolojik (internet, yazılım, donanım, veri, entegrasyon, güvenlik), insan kaynağı (dijital beceri, eğitim, öğrenme kapasitesi, değişime açıklık), süreç (tanımlama, standartlaştırma, ölçme), finansal (yatırım, bakım, lisans, eğitim maliyeti), dış çevre ve hukuk (talep, tedarikçi, ödeme, lojistik, yasal yükümlülük)."}, {"d": 3, "t": "Hazırlık", "f": "Neden süreç hazırlığı teknoloji yatırımından önce gelir?", "b": "Düzensiz bir sürecin otomasyonu düzensizliği daha hızlı üretir. Sıra: süreci tanımlama → gereksiz adımları kaldırma → sorumlulukları belirleme → teknolojiyi uygulama."}, {"d": 3, "t": "Aşamalar", "f": "Earl'ün modeli neyi açıklar?", "b": "E-işletmeciliğin altı aşamalı gelişimini: dış iletişimden elektronik işletmeye ve iş modelinin dönüşümüne uzanan süreç. (Aşamaların ayrıntısı fotoğraflarda yok.)"}, {"d": 4, "t": "Çeşitlilik", "f": "Raf alanı ile dijital katalog arasındaki fark nedir?", "b": "Fiziksel mağaza: sınırlı raf/depo/teşhir, yerel talebe göre ürün seçimi, az talep gören ürünü sergileme güçlüğü. E-mağaza: merkezi depo ve tedarikçi stoku, sipariş üzerine üretim, daha geniş ve niş ürün çeşidi."}, {"d": 4, "t": "Çeşitlilik", "f": "Çeşitlilik tüketici değerini nasıl artırır, hangi koşulla?", "b": "Az talep gören ürünler e-katalogda erişilebilir; çevrim içi kitapta çeşitlilikten doğan yarar düşük fiyattan doğan yarardan yüksek bulunmuştur. Ancak sınıflandırma, arama, filtreleme, stok doğruluğu ve öneri sistemi yoksa geniş katalog değer yerine karmaşıklık üretir."}, {"d": 4, "t": "Fiyat", "f": "E-ticarette fiyat yönetimi gelenekselden nasıl ayrılır?", "b": "Geleneksel: fiziksel etiket değiştirme, mağaza sistemi güncelleme, çalışanları bilgilendirme, yerel fiyat. Elektronik: merkezi güncelleme, daha sık ve küçük değişiklikler, rakip fiyatını hızlı karşılaştırma, kampanyaları hızla uygulama."}, {"d": 4, "t": "Fiyat", "f": "Toplam müşteri maliyeti nedir? İnternet fiyatları hep düşük müdür?", "b": "Ürün fiyatı + teslimat + zaman + arama + algılanan risk. İnternet fiyatları her zaman düşük değildir; fiyat farklılıkları ortadan kalkmamıştır. Kanallar ancak tüm bileşenlerle karşılaştırılabilir."}, {"d": 4, "t": "Teslimat", "f": "Geleneksel ve elektronik satın alma akışları nasıldır?", "b": "Geleneksel: mağaza → inceleme → ödeme → hemen teslim. Elektronik: seçim → sipariş → ödeme → hazırlama → teslim. E-ticarette ödeme ile ürüne sahip olma arasında bekleme vardır; fiziksel üründe teslimat süresi müşteri değerinin parçasıdır."}, {"d": 4, "t": "Teslimat", "f": "E-siparişin operasyon zinciri nedir?", "b": "Sipariş (ürün ve teslimat seçimi) → ödeme (tercih ve doğrulama) → hazırlama (depo ve paketleme) → taşıma (teslimat kuruluşu) → teslim. Müşteri deneyimi yalnız internet sitesinde oluşmaz."}, {"d": 4, "t": "Maliyet", "f": "E-ticaret maliyetleri ortadan kaldırır mı?", "b": "Hayır; maliyet ortadan kalkmaz, bileşimi değişir. Kira, dekorasyon, mağaza personeli, yerel stok, fiziksel satış noktası yerine yazılım ve bulut, dijital pazarlama, ödeme ve pazar yeri komisyonları, depolama-kargo-iade lojistiği öne çıkar."}, {"d": 4, "t": "Etkileşim", "f": "Yüz yüze ve dijital etkileşimin araçları nelerdir?", "b": "Yüz yüze: soruları anında yanıtlama, tepkileri gözlemleme, öneriyi anında uyarlama, karmaşık kararlarda açıklama ve güven. Dijital: kişiselleştirilmiş öneri ve içerik, chatbot ve canlı destek, e-posta ve mobil bildirim, çağrı merkezi. Karmaşık alışverişlerde insan desteği önemini korur."}, {"d": 4, "t": "Etkileşim", "f": "Kişiselleştirme ile mahremiyet arasındaki denge nedir?", "b": "Fayda: daha ilgili öneriler, daha hızlı ürün bulma, ihtiyaca uygun iletişim. Kaygı: aşırı veri toplama, izlenme hissi, verinin amaç dışı kullanımı. Kişiselleştirme için gerekli ve gereksiz veri arasındaki sınır açıkça belirlenmelidir."}, {"d": 4, "t": "Veri", "f": "Dijital müşteri yolculuğunda hangi veriler üretilir?", "b": "Trafik (kaynak ve ziyaret) → arama (arama ifadeleri) → inceleme (ürün görüntüleme) → sepet (ekleme ve terk) → sipariş (satın alma ve iade). Davranışsal ve işlemsel veriler süreç iyileştirmeyi destekler."}, {"d": 4, "t": "Veri", "f": "'Ölçülebilir olan her veri toplanmamalıdır' ilkesinin dört ölçütü nedir?", "b": "Amaç (verinin hangi sorun için gerektiği), gereklilik (yalnız gerekli veri), güvenlik (koruma ve erişim kontrolü), hukuk ve etik (uygun kullanım ve ayrımcılığın önlenmesi)."}, {"d": 4, "t": "Pazarlama", "f": "E-pazarlama reklamdan siparişe yolu nasıl değiştirir?", "b": "Reklam → ürün sayfası → sepet → sipariş şeklinde yolu kısaltır, dönüşümü kolaylaştırır. Ancak çok sayıda satıcı arasında görünürlük ve dikkat kazanmak zorlaşır; dikkat stratejik kaynak olur."}, {"d": 4, "t": "Aracılar", "f": "Aracısızlaşma ve yeniden aracılanma nedir?", "b": "Aracısızlaşma: üretici ile tüketicinin doğrudan buluşması, geleneksel aracıların rolünün azalması, doğrudan satış kanalı. Yeniden aracılanma: yeni dijital aracılar (pazar yeri, arama motoru, fiyat karşılaştırma, ödeme, lojistik, reklam/değerlendirme ağları); aracı sayısı azalmak zorunda değildir, işlevi ve gücü değişir."}, {"d": 4, "t": "Değerlendirme", "f": "Tüketici açısından e-ticaretin üstünlük ve sınırlılıkları?", "b": "Üstünlük: zaman-mekân esnekliği, kolay karşılaştırma, geniş çeşit, mağazaya gitmeme, yorumlara erişim, kişiselleştirilmiş öneri. Sınırlılık: fiziksel inceleyememe, teslimat bekleme ve kargo maliyeti, sahte yorum riski, ödeme/veri güvenliği kaygısı, iade-uyuşmazlık, mahremiyet."}, {"d": 4, "t": "Değerlendirme", "f": "İşletme açısından e-ticaretin üstünlük ve sınırlılıkları?", "b": "Üstünlük: geniş pazar, 7/24 sipariş, davranış ölçümü, hızlı fiyat/kampanya, otomasyon, ölçeklenme. Sınırlılık: yoğun fiyat ve görünürlük rekabeti, teknoloji ve güvenlik yatırımı, lojistik ve iade, pazar yeri/ödeme/reklam maliyetleri, kesinti ve siber saldırı, platform bağımlılığı."}, {"d": 4, "t": "Değerlendirme", "f": "Ürün kategorisi kanal üstünlüğünü nasıl değiştirir?", "b": "Standart ürünler (elektronik cihaz gibi karşılaştırılabilir) dijitalde kolay değerlendirilir. Duyusal ürünlerde (parfüm, kişiye özel giyim) fiziksel deneyim önemlidir. Hibrit yol: bir kanalda araştırıp diğerinde deneme, satın alma veya iade."}, {"d": 4, "t": "Bütünleşme", "f": "Bütünleşik ticaretin dört yaygın biçimi nedir?", "b": "Webrooming (internetten araştır, mağazada incele ve al), showrooming (mağazada gör/dene, e-kanaldan sipariş), tıkla ve teslim al (internetten sipariş, mağazadan teslim), mağazada iade (internetten alınanı mağazaya iade)."}, {"d": 5, "t": "E-perakende", "f": "Elektronik perakendecilik nedir, kapsamı nelerdir?", "b": "Nihai tüketiciye yönelik satışın dijital kanallar üzerinden yürütülmesi. Kapsam: dijital satış alanı (site, uygulama, pazar yeri, sosyal medya mağazası), işlem süreci (arama, karşılaştırma, sipariş, ödeme), operasyon (stok, depo, lojistik, müşteri hizmetleri, iade, satış sonrası)."}, {"d": 5, "t": "E-perakende", "f": "Ekranın önünde ve arka planda hangi sistemler çalışır?", "b": "Müşterinin gördüğü: ürün bilgisi ve görseller, arama ve karşılaştırma, sepet-ödeme-sipariş takibi, destek-değişim-iade. Arka planda: stok ve sipariş yönetimi, ödeme ve sahtekârlık kontrolü, depo-paketleme-lojistik, veri ve müşteri hizmetleri."}, {"d": 5, "t": "E-perakende", "f": "E-perakendecilik ile e-ticaret ilişkisi nedir? Ayırt edici ölçüt?", "b": "E-perakendecilik, e-ticaretin nihai tüketiciye satışa odaklanan alt alanıdır (e-işletmecilik ⊃ e-ticaret ⊃ e-perakendecilik). Ölçüt: işlemin dijital olması kadar alıcının nihai tüketici olup olmadığı. B2B hammadde alımı e-ticarettir; üreticinin kendi sitesinden tüketiciye satışı e-perakendeciliktir."}, {"d": 5, "t": "E-perakende", "f": "E-perakendeciliğin ayırt edici temel özellikleri nelerdir?", "b": "Dijital satış alanı, ölçülebilir müşteri davranışı ve sipariş ile teslimat arasındaki operasyon. Ayrıca: metin/görsel/video/yorumla sunum, 7/24 erişim, hızlı fiyat güncelleme, fiziksel teşhire az bağımlılık; güven-veri güvenliği-mahremiyet; müşteri ile satıcının fiziksel olarak ayrılması."}, {"d": 5, "t": "E-perakende", "f": "Erişim olanağı neden tek başına başarı sağlamaz?", "b": "Pazara erişim (geniş coğrafya) yanında yerel uyum (dil, ürün bilgisi, ödeme yöntemleri, müşteri desteği) ve yerine getirme (teslimat kapasitesi ve marka güvenilirliği) gerekir; bunlar satış vaadini gerçek müşteri deneyimine dönüştürür."}];
const QUIZ = [{"d": 2, "q": "Elektronik ticarette belirleyici unsur hangisidir?", "o": ["Ödemenin kartla yapılması", "Siparişin özel tasarlanmış elektronik sistem üzerinden verilmesi", "Ürünün dijital olması", "Teslimatın kargoyla yapılması"], "a": 1, "w": "Sipariş belirleyicidir; ödeme ve teslimat değişebilir."}, {"d": 2, "q": "Aşağıdakilerden hangisi bir işlemi e-ticaret yapan üç ölçütten biri DEĞİLDİR?", "o": ["Ekonomik değer", "En az iki taraf", "Elektronik sipariş sistemi", "Elektronik teslimat"], "a": 3, "w": "Teslimat fiziksel olabilir."}, {"d": 2, "q": "İnternetten sipariş edilip kapıda nakit ödenen bir masa için hangisi doğrudur?", "o": ["E-ticaret değildir, çünkü ödeme nakittir", "E-ticarettir, çünkü sipariş elektroniktir", "Kısmi e-ticaret sayılmaz", "Sadece B2B ise e-ticarettir"], "a": 1, "w": "Ödeme ve teslimat elektronik olmak zorunda değildir."}, {"d": 2, "q": "E-ticaret ile e-işletmecilik ilişkisi hangisidir?", "o": ["İkisi aynıdır", "E-işletmecilik e-ticaretin alt alanıdır", "E-ticaret e-işletmeciliğin alt alanıdır", "Hiçbir ilişkileri yoktur"], "a": 2, "w": "E-işletmecilik tüm iç ve dış süreçleri kapsar."}, {"d": 2, "q": "Serbest çalışan bir tasarımcının işletmeye çevrim içi hizmet sunması hangi türdür?", "o": ["B2C", "C2C", "C2B", "G2C"], "a": 2, "w": "Birey işletmeye değer sunar; roller tersine döner."}, {"d": 2, "q": "İşletmenin elektronik kamu ihalesine teklif vermesi hangi türdür?", "o": ["G2B", "B2G", "G2C", "B2B"], "a": 1, "w": "İşletmeden kamuya."}, {"d": 2, "q": "B2B e-ticarette kritik başarı faktörleri hangileridir?", "o": ["Deneyim, iade, ilan edilen fiyat", "Entegrasyon, güvenilirlik, teslim koşulları", "Sosyal medya ve reklam", "Ödeme ve kampanya"], "a": 1, "w": "B2C'de ise deneyim, güven, ödeme, teslimat ve iade öne çıkar."}, {"d": 2, "q": "Marjinal çoğaltma maliyetinin düşebildiği, telif ve erişim kontrolünün kritik olduğu ürün türü hangisidir?", "o": ["Fiziksel ürün", "Dijital ürün", "Hizmet", "Hammadde"], "a": 1, "w": "Örnek: e-kit const NOTES = "# Hafta 2 — Elektronik ticaretin tanımı, türleri, süreç, gelir modelleri ve göstergeler\n\n## Tanım (Bölüm 3)\n- **Belirleyici unsur: siparişin özel olarak tasarlanmış bir elektronik sistem üzerinden verilmesi.**\n- Bir işlemi e-ticaret yapan **üç ölçüt**:\n  1. **Ekonomik değer:** mal, hizmet veya bilgi ekonomik değere sahip olmalı.\n  2. **En az iki taraf:** satın alma, satış veya değişim işlemi gerçekleşmeli.\n  3. **Elektronik sipariş sistemi:** sipariş bu amaçla tasarlanmış bilgisayar ağı üzerinden oluşturulmalı (web sitesi, mobil uygulama, pazar yeri, EDI, işletmeler arası sipariş portalları).\n- **Sipariş belirleyicidir; ödeme ve teslimat değişebilir:**\n\n| Aşama | Elektronik olması zorunlu mu? | Örnek |\n|---|---|---|\n| Sipariş | **Evet** | İnternet sitesindeki alışveriş sepeti |\n| Ödeme | Hayır | Çevrim içi kart ödemesi veya kapıda ödeme |\n| Teslimat | Hayır | Dosya indirme veya kargo |\n- İnternetten sipariş edilen masa, ödeme teslimatta yapılsa bile **e-ticarettir**. Ürün internette görülüp sipariş mağazada verilirse (dar istatistiksel tanıma göre) **e-ticaret değildir**.\n\n## E-ticaret ve e-işletmecilik (Bölüm 4)\n- **E-ticaret:** dış çevreyle alım-satım işlemleri. **E-işletmecilik:** işletmenin bütün iç ve dış süreçleri (üretim, stok, tedarik, finans, İK, CRM, müşteri hizmetleri).\n- **E-ticaret, e-işletmeciliğin (daha dar) bir alt alanıdır.**\n\n## Ekonomik büyüklük (Bölüm 5)\n- E-ticaret yalnızca tüketici alışverişi değildir; **işletmeler arası (B2B) işlemler toplam hacmin önemli bölümünü** oluşturur.\n- **27 trilyon ABD doları:** 43 ekonomide işletmelerin 2022 e-ticaret satışları. **%60:** 2016–2022 dönemindeki yaklaşık büyüme. Sınır: veri dünyanın tamamını değil, raporlanan 43 ekonomiyi kapsar.\n\n## Taraflarına göre türler (Bölüm 6)\n| Boyut | B2B (işletmeden işletmeye) | B2C (işletmeden tüketiciye) |\n|---|---|---|\n| Taraflar | İki işletme | İşletme ve nihai tüketici |\n| İlişki | Daha sürekli, sözleşme ağırlıklı | Daha geniş müşteri kitlesi |\n| Fiyat | Müzakere, miktar indirimi, vade | Çoğunlukla ilan edilen fiyat |\n| Kritik başarı | Entegrasyon, güvenilirlik, teslim koşulları | Deneyim, güven, ödeme, teslimat ve iade |\n- B2B siparişleri çoğunlukla daha yüksek tutarlı; B2C'de kullanıcı deneyimi daha belirleyici.\n- **C2C (tüketiciden tüketiciye):** bireyler başka bireylere ürün/hizmet sunar; platform ilan, ödeme, kimlik doğrulama, puanlama ve uyuşmazlık çözümü sağlayabilir (ikinci el ürünün çevrim içi pazar yerinde satılması).\n- **C2B (tüketiciden işletmeye):** birey işletmeye ekonomik değeri olan içerik/hizmet/ürün sunar; satıcı-alıcı rolleri tersine döner (serbest çalışanın işletmeye çevrim içi tasarım hizmeti).\n- **Kamu bağlantılı:** **B2G** işletmeden kamuya (e-kamu ihalesine teklif), **G2B** kamudan işletmeye (kamu kurumunun ücretli veri/hizmet sunması), **G2C** kamudan vatandaşa (ücretli belge, ulaşım, kamu hizmeti). **Her elektronik kamu hizmeti e-ticaret değildir**; ekonomik bir sipariş veya değişim işlemi bulunmalı.\n\n## Ürün ve teslimat biçimine göre (Bölüm 7)\n- **Fiziksel ürün:** sipariş elektronik, teslimat fiziksel; stok, depo, kargo, son kilometre teslimatı ve iade yönetimi önem kazanır (kitap, mobilya, gıda, giyim).\n- **Dijital ürün:** sipariş ve teslimat elektronik; **marjinal çoğaltma maliyeti düşebilir**; telif, erişim kontrolü ve dijital hak yönetimi kritik (e-kitap, yazılım, dijital oyun).\n- **Hizmet:** sipariş elektronik; hizmet fiziksel ya da dijital (danışmanlık dijital, uçuş fiziksel, yemek üretim ve teslimata bağlı).\n- **Tam e-ticaret:** ürün, işlem ve teslimat dijital (e-kitap). **Kısmi e-ticaret:** sürecin yalnızca bazı bölümleri dijital (çevrim içi alınan ayakkabının kargoyla gelmesi).\n\n## Kanallar (Bölüm 8)\n- Kanal seçimi kontrol, erişim, maliyet, veri sahipliği ve aracının rolünü değiştirir.\n- **İşletmeye ait e-mağaza:** yüksek kontrol (fiyatlandırma, marka sunumu, müşteri verisi, hizmet koşulları) + yüksek sorumluluk (ziyaretçi çekme; yazılım, güvenlik, ödeme altyapısı).\n- **E-pazar yeri:** çok taraflı erişim (bağımsız satıcı ve alıcıları buluşturma; işlem, ödeme, görünürlük kolaylığı); gelir: komisyon, ilan, reklam, lojistik.\n- **Pazar yeri ile perakendeci arasındaki kritik fark: fiyat ve hizmet kararları üzerindeki kontrol kimdedir?**\n- **Mobil ticaret:** işlemin akıllı telefon/tablet üzerinden yapılması; ayrı bir işlem türünden çok **cihaza göre sınıflandırma** (uygulamalar, mobil siteler, dijital cüzdanlar, uygulama içi satın alma).\n- **Sosyal ticaret:** ürün keşfi, değerlendirme, tavsiye, satış veya müşteri iletişiminin sosyal medyayla bütünleşmesi. **Yalnızca reklam göstermek e-ticaret değildir; elektronik sipariş tamamlanmalı.**\n- **EDI (Electronic Data Interchange):** e-ticaret internet mağazalarından önce de vardı. Alıcı sistemi (sipariş) ↔ standart mesaj (EDI) ↔ tedarikçi sistemi (fatura/sevk). Sipariş, fatura, sevk ve stok bilgileri insan müdahalesi azaltılarak sistemler arasında aktarılır.\n\n## İşlem süreci (Bölüm 9)\n- Uçtan uca 6 aşama: **1 Keşif → 2 Değerlendirme → 3 Sipariş → 4 Ödeme → 5 Karşılama → 6 Satış sonrası.** Her aşamadaki kopuş toplam dönüşümü ve müşteri deneyimini etkiler.\n- Keşif: arama motorları, sosyal medya, pazar yerleri, reklamlar, yorumlar, tavsiyeler. Değerlendirme: fiyat, özellik, satıcı puanı, teslimat, garanti, iade, ödeme seçenekleri; **arama maliyeti azalabilir, karar yükü artabilir.** Sipariş: stok kontrolü, doğru fiyat ve vergi, teslimat bedeli, kampanyalar, sipariş özeti hatasız çalışmalı.\n- Ödeme: kart, transfer, dijital cüzdan, mobil, kapıda; gizlilik, doğrulama, güvenlik, hata yönetimi kritik. Karşılama: sipariş doğrulanır, stok ayrılır, ürün toplanır, paketlenir, taşıyıcıya aktarılır, takip bilgisi paylaşılır. Satış sonrası: iade, değişim, garanti, şikâyet, teknik destek, memnuniyet → tekrar satın alma kararı.\n\n## İş ve gelir modelleri (Bölüm 10)\n| Model | Gelirin kaynağı | Tipik kullanım |\n|---|---|---|\n| Doğrudan satış | Ürünün müşteriye satılması | E-mağaza |\n| Komisyon | Gerçekleşen işlemden pay | E-pazar yeri |\n| Abonelik | Dönemsel ücret | Dijital yayın platformu |\n| Kullanım başına | Tüketilen hizmet kadar ödeme | Bulut bilişim |\n| Reklam | Kullanıcı erişiminin reklamverene sunulması | İçerik platformu |\n- Birlikte kullanılabilir: **freemium** (temel ücretsiz, gelişmiş ücretli), **ilan ücreti** (satıcı listelemek için öder), **satış ortaklığı** (yönlendirilen satıştan pay), **ek hizmet** (lojistik, ödeme, depolama, reklam ayrıca satılır).\n- **Sürdürülebilir iş modeli = müşteriye sunulan değer + bu değerden gelir elde etme mantığı.**\n\n## Değer yaratma (Bölüm 11)\n- Teknoloji ancak arama, işlem ve koordinasyon maliyetlerini azaltan ya da yeni değer önerisi kuran mekanizmalarla anlam kazanır.\n- **Dört kaynak:** **Verimlilik** (arama, iletişim, sipariş, koordinasyon maliyetini azaltma; siparişin stoka otomatik aktarılması) · **Tamamlayıcılık** (birlikte sunulan unsurlarla daha yüksek değer; ürün + ödeme + teslimat + destek paketi) · **Bağlanma / kilitlenme** (ilişkinin gönüllü sürmesini kolaylaştırma; kayıtlı tercihler, sadakat, abonelik; müşterinin özgür seçimini ortadan kaldırmamalı) · **Yenilik** (yeni ürün, hizmet, işlem biçimi veya ilişki; küçük üreticiyi müşteriye bağlayan platform).\n\n## Güven ve algılanan risk (Bölüm 12)\n- Fiziksel uzaklık ve **bilgi asimetrisi** satın alma kararında güveni ve algılanan riski görünür kılar.\n- **8 risk:** ürün (açıklamaya uymama), teslimat (teslim edilmeme), ödeme (bilgilerin kötüye kullanılması), mahremiyet (verinin izinsiz kullanılması), itibar (sahte yorum/puan), satıcı (kimliğin belirsizliği), iade (sürecin işlememesi), sistem (kesinti veya siber saldırı).\n- Güveni destekleyen uygulamalar: satıcı kimliğini açıkça belirtmek, doğru ürün ve fiyat bilgisi, güvenli ödeme ve kimlik doğrulama, şeffaf teslimat süresi, açık iade ve garanti, doğrulanmış değerlendirmeleri ayırmak, erişilebilir müşteri hizmetleri, kişisel veriyi ölçülü ve amaçla sınırlı kullanmak.\n- **Güven, algılanan fayda ve kullanım kolaylığıyla birlikte satın alma niyetini etkiler.**\n\n## Başarı koşulları (Bölüm 13)\n- **Açık değer önerisi** (müşteri neden bu işletmeden almalı? fiyat, çeşit, hız, uzmanlık, kişiselleştirme, erişim kolaylığı) · **Kullanılabilir sistem** (hızlı, anlaşılır, erişilebilir; arama, filtreleme, sepet, ödeme gereksiz karmaşık olmamalı) · **Sistem bütünleşmesi** (satış kanalı stok, muhasebe, ödeme, CRM, lojistikle uyumlu; aksi hâlde yanlış fiyat, stok, gecikme).\n- **Lojistik ve karşılama** (doğru ürünün hasarsız, zamanında teslimi) · **Güven ve hizmet** (sorun yaşayan müşterinin ulaşabileceği muhatap) · **Veri temelli iyileştirme** (ziyaret, arama, sepet, satış, iade, şikâyet verileri; gizlilik, güvenlik, etikle sınırlı).\n- **DeLone–McLean başarı yaklaşımı:** girdi kaliteleri (**sistem, bilgi, hizmet kalitesi**) → kullanım deneyimi (**kullanım, kullanıcı memnuniyeti**) → sonuç (**net faydalar**). Başarı yalnızca satış miktarı değildir.\n\n## Temel performans göstergeleri (Bölüm 14)\n| Gösterge | Formül | Ders örneği |\n|---|---|---|\n| **Dönüşüm oranı** | sipariş sayısı / ziyaret (oturum) sayısı × 100 | 2.500 / 100.000 × 100 = **%2,5** |\n| **Ortalama sipariş değeri** | toplam satış geliri / sipariş sayısı | 1.500.000 TL / 2.500 = **600 TL** |\n| **Müşteri edinme maliyeti** | edinme harcaması / yeni müşteri sayısı | 300.000 TL / 2.000 = **150 TL** |\n| **Sepet terk oranı** | (başlatılan sepet − sipariş) / başlatılan sepet × 100 | (4.000 − 2.500) / 4.000 × 100 = **%37,5** |\n- Birlikte değerlendirilmesi gerekenler: tekrar satın alma oranı, iade oranı, sipariş karşılama süresi, zamanında teslimat oranı, şikâyet oranı, **müşteri yaşam boyu değeri**, brüt kâr marjı, kanal/kampanya dönüşümü.\n- **Yoğun indirim dönüşümü yükseltirken kârlılığı azaltabilir. Tek gösterge genel başarının tamamını açıklamaz.**\n\n---\n\n# Hafta 3 — Elektronik işletmecilik aşamaları ve hazırlık\n*(Ders sunusu 3–9. bölümler; fotoğraflar 6. bölümün başlığında bittiği için 6–9 eksik.)*\n\n## E-işletmeciliğe geçiş (Bölüm 3)\n- Geçiş **tek bir teknoloji alımından çok örgütün zaman içinde geliştirdiği yeteneklere** dayanır: \"tek seferlik yatırım\" değil, **\"sürekli gelişen örgütsel yetenek\"**.\n- Kapsam: tedarik ve üretim; pazarlama, satış ve ödeme; lojistik ve müşteri ilişkileri; finans ve İK.\n- Geçişin niteliği: **iletişimle başlayan gelişim → süreçlerin bütünleşmesi → iş modelinin dönüşümü.**\n- Aşama modellerinin kullanım alanı: **01 Mevcut düzey** (dijital olgunluk ve mevcut yetenekler) · **02 Sonraki adım** (gerekli yatırım, beceri, yönetsel kapasite) · **03 Stratejik bağlantı** (teknoloji yatırımlarını hedefler ve performans göstergeleriyle ilişkilendirmek). İşletmeler aşamaları farklı hızlarda yaşayabilir, birlikte yürütebilir veya atlayabilir.\n\n## Sayısallaştırma, dijitalleşme, dijital dönüşüm (Bölüm 4)\n| Kavram | Temel değişim | Örnek |\n|---|---|---|\n| **Sayısallaştırma** (digitization) | Bilginin biçimi değişir | Kâğıt faturanın elektronik belgeye çevrilmesi |\n| **Dijitalleşme** (digitalization) | Mevcut süreç iyileştirilir | Siparişlerin çevrim içi alınması |\n| **Dijital dönüşüm** | Süreç, yapı veya iş modeli yeniden tasarlanır | Perakendecinin veri temelli çok kanallı platforma dönüşmesi |\n- **Her teknoloji kullanımı dijital dönüşüm anlamına gelmez.**\n- **Dijital işletme stratejisi** = bilgi teknolojileri stratejisi ∩ işletme stratejisi; dönüşüm ilerledikçe ikisi arasındaki sınır zayıflar.\n\n## E-hazırlık / e-readiness (Bölüm 5)\n- İşletmenin yeni bir olgunluk düzeyine geçmek için gerekli **iç kaynaklara ve dış çevre koşullarına** sahip olup olmadığını gösterir.\n- **Örgütsel hazırlık:** finansal kaynaklar, insan kaynağı ve dijital bilgi, teknoloji altyapısı, üst yönetim desteği. **Dış çevre hazırlığı:** müşteri ve tedarikçi uyumu, finans ve ödeme altyapısı, iletişim ve lojistik altyapısı, devlet kurumları ve hukuki çevre.\n- Boyutlar: **Stratejik** (dijital hedefler, bütçe, yönetim desteği, sorumluluklar) · **Teknolojik** (internet, yazılım, donanım, veri, entegrasyon, güvenlik) · **İnsan kaynağı** (dijital beceri, eğitim, öğrenme kapasitesi, değişime açıklık) · **Süreç** (tanımlama, standartlaştırma, ölçme) · **Finansal** (yatırım, bakım, lisans, eğitim maliyetleri) · **Dış çevre ve hukuk** (talep, tedarikçi uyumu, ödeme, lojistik, yasal yükümlülükler).\n- **Süreç hazırlığı teknoloji yatırımından önce gelir:** 1 süreci tanımlama → 2 gereksiz adımları kaldırma → 3 sorumlulukları belirleme → 4 teknolojiyi uygulama. **\"Düzensiz bir sürecin otomasyonu, düzensizliği daha hızlı üretir.\"**\n\n## Gelişim aşamaları (Bölüm 6)\n- **Earl'ün altı aşamalı modeli:** dış iletişimden elektronik işletmeye ve iş modelinin dönüşümüne uzanan gelişimi açıklar. *(Aşamaların ayrıntı slaytı fotoğraflanmamış; ders kitabından/slayttan tamamla.)*\n\n---\n\n# Hafta 4 — E-ticaretin geleneksel ticaretle karşılaştırılması\n*(Bölüm 9–20; 3–8 fotoğraflanmamış.)*\n\n## Ürün çeşitliliği ve raf sınırlaması (Bölüm 9)\n- E-mağaza fiziksel teşhir alanına daha az bağımlıdır; **çeşitlilik ancak arama, sınıflandırma ve stok bilgisiyle değer yaratır.**\n- Fiziksel mağaza: sınırlı raf/depo/teşhir, yerel talebe göre seçim, az talep gören ürünü sergileme güçlüğü. E-mağaza: merkezi depo ve tedarikçi stoku, sipariş üzerine üretim, **daha geniş ve niş çeşit**.\n- Çevrim içi kitap satışlarında **çeşitlilikten doğan tüketici yararı, düşük fiyattan doğan yarardan daha yüksek** bulunmuştur (belirli dönem/kategoriye ait). Genel ilke: dijital pazar niş ürünlere erişimi kolaylaştırır.\n- Geniş çeşitliliğin yönetim koşulları: **sınıflandırma, arama, filtreleme, stok doğruluğu, öneri sistemi**; eksikse geniş katalog değer yerine karmaşıklık üretir.\n\n## Fiyatlandırma ve şeffaflık (Bölüm 10)\n- Geleneksel: fiziksel etiket değiştirme, mağaza sistemlerini güncelleme, çalışanları bilgilendirme, yerel fiyat. Elektronik: **merkezi güncelleme, daha sık ve küçük değişiklikler, rakip fiyatlarının hızlı karşılaştırılması, kampanyaların hızla uygulanması.**\n- İnternet fiyatları her zaman daha düşük değildir: kitap/müzik araştırmalarında daha düşük ve daha küçük değişiklikler görülmüş; ama **fiyat farklılıkları ortadan kalkmamıştır.**\n- **Toplam müşteri maliyeti = ürün fiyatı + teslimat + zaman + arama + algılanan risk.** Kanallar ancak tüm bileşenlerle karşılaştırılabilir.\n\n## Satın alma, ödeme ve teslimat (Bölüm 11)\n- Geleneksel akış: mağaza → inceleme → ödeme → **hemen teslim**. Elektronik akış: seçim → sipariş → ödeme → **hazırlama → teslim** (aradaki bekleme).\n- Dijital üründe teslim anında olabilir; **fiziksel üründe teslimat süresi müşteri değerinin parçasıdır.**\n- E-siparişin operasyon zinciri: **sipariş → ödeme (tercih ve doğrulama) → hazırlama (depo, paketleme) → taşıma (teslimat kuruluşu) → teslim.** **Müşteri deneyimi yalnız internet sitesinde oluşmaz.**\n\n## Maliyet yapısı (Bölüm 12)\n- **E-ticaret maliyetsiz değildir; maliyet ortadan kalkmaz, bileşimi değişir:** ağırlık mağaza ve fiziksel personelden **teknoloji, veri, pazarlama ve lojistiğe** kayar.\n| Geleneksel | Elektronik |\n|---|---|\n| Mağaza kirası ve dekorasyon | İnternet sitesi, uygulama, yazılım lisansları |\n| Fiziksel teşhir ve mağaza personeli | Teknik personel, bulut hizmeti, siber güvenlik |\n| Enerji, güvenlik, mağaza bazlı stok | Elektronik ödeme ve pazar yeri komisyonları |\n| Fiziksel reklam materyalleri | Dijital reklam ve müşteri edinme giderleri |\n| Yeni satış noktası açma | Depolama, paketleme, kargo ve iade lojistiği |\n\n## Satıcı–müşteri etkileşimi (Bölüm 13)\n- Yüz yüze: soruları anında yanıtlama, tepkileri gözlemleme, öneriyi anında uyarlama, karmaşık kararlarda açıklama ve güven. Dijital: ürün önerileri ve kişiselleştirilmiş içerik, chatbot ve canlı destek, e-posta ve mobil bildirim, çağrı merkezi. **Karmaşık alışverişlerde insan desteği önemini korur.**\n- **Kişiselleştirme–mahremiyet dengesi:** müşteri faydası (ilgili öneriler, hızlı bulma) vs mahremiyet kaygısı (aşırı veri toplama, izlenme hissi, amaç dışı kullanım). Gerekli ve gereksiz veri arasındaki sınır açıkça belirlenmeli.\n\n## Güven ve risk (Bölüm 14)\n- Fiziksel varlık belirsizliği azaltabilir; e-ticarette **satıcı kimliği, ödeme, teslimat, veri kullanımı ve iade** güvenin temel bileşenleri.\n- Risk kaynakları (6): satıcı kimliği, ürün uygunluğu, ödeme güvenliği, teslimat, kişisel veri, iade ve uyuşmazlık.\n- Güveni destekleyen: **şeffaflık** (satıcı kimliği ve iletişim; doğru ürün, fiyat, teslimat, stok bilgisi; açık iade, garanti, uyuşmazlık koşulları) + **güvenli işleyiş** (güvenli ödeme ve kimlik doğrulama; doğrulanmış yorum ve güvenilir satıcı puanı; erişilebilir müşteri hizmetleri ve veri güvenliği).\n\n## Veri ve performans (Bölüm 15)\n- Dijital müşteri yolculuğunda veri: **trafik** (kaynak, ziyaret) → **arama** (ifadeler) → **inceleme** (ürün görüntüleme) → **sepet** (ekleme, terk) → **sipariş** (satın alma, iade). Davranışsal ve işlemsel veriler süreç iyileştirmeyi destekler.\n- Göstergeler: dönüşüm oranı (ziyaretin siparişe dönüşmesi), sepet terk oranı (başlayan sepetin tamamlanmaması), tekrar satın alma, iade oranı, şikâyet (türü ve sıklığı), trafik kaynağı (müşterinin geldiği kanal).\n- **Ölçülebilir olan her veri toplanmamalıdır:** 01 **amaç** (hangi sorun için) · 02 **gereklilik** (yalnız gerekli veri) · 03 **güvenlik** (koruma, erişim kontrolü) · 04 **hukuk ve etik** (uygun kullanım, ayrımcılığın önlenmesi).\n\n## Pazarlama iletişimi (Bölüm 16)\n- E-pazarlama reklam ile sipariş arasındaki mesafeyi kısaltabilir: **reklam → ürün sayfası → sepet → sipariş.** Kısa yol dönüşümü kolaylaştırır; çok satıcı arasında **görünürlük ve dikkat** stratejik kaynak olur.\n- Geleneksel kanallar: TV ve radyo, gazete ve açık hava, mağaza içi iletişim, basılı katalog. Elektronik: arama motoru ve sosyal medya, içerik pazarlaması ve e-posta, mobil bildirim ve **yeniden hedefleme**, satış ortaklığı.\n\n## Aracılar ve platformlar (Bölüm 17)\n- E-ticaret aracıları ortadan kaldırmamıştır; yeni aracılar: **pazar yerleri, arama motorları, fiyat karşılaştırma, ödeme kuruluşları, lojistik platformları, reklam ve değerlendirme ağları.** Aracı sayısı azalmak zorunda değildir; **işlevi ve pazardaki gücü değişir.**\n- **Aracısızlaşma (disintermediation):** üretici ile tüketicinin doğrudan buluşması, geleneksel aracıların rolünün azalması, doğrudan satış kanalı. **Yeniden aracılanma (reintermediation):** yeni dijital aracılar, platformların görünürlük ve işlem rolü, aracıların güç ve teknolojisinin değişmesi.\n\n## Tüketici açısından (Bölüm 18)\n| Üstünlükler | Sınırlılıklar |\n|---|---|\n| Zaman ve mekân esnekliği | Ürünü fiziksel olarak inceleyememe |\n| Kolay fiyat ve ürün karşılaştırması | Teslimatı bekleme ve kargo maliyeti |\n| Geniş ürün ve satıcı çeşidi | Yanıltıcı bilgi veya sahte yorum riski |\n| Mağazaya gitme gereğinin azalması | Ödeme ve veri güvenliği kaygısı |\n| Kullanıcı yorumlarına erişim | İade ve uyuşmazlık sorunları |\n| Kişiselleştirilmiş öneriler | Mahremiyet ve izlenme kaygısı |\n- **Ürün kategorisi kanal üstünlüğünü değiştirir:** standart ürün (elektronik cihaz; dijitalde kolay değerlendirilir) · duyusal ürün (parfüm, kişiye özel giyim; fiziksel deneyim önemli) · hibrit yol (bir kanalda araştır, diğerinde dene/al/iade et).\n\n## İşletme açısından (Bölüm 19)\n| Üstünlükler | Sınırlılıklar |\n|---|---|\n| Daha geniş pazara erişim | Yoğun fiyat ve görünürlük rekabeti |\n| 7/24 sipariş kabulü | Teknoloji ve güvenlik yatırımı |\n| Müşteri davranışlarının ölçülmesi | Lojistik ve iade yönetimi |\n| Hızlı fiyat ve kampanya değişikliği | Pazar yeri, ödeme ve reklam maliyetleri |\n| Süreçlerin otomatikleştirilmesi | Sistem kesintisi ve siber saldırı riski |\n| Ölçeklenme potansiyeli | Platform ve teknoloji sağlayıcısına bağımlılık |\n- **Yetenek–bağımlılık dengesi:** yetenekler (teknoloji ve güvenlik, lojistik ve iade, dijital pazarlama, veri ve ölçüm, müşteri hizmetleri) vs bağımlılıklar (pazar yeri kuralları, ödeme kuruluşları, bulut ve yazılım sağlayıcıları, lojistik ortakları, reklam platformları).\n\n## Bütünleşme (Bölüm 20)\n- Müşteri yolculuğu kanallar arasında ilerler; işletme tek kanalı değil **bütün temas noktalarını** yönetir: araştırma (web, uygulama, mağaza) → değerlendirme (yorum, deneme, danışmanlık) → satın alma (mağaza/e-kanal) → teslim (kargo/mağaza) → iade ve destek (her iki kanal).\n- **Bütünleşik ticaretin 4 biçimi:**\n  - **Webrooming:** internetten araştır, mağazada incele ve satın al.\n  - **Showrooming:** mağazada gör/dene, elektronik kanaldan sipariş ver.\n  - **Tıkla ve teslim al (click & collect):** internetten sipariş, mağazadan teslim.\n  - **Mağazada iade:** internetten alınanı fiziksel mağazaya iade.\n- Ana çıkarımlar: fazla seçenek **bilgi yükü** yaratabilir; fiziksel mağaza duyusal deneyim ve yüz yüze güvende güçlü; veri ve kişiselleştirme değer yaratır ama amaç, güvenlik, hukuk, etik sınırlar gerekir; rekabet fiziksel ve dijital kanalları tek müşteri yolculuğunda bütünleştirmeyi gerektirir.\n\n---\n\n# Hafta 5 — Elektronik perakendecilik\n*(Bölüm 3–6; 6. bölümün içeriği fotoğraflanmamış.)*\n\n## Tanım ve kapsam (Bölüm 3)\n- **E-perakendecilik: nihai tüketiciye yönelik satışın dijital kanallar üzerinden yürütülmesi.**\n- Kapsam: **dijital satış alanı** (site, uygulama, pazar yeri, sosyal medya mağazası = görünen temas noktası) · **işlem süreci** (arama, karşılaştırma, sipariş, ödeme dijital) · **operasyon** (stok, depo, lojistik, müşteri hizmetleri, iade, satış sonrası ayrılmaz parçalar).\n- **Ekranın önü:** ürün bilgisi ve görseller, arama ve karşılaştırma, sepet-ödeme-sipariş takibi, destek-değişim-iade. **Arka plan:** stok ve sipariş yönetimi, ödeme ve **sahtekârlık kontrolü**, depo-paketleme-lojistik, veri ve müşteri hizmetleri.\n\n## E-ticaret ile ilişkisi (Bölüm 4)\n- **E-perakendecilik, e-ticaretin nihai tüketiciye satışa odaklanan alt alanıdır** (e-işletmecilik ⊃ e-ticaret ⊃ e-perakendecilik).\n| E-ticaret | E-perakendecilik |\n|---|---|\n| B2B, B2C, C2C ve diğer işlem türleri | Ağırlıklı olarak nihai tüketiciye satış |\n| Hammadde, ara malı, işletmeler arası hizmetler | Tüketim ürünleri ve nihai hizmetler |\n| Tedarik, belge paylaşımı, kurumlar arası süreçler | Ürün sunumu, sipariş, teslimat, satış sonrası |\n| Daha geniş ticari işlem alanı | E-ticaretin perakende alt alanı |\n- Örnekler: üreticinin başka işletmeden elektronik **hammadde alımı → e-ticaret** (e-perakende değil); üreticinin kendi sitesinden **nihai tüketiciye satışı → e-perakendecilik**. **Temel ölçüt: işlemin dijital olması kadar alıcının nihai tüketici olup olmadığı.**\n\n## Temel özellikler (Bölüm 5)\n- Ayırt edici: **dijital satış alanı, ölçülebilir müşteri davranışı, sipariş ile teslimat arasındaki operasyon.**\n- Müşteri arayüzü: dijital satış alanı; metin, görsel, video, yorumlarla sunum; günün her saati erişim; hızlı fiyat/kampanya güncelleme; fiziksel teşhire az bağımlılık. Operasyon ve risk: sipariş–teslimat arası süre; ayrıntılı davranış ölçümü; güven, veri güvenliği, mahremiyet; depo, paketleme, kargo, iade; **müşteri ile satıcının fiziksel olarak ayrılması**.\n- **Erişim olanağı tek başına başarı sağlamaz:** pazara erişim (coğrafi olarak geniş pazar) + **yerel uyum** (dil, ürün bilgisi, ödeme yöntemleri, müşteri desteği) + **yerine getirme** (teslimat kapasitesi ve marka güvenilirliği vaadi gerçek deneyime dönüştürür).\n\n## İş modelleri (Bölüm 6)\n- E-perakendeciler **kanal yapısı, aracılık rolü, müşteri ilişkisi ve gelir mantığı** bakımından farklı modeller kullanır. *(İçerik slaytları fotoğraflanmamış.)*\n";
const COURSE = {"title": "E-Ticaret (E-İşletmecilik)", "sub": "Sınıfta çekilen slayt fotoğraflarından (2.–5. hafta): notlar, kartlar, test, gösterge hesaplama alıştırmaları", "unit": "Hafta", "ders": {"2": "Hafta 2 · E-ticaretin tanımı, türleri, süreç ve göstergeler", "3": "Hafta 3 · E-işletmecilik aşamaları ve hazırlık", "4": "Hafta 4 · E-ticaret ve geleneksel ticaret", "5": "Hafta 5 · Elektronik perakendecilik"}, "gen": ["kpi"], "extra": ["Alıştırma sekmesinde dönüşüm oranı, ortalama sipariş değeri, müşteri edinme maliyeti ve sepet terk oranı sorularından en az 8 tane çöz", "Bildiğin bir e-ticaret sitesini seç: türü (B2C/C2C...), kanalı, gelir modelleri ve algılanan riskleri bir sayfada yaz"], "id": "e-ticaret"};
const DERS = COURSE.ders, NS = Object.keys(DERS).map(Number), U = COURSE.unit||'Ders', GENS = COURSE.gen||[];

  p.push({g:`Gün ${++g} · Aktif hatırlama`,t:[`Her ${U.toLowerCase()} için notlara bakmadan 10 satırlık özet yaz, sonra notlarla karşılaştır`,'Eksik çıkan kavramların kartlarını çalış'].concat(COURSE.extra||[])});

  return p;

/* ---------- notes (mini markdown) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

function renderCards(){
  const el=$('#p-cards');
  let h=`<div class="row" style="margin-bottom:14px">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${cardFilter===f}" data-f="${f}">${f?U+' '+f:'Hepsi'} (${dueList(f).length})</button>`).join('')+`</div><div id="sess"></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cardFilter=+b.dataset.f;store.set('pz_filter',cardFilter);session=[];renderCards()});
  if(!session.length||sIdx>=session.length){session=shuffle(dueList(cardFilter));sIdx=0}
  drawCard();
}
function drawCard(){
  const box=$('#sess');if(!box)return;
  if(!session.length){box.innerHTML=`<div class="card" style="text-align:center"><b>Bekleyen kart yok 🎉</b><p class="mute">Bu filtre için bugün çalışılacak kart kalmadı. Yarın tekrar gel ya da başka bir ${U.toLowerCase()} seç.</p><button class="btn alt" id="all">Yine de hepsini karıştır</button></div>`;
    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>!cardFilter||c.d===cardFilter));sIdx=0;drawCard()};return}
  const c=session[sIdx];flipped=false;
  box.innerHTML=`<div class="mute" style="margin-bottom:6px">${sIdx+1} / ${session.length} · Kutu ${cardState(c.id).box}</div><div class="bar" style="margin-bottom:12px"><i style="width:${sIdx/session.length*100}%"></i></div>
  <div class="card flash" id="fl" tabindex="0"><div class="tag">${esc(DERS[c.d])} · ${esc(c.t)}</div><div class="q">${esc(c.f)}</div><div class="a" id="ans" hidden>${esc(c.b)}</div><div class="mute" id="hint" style="margin-top:12px">Cevabı düşün, sonra çevirmek için dokun (Boşluk)</div></div>
  <div class="row" id="grade" hidden><button class="btn bad" data-g="0">Bilemedim</button><button class="btn alt" data-g="1">Zor</button><button class="btn ok" data-g="2">Bildim</button></div>`;
  const flip=()=>{if(flipped)return;flipped=true;$('#ans').hidden=false;$('#hint').hidden=true;$('#grade').hidden=false};
  $('#fl').onclick=flip;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(c,+b.dataset.g));
  window._flip=flip;
}
function grade(c,g){
  const s=cs(),st=s[c.id]||{box:1,due:0};
  if(g===0)st.box=1;else if(g===2)st.box=Math.min(5,st.box+1);
  st.due=Date.now()+(g===0?0:INTERVALS[st.box]*DAY);
  s[c.id]=st;store.set('pz_cards',s);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(g===0)session.push(c);
  sIdx++;
  if(sIdx>=session.length){session=[];renderCards()}else drawCard();
}
document.addEventListener('keydown',e=>{
  if($('#p-cards').classList.contains('on')&&$('#fl')){
    if(e.code==='Space'){e.preventDefault();window._flip&&window._flip()}
    else if(flipped&&['Digit1','Digit2','Digit3'].includes(e.code))$('#grade').querySelectorAll('[data-g]')[+e.code.slice(-1)-1].click();
  }
});

/* ---------- quiz ---------- */
let qz=null;
function renderQuizHome(){
  const wrong=store.get('pz_wrong',[]),best=store.get('pz_best',{});
  $('#p-quiz').innerHTML=`<div class="card"><b>Test oluştur</b><div class="row" style="margin:12px 0" id="qd">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${(qz&&qz.f||0)===f}" data-f="${f}">${f?U+' '+f:'Karışık'}</button>`).join('')+`</div>
  <div class="row"><button class="btn" id="go10">10 soru</button><button class="btn alt" id="go20">20 soru</button><button class="btn alt" id="goall">Hepsi</button><button class="btn alt" id="gow" ${wrong.length?'':'disabled'}>Yanlışlarım (${wrong.length})</button></div>
  <p class="mute" style="margin:12px 0 0">Şıklar her seferinde karışır. Yanlış yaptıkların "Yanlışlarım"a eklenir, doğru yapınca çıkar.</p></div>
  <div class="card mute">En iyi skorlar: ${[0,...NS].map(f=>`${f?U+' '+f:'Karışık'}:${best[f]!=null?best[f]+'%':'—'}`).join(' · ')}</div>`;
  let f=0;
  $('#qd').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=+b.dataset.f;$('#qd').querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const start=n=>startQuiz(f,n);
  $('#go10').onclick=()=>start(10);$('#go20').onclick=()=>start(20);$('#goall').onclick=()=>start(999);
  $('#gow').onclick=()=>startQuiz(0,999,true);
}
function startQuiz(f,n,wrongOnly){
  const W=store.get('pz_wrong',[]);
  let pool=QUIZ.map((q,i)=>({...q,id:i})).filter(q=>wrongOnly?W.includes(q.id):(!f||q.d===f));
  pool=shuffle(pool).slice(0,n);
  qz={f,items:pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,order:idx,ans:idx.indexOf(q.a)}}),i:0,score:0,done:false,wrongOnly};
  drawQ();
}
function drawQ(){
  const el=$('#p-quiz');
  if(qz.i>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100);
    if(!qz.wrongOnly){const b=store.get('pz_best',{});if(b[qz.f]==null||pct>b[qz.f]){b[qz.f]=pct;store.set('pz_best',b)}}
    el.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Sonuç</div><div style="font:700 48px Georgia,serif">${qz.score}/${qz.items.length}</div><p class="mute">%${pct} · ${pct>=85?'Güçlü — tekrar aralığını uzatabilirsin.':pct>=60?'İyi gidiyor — yanlışların kartlarını çalış.':'Notlara dön, ilgili kartları çalış, sonra tekrar dene.'}</p><button class="btn" id="again">Yeni test</button></div>`;
    $('#again').onclick=()=>{qz=null;renderQuizHome()};return;
  }
  const q=qz.items[qz.i];
  el.innerHTML=`<div class="mute" style="margin-bottom:6px">${qz.i+1} / ${qz.items.length} · ${esc(DERS[q.d])}</div><div class="bar" style="margin-bottom:12px"><i style="width:${qz.i/qz.items.length*100}%"></i></div>
  <div class="card"><div style="font:600 18px/1.45 Georgia,serif;margin-bottom:8px">${esc(q.q)}</div><div id="opts">${q.order.map((oi,k)=>`<button class="opt" data-k="${k}">${esc(q.o[oi])}</button>`).join('')}</div><div id="fb" hidden></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    el.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)qz.score++;
    const W=store.get('pz_wrong',[]),has=W.includes(q.id);
    if(!ok&&!has)W.push(q.id);if(ok&&has)W.splice(W.indexOf(q.id),1);store.set('pz_wrong',W);
    const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<p style="margin:12px 0 4px"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':'Yanlış'}</b> — ${esc(q.w)}</p><button class="btn" id="nx">${qz.i+1>=qz.items.length?'Sonucu gör':'Sonraki'}</button>`;
    $('#nx').onclick=()=>{qz.i++;drawQ()};$('#nx').focus();
  });
}

/* ---------- practice (procedural generators) ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmt=x=>String(Math.round(x*1000)/1000).replace('.',','), N=x=>x.toLocaleString('tr-TR');
const sum=a=>a.reduce((s,x)=>s+x,0);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mcq=o=>{const s=shuf(o.map((t,i)=>[t,i]));return{opts:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===0)}}; // doğru şık o[0]
const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);if(t.l.op&&PR[t.l.op]<PR[t.op])a=`(${a})`;if(t.r.op&&PR[t.r.op]<=PR[t.op])b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const tbl=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

const GEN={
  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder (kök–sol–sağ)',T.pre],['inorder (sol–kök–sağ)',T.ino],['postorder (sol–sağ–kök)',T.post],['level order (seviye seviye)',T.lvl]]),a=fn(t);
    return{q:`Aşağıdaki ikili ağacın <b>${nm}</b> dolaşma sırasını yaz.`+T.svg(t),type:'txt',a:a.join(''),show:a.join(', '),sol:`Sıra: <b>${a.join(', ')}</b>`}}},
  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(7,9));let t=null;v.forEach(x=>t=T.ins(t,x));
    const ns=T.nodes(t),k=R(0,4),lead=`Boş bir ikili arama ağacına sırasıyla <b>${v.join(', ')}</b> ekleniyor. `;let q,a,type='num';
    if(k===0){a=T.pre(t);q='Ağacın <b>preorder</b> dolaşımını yaz.';type='txt'}
    else if(k===1){a=T.post(t);q='Ağacın <b>postorder</b> dolaşımını yaz.';type='txt'}
    else if(k===2){const c=pick(ns.filter(x=>x.p));a=c.p.v;q=`<b>${c.n.v}</b> düğümünün ebeveyni hangisidir?`}
    else if(k===3){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> vardır?'}
    else{a=Math.max(...ns.map(x=>x.d));q='En derin düğümün <b>derinliği</b> kaçtır? (kök = 0)'}
    const arr=Array.isArray(a);return{q:lead+q,type,a:arr?a.join(''):a,show:arr?a.join(', '):a,sol:'Kural: küçükse sola, büyük veya eşitse sağa. Oluşan ağaç:'+T.svg(t)+(arr?`Cevap: <b>${a.join(', ')}</b>`:'')}}},
  treeprops:{label:'Ağaç terimleri',f(){const t=T.rand(R(7,10)),ns=T.nodes(t),c=pick(ns),k=R(0,4);let q,a;
    if(k===0){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> düğüm vardır?'}
    else if(k===1){a=c.d;q=`<b>${c.n.v}</b> düğümünün <b>derinliği</b> kaçtır? (kökten kenar sayısı, kök = 0)`}
    else if(k===2){a=c.d+1;q=`<b>${c.n.v}</b> düğümünün <b>seviyesi</b> kaçtır? (kök = 1)`}
    else if(k===3){a=(c.n.l?1:0)+(c.n.r?1:0);q=`<b>${c.n.v}</b> düğümünün <b>derecesi</b> (çocuk sayısı) kaçtır?`}
    else{a=ns.filter(x=>x.n.l||x.n.r).length;q='Ağaçta kaç <b>dahili</b> (yaprak olmayan) düğüm vardır?'}
    return{q:q+T.svg(t),type:'num',a,sol:`Cevap: <b>${a}</b>. Derinlik = kökten kenar sayısı, seviye = derinlik + 1, derece = çocuk sayısı, yaprak = çocuğu olmayan düğüm.`}}},
  postfix:{label:'Infix → postfix/prefix',f(){let i=0;const t=exprT(R(3,5),()=>'ABCDEFG'[i++],Object.keys(PR)),pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');
    return{q:`<b>${inf(t)}</b> ifadesinin <b>${pre?'prefix':'postfix'}</b> karşılığını yaz.`,type:'txt',a,show:a,sol:`${pre?'Prefix':'Postfix'}: <b>${a}</b>. En son yapılan işlem (${t.op}) ${pre?'en başa':'en sona'} yazılır; parantez içleri önce kendi ${pre?'prefix':'postfix'} haline getirilir.`}}},
  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);
    const tk=pst(t),st=[],steps=[];tk.forEach(x=>{if(typeof x==='number')st.push(x);else{const b=st.pop(),a=st.pop(),r=ev({op:x,l:{v:a},r:{v:b}});st.push(r);steps.push(`${a} ${x} ${b} = ${r} → yığın: [${st.join(', ')}]`)}});
    return{q:`<b>${tk.join(' ')}</b> postfix ifadesinin değeri kaçtır?`,type:'num',a:v,sol:'Sayıları yığına at; operatör gelince iki eleman çıkar (ikinci çıkan soldadır), sonucu geri at:<br>'+steps.join('<br>')}}},
  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;
    for(let i=0,n=R(6,9);i<n;i++){if(ds.length&&Math.random()<.35){last=S?ds.pop():ds.shift();ops.push(S?'pop()':'dequeue()')}else{const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}}
    if(!ds.length){const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}
    const k=last!=null?R(0,2):R(0,1),q=[S?'Tepede (top) hangi eleman vardır?':'Önde (front) hangi eleman vardır?','Yapıda kaç eleman kalmıştır?',`Son ${S?'pop':'dequeue'} işlemi hangi elemanı çıkarmıştır?`][k];
    return{q:`Boş bir ${S?'yığına (stack)':'kuyruğa (queue)'} sırasıyla şu işlemler uygulanıyor:<div class="raw">${ops.join(', ')}</div>${q}`,type:'num',a:[S?ds[ds.length-1]:ds[0],ds.length,last][k],sol:`Son durum (${S?'alttan tepeye':'önden arkaya'}): [${ds.join(', ')}]. ${S?'LIFO: son giren ilk çıkar.':'FIFO: ilk giren ilk çıkar.'}`}}},
  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,3);
    if(k===0){const v=R(20,200)*1000,s=Math.round(v*R(5,40)/1000),a=s/v*100;return{q:`Bir e-ticaret sitesi ayda <b>${N(v)}</b> ziyaret ve <b>${N(s)}</b> sipariş alıyor. <b>Dönüşüm oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Dönüşüm = sipariş / ziyaret × 100 = ${N(s)} / ${N(v)} × 100 = %${fmt(a)}`}}
    if(k===1){const o=R(5,50)*100,a=R(15,120)*10;return{q:`Aylık gelir <b>${N(o*a)} TL</b>, sipariş sayısı <b>${N(o)}</b>. <b>Ortalama sipariş değeri (AOV)</b> kaç TL'dir?`,type:'num',a,sol:`AOV = gelir / sipariş = ${N(o*a)} / ${N(o)} = ${N(a)} TL`}}
    if(k===2){const m=R(5,40)*100,a=R(5,60)*10;return{q:`Pazarlamaya <b>${N(m*a)} TL</b> harcanarak <b>${N(m)}</b> yeni müşteri kazanıldı. <b>Müşteri edinme maliyeti (CAC)</b> kaç TL'dir?`,type:'num',a,sol:`CAC = pazarlama harcaması / yeni müşteri = ${N(m*a)} / ${N(m)} = ${N(a)} TL`}}
    const s=R(10,80)*100,o=Math.round(s*R(20,80)/100),a=(s-o)/s*100;return{q:`<b>${N(s)}</b> sepet oluşturuldu, bunların <b>${N(o)}</b> tanesi siparişe döndü. <b>Sepet terk oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Sepet terk = (sepet − sipariş) / sepet × 100 = (${N(s)} − ${N(o)}) / ${N(s)} × 100 = %${fmt(a)}`}}},
  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);
    if(Math.random()<.7)return{q:`Bir sektörde tüm pazarın satışları geçen yıl <b>${N(p)} milyon TL</b>, bu yıl <b>${N(c)} milyon TL</b>. <b>Pazar gelişim hızı</b> yüzde kaçtır? (Azalma varsa eksi yaz.)`,type:'num',a:g,sol:`(cari − geçmiş) / geçmiş × 100 = (${N(c)} − ${N(p)}) / ${N(p)} × 100 = %${fmt(g)}. Sonuç ülkenin büyüme hızıyla kıyaslanır.`};
    return{q:`Pazar satışları <b>${N(p)}</b> → <b>${N(c)}</b> milyon TL oldu; ülke ekonomisi <b>%${u}</b> büyüdü. Pazar için hangisi söylenir?`,type:'mc',opts:['Ülkeden hızlı büyüyor (gelişen pazar)','Büyüyor ama ülkeden yavaş','Daralıyor (olumsuz pazar)'],a:g>u?0:g>=0?1:2,sol:`Pazar gelişim hızı = %${fmt(g)}; ülke büyümesi %${u} ile kıyaslanır.`}}},
  gsyih:{label:'GSYİH/GSMH · faktörler',f(){
    if(Math.random()<.55){const [s,a]=pick([["Bir Türk firmasının Denizli'deki fabrikasının üretimi",2],["Bir Alman otomotiv firmasının Bursa'daki fabrikasının üretimi",0],["Bir Türk müteahhitlik firmasının Katar'daki projesi",1],["Bir Japon elektronik firmasının Manisa'daki tesisinin üretimi",0],["Bir Türk tekstil firmasının Mısır'daki fabrikasının üretimi",1],["İstanbul'da çalışan Türk yazılımcının ürettiği hizmet",2],["Bir Türk inşaat firmasının Türkmenistan'daki köprü projesi",1],["Bir Koreli firmanın Kocaeli'deki fabrikasının üretimi",0]]);
      return{q:`Türkiye açısından: <b>${s}</b> hangisine dahildir?`,type:'mc',opts:['Yalnız GSYİH','Yalnız GSMH','Hem GSYİH hem GSMH'],a,sol:'GSYİH: üretim nerede yapıldı? (toprak ilkesi). GSMH: üretimi kim yaptı? (vatandaşlık ilkesi).'}}

let gq=null,gsel=store.get('pz_gsel','all');

    mi.forEach((x,i)=>x.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(gq.done)return nextGen();const empty=mi.find(y=>!y.value.trim());empty?empty.focus():checkGen(vals())});mi[0].focus()}

function checkGen(v){
  if(gq.done)return;
  const numOk=(s,a)=>Math.abs(parseNum(s)-a)<=Math.max(.0015,Math.abs(a)*1e-4);
  if(gq.type==='multi'){const mi=[...$('#gbox').querySelectorAll('[data-f]')],e=mi.find(x=>!x.value.trim());if(e)return e.focus()}

  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){
  const s=cs(),counts=[0,0,0,0,0,0];
  CARDS.forEach((_,i)=>counts[(s[i]||{box:1}).box]++);
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));
  const weak=CARDS.map((c,i)=>({...c,id:i,box:(s[i]||{box:1}).box})).filter(c=>c.box<=2&&s[c.id]).slice(0,8);
  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=()=>{if(confirm('Kart, test, alıştırma ve plan ilerlemesi silinsin mi?')){['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
