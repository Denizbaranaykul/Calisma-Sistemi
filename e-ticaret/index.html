<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Ticaret (E-İşletmecilik)</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.avl .nd{cursor:pointer}.avl .nd.sel circle{fill:var(--accent)}.avl .nd.sel text{fill:var(--accent-ink)}
.avl .nd.bad circle{stroke:var(--bad);stroke-width:3.5}.avl .bf{font-size:11px;fill:var(--mute);text-anchor:start}.avl .nd.bad .bf{fill:var(--bad);font-weight:700}
.avl.anim line{animation:avfade .4s ease .35s both}@keyframes avfade{from{opacity:0}}
.seqc{display:inline-block;min-width:30px;text-align:center;padding:2px 8px;border-radius:6px;margin:2px;background:var(--soft);font-weight:600}.seqc.done{opacity:.4;text-decoration:line-through}.seqc.next{background:var(--accent);color:var(--accent-ink)}
.seqc.ok{opacity:1;text-decoration:none;background:color-mix(in srgb,var(--ok) 22%,var(--soft))}.seqc.no{opacity:1;text-decoration:none;background:color-mix(in srgb,var(--bad) 22%,var(--soft))}
.avlog{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}.avs{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;background:var(--card)}.avs.ok{border-color:var(--ok)}.avs.no{border-color:var(--bad)}.avs svg{margin:4px auto 0;max-width:none}.avar{color:var(--mute)}
.avmsg{border-left:4px solid var(--line);padding:6px 12px;margin:8px 0;background:var(--soft);border-radius:0 8px 8px 0}.avmsg.ok{border-color:var(--ok)}.avmsg.no{border-color:var(--bad)}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>

<script>
const CARDS = [{"d": 2, "t": "Tanım", "f": "Elektronik ticarette belirleyici unsur nedir?", "b": "Siparişin özel olarak tasarlanmış bir elektronik sistem (bilgisayar ağı) üzerinden verilmesi. Ödeme ve teslimat elektronik olmak zorunda değildir."}, {"d": 2, "t": "Tanım", "f": "Bir işlemi e-ticaret yapan üç ölçüt nedir?", "b": "1) Ekonomik değer (mal, hizmet veya bilgi ekonomik değere sahip olmalı) 2) En az iki taraf (satın alma, satış veya değişim) 3) Elektronik sipariş sistemi (sipariş bu amaçla tasarlanmış ağ üzerinden oluşturulmalı)."}, {"d": 2, "t": "Tanım", "f": "Sipariş, ödeme ve teslimattan hangisinin elektronik olması zorunludur?", "b": "Yalnızca sipariş (ör. sitedeki alışveriş sepeti). Ödeme (kart veya kapıda) ve teslimat (dosya indirme veya kargo) elektronik olmayabilir."}, {"d": 2, "t": "Tanım", "f": "İnternetten sipariş verilip kapıda ödenen masa e-ticaret midir? İnternette görülüp mağazada sipariş verilen ürün?", "b": "Masa: evet, e-ticarettir (sipariş elektronik). İnternette görülüp sipariş mağazada verilirse dar istatistiksel tanıma göre e-ticaret değildir."}, {"d": 2, "t": "Tanım", "f": "E-ticaret ile e-işletmecilik farkı nedir?", "b": "E-ticaret dış çevreyle alım-satım işlemleridir. E-işletmecilik işletmenin bütün iç ve dış süreçlerine (üretim, stok, tedarik, finans, İK, CRM, müşteri hizmetleri) uzanır. E-ticaret, e-işletmeciliğin daha dar bir alt alanıdır."}, {"d": 2, "t": "Büyüklük", "f": "E-ticaretin ekonomik büyüklüğüne dair derste verilen iki rakam ve sınır nedir?", "b": "27 trilyon ABD doları: 43 ekonomide işletmelerin 2022 e-ticaret satışları. %60: 2016–2022 arası yaklaşık büyüme. Sınır: veri dünyanın tamamını değil raporlanan 43 ekonomiyi kapsar. B2B işlemler hacmin önemli bölümüdür."}, {"d": 2, "t": "Türler", "f": "B2B ve B2C'yi taraflar, ilişki, fiyat ve kritik başarı açısından karşılaştır.", "b": "B2B: iki işletme; sürekli ve sözleşme ağırlıklı; müzakere, miktar indirimi, vade; entegrasyon, güvenilirlik, teslim koşulları. B2C: işletme ve nihai tüketici; geniş müşteri kitlesi; ilan edilen fiyat; deneyim, güven, ödeme, teslimat ve iade."}, {"d": 2, "t": "Türler", "f": "C2C ve C2B nedir? Örnekleri?", "b": "C2C: bireyler başka bireylere ürün/hizmet sunar; platform ilan, ödeme, kimlik doğrulama, puanlama, uyuşmazlık çözümü sağlayabilir (ikinci el ürün satışı). C2B: birey işletmeye değer sunar, roller tersine döner (serbest çalışanın işletmeye çevrim içi tasarım hizmeti)."}, {"d": 2, "t": "Türler", "f": "B2G, G2B ve G2C nedir? Her elektronik kamu hizmeti e-ticaret midir?", "b": "B2G: işletmeden kamuya (e-kamu ihalesine teklif). G2B: kamudan işletmeye (ücretli veri/hizmet). G2C: kamudan vatandaşa (ücretli belge, ulaşım). Hayır; ekonomik bir sipariş veya değişim işlemi olmalı."}, {"d": 2, "t": "Türler", "f": "Fiziksel ürün, dijital ürün ve hizmette sipariş ve teslimat nasıldır?", "b": "Fiziksel: sipariş elektronik, teslimat fiziksel (stok, kargo, son kilometre, iade önemli). Dijital: sipariş ve teslimat elektronik (marjinal çoğaltma maliyeti düşük; telif, erişim kontrolü, dijital hak yönetimi kritik). Hizmet: sipariş elektronik, sunum fiziksel veya dijital."}, {"d": 2, "t": "Türler", "f": "Tam ve kısmi e-ticaret farkı nedir?", "b": "Tam: ürün, işlem ve teslimatın tümü dijital (e-kitap satın alma). Kısmi: sürecin yalnızca bazı bölümleri dijital (çevrim içi alınan ayakkabının kargoyla gelmesi)."}, {"d": 2, "t": "Kanal", "f": "İşletmeye ait e-mağaza ile e-pazar yerini karşılaştır.", "b": "E-mağaza: yüksek kontrol (fiyat, marka, müşteri verisi, hizmet koşulları) ama yüksek sorumluluk (ziyaretçi çekme; yazılım, güvenlik, ödeme altyapısı). Pazar yeri: bağımsız satıcı ve alıcıları buluşturur; işlem, ödeme, görünürlük kolaylığı; gelir: komisyon, ilan, reklam, lojistik."}, {"d": 2, "t": "Kanal", "f": "Pazar yeri ile perakendeci arasındaki kritik fark nedir?", "b": "Fiyat ve hizmet kararları üzerindeki kontrolün kimde olduğu (perakendecide işletmede, pazar yerinde bağımsız satıcılarda)."}, {"d": 2, "t": "Kanal", "f": "Mobil ticaret ve sosyal ticaret nedir?", "b": "Mobil ticaret: işlemin akıllı telefon/tablet üzerinden yapılması; ayrı işlem türü değil, cihaza göre sınıflandırma (uygulama, mobil site, dijital cüzdan, uygulama içi satın alma). Sosyal ticaret: keşif, değerlendirme, tavsiye, satış veya iletişimin sosyal medyayla bütünleşmesi; yalnızca reklam göstermek e-ticaret değildir, elektronik sipariş tamamlanmalı."}, {"d": 2, "t": "Kanal", "f": "EDI nedir?", "b": "Electronic Data Interchange: alıcı sistemi (sipariş) ile tedarikçi sistemi (fatura/sevk) arasında standart mesajla sipariş, fatura, sevk ve stok bilgilerinin insan müdahalesi azaltılarak aktarılması. E-ticaret internet mağazalarından önce de vardı."}, {"d": 2, "t": "Süreç", "f": "Uçtan uca e-ticaret sürecinin 6 aşaması nedir?", "b": "Keşif → değerlendirme → sipariş → ödeme → karşılama → satış sonrası. Her aşamadaki kopuş toplam dönüşümü ve müşteri deneyimini etkiler."}, {"d": 2, "t": "Süreç", "f": "Değerlendirme aşamasında arama maliyeti ve karar yükü nasıl değişir?", "b": "Fiyat, özellik, satıcı puanı, teslimat, garanti, iade ve ödeme seçenekleri karşılaştırılır. Arama maliyeti azalabilir, ancak karar yükü artabilir."}, {"d": 2, "t": "Süreç", "f": "Sipariş karşılama (fulfillment) aşamasında ne olur?", "b": "Sipariş doğrulanır, stok ayrılır, ürün toplanır, paketlenir, taşıyıcıya aktarılır ve takip bilgisi paylaşılır."}, {"d": 2, "t": "Gelir", "f": "Beş temel gelir modeli ve tipik kullanımları nedir?", "b": "Doğrudan satış (ürün satışı; e-mağaza), komisyon (işlemden pay; pazar yeri), abonelik (dönemsel ücret; dijital yayın), kullanım başına (tüketilen kadar; bulut bilişim), reklam (kullanıcı erişimini reklamverene sunma; içerik platformu)."}, {"d": 2, "t": "Gelir", "f": "Birlikte kullanılabilen gelir modelleri nelerdir? Sürdürülebilir iş modeli nedir?", "b": "Freemium (temel ücretsiz, gelişmiş ücretli), ilan ücreti (satıcı listeleme için öder), satış ortaklığı (yönlendirilen satıştan pay), ek hizmet (lojistik, ödeme, depolama, reklam ayrıca satılır). Sürdürülebilir iş modeli = müşteriye sunulan değer + bu değerden gelir elde etme mantığı."}, {"d": 2, "t": "Değer", "f": "Dört temel değer yaratma kaynağı nedir?", "b": "Verimlilik (arama, iletişim, sipariş, koordinasyon maliyetini azaltma; siparişin stoka otomatik aktarımı), tamamlayıcılık (ürün+ödeme+teslimat+destek paketi), bağlanma (kayıtlı tercihler, sadakat, abonelik; özgür seçimi ortadan kaldırmamalı), yenilik (küçük üreticiyi müşteriye bağlayan platform)."}, {"d": 2, "t": "Güven", "f": "Müşterinin algıladığı 8 risk nedir?", "b": "Ürün (açıklamaya uymama), teslimat (teslim edilmeme), ödeme (bilgilerin kötüye kullanılması), mahremiyet (verinin izinsiz kullanılması), itibar (sahte yorum/puan), satıcı (kimlik belirsizliği), iade (sürecin işlememesi), sistem (kesinti/siber saldırı)."}, {"d": 2, "t": "Güven", "f": "Güveni destekleyen uygulamalar nelerdir?", "b": "Satıcı kimliğini açıkça belirtmek, doğru ürün/fiyat bilgisi, güvenli ödeme ve kimlik doğrulama, şeffaf teslimat süresi, açık iade ve garanti, doğrulanmış değerlendirmeleri ayırmak, erişilebilir müşteri hizmetleri, kişisel veriyi ölçülü ve amaçla sınırlı kullanmak. Güven, algılanan fayda ve kullanım kolaylığıyla satın alma niyetini etkiler."}, {"d": 2, "t": "Başarı", "f": "E-ticarette başarı koşulları (6) nelerdir?", "b": "Açık değer önerisi, kullanılabilir sistem, sistem bütünleşmesi (stok, muhasebe, ödeme, CRM, lojistik), lojistik ve karşılama, güven ve hizmet (ulaşılabilir muhatap), veri temelli iyileştirme (gizlilik, güvenlik, etikle sınırlı)."}, {"d": 2, "t": "Başarı", "f": "DeLone–McLean e-ticaret başarı yaklaşımının bileşenleri nedir?", "b": "Girdi kaliteleri (sistem kalitesi, bilgi kalitesi, hizmet kalitesi) → kullanım deneyimi (kullanım, kullanıcı memnuniyeti) → sonuç (net faydalar). Başarı yalnızca satış miktarı değildir."}, {"d": 2, "t": "Gösterge", "f": "Dönüşüm oranı nasıl hesaplanır? Ders örneği?", "b": "Sipariş sayısı / ziyaret (oturum) sayısı × 100. 2.500 sipariş / 100.000 ziyaret × 100 = %2,5. Ziyaretlerin ne kadarının siparişle sonuçlandığını gösterir."}, {"d": 2, "t": "Gösterge", "f": "Ortalama sipariş değeri nasıl hesaplanır? Ders örneği?", "b": "Toplam satış geliri / sipariş sayısı. 1.500.000 TL / 2.500 = 600 TL. Bir siparişin ortalama parasal büyüklüğünü gösterir."}, {"d": 2, "t": "Gösterge", "f": "Müşteri edinme maliyeti nasıl hesaplanır? Ders örneği?", "b": "Edinme harcaması / yeni müşteri sayısı. 300.000 TL / 2.000 = 150 TL. Yeni müşteri kazanmak için yapılan ortalama harcama."}, {"d": 2, "t": "Gösterge", "f": "Sepet terk oranı nasıl hesaplanır? Ders örneği?", "b": "(Başlatılan sepetler − siparişler) / başlatılan sepetler × 100. (4.000 − 2.500) / 4.000 × 100 = %37,5."}, {"d": 2, "t": "Gösterge", "f": "Göstergeler neden birlikte değerlendirilmelidir?", "b": "Tek gösterge başarının tamamını açıklamaz; ör. yoğun indirim dönüşümü yükseltirken kârlılığı azaltabilir. Diğer göstergeler: tekrar satın alma, iade oranı, karşılama süresi, zamanında teslimat, şikâyet oranı, müşteri yaşam boyu değeri, brüt kâr marjı, kanal/kampanya dönüşümü."}, {"d": 3, "t": "Geçiş", "f": "E-işletmeciliğe geçişin niteliği nedir?", "b": "Tek bir teknoloji alımından (tek seferlik yatırım) çok, örgütün zaman içinde geliştirdiği sürekli gelişen örgütsel yeteneğe dayanır. İletişimle başlar, süreçlerin bütünleşmesine ve iş modelinin dönüşümüne doğru ilerler."}, {"d": 3, "t": "Geçiş", "f": "Aşama modelleri ne işe yarar?", "b": "01 Mevcut düzey: dijital olgunluk ve mevcut yetenekleri belirlemek. 02 Sonraki adım: gerekli yatırım, beceri ve yönetsel kapasiteyi tanımlamak. 03 Stratejik bağlantı: teknoloji yatırımlarını hedefler ve performans göstergeleriyle ilişkilendirmek. Aşamalar farklı hızda yaşanabilir, birlikte yürütülebilir veya atlanabilir."}, {"d": 3, "t": "Dönüşüm", "f": "Sayısallaştırma, dijitalleşme ve dijital dönüşüm farkı nedir?", "b": "Sayısallaştırma: bilginin biçimi değişir (kâğıt fatura → e-belge). Dijitalleşme: mevcut süreç iyileştirilir (siparişlerin çevrim içi alınması). Dijital dönüşüm: süreç, yapı veya iş modeli yeniden tasarlanır (perakendecinin veri temelli çok kanallı platforma dönüşmesi). Her teknoloji kullanımı dijital dönüşüm değildir."}, {"d": 3, "t": "Dönüşüm", "f": "Dijital işletme stratejisi nedir?", "b": "Bilgi teknolojileri stratejisi ile işletme stratejisinin kesişimi. Dönüşüm ilerledikçe teknoloji stratejisi ile işletme stratejisi arasındaki sınır zayıflar."}, {"d": 3, "t": "Hazırlık", "f": "Elektronik hazırlık (e-readiness) nedir? İki boyutu?", "b": "İşletmenin yeni bir olgunluk düzeyine geçmek için gerekli iç kaynaklara ve dış çevre koşullarına sahip olup olmadığı. Örgütsel hazırlık (finansal kaynak, insan kaynağı ve dijital bilgi, teknoloji altyapısı, üst yönetim desteği) ve dış çevre hazırlığı (müşteri/tedarikçi uyumu, finans ve ödeme, iletişim ve lojistik altyapısı, devlet ve hukuki çevre)."}, {"d": 3, "t": "Hazırlık", "f": "Elektronik hazırlığın altı boyutu nedir?", "b": "Stratejik (hedef, bütçe, yönetim desteği, sorumluluk), teknolojik (internet, yazılım, donanım, veri, entegrasyon, güvenlik), insan kaynağı (dijital beceri, eğitim, öğrenme kapasitesi, değişime açıklık), süreç (tanımlama, standartlaştırma, ölçme), finansal (yatırım, bakım, lisans, eğitim maliyeti), dış çevre ve hukuk (talep, tedarikçi, ödeme, lojistik, yasal yükümlülük)."}, {"d": 3, "t": "Hazırlık", "f": "Neden süreç hazırlığı teknoloji yatırımından önce gelir?", "b": "Düzensiz bir sürecin otomasyonu düzensizliği daha hızlı üretir. Sıra: süreci tanımlama → gereksiz adımları kaldırma → sorumlulukları belirleme → teknolojiyi uygulama."}, {"d": 3, "t": "Aşamalar", "f": "Earl'ün modeli neyi açıklar?", "b": "E-işletmeciliğin altı aşamalı gelişimini: dış iletişimden elektronik işletmeye ve iş modelinin dönüşümüne uzanan süreç. (Aşamaların ayrıntısı fotoğraflarda yok.)"}, {"d": 4, "t": "Çeşitlilik", "f": "Raf alanı ile dijital katalog arasındaki fark nedir?", "b": "Fiziksel mağaza: sınırlı raf/depo/teşhir, yerel talebe göre ürün seçimi, az talep gören ürünü sergileme güçlüğü. E-mağaza: merkezi depo ve tedarikçi stoku, sipariş üzerine üretim, daha geniş ve niş ürün çeşidi."}, {"d": 4, "t": "Çeşitlilik", "f": "Çeşitlilik tüketici değerini nasıl artırır, hangi koşulla?", "b": "Az talep gören ürünler e-katalogda erişilebilir; çevrim içi kitapta çeşitlilikten doğan yarar düşük fiyattan doğan yarardan yüksek bulunmuştur. Ancak sınıflandırma, arama, filtreleme, stok doğruluğu ve öneri sistemi yoksa geniş katalog değer yerine karmaşıklık üretir."}, {"d": 4, "t": "Fiyat", "f": "E-ticarette fiyat yönetimi gelenekselden nasıl ayrılır?", "b": "Geleneksel: fiziksel etiket değiştirme, mağaza sistemi güncelleme, çalışanları bilgilendirme, yerel fiyat. Elektronik: merkezi güncelleme, daha sık ve küçük değişiklikler, rakip fiyatını hızlı karşılaştırma, kampanyaları hızla uygulama."}, {"d": 4, "t": "Fiyat", "f": "Toplam müşteri maliyeti nedir? İnternet fiyatları hep düşük müdür?", "b": "Ürün fiyatı + teslimat + zaman + arama + algılanan risk. İnternet fiyatları her zaman düşük değildir; fiyat farklılıkları ortadan kalkmamıştır. Kanallar ancak tüm bileşenlerle karşılaştırılabilir."}, {"d": 4, "t": "Teslimat", "f": "Geleneksel ve elektronik satın alma akışları nasıldır?", "b": "Geleneksel: mağaza → inceleme → ödeme → hemen teslim. Elektronik: seçim → sipariş → ödeme → hazırlama → teslim. E-ticarette ödeme ile ürüne sahip olma arasında bekleme vardır; fiziksel üründe teslimat süresi müşteri değerinin parçasıdır."}, {"d": 4, "t": "Teslimat", "f": "E-siparişin operasyon zinciri nedir?", "b": "Sipariş (ürün ve teslimat seçimi) → ödeme (tercih ve doğrulama) → hazırlama (depo ve paketleme) → taşıma (teslimat kuruluşu) → teslim. Müşteri deneyimi yalnız internet sitesinde oluşmaz."}, {"d": 4, "t": "Maliyet", "f": "E-ticaret maliyetleri ortadan kaldırır mı?", "b": "Hayır; maliyet ortadan kalkmaz, bileşimi değişir. Kira, dekorasyon, mağaza personeli, yerel stok, fiziksel satış noktası yerine yazılım ve bulut, dijital pazarlama, ödeme ve pazar yeri komisyonları, depolama-kargo-iade lojistiği öne çıkar."}, {"d": 4, "t": "Etkileşim", "f": "Yüz yüze ve dijital etkileşimin araçları nelerdir?", "b": "Yüz yüze: soruları anında yanıtlama, tepkileri gözlemleme, öneriyi anında uyarlama, karmaşık kararlarda açıklama ve güven. Dijital: kişiselleştirilmiş öneri ve içerik, chatbot ve canlı destek, e-posta ve mobil bildirim, çağrı merkezi. Karmaşık alışverişlerde insan desteği önemini korur."}, {"d": 4, "t": "Etkileşim", "f": "Kişiselleştirme ile mahremiyet arasındaki denge nedir?", "b": "Fayda: daha ilgili öneriler, daha hızlı ürün bulma, ihtiyaca uygun iletişim. Kaygı: aşırı veri toplama, izlenme hissi, verinin amaç dışı kullanımı. Kişiselleştirme için gerekli ve gereksiz veri arasındaki sınır açıkça belirlenmelidir."}, {"d": 4, "t": "Veri", "f": "Dijital müşteri yolculuğunda hangi veriler üretilir?", "b": "Trafik (kaynak ve ziyaret) → arama (arama ifadeleri) → inceleme (ürün görüntüleme) → sepet (ekleme ve terk) → sipariş (satın alma ve iade). Davranışsal ve işlemsel veriler süreç iyileştirmeyi destekler."}, {"d": 4, "t": "Veri", "f": "'Ölçülebilir olan her veri toplanmamalıdır' ilkesinin dört ölçütü nedir?", "b": "Amaç (verinin hangi sorun için gerektiği), gereklilik (yalnız gerekli veri), güvenlik (koruma ve erişim kontrolü), hukuk ve etik (uygun kullanım ve ayrımcılığın önlenmesi)."}, {"d": 4, "t": "Pazarlama", "f": "E-pazarlama reklamdan siparişe yolu nasıl değiştirir?", "b": "Reklam → ürün sayfası → sepet → sipariş şeklinde yolu kısaltır, dönüşümü kolaylaştırır. Ancak çok sayıda satıcı arasında görünürlük ve dikkat kazanmak zorlaşır; dikkat stratejik kaynak olur."}, {"d": 4, "t": "Aracılar", "f": "Aracısızlaşma ve yeniden aracılanma nedir?", "b": "Aracısızlaşma: üretici ile tüketicinin doğrudan buluşması, geleneksel aracıların rolünün azalması, doğrudan satış kanalı. Yeniden aracılanma: yeni dijital aracılar (pazar yeri, arama motoru, fiyat karşılaştırma, ödeme, lojistik, reklam/değerlendirme ağları); aracı sayısı azalmak zorunda değildir, işlevi ve gücü değişir."}, {"d": 4, "t": "Değerlendirme", "f": "Tüketici açısından e-ticaretin üstünlük ve sınırlılıkları?", "b": "Üstünlük: zaman-mekân esnekliği, kolay karşılaştırma, geniş çeşit, mağazaya gitmeme, yorumlara erişim, kişiselleştirilmiş öneri. Sınırlılık: fiziksel inceleyememe, teslimat bekleme ve kargo maliyeti, sahte yorum riski, ödeme/veri güvenliği kaygısı, iade-uyuşmazlık, mahremiyet."}, {"d": 4, "t": "Değerlendirme", "f": "İşletme açısından e-ticaretin üstünlük ve sınırlılıkları?", "b": "Üstünlük: geniş pazar, 7/24 sipariş, davranış ölçümü, hızlı fiyat/kampanya, otomasyon, ölçeklenme. Sınırlılık: yoğun fiyat ve görünürlük rekabeti, teknoloji ve güvenlik yatırımı, lojistik ve iade, pazar yeri/ödeme/reklam maliyetleri, kesinti ve siber saldırı, platform bağımlılığı."}, {"d": 4, "t": "Değerlendirme", "f": "Ürün kategorisi kanal üstünlüğünü nasıl değiştirir?", "b": "Standart ürünler (elektronik cihaz gibi karşılaştırılabilir) dijitalde kolay değerlendirilir. Duyusal ürünlerde (parfüm, kişiye özel giyim) fiziksel deneyim önemlidir. Hibrit yol: bir kanalda araştırıp diğerinde deneme, satın alma veya iade."}, {"d": 4, "t": "Bütünleşme", "f": "Bütünleşik ticaretin dört yaygın biçimi nedir?", "b": "Webrooming (internetten araştır, mağazada incele ve al), showrooming (mağazada gör/dene, e-kanaldan sipariş), tıkla ve teslim al (internetten sipariş, mağazadan teslim), mağazada iade (internetten alınanı mağazaya iade)."}, {"d": 5, "t": "E-perakende", "f": "Elektronik perakendecilik nedir, kapsamı nelerdir?", "b": "Nihai tüketiciye yönelik satışın dijital kanallar üzerinden yürütülmesi. Kapsam: dijital satış alanı (site, uygulama, pazar yeri, sosyal medya mağazası), işlem süreci (arama, karşılaştırma, sipariş, ödeme), operasyon (stok, depo, lojistik, müşteri hizmetleri, iade, satış sonrası)."}, {"d": 5, "t": "E-perakende", "f": "Ekranın önünde ve arka planda hangi sistemler çalışır?", "b": "Müşterinin gördüğü: ürün bilgisi ve görseller, arama ve karşılaştırma, sepet-ödeme-sipariş takibi, destek-değişim-iade. Arka planda: stok ve sipariş yönetimi, ödeme ve sahtekârlık kontrolü, depo-paketleme-lojistik, veri ve müşteri hizmetleri."}, {"d": 5, "t": "E-perakende", "f": "E-perakendecilik ile e-ticaret ilişkisi nedir? Ayırt edici ölçüt?", "b": "E-perakendecilik, e-ticaretin nihai tüketiciye satışa odaklanan alt alanıdır (e-işletmecilik ⊃ e-ticaret ⊃ e-perakendecilik). Ölçüt: işlemin dijital olması kadar alıcının nihai tüketici olup olmadığı. B2B hammadde alımı e-ticarettir; üreticinin kendi sitesinden tüketiciye satışı e-perakendeciliktir."}, {"d": 5, "t": "E-perakende", "f": "E-perakendeciliğin ayırt edici temel özellikleri nelerdir?", "b": "Dijital satış alanı, ölçülebilir müşteri davranışı ve sipariş ile teslimat arasındaki operasyon. Ayrıca: metin/görsel/video/yorumla sunum, 7/24 erişim, hızlı fiyat güncelleme, fiziksel teşhire az bağımlılık; güven-veri güvenliği-mahremiyet; müşteri ile satıcının fiziksel olarak ayrılması."}, {"d": 5, "t": "E-perakende", "f": "Erişim olanağı neden tek başına başarı sağlamaz?", "b": "Pazara erişim (geniş coğrafya) yanında yerel uyum (dil, ürün bilgisi, ödeme yöntemleri, müşteri desteği) ve yerine getirme (teslimat kapasitesi ve marka güvenilirliği) gerekir; bunlar satış vaadini gerçek müşteri deneyimine dönüştürür."}, {"d": 5, "t": "İş modeli", "f": "Mağaza yapısına göre üç e-perakende modeli?", "b": "Pure-play (fiziksel mağaza yok, site/uygulama), fiziksel ve dijital (mağaza teslim, iade, deneyim noktası), pazar yeri (bağımsız satıcılar ortak platformda)."}, {"d": 5, "t": "İş modeli", "f": "Müşteri ilişkisine göre üç e-perakende modeli?", "b": "Doğrudan tüketiciye (DTC: üretici aracısız satar), abonelik (dönemsel ödeme, sürekli değer gerekir), sosyal ve mobil (keşif ve satın alma sosyal medya/mobilde)."}, {"d": 5, "t": "İş modeli", "f": "Pazar yeri ve DTC modellerinin temel üstünlüğü ve yönetim sorunu?", "b": "Pazar yeri: hazır trafik ve işlem altyapısı / komisyon ve platform bağımlılığı. DTC: müşteri verisi ve marka deneyimi üzerinde kontrol / lojistik, iade ve bireysel hizmet yükü."}, {"d": 5, "t": "İş modeli", "f": "Pure-play ve abonelik modellerinin üstünlüğü ve sorunu?", "b": "Pure-play: düşük fiziksel mağaza bağımlılığı / güven ve teslimat maliyeti. Abonelik: tekrarlanan gelir / müşteri kaybını önleyecek sürekli değer."}, {"d": 5, "t": "Değer", "f": "Değer önerisi nedir?", "b": "Müşterinin neden belirli bir elektronik mağazayı seçmesi gerektiğini açıklayan yararlar bütünü: işlemsel yararlar (fiyat, karşılaştırma, hızlı teslimat, kolay iade) + seçim ve deneyim (çeşit, nadir ürün, bilgi, kişiselleştirme)."}, {"d": 5, "t": "Değer", "f": "Ürün çeşitliliğinin iki yüzü?", "b": "Tüketici refahı (daha çok seçenek, niş ürünler, fiyat avantajını aşan değer) ve karar güçlüğü (yetersiz sınıflandırma, zayıf arama/filtre, bilgi yükü)."}, {"d": 5, "t": "Süreç", "f": "Müşteri yolculuğunun ilk yarısının 5 aşaması?", "b": "Kazanım → keşif → değerlendirme → sepet → ödeme."}, {"d": 5, "t": "Süreç", "f": "Siparişten müşteri ilişkisine 5 aşama?", "b": "Onay (stok ve ödeme doğrulama) → karşılama (bulma, hazırlama, paketleme) → teslimat → satış sonrası (destek, değişim, iade) → ilişki (memnuniyet, sadakat, tavsiye)."}, {"d": 5, "t": "Süreç", "f": "'Bir aşamadaki hata bütün deneyimi etkiler' ne demektir?", "b": "İyi tasarlanmış mağaza, yanlış veya geç teslim edilen siparişin etkisini tek başına kaldıramaz; arayüz, stok doğruluğu, karşılama, teslimat ve sorun çözümü birlikte yönetilmelidir."}, {"d": 5, "t": "Tasarım", "f": "Ana sayfada yapılması ve kaçınılması gerekenler?", "b": "İşletme kimliğini açık göstermek, temel kategorileri görünür kılmak, değer önerisini anlaşılır sunmak; hareketli görsel ve kampanya kalabalığından kaçınmak."}, {"d": 5, "t": "Tasarım", "f": "Sepet terkini artıran 4 unsur?", "b": "Beklenmeyen teslimat bedeli, zorunlu üyelik, uzun ve karmaşık formlar, teknik hata veya yavaşlık."}, {"d": 5, "t": "Tasarım", "f": "Ürün sayfasındaki zorunlu bilgi alanları?", "b": "Ürün adı, fiyat ve stok; gerçekçi görseller ve teknik özellikler; ölçü/beden/malzeme/kapasite; teslimat tarihi ve maliyeti; iade ve garanti; müşteri değerlendirmeleri ve satıcı kimliği."}, {"d": 5, "t": "Değer", "f": "Faydacı ve hazcı alışveriş değeri farkı?", "b": "Faydacı: ihtiyacı kolay karşılama, fiyat karşılaştırma, zaman kazanma, işlemi hatasız tamamlama. Hazcı: yeni ürün keşfi, alışverişten keyif, görsel gezinme, ilham ve deneyim."}, {"d": 5, "t": "Kalite", "f": "eTailQ modelinin 4 boyutu?", "b": "İnternet sitesi tasarımı, siparişin yerine getirilmesi, gizlilik ve güvenlik, müşteri hizmetleri."}, {"d": 5, "t": "Kalite", "f": "E-S-QUAL ve E-RecS-QUAL boyutları?", "b": "E-S-QUAL (normal hizmet): etkinlik, sistem kullanılabilirliği, siparişin yerine getirilmesi, gizlilik. E-RecS-QUAL (sorun sonrası): yanıt verebilirlik, telafi, iletişim kurabilme."}, {"d": 5, "t": "Kalite", "f": "Hizmet telafisinin üç aşaması?", "b": "Sorun öncesi (iyi site, doğru bilgi, zamanında sipariş), sorun anı (hata bildirimi, yanıt hızı, iletişim kolaylığı), telafi (adil çözüm, açık süreç, uygun geri ödeme)."}, {"d": 5, "t": "Güven", "f": "E-perakendede güven neden kritiktir? Risk kaynakları?", "b": "Müşteri ürünü, satıcıyı ve ödemeyi fiziksel olarak gözlemleyemez. Riskler: ürün ve satıcı, ödeme ve veri, teslimat ve iade."}, {"d": 5, "t": "Güven", "f": "Güveni destekleyen uygulamalar?", "b": "Şeffaflık (satıcı kimliği, gerçekçi bilgi, açık teslimat/iade koşulları, doğrulanmış yorumlar) ve güvenli-adil işleyiş (güvenli ödeme, sipariş izleme, ulaşılabilir müşteri hizmetleri, hızlı ve adil şikâyet çözümü)."}, {"d": 5, "t": "Veri", "f": "Kişiselleştirme–mahremiyet dengesinin yönetim ilkesi?", "b": "Veri belirli amaçla ve gerektiği kadar toplanmalı, güvenli saklanmalı, hukuka ve etik ilkelere uygun kullanılmalı; aşırı ayrıntılı öneriler izlenme duygusu yaratabilir."}, {"d": 5, "t": "Lojistik", "f": "E-fulfillment nedir? Zincirin 6 adımı?", "b": "Siparişten teslime ve gerekirse iadeye kadar operasyonel faaliyetler. Doğrulama → stok → toplama → paketleme → taşıyıcı → teslim."}, {"d": 5, "t": "Lojistik", "f": "Son kilometre teslimatının başlıca sorunları?", "b": "Adres ve zaman (müşteri adreste yok, dar teslimat aralığı), operasyon (trafik, dağınık noktalar, kapasite), hizmet hatası (taşıyıcı kaynaklı olsa da perakendecinin hizmeti sayılır)."}, {"d": 5, "t": "Lojistik", "f": "Alternatif teslim seçenekleri?", "b": "Mağazadan teslim, teslimat dolabı, belirlenmiş teslim noktası (adrese teslim: standart, saat aralıklı, aynı gün)."}, {"d": 5, "t": "Lojistik", "f": "Tersine lojistik süreci?", "b": "Talep → toplama → taşıma (depoya dönüş) → kontrol → karar (yeniden satış veya tasfiye) → geri ödeme."}, {"d": 5, "t": "Lojistik", "f": "Kolay iade politikasının iki yönü?", "b": "Müşteri değeri: algılanan riski azaltır, kararı kolaylaştırır, güven ve tekrar satın almayı destekler. İşletme maliyeti: taşıma-paketleme, iş gücü-kontrol, ürün değer kaybı, kötüye kullanım riski."}, {"d": 5, "t": "Kanal", "f": "Çok kanallı ile omnichannel farkı?", "b": "Çok kanallı: kanallar birlikte bulunur ama ayrı süreçlerle yönetilebilir, müşteri farklı bilgi görebilir. Omnichannel: stok, fiyat, müşteri hesabı ve sipariş bilgisi bütünleşir; yolculuk kanallar arasında kesintisiz ilerler."}, {"d": 5, "t": "Kanal", "f": "Bütünleşik perakendecilik uygulama örnekleri?", "b": "İnternetten alıp mağazadan teslim, internetten alınanı mağazaya iade, mağazada olmayanı internetten sipariş, uygulamada mağaza stokunu görme, ortak müşteri hesabı, ortak sadakat puanı."}, {"d": 5, "t": "Gösterge", "f": "İade oranı ve zamanında teslimat oranı formülleri?", "b": "İade oranı = (iade edilen / satılan ürün veya sipariş) × 100. Zamanında teslimat = (söz verilen zamanda teslim edilen / toplam teslim edilen sipariş) × 100."}, {"d": 5, "t": "Gösterge", "f": "Neden tek bir performans göstergesi yeterli değildir?", "b": "Agresif indirim dönüşümü artırıp kârlılığı düşürebilir; kolay iade satışı destekleyip tersine lojistik maliyetini artırabilir. Satış, maliyet, hizmet kalitesi ve müşteri ilişkisi birlikte yorumlanmalı."}, {"d": 5, "t": "Değerlendirme", "f": "E-perakendeciliğin üç üstünlüğü ve üç sınırlılığı?", "b": "Üstünlük: zaman-mekân esnekliği, geniş pazar ve çeşit, kolay karşılaştırma (ayrıca veri, otomasyon, ölçeklenebilirlik). Sınırlılık: ürünü fiziksel inceleyememe, teslimat süresi ve kargo/iade maliyeti, güvenlik-mahremiyet kaygısı (ayrıca rekabet, platform bağımlılığı, siber risk)."}, {"d": 6, "t": "Kavram", "f": "Üç kavramı ayıran temel ölçüt nedir?", "b": "Kullanılan teknoloji değil, teknolojinin desteklediği işletme faaliyeti. Aynı site hem e-perakende arayüzü, hem e-ticaret kanalı, hem e-işletmecilik sisteminin parçası olabilir."}, {"d": 6, "t": "Kavram", "f": "Elektronik işletmecilik nedir? Temel sorusu?", "b": "İşletmenin değer zincirindeki faaliyetleri dijital teknolojilerle yürütmesi veya desteklemesi. Temel soru: faaliyetler dijital teknolojilerle nasıl daha bütünleşik ve verimli yürütülebilir?"}, {"d": 6, "t": "Sistem", "f": "ERP, CRM, SCM ne işe yarar?", "b": "ERP: finans, stok, üretim, satın alma gibi kaynakları bütünleştirir. CRM: müşteri bilgileri ve ilişkilerini yönetir. SCM: tedarik zinciri faaliyetlerini planlar ve koordine eder."}, {"d": 6, "t": "Sistem", "f": "Intranet ile extranet farkı?", "b": "Intranet işletme içi bilgi ve iletişimi destekler; extranet tedarikçi, bayi ve iş ortaklarıyla güvenli bilgi paylaşır."}, {"d": 6, "t": "Kavram", "f": "E-ticaretin belirleyici unsuru (OECD yaklaşımı)?", "b": "Siparişin bilgisayar ağı üzerinden oluşturulması. Ödeme ve teslimat yöntemi sınıflandırmayı tek başına belirlemez."}, {"d": 6, "t": "Kavram", "f": "İnternetten sipariş + kapıda nakit ödeme e-ticaret midir? Mağazada sipariş + mobil bankacılıkla ödeme?", "b": "İlki e-ticarettir (sipariş elektronik). İkincisi tek başına e-ticaret değildir (sipariş fiziksel mağazada; elektronik ödeme sipariş kanalını değiştirmez)."}, {"d": 6, "t": "Kavram", "f": "C2B, B2G ve G2B/G2C ne demektir?", "b": "C2B: tüketicinin işletmeye ürün, hizmet veya değer sunması. B2G: işletme ile kamu kurumu arasındaki ticari işlem. G2B/G2C: kamunun işletme veya bireylere elektronik hizmet sunması."}, {"d": 6, "t": "Kavram", "f": "Zwass (1996) e-ticareti nasıl ele alır?", "b": "Ticari bilgi paylaşımı, iş ilişkileri ve işlemlerin telekomünikasyon ağları üzerinden yürütülmesi olarak geniş biçimde; e-ticaret yalnız tüketici alışverişi değildir (elektronik hammadde siparişi de e-ticarettir)."}, {"d": 6, "t": "Kapsam", "f": "Kapsam hiyerarşisi ve 'daima doğru' önermeler?", "b": "E-işletmecilik ⊃ e-ticaret ⊃ e-perakendecilik. Daima doğru: her e-perakende faaliyeti e-ticarettir; her e-ticaret e-işletmeciliğin parçasıdır. Tersleri daima doğru değildir."}, {"d": 6, "t": "Karşılaştırma", "f": "Üç kavramda işlem (sipariş) zorunluluğu?", "b": "E-işletmecilik: hayır. E-ticaret: evet. E-perakendecilik: evet."}, {"d": 6, "t": "Karşılaştırma", "f": "Üç kavramın temel çıktıları ve başlıca riskleri?", "b": "E-işletmecilik: verimlilik, bütünleşme, karar kalitesi / sistem bütünleşmesi ve örgütsel değişim. E-ticaret: başarılı ticari işlem / işlem, ödeme ve taraf güvenliği. E-perakende: satış, deneyim, sadakat / ürün, teslimat, iade ve tüketici güveni."}, {"d": 6, "t": "Sınıflandırma", "f": "Faaliyet sınıflandırma akışı?", "b": "Elektronik sipariş oluşuyor mu? Hayır → e-işletmecilik olabilir, e-ticaret değil. Evet → e-ticaret; siparişi nihai tüketici veriyorsa (satıcı işletme/perakendeci) e-perakendecilik."}, {"d": 6, "t": "Ön/arka yüz", "f": "Ön yüz ve arka yüz faaliyetleri?", "b": "Ön yüz: müşterinin gördüğü temas noktaları (site, uygulama, ürün sayfası, sepet-ödeme, sipariş izleme, canlı destek). Arka yüz: ERP, stok-depo, muhasebe-satın alma, tedarikçi/kargo entegrasyonu, İK, veri analizi, iade-geri ödeme."}, {"d": 6, "t": "Ön/arka yüz", "f": "Arka yüz bütünleşmesiyle ilgili araştırma bulgusu?", "b": "624 perakende işletmesinde ön ve arka yüz yetenekleri e-işletmecilik değeriyle ilişkili; Zhu ve Kraemer (2005): arka yüz bütünleşmesi daha güçlü bir farklılaştırıcı olabilir."}, {"d": 6, "t": "Değer", "f": "E-işletmecilikte dört değer kaynağı?", "b": "Etkinlik (maliyet ve süre azalması), tamamlayıcılıklar (birlikte sunulan ürün/hizmet/kanalların ek değeri), sistemde tutma (müşteri ve ortağın aynı sistemde kalması), yenilik (yeni işlem, hizmet veya iş modeli)."}, {"d": 6, "t": "Değer", "f": "Zott, Amit ve Massa (2011) iş modelini nasıl tanımlar?", "b": "İşletmenin nasıl değer yarattığını ve bu değeri nasıl elde ettiğini açıklayan bütünsel bir faaliyet sistemi."}, {"d": 6, "t": "Performans", "f": "Gelir ile işletme değeri neden aynı değildir?", "b": "Bazı sistemler doğrudan gelir yaratmaz ama değerlidir (e-İK, idari süre/maliyet azalması, veri kalitesi); yüksek satış da yeterli olmayabilir (yanlış stok, verimsiz teslimat, yüksek iade maliyeti)."}, {"d": 6, "t": "Hukuk", "f": "Üç alanın hukuki/etik odakları?", "b": "E-işletmecilik: çalışan-tedarikçi verisi, erişim yetkisi, ticari sır, otomatik kararların etiği. E-ticaret: elektronik sözleşme, ödeme güvenliği, kimlik doğrulama, vergi, sınır ötesi işlem. E-perakende: tüketicinin bilgilendirilmesi, mesafeli satış, iade ve cayma hakkı, bilgi doğruluğu."}, {"d": 6, "t": "Kavram", "f": "Tanıtım sitesi neden elektronik mağaza değildir?", "b": "Müşteri sipariş oluşturamıyorsa site satış kanalı değil dijital iletişim kanalıdır; ürünlerin internette görünmesi e-perakendecilik için yeterli değildir."}, {"d": 6, "t": "Sınıflandırma", "f": "Hızlı sınıflandırma ölçütünün 3 adımı?", "b": "1) Dijital faaliyet → e-işletmecilik değerlendirilir. 2) Elektronik sipariş → e-ticaret vardır. 3) Nihai tüketiciye elektronik satış → e-perakendecilik vardır."}];
const QUIZ = [{"d": 2, "q": "Elektronik ticarette belirleyici unsur hangisidir?", "o": ["Siparişin elektronik sistem üzerinden verilmesi", "Ödemenin elektronik sistem üzerinden yapılması", "Ürünün elektronik sistem üzerinden teslimi", "Tanıtımın elektronik sistem üzerinden yapılması"], "a": 0, "w": "Sipariş belirleyicidir; ödeme ve teslimat değişebilir."}, {"d": 2, "q": "Aşağıdakilerden hangisi bir işlemi e-ticaret yapan üç ölçütten biri DEĞİLDİR?", "o": ["Ekonomik değer", "En az iki taraf", "Elektronik sipariş sistemi", "Elektronik teslimat"], "a": 3, "w": "Teslimat fiziksel olabilir."}, {"d": 2, "q": "İnternetten sipariş edilip kapıda nakit ödenen bir masa için hangisi doğrudur?", "o": ["E-ticaret değildir, çünkü ödeme nakittir", "E-ticarettir, çünkü sipariş elektroniktir", "Kısmi e-ticaret sayılmaz", "Sadece B2B ise e-ticarettir"], "a": 1, "w": "Ödeme ve teslimat elektronik olmak zorunda değildir."}, {"d": 2, "q": "E-ticaret ile e-işletmecilik ilişkisi hangisidir?", "o": ["İkisi aynıdır", "E-işletmecilik e-ticaretin alt alanıdır", "E-ticaret e-işletmeciliğin alt alanıdır", "Hiçbir ilişkileri yoktur"], "a": 2, "w": "E-işletmecilik tüm iç ve dış süreçleri kapsar."}, {"d": 2, "q": "Serbest çalışan bir tasarımcının işletmeye çevrim içi hizmet sunması hangi türdür?", "o": ["B2C", "C2C", "C2B", "G2C"], "a": 2, "w": "Birey işletmeye değer sunar; roller tersine döner."}, {"d": 2, "q": "İşletmenin elektronik kamu ihalesine teklif vermesi hangi türdür?", "o": ["G2B", "B2G", "G2C", "B2B"], "a": 1, "w": "İşletmeden kamuya."}, {"d": 2, "q": "B2B e-ticarette kritik başarı faktörleri hangileridir?", "o": ["Entegrasyon, güvenilirlik, teslim koşulları", "Deneyim, güven, kolay iade koşulları", "Entegrasyon, kampanya, sosyal medya reklamı", "Ödeme kolaylığı, teslimat hızı, iade süresi"], "a": 0, "w": "B2C'de ise deneyim, güven, ödeme, teslimat ve iade öne çıkar."}, {"d": 2, "q": "Marjinal çoğaltma maliyetinin düşebildiği, telif ve erişim kontrolünün kritik olduğu ürün türü hangisid
