<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veri Yapıları</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>

<script>
const CARDS = [{"d": 1, "t": "Bağlı Liste", "f": "Bağlı liste nedir, düğüm neyi içerir?", "b": "Aynı kümeye ait veri parçalarının bellekte sanal olarak birbirine bağlanmasıyla oluşan yapı. Düğüm (node) = veri bloğu + bir sonraki düğümü gösteren bağlantı işaretçisi (link/next)."}, {"d": 1, "t": "Bağlı Liste", "f": "Head ve tail neyi gösterir? Boş listede değerleri nedir?", "b": "Head ilk düğümü, tail son düğümü gösterir; son düğümün next'i NULL'dır. Liste boşken head ve tail NULL'dır."}, {"d": 1, "t": "Bağlı Liste", "f": "Bağlı listede ekleme/silme diziye göre neden kolaydır?", "b": "Elemanları kaydırmak gerekmez; yalnızca ilgili düğümlerin bağlantıları (linkler) değiştirilir. Dinamik bellek: ihtiyaç oldukça düğüm eklenir/çıkarılır."}, {"d": 1, "t": "Bağlı Liste", "f": "Dört bağlı liste türünü say.", "b": "Tek yönlü (her düğüm bir sonrakini gösterir), çift yönlü (önceki ve sonraki), çevrimsel (son düğüm ilkine bağlanır, NULL yok), karma (hibrit: türlerin birleşimi)."}, {"d": 1, "t": "Bağlı Liste", "f": "Bağlı listeden ortadaki bir düğüm nasıl silinir?", "b": "1) Silinecek düğümü bul 2) Önceki düğümün bağlantısını silinenin sonrakine yönlendir (bağlantıyı kopar) 3) Silinen düğümün belleğini iade et."}, {"d": 1, "t": "Bağlı Liste", "f": "Bağlı listelerin kullanım alanlarına örnekler ver.", "b": "Dinamik bellek yönetimi, stack ve queue gerçekleştirme, hash tablolarında çarpışma (collision) çözümü, metin editörlerinde satırlar, tarayıcı listeleri, graf/yol temsili, veri akışlarının işlenmesi."}, {"d": 1, "t": "Çift Yönlü", "f": "Çift yönlü bağlı listenin avantaj ve dezavantajı nedir?", "b": "Avantaj: ileri-geri gezinme; referansı bilinen ortadaki düğümü O(1)'de silme (önceki düğüme doğrudan erişim). Dezavantaj: her düğüm ekstra prev işaretçisi taşır (daha çok bellek); ekleme/silmede daha fazla işaretçi güncellenir."}, {"d": 1, "t": "Çift Yönlü", "f": "Çift yönlü bağlı liste nerelerde kullanılır?", "b": "Undo/redo, tarayıcı geri/ileri (current.prev / current.next), müzik çalar önceki/sonraki, LRU cache (hash table ile), metin editörleri, navigasyon, bellek blokları, pencereler arası gezinme."}, {"d": 1, "t": "Çift Yönlü", "f": "Tek yönlü listede ortadaki düğümü silmek neden daha maliyetlidir?", "b": "Önceki düğüme işaretçi olmadığı için önceki düğümü bulmak üzere listenin başından itibaren tarama gerekir. Çift yönlüde prev ile doğrudan ulaşılır."}, {"d": 1, "t": "Çevrimsel", "f": "Çevrimsel bağlı listenin özellikleri ve kullanım alanları?", "b": "NULL değer yoktur, tüm düğümler birbirine bağlıdır; başlangıç/son yoktur, sona gelince otomatik başa dönülür. Kullanım: işletim sisteminde süreçlere döngüsel erişim (round-robin), çok oyunculu oyunlarda sıra değişimi."}, {"d": 2, "t": "Stack", "f": "Stack hangi mantıkla çalışır?", "b": "LIFO (Last In First Out) ya da FILO (First In Last Out): son eklenen ilk çıkar. Stack pointer (top) en üstü gösterir."}, {"d": 2, "t": "Stack", "f": "Stack'in temel işlemleri nelerdir?", "b": "push() ekler, pop() en son ekleneni çıkarır, top()/peek() en üsttekine bakar, count() eleman sayısını verir, isEmpty() boş mu kontrol eder."}, {"d": 2, "t": "Stack", "f": "Stack bilgisayarda nerelerde kullanılır?", "b": "Undo/redo, web geri butonu, fonksiyon çağrıları (call stack) ve özyineleme, backtracking (labirent, sudoku), derleyicide parantez dengeleme ve infix→postfix dönüşümü, DFS, thread stack'leri, kesme işlemleri, JVM/.NET stack tabanlı VM, Assembly PUSH/POP."}, {"d": 2, "t": "Stack", "f": "Stack ile parantez dengesi nasıl kontrol edilir?", "b": "Açılan parantezi push et. Kapanan gelince: stack boşsa veya tepedeki eşleşmiyorsa → dengesiz; eşleşiyorsa pop. Sonunda stack boşsa dengeli. Örnek: {[()]} dengeli, {([)]} dengesiz."}, {"d": 2, "t": "Notasyon", "f": "Infix, prefix ve postfix notasyonlarını açıkla.", "b": "Infix: operatör operandların arasında (A + B); öncelik/parantez gerekir. Prefix: operatör önce (+AB). Postfix: önce operandlar sonra operatör (AB+). Derleyiciler stack ile prefix/postfix'e çevirir; parantez gerekmez."}, {"d": 2, "t": "Notasyon", "f": "A + B * C ve (A + B) * C ifadelerinin prefix ve postfix karşılıkları?", "b": "A + B * C → prefix +A*BC, postfix ABC*+. (A + B) * C → prefix *+ABC, postfix AB+C*."}, {"d": 2, "t": "Notasyon", "f": "(A + B) * (C + D) ve A * B + C * D'nin postfix'i nedir?", "b": "(A + B) * (C + D) → AB+CD+* (prefix *+AB+CD). A * B + C * D → AB*CD*+ (prefix +*AB*CD)."}, {"d": 2, "t": "Notasyon", "f": "(X + Y) * ((A + B) / C) ifadesinin prefix ve postfix'i? Slaytta ne hata var?", "b": "Prefix: *+XY/+ABC. Postfix: XY+AB+C/*. Slaytta bu iki etiket ters yazılmış; ayrıca '456*+' prefix diye verilmiş ama aslında postfix'tir."}, {"d": 2, "t": "Notasyon", "f": "Postfix ifade stack ile nasıl hesaplanır? 456*+ kaç eder?", "b": "Soldan sağa oku: sayıysa push; operatörse iki kez pop (ikinci çıkan sol operand), işlemi yap, sonucu push. 456*+: push 4,5,6 → * : 5×6=30 → + : 4+30 = 34."}, {"d": 2, "t": "Notasyon", "f": "Infix → postfix dönüşümünde stack nasıl kullanılır?", "b": "Operandları doğrudan çıktıya yaz. Operatör gelince, tepedeki operatörün önceliği büyük/eşit oldukça onları çıktıya pop et, sonra yeni operatörü push et. '(' push edilir; ')' gelince '('e kadar pop edilir. Sonda kalanlar pop edilir. Öncelik: * / > + −."}, {"d": 2, "t": "Stack", "f": "Hanoi Kuleleri kuralları nelerdir?", "b": "Her hamlede yalnızca bir disk taşınır; hiçbir disk kendisinden küçük bir diskin üzerine konamaz; her hamlede en üstteki disk alınır; diğer direklerde daha önceden diskler olabilir. (n disk için en az 2ⁿ − 1 hamle.)"}, {"d": 3, "t": "Queue", "f": "Kuyruk hangi mantıkla çalışır, veri nereden girip çıkar?", "b": "FIFO (First In First Out) / LILO. Veri arkadan (rear) girer, önden (front) çıkar. Örnek: yazıcı kuyruğu, bilet gişesi."}, {"d": 3, "t": "Queue", "f": "Kuyruğun temel işlemleri nelerdir?", "b": "enqueue() ekler, dequeue() çıkarır, peek() ilk elemanı gösterir, clear() temizler, count() eleman sayısını verir."}, {"d": 3, "t": "Queue", "f": "Kuyruk nerelerde kullanılır?", "b": "CPU zamanlayıcılar (Round-Robin), I/O ve yazıcı işleri, router/switch'te ağ paketleri, mesaj kuyrukları (RabbitMQ, Kafka), BFS (genişlik öncelikli arama), banka/çağrı merkezi simülasyonu, asenkron görevler, üretici–tüketici problemi."}, {"d": 3, "t": "Queue", "f": "Kuyruk için üç tasarım yaklaşımı nedir?", "b": "1) Dizi üzerinde kaydırmalı (tek indis; her dequeue'da elemanlar sola kayar, maliyetli) 2) Dizi üzerinde çevrimsel (front ve rear iki indis; halka bellek, kaydırma yok) 3) Bağlı liste (dinamik bellek)."}, {"d": 3, "t": "Queue", "f": "Çevrimsel (dairesel) kuyruğun kaydırmalı kuyruğa üstünlüğü nedir?", "b": "Dizinin sonundaki elemandan sonra ilk elemana dönülür (halka bellek). Bu yüzden dequeue'dan sonra kaydırma gerekmez; front ve rear işaretçileriyle bellek verimli kullanılır."}, {"d": 3, "t": "Queue", "f": "Öncelikli kuyruk (priority queue) nedir?", "b": "Elemanların önceliği varsa kullanılır (işletim sistemi süreç kuyruğu). Öncelik yoksa FIFO; öncelik varsa FIFO olmaksızın öncelik sırasına göre yerleşir (önceliksiz sona, öncelikli önceliğine göre). Genelde bağlı liste ile gerçekleştirilir."}, {"d": 3, "t": "Queue", "f": "Stack ve queue hangi arama algoritmalarında kullanılır?", "b": "Stack → DFS (derinlik öncelikli arama). Queue → BFS (genişlik öncelikli arama)."}, {"d": 4, "t": "Ağaç", "f": "Ağaç veri yapısının avantaj ve dezavantajları nelerdir?", "b": "Avantaj: dengeli ağaçta O(log₂N) hızlı arama (n=1000: bağlı listede ~1000, ağaçta <10 işlem), özyinelemeli fonksiyonlarla kolay tasarım. Dezavantaj: daha fazla bellek, çok sayıda işaretçi ve değişken."}, {"d": 4, "t": "Ağaç", "f": "Ağaçlar nerelerde kullanılır?", "b": "Dosya sistemleri, veritabanı indeksleme (B-Tree/B+Tree, MySQL), Dijkstra/Prim/Kruskal (spanning tree), derleyici AST'si, Huffman sıkıştırma (ZIP, JPEG, MP3), karar ağaçları (ML), oyun ağaçları (satranç, Go)."}, {"d": 4, "t": "Ağaç", "f": "Kök, yaprak, dahili düğüm ve derece kavramları nedir?", "b": "Kök: en üstteki tek düğüm. Yaprak: çocuğu olmayan (terminal/harici) düğüm. Dahili düğüm: en az bir çocuğu olan düğüm. Derece: bir düğümün çocuk (alt ağaç) sayısı; yapraklarda 0. Tüm dereceleri eşit ağaç homojendir."}, {"d": 4, "t": "Ağaç", "f": "Ata (ancestor) ve torun (descendant) nedir?", "b": "Ata: düğümden köke kadar olan yoldaki herhangi bir düğüm (kök dahil); en yakını parent. Torun: düğümden yaprağa kadar olan yoldaki herhangi bir düğüm (yaprak dahil); en yakını child."}, {"d": 4, "t": "Ağaç", "f": "Seviye, derinlik ve yükseklik arasındaki fark nedir?", "b": "Seviye: kök ile düğüm arasındaki kenar sayısı + 1 (kök = 1). Derinlik: kök ile düğüm arasındaki kenar sayısı (kök = 0). Yükseklik: düğümden yaprağa en uzun yoldaki kenar sayısı; kökün yüksekliği = ağacın yüksekliği."}, {"d": 4, "t": "Ağaç", "f": "Soru 1 ağacında (A→B,C; B→D,E,F; E→G; G→H,I) düğüm sayısı, yapraklar, seviye sayısı ve yükseklik?", "b": "Düğüm sayısı 9; kök A; yapraklar C, D, F, H, I; H'nin ataları G, E, B, A; E'nin kardeşleri D, F; seviye sayısı 5; yükseklik 4."}, {"d": 4, "t": "İkili Ağaç", "f": "İkili ağaç (binary tree) nedir?", "b": "Kökten başlayan, her düğümün en fazla 2 çocuğu (sol ve sağ) olan ağaç. Kök hariç her düğüm bir daldan gelir. Bilgisayar biliminde en yaygın veri yapısıdır."}, {"d": 4, "t": "İkili Ağaç", "f": "Full ve complete binary tree farkı nedir?", "b": "Full: her düğümün 0 ya da 2 çocuğu vardır; her zaman yaprak sayısı = dahili düğüm sayısı + 1. Complete: son seviye hariç tüm seviyeler doludur ve son seviyedeki düğümler soldan sağa (sola yaslı) yerleşir."}, {"d": 4, "t": "İkili Ağaç", "f": "Balanced, degenerate ve perfect binary tree nedir?", "b": "Balanced: her düğümün alt ağaçları arasındaki yükseklik farkı en fazla 1. Degenerate (pathological): her ebeveynin tek çocuğu var (liste gibi). Perfect: tüm dahili düğümlerin 2 çocuğu var ve tüm yapraklar aynı seviyede; aynı zamanda full, complete ve balanced."}, {"d": 4, "t": "Dolaşma", "f": "Preorder, inorder ve postorder sıraları nedir?", "b": "Preorder: kök – sol – sağ (ağacı kopyalamak). Inorder: sol – kök – sağ (BST'de sıralı çıktı). Postorder: sol – sağ – kök (ağacı silmek)."}, {"d": 4, "t": "Dolaşma", "f": "Ders örneği ağacının (1; 2,3; 2→4; 3→5,6; 5→7,8) preorder, inorder, postorder sonuçları?", "b": "Preorder: 1, 2, 4, 3, 5, 7, 8, 6. Inorder: 4, 2, 1, 7, 5, 8, 3, 6. Postorder: 4, 2, 7, 8, 5, 6, 3, 1."}, {"d": 4, "t": "Dolaşma", "f": "Dolaşma sonuçlarından kök nasıl bulunur?", "b": "Preorder'ın ilk elemanı ve postorder'ın son elemanı her zaman köktür. Inorder'da kökün solundakiler sol alt ağaç, sağındakiler sağ alt ağaçtır."}, {"d": 5, "t": "BST", "f": "BST'yi sıradan ikili ağaçtan ayıran özellik nedir?", "b": "Parent–child arasında büyüklük ilişkisi vardır: her düğüm için sol alt ağaçtaki tüm değerler düğümden küçük, sağ alt ağaçtakiler büyük veya eşittir. Her alt ağaç da BST'dir."}, {"d": 5, "t": "BST", "f": "BST'de hangi dolaşma sıralı veri verir? Bu neyi mümkün kılar?", "b": "Inorder dolaşma küçükten büyüğe sıralı veri verir. Bu, Tree Sort algoritmasını ve aralık sorgularını ('10 ile 30 arası') mümkün kılar."}, {"d": 5, "t": "BST", "f": "BST'ye ekleme kuralı nedir?", "b": "İlk eleman kök olur. Yeni değer kökten başlayarak karşılaştırılır: küçükse sola, büyük veya eşitse sağa gidilir; boş konum bulununca oraya yerleştirilir."}, {"d": 5, "t": "BST", "f": "[10, 12, 5, 4, 20, 8, 7, 15, 13] ile kurulan BST'nin yapısı nedir?", "b": "Kök 10. Sol: 5 (sol 4, sağ 8; 8'in solu 7). Sağ: 12 (sağ 20; 20'nin solu 15; 15'in solu 13)."}, {"d": 5, "t": "BST", "f": "BST'de silmenin üç durumu nedir?", "b": "1) Yaprak: doğrudan silinir, parent'ın işaretçisi NULL. 2) Tek çocuklu: parent'ın işaretçisi silinenin çocuğuna yönlendirilir. 3) İki çocuklu: sağ alt ağacın minimumu veya sol alt ağacın maksimumu bulunur, değeri kopyalanır, o düğüm durum 1/2 ile silinir."}, {"d": 5, "t": "BST", "f": "BST'nin zaman karmaşıklığı nedir, ne zaman bozulur?", "b": "Arama, ekleme, silme ortalama O(log n). Sıralı veri eklenirse ağaç dejenere olur (liste gibi) ve O(n)'e düşer. Bu yüzden AVL, Red-Black gibi dengeli ağaçlar geliştirilmiştir."}, {"d": 5, "t": "AVL", "f": "AVL ağacı nedir, denge faktörü nasıl hesaplanır?", "b": "Adelson-Velsky ve Landis'in kendi kendini dengeleyen BST'si. Denge faktörü BF = h_sol − h_sağ; her düğümde −1, 0 veya +1 olmalı. +2 veya −2 olursa döndürme gerekir."}, {"d": 5, "t": "AVL", "f": "AVL'de dört dengesizlik durumu ve çözümleri nedir?", "b": "Sol-sol (BF +2) → sağa döndürme. Sağ-sağ (BF −2) → sola döndürme. Sol-sağ → önce sol çocukta sola, sonra düğümde sağa (çift). Sağ-sol → önce sağ çocukta sağa, sonra düğümde sola (çift)."}, {"d": 5, "t": "AVL", "f": "Sola döndürmede ne olur?", "b": "Sağ alt ağaç çok yüksektir (BF = −2). Dengesiz düğümün sağ çocuğu yeni kök olur, eski kök onun sol çocuğu olur; alt ağaçlar BST kuralına göre yeniden bağlanır. Döndürme O(1)'dir."}, {"d": 5, "t": "AVL", "f": "AVL ağacının performans garantisi nedir?", "b": "Her ekleme/silme sonrası otomatik dengelendiği için arama, ekleme ve silme en kötü durumda bile O(log n)'dir. Örnek: 1–7 sırayla eklenince kök 4 olur ve ağaç dengeli kalır."}, {"d": 5, "t": "AVL", "f": "3, 2, 1, 4, 5, 6 AVL'ye eklenince ne olur?", "b": "1 eklenince 3'te dengesizlik → tek döndürme, kök 2. 4 eklenir. 5 → 3'te dengesizlik, tek döndürme. 6 → kök 2'de dengesizlik, tek döndürme → kök 4 (sol 2: 1, 3; sağ 5: 6)."}];
const QUIZ = [{"d": 1, "q": "Bağlı listede bir düğüm hangi iki bileşenden oluşur?", "o": ["Anahtar ve değer", "Veri ve bağlantı işaretçisi", "Indis ve boyut", "Kök ve yaprak"], "a": 1, "w": "Düğüm = veri bloğu + sonraki düğümü gösteren link."}, {"d": 1, "q": "Boş bir bağlı listede head ve tail ne olur?", "o": ["0 ve 1", "İlk ve son düğüm", "NULL", "Aynı düğüm"], "a": 2, "w": "Liste boşken head ve tail NULL'dır."}, {"d": 1, "q": "Son düğümün ilk düğüme bağlandığı, NULL içermeyen liste türü hangisidir?", "o": ["Tek yönlü", "Çift yönlü", "Çevrimsel", "Karma"], "a": 2, "w": "Çevrimsel listede başlangıç/son yoktur."}, {"d": 1, "q": "Tarayıcıda geri/ileri gezinme ve undo/redo için en uygun yapı hangisidir?", "o": ["Tek yönlü bağlı liste", "Çift yönlü bağlı liste", "Öncelikli kuyruk", "Dizi üzerinde kaydırmalı kuyruk"], "a": 1, "w": "prev ve next işaretçileriyle iki yönlü gezinme sağlar."}, {"d": 1, "q": "Çift yönlü bağlı listenin dezavantajı hangisidir?", "o": ["Geri gezinememe", "Her düğümde ekstra prev işaretçisi nedeniyle daha fazla bellek", "Ortadan silmenin O(n) olması", "NULL kullanamama"], "a": 1, "w": "Ekstra işaretçi bellek ve güncelleme maliyeti getirir."}, {"d": 1, "q": "Referansı bilinen ortadaki düğümü O(1)'de silebilen yapı hangisidir?", "o": ["Tek yönlü liste", "Çift yönlü liste", "Dizi", "Stack"], "a": 1, "w": "Önceki düğüme prev ile doğrudan erişildiği için tarama gerekmez."}, {"d": 2, "q": "Stack hangi mantıkla çalışır?", "o": ["FIFO", "LIFO", "Öncelik sırası", "Rastgele erişim"], "a": 1, "w": "Son giren ilk çıkar (LIFO/FILO)."}, {"d": 2, "q": "Stack'te en son eklenen elemanı çıkaran işlem hangisidir?", "o": ["push()", "peek()", "pop()", "enqueue()"], "a": 2, "w": "pop() en üsttekini çıkarır."}, {"d": 2, "q": "Aşağıdakilerden hangisi stack kullanım alanı DEĞİLDİR?", "o": ["Fonksiyon çağrıları (call stack)", "Parantez dengeleme", "Yazıcı kuyruğu", "Undo işlemi"], "a": 2, "w": "Yazıcı kuyruğu FIFO'dur, queue kullanır."}, {"d": 2, "q": "A + B * C ifadesinin postfix karşılığı nedir?", "o": ["AB+C*", "ABC*+", "+A*BC", "AB*C+"], "a": 1, "w": "Önce B*C (BC*), sonra A ile toplanır: ABC*+."}, {"d": 2, "q": "(A + B) * C ifadesinin prefix karşılığı nedir?", "o": ["*+ABC", "+*ABC", "AB+C*", "*A+BC"], "a": 0, "w": "Çarpma en dıştadır: * (+AB) C → *+ABC."}, {"d": 2, "q": "(A + B) * (C + D) ifadesinin postfix karşılığı nedir?", "o": ["AB+CD+*", "*+AB+CD", "ABCD++*", "AB*CD++"], "a": 0, "w": "Her parantez ayrı postfix olur (AB+, CD+), sonra *."}, {"d": 2, "q": "456*+ postfix ifadesinin değeri kaçtır?", "o": ["26", "34", "120", "50"], "a": 1, "w": "5×6=30, sonra 4+30=34."}, {"d": 2, "q": "Postfix hesaplamada bir operatör okununca ne yapılır?", "o": ["Operatör push edilir", "Stack temizlenir", "İki operand pop edilir, işlem yapılır, sonuç push edilir", "Bir operand pop edilir"], "a": 2, "w": "İkinci çıkan operand sol taraftır."}, {"d": 2, "q": "{([)]} ifadesi parantez kontrolünde neden dengesizdir?", "o": ["Parantez sayısı tek", "']' geldiğinde stack'in tepesinde '(' vardır, eşleşmez", "Stack boştur", "Süslü parantez desteklenmez"], "a": 1, "w": "Kapanan parantez tepedekiyle eşleşmezse dengesizdir."}, {"d": 3, "q": "Kuyruğa veri hangi uçtan girer, hangi uçtan çıkar?", "o": ["Front'tan girer, rear'dan çıkar", "Rear'dan girer, front'tan çıkar", "Top'tan girer ve çıkar", "Ortadan girer"], "a": 1, "w": "FIFO: arkadan ekle, önden çıkar."}, {"d": 3, "q": "Dizi üzerinde kaydırmalı kuyruğun temel sorunu nedir?", "o": ["İki indis gerektirmesi", "Her dequeue sonrası tüm elemanların kaydırılması (maliyet)", "Bağlı liste gerektirmesi", "LIFO çalışması"], "a": 1, "w": "Kaydırma işlemi performans açısından maliyetlidir."}, {"d": 3, "q": "Kaydırma gerektirmeyen, front ve rear iki indis kullanan kuyruk tasarımı hangisidir?", "o": ["Kaydırmalı kuyruk", "Çevrimsel (dairesel) kuyruk", "Stack", "Perfect tree"], "a": 1, "w": "Halka bellek mantığıyla sonda başa dönülür."}, {"d": 3, "q": "BFS (genişlik öncelikli arama) hangi veri yapısını kullanır?", "o": ["Stack", "Queue", "Hash", "AVL"], "a": 1, "w": "BFS kuyruk, DFS stack kullanır."}, {"d": 3, "q": "Öncelikli kuyrukta öncelikli bir eleman nereye yerleştirilir?", "o": ["Her zaman sona", "Her zaman başa", "Öncelik sırasına göre uygun yere", "Rastgele"], "a": 2, "w": "Öncelik varsa FIFO olmaksızın öncelik sırası belirleyicidir."}, {"d": 4, "q": "Kökün derinliği ve seviyesi sırasıyla kaçtır (ders tanımı)?", "o": ["0 ve 1", "1 ve 0", "1 ve 1", "0 ve 0"], "a": 0, "w": "Derinlik kenar sayısıdır (0); seviye kenar sayısı + 1'dir (1)."}, {"d": 4, "q": "Yaprak düğümün derecesi kaçtır?", "o": ["0", "1", "2", "Değişir"], "a": 0, "w": "Yaprağın çocuğu yoktur."}, {"d": 4, "q": "Her düğümünün 0 ya da 2 çocuğu olan ikili ağaç hangisidir?", "o": ["Complete", "Full", "Degenerate", "Balanced"], "a": 1, "w": "Full binary tree'de yaprak sayısı = dahili düğüm + 1."}, {"d": 4, "q": "Full binary tree'de 7 dahili düğüm varsa kaç yaprak vardır?", "o": ["6", "7", "8", "14"], "a": 2, "w": "Yaprak = dahili düğüm + 1 = 8."}, {"d": 4, "q": "Tüm dahili düğümlerin 2 çocuğu olduğu ve tüm yaprakların aynı seviyede olduğu ağaç hangisidir?", "o": ["Degenerate", "Complete", "Perfect", "Homojen olmayan"], "a": 2, "w": "Perfect ağaç aynı zamanda full, complete ve balanced'tır."}, {"d": 4, "q": "Her ebeveynin tek çocuğu olduğu ikili ağaç türü hangisidir?", "o": ["Perfect", "Degenerate (pathological)", "Full", "Complete"], "a": 1, "w": "Bağlı listeye benzer, performans kötüdür."}, {"d": 4, "q": "Inorder dolaşmanın sırası nedir?", "o": ["kök–sol–sağ", "sol–kök–sağ", "sol–sağ–kök", "sağ–kök–sol"], "a": 1, "w": "Inorder: sol, kök, sağ."}, {"d": 4, "q": "Bir ağacın preorder'ı A, B, D, C, E, G, F, H, I ise kök hangisidir?", "o": ["I", "D", "A", "C"], "a": 2, "w": "Preorder'ın ilk elemanı köktür."}, {"d": 4, "q": "Ağacı silmek için genellikle hangi dolaşma kullanılır?", "o": ["Preorder", "Inorder", "Postorder", "Level order"], "a": 2, "w": "Çocuklar köke dokunmadan önce silinir: sol–sağ–kök."}, {"d": 5, "q": "BST'de inorder dolaşma ne verir?", "o": ["Rastgele sıra", "Küçükten büyüğe sıralı veri", "Büyükten küçüğe", "Sadece yaprakları"], "a": 1, "w": "Bu özellik Tree Sort'un temelidir."}, {"d": 5, "q": "BST'ye ekleme yaparken eklenecek değer düğüme eşitse ders kuralına göre nereye gidilir?", "o": ["Sola", "Sağa", "Eklenmez", "Köke"], "a": 1, "w": "Derste 'büyük veya eşitse sağa' kuralı kullanıldı."}, {"d": 5, "q": "[10, 12, 5, 4, 20, 8, 7, 15, 13] BST'sinde 13'ün ebeveyni hangisidir?", "o": ["12", "20", "15", "10"], "a": 2, "w": "13 → 10'dan büyük, 12'den büyük, 20'den küçük, 15'ten küçük: 15'in solu."}, {"d": 5, "q": "İki çocuklu bir düğüm BST'den silinirken yerine hangisi geçebilir?", "o": ["Kök", "Sağ alt ağacın minimumu veya sol alt ağacın maksimumu", "Herhangi bir yaprak", "Sol çocuğu her zaman"], "a": 1, "w": "Bu değerler BST özelliğini korur."}, {"d": 5, "q": "Sıralı veri (1, 2, 3, ...) normal BST'ye eklenirse ne olur?", "o": ["Ağaç perfect olur", "Ağaç dejenere olur, arama O(n)'e düşer", "Kök değişir", "Hiçbir şey"], "a": 1, "w": "Bu yüzden AVL gibi dengeli ağaçlar kullanılır."}, {"d": 5, "q": "AVL ağacında denge faktörü (BF) hangi değerleri alabilir?", "o": ["0 ve 1", "−1, 0, +1", "−2'den +2'ye", "Sadece 0"], "a": 1, "w": "±2 olursa döndürme gerekir."}, {"d": 5, "q": "Sol çocuğun sağ alt ağacı yüksekse (sol-sağ durumu) hangi döndürme yapılır?", "o": ["Tek sağa döndürme", "Tek sola döndürme", "Önce sol çocukta sola, sonra düğümde sağa (çift)", "Önce sağa sonra sola"], "a": 2, "w": "Left-Right durumu çift döndürme gerektirir."}, {"d": 5, "q": "1'den 7'ye kadar sayılar sırayla AVL ağacına eklenirse kök hangi değer olur?", "o": ["1", "4", "7", "3"], "a": 1, "w": "Dengeleme sonrası ortadaki değer kök olur."}];
const NOTES = "# Konu 1 — Bağlı listeler (Linked List)\n\n## Bağlı liste nedir?\n- Aynı kümeye ait veri parçalarının bellekte **sanal olarak** birbirine bağlanmasıyla oluşur.\n- Bileşenler: **düğüm (node)** = veri bloğu + **bağlantı işaretçisi (link/next)**.\n- **Head:** ilk elemanı gösterir. **Tail:** son elemanı gösterir (son düğümün next'i NULL).\n- Ekleme ve silme kolaydır: yalnızca linkler değiştirilir (dizideki gibi kaydırma yok).\n- Kullanım: dinamik bellek tahsisi, yığın ve kuyruk gerçekleştirme, hash tablolarında çarpışma (collision) çözümü, metin editörleri (her satır bir düğüm), tarayıcı listeleri, graf/yol temsili, veri akışı işleme.\n\n## Türler\n| Tür | Açıklama |\n|---|---|\n| **Tek yönlü (singly)** | Her düğüm yalnızca bir sonrakini gösterir. En yaygın tür. |\n| **Çift yönlü (doubly)** | Her düğüm hem öncekini (prev) hem sonrakini (next) gösterir; ileri-geri gezinme. |\n| **Çevrimsel (circular)** | Son düğüm ilk düğüme bağlanır; NULL yok, başlangıç/son yok. |\n| **Karma (hybrid)** | Farklı türlerin birleşimi. |\n\n## Temel işlemler\n1. **Boş liste:** head ve tail NULL.\n2. **Ekleme:** başa, sona veya sıralı (ortaya). Adımlar: yeni düğüm oluştur → bağlantıları ayarla → işaretçileri güncelle.\n3. **Silme:** düğümü bul → bağlantıyı kopar (öncekinin next'ini sonrakine yönlendir) → belleği iade et. Baştan, sondan, tümü veya istenen düğüm silinebilir.\n4. **Arama** ve 5. **Sıralama** (Merge/Quick Sort düğümleri yeniden bağlayarak verimli olabilir).\n\n## Çift yönlü bağlı liste\n- Her düğüm iki bağlantı içerir; **aradan ekleme/silme kolay**.\n- Kullanım: **undo/redo**, tarayıcı **geri/ileri** (current.prev / current.next), medya oynatıcı önceki/sonraki şarkı, **LRU cache** (hash table ile birlikte; ortadan O(1) silme), metin editörleri, navigasyon, bellek blokları, pencereler arası gezinme.\n- **Avantaj:** referansı bilinen ortadaki düğümü **O(1)**'de silebilir; ileri-geri gezinme. **Dezavantaj:** ekstra prev işaretçisi → daha fazla bellek; ekleme/silmede daha çok işaretçi güncellemesi.\n- Silme tek yönlüye göre daha verimlidir çünkü önceki düğüme doğrudan erişim vardır (tek yönlüde öncekini bulmak için baştan taramak gerekir).\n\n## Çevrimsel bağlı liste\n- Hiç NULL yok, her düğüm başlangıç ya da son olabilir; sona gelince otomatik başa dönülür.\n- Kullanım: işletim sisteminde süreçlere döngüsel erişim (round-robin), çok oyunculu oyunlarda sıra değişimi.\n\n---\n\n# Konu 2 — Yığın (Stack)\n\n## Kavram\n- **LIFO / FILO** (Last In First Out / First In Last Out). Bellek üzerinde kurulmuş mekanizma.\n- **Stack pointer (top):** ekleme yapılacak boş hücreyi / en üstü gösterir.\n- İşlemler: **push()** ekle, **pop()** en son ekleneni çıkar, **top()/peek()** en üsttekine bak, **count()** eleman sayısı, **isEmpty()** boş mu.\n\n## Kullanım alanları\n- Günlük hayat: şarjör, yemekhane tepsileri, el feneri pilleri.\n- Bilgisayar: **undo/redo**, web geri butonu, **fonksiyon çağrıları (call stack)** ve **özyineleme (recursion)**, bellek yönetimi, **geri izleme (backtracking)** (labirent, sudoku, satranç), derleyicide **parantez dengeleme** ve **infix→postfix/prefix** dönüşümü, **DFS** (derinlik öncelikli arama), thread'lerin kendi stack'i, kesme (interrupt) durumunun saklanması, JVM/.NET CLR gibi stack tabanlı sanal makineler, Assembly PUSH/POP.\n\n## Uygulamalar\n- **Parantez kontrolü:** açılan parantezi push et; kapanan gelince stack boşsa ya da tepedeki eşleşmiyorsa → dengesiz; eşleşirse pop. Sonda stack boşsa dengeli. `{[()]}` → True, `{([)]}` → False.\n- **Palindrom kontrolü:** karakterleri stack'e atıp ters sırayla çıkararak karşılaştır.\n\n## Matematiksel notasyonlar\n- **Infix:** operatör operandların arasında: `2 + 4 * 6`. Öncelik ve parantez gerekir: (2+4)*6 = 36, 2+(4*6) = 26. Derleyici için zordur → prefix/postfix'e çevrilir.\n- **Prefix (Polonya):** operatör önce: `+2*46 = 26`, `*+246 = 36`.\n- **Postfix (Ters Polonya):** önce operandlar sonra operatör: `246*+ = 26`, `24+6* = 36`.\n\n| Infix | Prefix | Postfix |\n|---|---|---|\n| A + B | +AB | AB+ |\n| A + B * C | +A*BC | ABC*+ |\n| (A + B) * C | *+ABC | AB+C* |\n| A + B * C + D | ++A*BCD | ABC*+D+ |\n| (A + B) * (C + D) | *+AB+CD | AB+CD+* |\n| A * B + C * D | +*AB*CD | AB*CD*+ |\n| A + B + C + D | +++ABCD | AB+C+D+ |\n| (X + Y) * ((A + B) / C) | *+XY/+ABC | XY+AB+C/* |\n\n- **Dikkat (slayt hatası):** Stack sunumunun son örneğinde prefix ve postfix etiketleri **ters** yazılmış. Doğrusu: prefix `*+XY/+ABC`, postfix `XY+AB+C/*`. Aynı sayfadaki `456*+` ifadesi de **postfix**'tir (prefix değil).\n- **Postfix hesaplama (stack ile):** soldan sağa oku; sayıysa push; operatörse iki kez pop, işlemi yap (ikinci çıkan **sol** operand), sonucu push. `456*+` → push 4, 5, 6 → `*`: 5*6=30 → `+`: 4+30 = **34**.\n- **Infix→postfix (stack ile):** operandları doğrudan çıktıya yaz; operatörü, tepedeki operatörün önceliği kendisininkinden büyük ya da eşitse onları çıktıya pop ettikten sonra push et; `(` push, `)` gelince `(`'e kadar pop et; sonda kalanları pop et. (Öncelik: `* /` > `+ -`.)\n- **Çalışma ödevi — Hanoi Kuleleri:** her hamlede tek disk; büyük disk küçüğün üstüne konamaz; en üstteki disk alınır. (n disk için en az 2ⁿ − 1 hamle.)\n\n---\n\n# Konu 3 — Kuyruk (Queue)\n\n## Kavram\n- **FIFO / LILO** (First In First Out). Veri **arkadan (rear)** girer, **önden (front)** çıkar.\n- İşlemler: **enqueue()** ekle, **dequeue()** çıkar, **peek()** ilk elemanı gör, **clear()** temizle, **count()** say.\n- Kullanım: işletim sisteminde **CPU zamanlayıcı (Round-Robin)**, I/O ve yazıcı kuyruğu, ağ paketleri (router/switch), **mesaj kuyrukları (RabbitMQ, Kafka)**, **BFS** (genişlik öncelikli arama), banka/çağrı merkezi simülasyonu, asenkron görevler, **üretici–tüketici** problemi.\n\n## Tasarım yaklaşımları\n1. **Dizi üzerinde kaydırmalı:** tek indis; her dequeue'dan sonra tüm elemanlar sola kaydırılır → basit ama **maliyetli**.\n2. **Dizi üzerinde çevrimsel (dairesel / halka bellek):** **iki indis (front, rear)**; dizinin son elemanından sonra ilk elemana dönülür; **kaydırma yok**, bellek verimli.\n3. **Bağlı liste ile:** dinamik bellek yönetimi.\n\n## Öncelikli kuyruk (Priority Queue)\n- İşletim sistemindeki süreçlerin önceliği varsa kullanılır. Öncelik yoksa FIFO; öncelik varsa FIFO olmaksızın öncelik sırasına göre yerleştirilir (önceliksiz → sona, öncelikli → önceliğine göre yerine).\n- Genellikle **bağlı liste** ile gerçekleştirilir.\n\n## Stack vs Queue\n| | Stack | Queue |\n|---|---|---|\n| Mantık | LIFO | FIFO |\n| Ekleme/çıkarma | Aynı uçtan (top) | Ekleme rear, çıkarma front |\n| Arama algoritması | DFS | BFS |\n| Örnek | Undo, call stack | Yazıcı kuyruğu, CPU zamanlama |\n\n---\n\n# Konu 4 — Ağaçlar ve ikili ağaçlar\n\n## Ağaç (Tree)\n- Verilerin bellekte **hiyerarşik**, ağaç görünümlü sanal bağlanması.\n- Kullanım: dosya sistemleri (klasör yapısı), veritabanı dizinleme (**B-Tree / B+Tree**, MySQL), Dijkstra/Prim/Kruskal (spanning tree), derleyicilerde **soyut sözdizim ağacı (AST)**, **Huffman** sıkıştırma (ZIP, JPEG, MP3), **karar ağaçları** (makine öğrenmesi), oyun ağaçları (satranç, Go).\n- **Avantaj:** dengeli ağaçta arama **O(log₂N)** (n=1000 için bağlı listede ~1000, ağaçta <10 işlem); özyinelemeli tasarım kolay. **Dezavantaj:** daha fazla bellek, çok işaretçi ve değişken.\n\n## Temel kavramlar\n- **Kök (root):** en tepedeki tek düğüm; önce kök oluşturulur. **Yaprak (leaf, terminal/harici):** çocuğu olmayan düğüm.\n- **Kenar (edge):** düğümler arası bağlantı. **Yol (path):** bağlantı dizisi.\n- **Çocuk (child), ebeveyn (parent; kök hariç her düğümün bir ebeveyni var), kardeş (sibling; aynı ebeveyn).**\n- **Torun (descendant):** bir düğümden yaprağa kadar yoldaki düğümler (en yakını child). **Ata (ancestor):** bir düğümden köke kadar yoldaki düğümler (en yakını parent).\n- **Dahili düğüm:** en az bir çocuğu olan düğüm. **Derece (degree):** çocuk/alt ağaç sayısı (yaprakta 0). Tüm düğümlerin derecesi eşitse **homojen ağaç**.\n- **Seviye (level):** kök ile düğüm arasındaki kenar sayısı **+ 1** (kök = 1). **Derinlik (depth):** kök ile düğüm arasındaki kenar sayısı (kök = 0). **Yükseklik (height):** düğümden yaprağa en uzun yoldaki kenar sayısı; kökün yüksekliği = ağacın yüksekliği.\n- **Alt ağaç (subtree):** bir düğüm ve torunları. **Orman (forest):** ağaçlar kümesi.\n- Gösterim: bağlı liste (esnek), dizi (hızlı erişim), işaretçi tabanlı (parent + child işaretçileri).\n- **Soru-cevap örneği:** A kökü; A'nın çocukları B, C; B'nin çocukları D, E, F; E'nin çocuğu G; G'nin çocukları H, I → düğüm sayısı 9, yapraklar C, D, F, H, I; H'nin ataları G, E, B, A; B'nin torunları E, G, H, I (slayta göre; D ve F de B'nin torunudur); E'nin kardeşleri D, F; seviye sayısı 5; yükseklik 4.\n\n## İkili ağaç (Binary Tree)\n- Her düğüm **en fazla 2** çocuk (sol ve sağ). Bilgisayar biliminde en yaygın veri yapısı.\n- **Full (tam/dolu):** her düğümün 0 ya da 2 çocuğu var. Her zaman: **yaprak sayısı = dahili düğüm sayısı + 1**.\n- **Complete (eksiksiz):** son seviye hariç tüm seviyeler dolu, son seviye düğümleri soldan sağa (sola yaslı).\n- **Balanced (dengeli):** her düğümün alt ağaçları arasındaki yükseklik farkı en fazla 1.\n- **Degenerate / pathological (dejenere):** her ebeveynin tek çocuğu var (bağlı listeye benzer).\n- **Perfect (mükemmel):** tüm dahili düğümlerin 2 çocuğu var ve tüm yapraklar aynı seviyede. Perfect ağaç aynı zamanda full, complete ve balanced'tır.\n\n## Dolaşma (traversal)\n| Yöntem | Sıra | Not |\n|---|---|---|\n| **Preorder** | kök – sol – sağ | ağacı kopyalamak için ideal |\n| **Inorder** | sol – kök – sağ | BST'de küçükten büyüğe sıralı verir |\n| **Postorder** | sol – sağ – kök | ağacı silmek için kullanılır |\n- Ders örneği (1 kök; 2, 3 çocukları; 2'nin solu 4; 3'ün çocukları 5, 6; 5'in çocukları 7, 8): preorder 1,2,4,3,5,7,8,6 · inorder 4,2,1,7,5,8,3,6 · postorder 4,2,7,8,5,6,3,1.\n- Soru 3 (A; B, C; B'nin solu D; C'nin çocukları E, F; E'nin sağı G; F'nin çocukları H, I): preorder A,B,D,C,E,G,F,H,I · inorder D,B,A,E,G,C,H,F,I · postorder D,B,G,E,H,I,F,C,A.\n- İpucu: preorder'ın ilk elemanı ve postorder'ın son elemanı her zaman **kök**tür.\n\n---\n\n# Konu 5 — İkili arama ağacı (BST) ve AVL\n\n## BST\n- Parent ile child arasında **büyüklük-küçüklük** ilişkisi vardır (sıradan ikili ağaçta yoktur). Her düğüm için: **sol alt ağaçtaki tüm değerler < düğüm ≤ sağ alt ağaçtaki değerler** (derste eşitler sağa).\n- Her alt ağaç yine BST'dir (özyinelemeli). **Inorder dolaşma küçükten büyüğe sıralı veri verir** → **Tree Sort**.\n- Kullanım: arama yoğun uygulamalar, veritabanı indeksleme (dengeli türevleri AVL, Red-Black, B/B+ Tree), telefon rehberi, sözlük, derleyici sembol tablosu, **aralık sorguları** (\"10 ile 30 arasındakiler\").\n- Arama ortalama **O(log n)**; sıralı veri eklenirse ağaç **dejenere** olur ve O(n)'e düşer → bu yüzden dengeli ağaçlar geliştirildi.\n\n## BST ekleme\n- İlk eleman kök olur. Sonraki her değer kökten başlayarak karşılaştırılır: **küçükse sola, büyük veya eşitse sağa**; boş yer bulununca yerleşir.\n- Soru 5: [10, 12, 5, 4, 20, 8, 7, 15, 13] → kök 10; sol 5 (sol 4, sağ 8 → 8'in solu 7); sağ 12 (sağ 20 → 20'nin solu 15 → 15'in solu 13).\n\n## BST silme (3 durum)\n1. **Yaprak:** doğrudan sil, parent'ın işaretçisi NULL.\n2. **Tek çocuklu:** parent'ın işaretçisini silinen düğümün çocuğuna yönlendir; alt ağaç parent'a bağlanır (sol/sağ fark etmez).\n3. **İki çocuklu:** **sağ alt ağacın minimumu (inorder successor)** ya da **sol alt ağacın maksimumu (inorder predecessor)** bulunur, değeri silinecek düğüme kopyalanır, sonra o düğüm durum 1 veya 2 ile silinir.\n\n## AVL ağacı (Adelson-Velsky ve Landis)\n- Kendi kendini dengeleyen BST. Her düğümde **denge (balans) faktörü BF = h_sol − h_sağ ∈ {−1, 0, +1}**.\n- BF **+2 / −2** olursa ağaç dengesizdir → **döndürme (rotasyon)**. Döndürme **O(1)** (yalnızca işaretçi değişikliği). Arama/ekleme/silme her durumda **O(log n)**.\n- **4 durum:**\n  - **Sağ-sağ (RR) → sola döndürme:** BF = −2, sağ çocuk yukarı çıkar, eski kök onun sol çocuğu olur.\n  - **Sol-sol (LL) → sağa döndürme:** BF = +2, sol çocuk yeni kök olur; yeni kökün sağ alt ağacı varsa eski köke sol çocuk olarak bağlanır (azalan sırada eklemede sık).\n  - **Sol-sağ (LR) → önce sol çocukta sola, sonra düğümde sağa döndürme** (çift döndürme).\n  - **Sağ-sol (RL) → önce sağ çocukta sağa, sonra düğümde sola döndürme** (LR'nin ayna görüntüsü).\n- Örnek [1..7] sırayla: normal BST bağlı listeye dönerdi; AVL'de kök **4**, yükseklik 3 (ders slaytı; kenar sayısıyla 2), 7 düğüm.\n- Soru 6: 3, 2, 1 → 1 eklenince 3'te denge bozulur, tek döndürme → kök 2. 4 eklenir. 5 → 3'te dengesizlik, tek döndürme. 6 → 2'de (kök) dengesizlik, tek döndürme → kök **4** (sol 2: 1, 3; sağ 5: 6).\n- Soru 7 (devam: 7, 16, 15, 14, 13, 12, 11, 10, 8, 9): 7 → 5'te dengesizlik, tek döndürme; 16 sorunsuz; 15 → 7'de dengesizlik, **tek döndürme yetmez → ikili (çift) döndürme**; 14 → ikili döndürme; 13 → tek döndürme (kök **7** olur); 12, 11, 10 → tek döndürmeler; 8 ve 9 eklenince yine döndürme.\n";

/* ---------- notes (mini markdown) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

/* ---------- flashcards (Leitner) ---------- */
let cardFilter=store.get('pz_filter',0), session=[], sIdx=0, flipped=false;
const cs=()=>store.get('pz_cards',{});
function cardState(id){return cs()[id]||{box:1,due:0}}
function dueList(f){const s=cs(),now=Date.now();return CARDS.map((c,i)=>({...c,id:i})).filter(c=>(!f||c.d===f)&&((s[c.id]||{due:0}).due<=now))}
function renderCards(){
  const el=$('#p-cards');
  let h=`<div class="row" style="margin-bottom:14px">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${cardFilter===f}" data-f="${f}">${f?U+' '+f:'Hepsi'} (${dueList(f).length})</button>`).join('')+`</div><div id="sess"></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cardFilter=+b.dataset.f;store.set('pz_filter',cardFilter);session=[];renderCards()});
  if(!session.length||sIdx>=session.length){session=shuffle(dueList(cardFilter));sIdx=0}
  drawCard();
}
function drawCard(){
  const box=$('#sess');if(!box)return;
  if(!session.length){box.innerHTML=`<div class="card" style="text-align:center"><b>Bekleyen kart yok 🎉</b><p class="mute">Bu filtre için bugün çalışılacak kart kalmadı. Yarın tekrar gel ya da başka bir ${U.toLowerCase()} seç.</p><button class="btn alt" id="all">Yine de hepsini karıştır</button></div>`;
    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>!cardFilter||c.d===cardFilter));sIdx=0;drawCard()};return}
  const c=session[sIdx];flipped=false;
  box.innerHTML=`<div class="mute" style="margin-bottom:6px">${sIdx+1} / ${session.length} · Kutu ${cardState(c.id).box}</div><div class="bar" style="margin-bottom:12px"><i style="width:${sIdx/session.length*100}%"></i></div>
  <div class="card flash" id="fl" tabindex="0"><div class="tag">${esc(DERS[c.d])} · ${esc(c.t)}</div><div class="q">${esc(c.f)}</div><div class="a" id="ans" hidden>${esc(c.b)}</div><div class="mute" id="hint" style="margin-top:12px">Cevabı düşün, sonra çevirmek için dokun (Boşluk)</div></div>
  <div class="row" id="grade" hidden><button class="btn bad" data-g="0">Bilemedim</button><button class="btn alt" data-g="1">Zor</button><button class="btn ok" data-g="2">Bildim</button></div>`;
  const flip=()=>{if(flipped)return;flipped=true;$('#ans').hidden=false;$('#hint').hidden=true;$('#grade').hidden=false};
  $('#fl').onclick=flip;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(c,+b.dataset.g));
  window._flip=flip;
}
function grade(c,g){
  const s=cs(),st=s[c.id]||{box:1,due:0};
  if(g===0)st.box=1;else if(g===2)st.box=Math.min(5,st.box+1);
  st.due=Date.now()+(g===0?0:INTERVALS[st.box]*DAY);
  s[c.id]=st;store.set('pz_cards',s);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(g===0)session.push(c);
  sIdx++;
  if(sIdx>=session.length){session=[];renderCards()}else drawCard();
}
document.addEventListener('keydown',e=>{
  if($('#p-cards').classList.contains('on')&&$('#fl')){
    if(e.code==='Space'){e.preventDefault();window._flip&&window._flip()}
    else if(flipped&&['Digit1','Digit2','Digit3'].includes(e.code))$('#grade').querySelectorAll('[data-g]')[+e.code.slice(-1)-1].click();
  }
});

/* ---------- quiz ---------- */
let qz=null;
function renderQuizHome(){
  const wrong=store.get('pz_wrong',[]),best=store.get('pz_best',{});
  $('#p-quiz').innerHTML=`<div class="card"><b>Test oluştur</b><div class="row" style="margin:12px 0" id="qd">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${(qz&&qz.f||0)===f}" data-f="${f}">${f?U+' '+f:'Karışık'}</button>`).join('')+`</div>
  <div class="row"><button class="btn" id="go10">10 soru</button><button class="btn alt" id="go20">20 soru</button><button class="btn alt" id="goall">Hepsi</button><button class="btn alt" id="gow" ${wrong.length?'':'disabled'}>Yanlışlarım (${wrong.length})</button></div>
  <p class="mute" style="margin:12px 0 0">Şıklar her seferinde karışır. Yanlış yaptıkların "Yanlışlarım"a eklenir, doğru yapınca çıkar.</p></div>
  <div class="card mute">En iyi skorlar: ${[0,...NS].map(f=>`${f?U+' '+f:'Karışık'}:${best[f]!=null?best[f]+'%':'—'}`).join(' · ')}</div>`;
  let f=0;
  $('#qd').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=+b.dataset.f;$('#qd').querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const start=n=>startQuiz(f,n);
  $('#go10').onclick=()=>start(10);$('#go20').onclick=()=>start(20);$('#goall').onclick=()=>start(999);
  $('#gow').onclick=()=>startQuiz(0,999,true);
}
function startQuiz(f,n,wrongOnly){
  const W=store.get('pz_wrong',[]);
  let pool=QUIZ.map((q,i)=>({...q,id:i})).filter(q=>wrongOnly?W.includes(q.id):(!f||q.d===f));
  pool=shuffle(pool).slice(0,n);
  qz={f,items:pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,order:idx,ans:idx.indexOf(q.a)}}),i:0,score:0,done:false,wrongOnly};
  drawQ();
}
function drawQ(){
  const el=$('#p-quiz');
  if(qz.i>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100);
    if(!qz.wrongOnly){const b=store.get('pz_best',{});if(b[qz.f]==null||pct>b[qz.f]){b[qz.f]=pct;store.set('pz_best',b)}}
    el.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Sonuç</div><div style="font:700 48px Georgia,serif">${qz.score}/${qz.items.length}</div><p class="mute">%${pct} · ${pct>=85?'Güçlü — tekrar aralığını uzatabilirsin.':pct>=60?'İyi gidiyor — yanlışların kartlarını çalış.':'Notlara dön, ilgili kartları çalış, sonra tekrar dene.'}</p><button class="btn" id="again">Yeni test</button></div>`;
    $('#again').onclick=()=>{qz=null;renderQuizHome()};return;
  }
  const q=qz.items[qz.i];
  el.innerHTML=`<div class="mute" style="margin-bottom:6px">${qz.i+1} / ${qz.items.length} · ${esc(DERS[q.d])}</div><div class="bar" style="margin-bottom:12px"><i style="width:${qz.i/qz.items.length*100}%"></i></div>
  <div class="card"><div style="font:600 18px/1.45 Georgia,serif;margin-bottom:8px">${esc(q.q)}</div><div id="opts">${q.order.map((oi,k)=>`<button class="opt" data-k="${k}">${esc(q.o[oi])}</button>`).join('')}</div><div id="fb" hidden></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    el.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)qz.score++;
    const W=store.get('pz_wrong',[]),has=W.includes(q.id);
    if(!ok&&!has)W.push(q.id);if(ok&&has)W.splice(W.indexOf(q.id),1);store.set('pz_wrong',W);
    const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<p style="margin:12px 0 4px"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':'Yanlış'}</b> — ${esc(q.w)}</p><button class="btn" id="nx">${qz.i+1>=qz.items.length?'Sonucu gör':'Sonraki'}</button>`;
    $('#nx').onclick=()=>{qz.i++;drawQ()};$('#nx').focus();
  });
}

/* ---------- practice (procedural generators) ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmt=x=>String(Math.round(x*1000)/1000).replace('.',','), N=x=>x.toLocaleString('tr-TR');
const sum=a=>a.reduce((s,x)=>s+x,0);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mcq=o=>{const s=shuf(o.map((t,i)=>[t,i]));return{opts:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===0)}}; // doğru şık o[0]
const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);if(t.l.op&&PR[t.l.op]<PR[t.op])a=`(${a})`;if(t.r.op&&PR[t.r.op]<=PR[t.op])b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const tbl=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

const GEN={
  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder (kök–sol–sağ)',T.pre],['inorder (sol–kök–sağ)',T.ino],['postorder (sol–sağ–kök)',T.post],['level order (seviye seviye)',T.lvl]]),a=fn(t);
    return{q:`Aşağıdaki ikili ağacın <b>${nm}</b> dolaşma sırasını yaz.`+T.svg(t),type:'txt',a:a.join(''),show:a.join(', '),sol:`Sıra: <b>${a.join(', ')}</b>`}}},
  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(7,9));let t=null;v.forEach(x=>t=T.ins(t,x));
    const ns=T.nodes(t),k=R(0,4),lead=`Boş bir ikili arama ağacına sırasıyla <b>${v.join(', ')}</b> ekleniyor. `;let q,a,type='num';
    if(k===0){a=T.pre(t);q='Ağacın <b>preorder</b> dolaşımını yaz.';type='txt'}
    else if(k===1){a=T.post(t);q='Ağacın <b>postorder</b> dolaşımını yaz.';type='txt'}
    else if(k===2){const c=pick(ns.filter(x=>x.p));a=c.p.v;q=`<b>${c.n.v}</b> düğümünün ebeveyni hangisidir?`}
    else if(k===3){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> vardır?'}
    else{a=Math.max(...ns.map(x=>x.d));q='En derin düğümün <b>derinliği</b> kaçtır? (kök = 0)'}
    const arr=Array.isArray(a);return{q:lead+q,type,a:arr?a.join(''):a,show:arr?a.join(', '):a,sol:'Kural: küçükse sola, büyük veya eşitse sağa. Oluşan ağaç:'+T.svg(t)+(arr?`Cevap: <b>${a.join(', ')}</b>`:'')}}},
  treeprops:{label:'Ağaç terimleri',f(){const t=T.rand(R(7,10)),ns=T.nodes(t),c=pick(ns),k=R(0,4);let q,a;
    if(k===0){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> düğüm vardır?'}
    else if(k===1){a=c.d;q=`<b>${c.n.v}</b> düğümünün <b>derinliği</b> kaçtır? (kökten kenar sayısı, kök = 0)`}
    else if(k===2){a=c.d+1;q=`<b>${c.n.v}</b> düğümünün <b>seviyesi</b> kaçtır? (kök = 1)`}
    else if(k===3){a=(c.n.l?1:0)+(c.n.r?1:0);q=`<b>${c.n.v}</b> düğümünün <b>derecesi</b> (çocuk sayısı) kaçtır?`}
    else{a=ns.filter(x=>x.n.l||x.n.r).length;q='Ağaçta kaç <b>dahili</b> (yaprak olmayan) düğüm vardır?'}
    return{q:q+T.svg(t),type:'num',a,sol:`Cevap: <b>${a}</b>. Derinlik = kökten kenar sayısı, seviye = derinlik + 1, derece = çocuk sayısı, yaprak = çocuğu olmayan düğüm.`}}},
  postfix:{label:'Infix → postfix/prefix',f(){let i=0;const t=exprT(R(3,5),()=>'ABCDEFG'[i++],Object.keys(PR)),pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');
    return{q:`<b>${inf(t)}</b> ifadesinin <b>${pre?'prefix':'postfix'}</b> karşılığını yaz.`,type:'txt',a,show:a,sol:`${pre?'Prefix':'Postfix'}: <b>${a}</b>. En son yapılan işlem (${t.op}) ${pre?'en başa':'en sona'} yazılır; parantez içleri önce kendi ${pre?'prefix':'postfix'} haline getirilir.`}}},
  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);
    const tk=pst(t),st=[],steps=[];tk.forEach(x=>{if(typeof x==='number')st.push(x);else{const b=st.pop(),a=st.pop(),r=ev({op:x,l:{v:a},r:{v:b}});st.push(r);steps.push(`${a} ${x} ${b} = ${r} → yığın: [${st.join(', ')}]`)}});
    return{q:`<b>${tk.join(' ')}</b> postfix ifadesinin değeri kaçtır?`,type:'num',a:v,sol:'Sayıları yığına at; operatör gelince iki eleman çıkar (ikinci çıkan soldadır), sonucu geri at:<br>'+steps.join('<br>')}}},
  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;
    for(let i=0,n=R(6,9);i<n;i++){if(ds.length&&Math.random()<.35){last=S?ds.pop():ds.shift();ops.push(S?'pop()':'dequeue()')}else{const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}}
    if(!ds.length){const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}
    const k=last!=null?R(0,2):R(0,1),q=[S?'Tepede (top) hangi eleman vardır?':'Önde (front) hangi eleman vardır?','Yapıda kaç eleman kalmıştır?',`Son ${S?'pop':'dequeue'} işlemi hangi elemanı çıkarmıştır?`][k];
    return{q:`Boş bir ${S?'yığına (stack)':'kuyruğa (queue)'} sırasıyla şu işlemler uygulanıyor:<div class="raw">${ops.join(', ')}</div>${q}`,type:'num',a:[S?ds[ds.length-1]:ds[0],ds.length,last][k],sol:`Son durum (${S?'alttan tepeye':'önden arkaya'}): [${ds.join(', ')}]. ${S?'LIFO: son giren ilk çıkar.':'FIFO: ilk giren ilk çıkar.'}`}}},
  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,3);
    if(k===0){const v=R(20,200)*1000,s=Math.round(v*R(5,40)/1000),a=s/v*100;return{q:`Bir e-ticaret sitesi ayda <b>${N(v)}</b> ziyaret ve <b>${N(s)}</b> sipariş alıyor. <b>Dönüşüm oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Dönüşüm = sipariş / ziyaret × 100 = ${N(s)} / ${N(v)} × 100 = %${fmt(a)}`}}
    if(k===1){const o=R(5,50)*100,a=R(15,120)*10;return{q:`Aylık gelir <b>${N(o*a)} TL</b>, sipariş sayısı <b>${N(o)}</b>. <b>Ortalama sipariş değeri (AOV)</b> kaç TL'dir?`,type:'num',a,sol:`AOV = gelir / sipariş = ${N(o*a)} / ${N(o)} = ${N(a)} TL`}}

  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);

  gsyih:{label:'GSYİH/GSMH · faktörler',f(){
    if(Math.random()<.55){const [s,a]=pick([["Bir Türk firmasının Denizli'deki fabrikasının üretimi",2],["Bir Alman otomotiv firmasının Bursa'daki fabrikasının üretimi",0],["Bir Türk müteahhitlik firmasının Katar'daki projesi",1],["Bir Japon elektronik firmasının Manisa'daki tesisinin üretimi",0],["Bir Türk tekstil firmasının Mısır'daki fabrikasının üretimi",1],["İstanbul'da çalışan Türk yazılımcının ürettiği hizmet",2],["Bir Türk inşaat firmasının Türkmenistan'daki köprü projesi",1],["Bir Koreli firmanın Kocaeli'deki fabrikasının üretimi",0]]);

    return{q:`Üretim faktörleri açısından: <b>${s}</b> hangi faktörün karşılığıdır?`,type:'mc',opts:['Rant (doğal kaynak)','Ücret (emek)','Faiz (sermaye)','Kâr (girişimcilik)'],a,sol:'Doğal kaynak → rant, emek → ücret, sermaye → faiz, girişimcilik → kâr.'}}},
  freq:{label:'Frekans tablosu',f(){const n=R(15,20),d=[...Array(n)].map(()=>R(0,5)),cnt=[0,1,2,3,4,5].map(v=>d.filter(x=>x===v).length),v=R(0,4),k=R(0,2);
    let c=0;const ft=tbl(['x','frekans','pay','yüzde','küm. yüzde'],cnt.map((f,x)=>{c+=f;return[x,f,fmt(f/n),'%'+fmt(f/n*100),'%'+fmt(c/n*100)]}));
    const kum=sum(cnt.slice(0,v+1)),a=[cnt[v]/n,kum/n*100,cnt[v]/n*100][k];
    const q=[`x = <b>${v}</b> olanların <b>payı (nispi frekans)</b> kaçtır? (ondalıklı yaz)`,`x ≤ <b>${v}</b> için <b>kümülatif yüzde</b> kaçtır?`,`x = <b>${v}</b> için <b>yüzde</b> kaçtır?`][k];
    const s=[`pay = ${cnt[v]} / ${n} = ${fmt(a)}`,`kümülatif frekans = ${cnt.slice(0,v+1).join(' + ')} = ${kum} → ${kum} / ${n} × 100 = %${fmt(a)}`,`${cnt[v]} / ${n} × 100 = %${fmt(a)}`][k];
    return{q:`${n} öğrencinin alttan aldığı ders sayısı:<div class="raw">${d.join(', ')}</div>${q}`,type:'num',a,sol:s+ft}}},
  central:{label:'Ortalama · medyan · mod',f(){let d,mode;do{d=[...Array(R(7,12))].map(()=>R(1,15));const c={};d.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c)),m=Object.keys(c).filter(k=>c[k]===mx);mode=m.length===1&&mx>1?+m[0]:null}while(mode==null);
    const s=[...d].sort((a,b)=>a-b),n=d.length,med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,mean=sum(d)/n;
    return{q:`Veri: <div class="raw">${d.join(', ')}</div>Bu verinin <b>aritmetik ortalamasını, medyanını ve modunu</b> bul.`,type:'multi',fields:[['Ortalama',mean],['Medyan',med],['Mod',mode]],sol:`Sıralı: ${s.join(', ')} (N = ${n}).<br>Ortalama = ${sum(d)} / ${n} = ${fmt(mean)} · Medyan konumu = (N + 1) / 2 = ${fmt((n+1)/2)} → Medyan = ${fmt(med)}${n%2?'':' (ortadaki iki değerin ortalaması)'} · Mod = ${mode} (en sık tekrar eden)`}}},
  weighted:{label:'Ağırlıklı ortalama',f(){const k=R(0,4),wm=(x,w)=>sum(x.map((v,i)=>v*w[i]))/sum(w),
      ws=(x,w)=>`x̄ = Σ(w·x) / Σw = (${x.map((v,i)=>`${N(v)} × ${N(w[i])}`).join(' + ')}) / (${w.map(N).join(' + ')}) = ${fmt(sum(x.map((v,i)=>v*w[i])))} / ${N(sum(w))} = <b>${fmt(wm(x,w))}</b>`;
    if(k===0){const w=pick([30,40,50]),v=R(20,100),f=R(20,100),a=v*w/100+f*(100-w)/100;
      return{q:`Vize %${w}, final %${100-w} ağırlıklı. Vizeden <b>${v}</b>, finalden <b>${f}</b> alan öğrencinin ağırlıklı ortalaması kaçtır?`,type:'num',a,sol:`${v} × ${fmt(w/100)} + ${f} × ${fmt(1-w/100)} = ${fmt(v*w/100)} + ${fmt(f*(100-w)/100)} = ${fmt(a)}<br>Ağırlıkların toplamı ${fmt(w/100)} + ${fmt(1-w/100)} = 1 olduğu için ayrıca bölmeye gerek yok. (Basit ortalama ${fmt((v+f)/2)} olurdu.)`}}
    if(k===1){const ds=shuf(['Matematik','İstatistik','Muhasebe','İktisat','Hukuk','Pazarlama','İşletme']).slice(0,R(3,5)),w=ds.map(()=>pick([2,3,4,5,6])),x=ds.map(()=>pick([1,1.5,2,2.5,3,3.5,4]));
      return{q:`Bir öğrencinin dönem dersleri:`+tbl(['Ders','Kredi','Not (4\'lük)'],ds.map((d,i)=>[d,w[i],N(x[i])]))+`Kredi ağırlıklı <b>not ortalaması</b> kaçtır?`,type:'num',a:wm(x,w),sol:ws(x,w)+`<br>Ağırlıkların (kredilerin) toplamı ${sum(w)}, 1 değil → çarpımlar toplamı Σw = ${sum(w)} ile bölünür. Basit ortalama ${fmt(sum(x)/x.length)} olurdu.`}}
    if(k===2){const g=['A','B','C'].slice(0,R(2,3)),w=g.map(()=>R(15,45)),x=g.map(()=>R(45,85));
      return{q:`${g.map((s,i)=>`<b>${s}</b> şubesi: ${w[i]} öğrenci, ortalama <b>${x[i]}</b>`).join('<br>')}<br>Şubeler birleştirilirse <b>tüm öğrencilerin ortalaması</b> kaçtır?`,type:'num',a:wm(x,w),sol:ws(x,w)+`<br>Ağırlık = öğrenci sayısı (Σw = ${sum(w)}). Şube ortalamalarının basit ortalaması (${fmt(sum(x)/g.length)}) yanlış olur, çünkü şubeler eşit büyüklükte değil.`}}
    if(k===3){const x=[...Array(R(3,4))].map(()=>R(4,24)*5),w=x.map(()=>R(5,40));
      return{q:`Bir mağaza aynı ürünü farklı fiyatlardan sattı:`+tbl(['Fiyat (TL)','Satılan adet'],x.map((v,i)=>[v,w[i]]))+`<b>Adet ağırlıklı ortalama satış fiyatı</b> kaçtır?`,type:'num',a:wm(x,w),sol:ws(x,w)+`<br>Ağırlık = satış adedi (Σw = ${sum(w)} adet). Fiyatların basit ortalaması ${fmt(sum(x)/x.length)} olurdu.`}}
    const nm=['1. kısa sınav','2. kısa sınav','Ödev','Vize','Final'],w=pick([[1,1,1,2,3],[1,1,2,3,5],[1,1,1,3,4],[2,2,1,4,6]]),x=nm.map(()=>R(30,100));
    return{q:`Bir derste notlar katsayılarla hesaplanıyor:`+tbl(['Değerlendirme','Katsayı','Not'],nm.map((s,i)=>[s,w[i],x[i]]))+`Öğrencinin <b>ağırlıklı ortalaması</b> kaçtır?`,type:'num',a:wm(x,w),sol:ws(x,w)+`<br>Katsayıların toplamı ${sum(w)}, 1 değil → Σw'ye bölünür.`}}},
  spread:{label:'Ranj · OMS · varyans · s.sapma',f(){let d,n;do{n=R(4,6);d=[...Array(n)].map(()=>R(1,20))}while(sum(d)%n);
    const mu=sum(d)/n,dv=d.map(x=>x-mu),ss=sum(dv.map(x=>x*x));
    return{q:`Veri (ana kütle): <div class="raw">${d.join(', ')}</div><b>Ranj, ortalama mutlak sapma (OMS), varyans ve standart sapmayı</b> bul.`,type:'multi',fields:[['Ranj',Math.max(...d)-Math.min(...d)],['OMS',sum(dv.map(Math.abs))/n],['Varyans (σ²)',ss/n],['Standart sapma (σ)',Math.sqrt(ss/n)]],
      sol:`μ = ${sum(d)} / ${n} = ${fmt(mu)}`+tbl(['X','d = X − μ','|d|','d²'],d.map((x,i)=>[x,fmt(dv[i]),fmt(Math.abs(dv[i])),fmt(dv[i]**2)]).concat([['Σ','0',fmt(sum(dv.map(Math.abs))),fmt(ss)]]))+`Ranj = ${Math.max(...d)} − ${Math.min(...d)} = ${Math.max(...d)-Math.min(...d)} · OMS = ${fmt(sum(dv.map(Math.abs)))} / ${n} = ${fmt(sum(dv.map(Math.abs))/n)} · Varyans = ${fmt(ss)} / ${n} = ${fmt(ss/n)} · σ = √${fmt(ss/n)} = ${fmt(Math.sqrt(ss/n))}`}}},
  zscore:{label:'z skoru',f(){const mu=R(40,70),sd=R(5,15),k=R(0,6),Z=()=>pick([-2,-1.5,-1,-.5,.5,1,1.5,2,2.5]);
    if(k===0){const x=R(mu-2*sd,mu+2*sd),z=(x-mu)/sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. <b>${x}</b> alan öğrencinin <b>z skoru</b> kaçtır?`,type:'num',a:z,sol:`z = (X − μ) / σ = (${x} − ${mu}) / ${sd} = ${fmt(z)} → ${z>0?'ortalamanın üstünde':z<0?'ortalamanın altında':'tam ortalamada'}.`}}
    if(k===1){const z=Z(),x=mu+z*sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. z skoru <b>${fmt(z)}</b> olan öğrencinin <b>ham puanı</b> kaçtır?`,type:'num',a:x,sol:`X = μ + z·σ = ${mu} + (${fmt(z)}) × ${sd} = ${fmt(x)}`}}
    if(k===2){const z=Z(),x=mu+z*sd;return{q:`Bir sınavın ortalaması <b>${mu}</b>. <b>${fmt(x)}</b> alan öğrencinin z skoru <b>${fmt(z)}</b>. Sınavın <b>standart sapması</b> kaçtır?`,type:'num',a:sd,sol:`z = (X − μ) / σ → σ = (X − μ) / z = (${fmt(x)} − ${mu}) / ${fmt(z)} = ${fmt(x-mu)} / ${fmt(z)} = ${sd}`}}
    if(k===3){const z=Z(),x=mu+z*sd;return{q:`Standart sapması <b>${sd}</b> olan bir sınavda <b>${fmt(x)}</b> alan öğrencinin z skoru <b>${fmt(z)}</b>. Sınavın <b>ortalaması</b> kaçtır?`,type:'num',a:mu,sol:`μ = X − z·σ = ${fmt(x)} − (${fmt(z)}) × ${sd} = ${fmt(x)} − (${fmt(z*sd)}) = ${mu}`}}
    if(k===4){const z=Z(),x=mu+z*sd,m2=R(10,20)*5,s2=pick([5,8,10,12,15,20]),a=m2+z*s2;
      return{q:`Ali A sınavından <b>${fmt(x)}</b> aldı (μ = ${mu}, σ = ${sd}). B sınavında (μ = <b>${m2}</b>, σ = <b>${s2}</b>) <b>aynı göreli başarıyı</b> göstermesi için kaç puan alması gerekir?`,type:'num',a,sol:`Aynı göreli başarı = aynı z skoru. z = (${fmt(x)} − ${mu}) / ${sd} = ${fmt(z)} → X_B = μ_B + z·σ_B = ${m2} + (${fmt(z)}) × ${s2} = ${fmt(a)}`}}
    if(k===5){const P=[-1,-.5,0,.5,1,1.5,2],ma=R(10,14)*5,mb=R(10,14)*5,sa=2*R(3,7),sb=2*R(3,7);let za,zb;do{za=pick(P);zb=pick(P)}while(za===zb);const xa=ma+za*sa,xb=mb+zb*sb;
      return{q:`Ayşe matematikten <b>${xa}</b> (sınıf μ = ${ma}, σ = ${sa}), Türkçeden <b>${xb}</b> (sınıf μ = ${mb}, σ = ${sb}) aldı. <b>Sınıfına göre</b> hangi derste daha başarılıdır?`,type:'mc',opts:['Matematik','Türkçe','İkisinde eşit'],a:za>zb?0:1,
        sol:`z_mat = (${xa} − ${ma}) / ${sa} = ${fmt(za)} · z_tür = (${xb} − ${mb}) / ${sb} = ${fmt(zb)} → z'si büyük olan derste göreli olarak daha başarılıdır. Ham puanlar farklı ölçeklerde olduğu için doğrudan karşılaştırılmaz.`}}
    const [q,o,s]=pick([
      ['Bir veri setindeki tüm değerler z skoruna dönüştürülürse yeni dağılımın ortalaması ve standart sapması ne olur?',['Ortalama 0, standart sapma 1','Ortalama 1, standart sapma 0','Ortalama ve standart sapma değişmez','Ortalama 50, standart sapma 10'],'z skorlarının ortalaması her zaman 0, standart sapması her zaman 1\'dir.'],
      ['Sağa çarpık bir dağılımdaki değerler z skorlarına dönüştürülürse dağılımın şekli ne olur?',['Sağa çarpık kalır','Normal dağılıma dönüşür','Sola çarpık olur','Simetrik olur'],'z dönüşümü yalnızca kaydırır ve ölçekler; dağılımın şeklini değiştirmez.'],
      ['z = −1,5 ne anlatır?',['Değer ortalamanın 1,5 standart sapma altındadır','Değer ortalamadan 1,5 puan düşüktür','Değer en düşük %15\'lik dilimdedir','Değer ortalamanın 1,5 standart sapma üstündedir'],'z, ortalamadan kaç standart sapma uzakta olunduğunu gösterir; eksi işareti ortalamanın altında demektir.'],
      ['z skorunun birimi nedir?',['Birimsizdir','Ham puanla aynı birimdedir','Yüzdedir','Ham puan biriminin karesidir'],'(X − μ) / σ işleminde pay ile payda aynı birimde olduğu için birim sadeleşir. Bu sayede farklı ölçekler karşılaştırılabilir.'],
      ['Ham puanı ortalamaya eşit olan bir kişinin z skoru kaçtır?',['0','1','−1','Ortalamaya eşittir'],'X = μ ise X − μ = 0, yani z = 0.'],
      ['İki öğrencinin z skorları +2 ve −2\'dir. Hangisi doğrudur?',['Ortalamaya eşit uzaklıktadırlar, biri üstünde biri altında','İkisi de ortalamanın üstündedir','Puanlarının toplamı sıfırdır','İkisi de aynı puanı almıştır'],'|z| uzaklığı, işaret yönü gösterir.']]);
    return{q,type:'mc',...mcq(o),sol:s}}},
  empirical:{label:'Normal dağılım görgül kural',f(){const mu=R(10,14)*5,sd=pick([5,8,10,12,15]),n=pick([200,400,1000,2000,4000]),k=R(0,4),
      KUR='±1σ ≈ %68 (yarısı %34), ±2σ ≈ %95 (yarısı %47,5), ±3σ ≈ %99,7 (yarısı %49,85), ortalamanın her iki yanı %50',ORTA=[[1,68],[2,95],[3,99.7]];
    if(k===0){const [z1,z2,p]=pick([[-1,1,68],[0,1,34],[-2,2,95],[1,2,13.5],[-2,-1,13.5],[0,2,47.5],[-3,3,99.7],[1,9,16],[-9,-1,16],[2,9,2.5],[-9,-2,2.5],[-1,2,81.5],[-2,1,81.5],[2,3,2.35],[-3,-2,2.35],[-9,1,84],[-1,9,84],[-9,2,97.5],[0,3,49.85]]);
      const lo=mu+z1*sd,hi=mu+z2*sd,desc=z1===-9?`${hi} ve altında`:z2===9?`${lo} ve üstünde`:`${lo} ile ${hi} arasında`,c=Math.random()<.5,a=c?n*p/100:p,zs=z=>z===-9?'−∞':z===9?'+∞':(z>0?'+':'')+z;
      return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>${c?`, N = <b>${N(n)}</b>`:''}. <b>${desc}</b> not alanların ${c?'<b>sayısı</b>':'<b>yüzdesi</b>'} yaklaşık kaçtır?`,type:'num',a,
        sol:`z aralığı: ${zs(z1)} ile ${zs(z2)}. ${KUR} → %${fmt(p)}${c?` → ${N(n)} × ${fmt(p/100)} = ${fmt(a)}`:''}`}}
    if(k===1){const [z,p]=pick(ORTA);
      return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>. Öğrencilerin <b>ortadaki %${fmt(p)}</b>'lik kısmı hangi iki not arasındadır?`,type:'multi',fields:[['Alt sınır',mu-z*sd],['Üst sınır',mu+z*sd]],sol:`Ortadaki %${fmt(p)} → μ ± ${z}σ = ${mu} ± ${z} × ${sd} → ${mu-z*sd} ile ${mu+z*sd}`}}
    if(k===2){const [z,p]=pick(ORTA),lo=mu-z*sd,hi=mu+z*sd;
      return{q:`Normal dağılan bir sınavda öğrencilerin ortadaki <b>%${fmt(p)}</b>'lik kısmı <b>${lo}</b> ile <b>${hi}</b> arasında not aldı. Sınavın <b>ortalaması ve standart sapması</b> kaçtır?`,type:'multi',fields:[['Ortalama (μ)',mu],['Standart sapma (σ)',sd]],sol:`Dağılım simetrik → μ = (${lo} + ${hi}) / 2 = ${mu}. %${fmt(p)} = μ ± ${z}σ → aralığın genişliği ${hi-lo} = ${2*z}σ → σ = ${hi-lo} / ${2*z} = ${sd}`}}
    if(k===3){const [z,p]=pick([[1,32],[2,5],[3,.3]]),c=Math.random()<.5,a=c?n*p/100:p;
      return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>${c?`, N = <b>${N(n)}</b>`:''}. <b>${mu-z*sd} altında veya ${mu+z*sd} üstünde</b> not alanların ${c?'<b>sayısı</b>':'<b>yüzdesi</b>'} yaklaşık kaçtır?`,type:'num',a,
        sol:`Bu notlar μ ± ${z}σ aralığının dışında. İçerisi %${fmt(100-p)} → dışarısı %100 − %${fmt(100-p)} = %${fmt(p)} (her kuyrukta %${fmt(p/2)})${c?` → ${N(n)} × ${fmt(p/100)} = ${fmt(a)}`:''}`}}
    const [z,p,how]=pick([[-2,2.5,'%50 − %47,5'],[-1,16,'%50 − %34'],[0,50,'tam ortalama → %50'],[1,84,'%50 + %34'],[2,97.5,'%50 + %47,5'],[3,99.85,'%50 + %49,85']]),x=mu+z*sd;
    return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>. <b>${x}</b> alan bir öğrenci, öğrencilerin yaklaşık <b>yüzde kaçından</b> daha yüksek not almıştır?`,type:'num',a:p,sol:`z = (${x} − ${mu}) / ${sd} = ${z}. z = ${z} noktasının solundaki (altındaki) alan: ${how} = %${fmt(p)}`}}}
};
let gq=null,gsel=store.get('pz_gsel','all');
if(gsel!=='all'&&!GENS.includes(gsel))gsel='all';
function renderGen(){
  const st=store.get('pz_gen',{});
  $('#p-gen').innerHTML=`<div class="card"><div class="row" id="gch">`+['all',...GENS].map(g=>`<button class="chip" aria-pressed="${gsel===g}" data-g="${g}">${g==='all'?'Karışık':GEN[g].label}${st[g]?` · ${st[g][0]}/${st[g][1]}`:''}</button>`).join('')+`</div>
  <p class="mute" style="margin:10px 0 0">Sorular her seferinde rastgele sayılarla yeniden üretilir — sınırsız alıştırma. Ondalıkta virgül ya da nokta kullanabilirsin; nihai cevabı virgülden sonra 3 basamağa yuvarla.</p></div><div id="gbox"></div>`;
  $('#gch').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gsel=b.dataset.g;store.set('pz_gsel',gsel);gq=null;renderGen()});
  if(!gq)newGen();drawGen();
}
function newGen(){const g=gsel==='all'?pick(GENS):gsel;gq={g,...GEN[g].f(),done:false}}
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9+\-*/]/g,'');
function parseNum(s){s=String(s).trim().replace(/[%\s]/g,'').replace('−','-');if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))}
function drawGen(){
  const q=gq,b=$('#gbox');
  const inp=q.type==='mc'?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :q.type==='multi'?`<div class="mf">${q.fields.map(([l],i)=>`<label>${esc(l)}<input class="gin" data-f="${i}" autocomplete="off" inputmode="decimal" placeholder="Sayı"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="gchk">Kontrol et</button></div>`
    :`<div class="row"><input id="gin" class="gin" autocomplete="off" inputmode="${q.type==='num'?'decimal':'text'}" placeholder="${q.type==='num'?'Sayı (ör. 2,5)':'Cevabın (ör. A, B, C)'}"><button class="btn" id="gchk">Kontrol et</button></div>`;
  b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div>${inp}<div id="gfb"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>checkGen(+x.dataset.i));
  const gin=$('#gin'),mi=[...b.querySelectorAll('[data-f]')];
  if(mi.length){const vals=()=>mi.map(x=>x.value);$('#gchk').onclick=()=>checkGen(vals());
    mi.forEach((x,i)=>x.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(gq.done)return nextGen();const empty=mi.find(y=>!y.value.trim());empty?empty.focus():checkGen(vals())});mi[0].focus()}
  if(gin){$('#gchk').onclick=()=>checkGen(gin.value);gin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gq.done?nextGen():checkGen(gin.value)}};gin.focus()}
  $('#gshow').onclick=()=>{gq.done=true;showSol(null)};$('#gnext').onclick=nextGen;
}
function nextGen(){newGen();renderGen()}
function checkGen(v){
  if(gq.done)return;
  const numOk=(s,a)=>Math.abs(parseNum(s)-a)<=Math.max(.0015,Math.abs(a)*1e-4);
  if(gq.type==='multi'){const mi=[...$('#gbox').querySelectorAll('[data-f]')],e=mi.find(x=>!x.value.trim());if(e)return e.focus()}
  else if(gq.type!=='mc'&&String(v).trim()==='')return;
  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){
  const s=cs(),counts=[0,0,0,0,0,0];
  CARDS.forEach((_,i)=>counts[(s[i]||{box:1}).box]++);
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));
  const weak=CARDS.map((c,i)=>({...c,id:i,box:(s[i]||{box:1}).box})).filter(c=>c.box<=2&&s[c.id]).slice(0,8);
  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=()=>{if(confirm('Kart, test, alıştırma ve plan ilerlemesi silinsin mi?')){['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
