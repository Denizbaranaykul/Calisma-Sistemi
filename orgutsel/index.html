<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Örgütsel Davranış</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>

<script>
const CARDS = [{"d": 1, "t": "Giriş", "f": "Örgüte yeni katılan bir çalışan (Barış örneği) örgüte neyle gelir ve süreç nasıl işler?", "b": "Önce bir birey olarak, kişiliğiyle gelir; örgüt onu kişiliğine göre değerlendirir, o da örgütü etkiler. Sonra yöneticisi ve iş arkadaşlarıyla (grup) ilişki kurar; kimya tutarsa uyum sağlayıp örgütte kalır."}, {"d": 1, "t": "Kişilik", "f": "'Kişiliksiz insan' var mıdır? Bu söz ne anlama gelir?", "b": "Hayır; herkesin kişiliği vardır. 'Kişiliksiz/şahsiyetsiz/karaktersiz' demek, kendi kalıbımıza veya genel kalıplara uymayan kişiyi etiketlemektir; bizim yaptığımız kişilik tanımına uymuyor demektir."}, {"d": 1, "t": "Kişilik", "f": "Kişilik neden 'dinamik' bir kavram olarak anlatılır?", "b": "Doğmadan şekillenmeye başlar, doğduktan sonra büyüyüp gelişir; dış dünyaya/çevreye uyum sağlama noktasında içimizde gelişen bir sistemdir. Ama aynı zamanda belirgin, tutarlı ve değişmeyen özellikler bütünüdür."}, {"d": 1, "t": "Kişilik", "f": "Kişiliğin üç temel özelliğini say.", "b": "1) Benzersizlik (kendine özgülük) 2) Tutarlılık 3) Durağanlık (değişmezlik/süreklilik)."}, {"d": 1, "t": "Kişilik", "f": "Benzersizlik ne demektir? Örnekler?", "b": "Parça parça benzeyenler çıksa da bütün olarak her insan kendine özgüdür: dış görünüş (parmak/burun izi), zekâ türleri (Gardner çoklu zekâ), roller (ailenin kaçıncı çocuğu, cinsiyet), enerji, ahlaki değerler, kültür düzeyi, yaşam felsefesi."}, {"d": 1, "t": "Kişilik", "f": "Gardner'ın çoklu zekâ yaklaşımı benzersizliği nasıl destekler?", "b": "Tek bir zekâ yok; duygusal, görsel, doğa, ahlaki vb. farklı zekâ türleri var. Herkesin bu türlerde farklı bir dağılımı olduğu için zekâ profili de benzersizdir (bilişsel zekâsı benzer olan biri duygusal zekâda çok yüksek olabilir)."}, {"d": 1, "t": "Kişilik", "f": "Tutarlılık özelliği ne demektir?", "b": "Kişinin sahip olduğu özellikleri farklı ortamlarda da aynı şekilde sergilemesi. Yeni ortamlarda hep çekingen olan ya da her yerde atılgan davranan kişi gibi; arkadaş ortamında rahat olması tutarsızlık sayılmaz."}, {"d": 1, "t": "Kişilik", "f": "Durağanlık (değişmezlik) özelliğini dağ benzetmesiyle açıkla.", "b": "Dağın yüzeyi (yaprak rengi, kar, çiçek) mevsimle değişir ama dağ bütün olarak ve çekirdeği aynı kalır. İnsanda da saç rengi, giyim, yemek-müzik zevki, tarz değişir; kişilik çekirdeği ('yedisinde ne ise yetmişinde o') kalır."}, {"d": 1, "t": "Kişilik", "f": "Kişilik çekirdeğini kökten değiştirebilen şeyler nelerdir?", "b": "Meteor etkisi yapan istisnai olaylar: yakın kaybı (ebeveyn ölümü), deprem/afet, ölümcül hastalık, ağır travma. Bunlar kişiliği 180 derece döndürebilir; normal büyüme ve zevk değişimi bu kapsamda değildir."}, {"d": 1, "t": "Faktörler", "f": "Kişiliğin oluşumunda etkili üç faktör grubunu say.", "b": "1) Kalıtım (genler) 2) Çevre (aile, okul/arkadaş, toplum-kültür, coğrafya) 3) Durumsal faktörler."}, {"d": 1, "t": "Faktörler", "f": "Kalıtımla (genlerle) neler aktarılır?", "b": "Dış görünüş, kan kimyası, sinir sistemi, hormonal salgılar, zekâ, cinsiyet, bazı hastalıklar ve kişilik eğilimleri. Travmaların bile aktarılabildiğine dair bulgular var (solucan deneyi)."}, {"d": 1, "t": "Faktörler", "f": "Solucan deneyi ve tek yumurta ikizi çalışmaları neyi gösterir?", "b": "Solucan: ışıkla acı eşleştirilen ebeveynlerin yavruları, acıyı yaşamadan ışıktan kaçtı → öğrenilmiş korku bile aktarılabilir. İkizler: doğumda ayrılan tek yumurta ikizleri yetişkinken aynı marka araba/sigara, aynı isimli köpek gibi şaşırtıcı benzerlik gösterdi → genlerin etkisi azımsanamaz."}, {"d": 1, "t": "Faktörler", "f": "Kişilikte genler mi çevre mi daha etkilidir?", "b": "Biri diğerinden ağır basmaz; ikisi birlikte etkilidir. Eskiden 'çevre daha çok' denirdi, bugün ikiz çalışmaları genlerin etkisinin büyük olduğunu da gösteriyor."}, {"d": 1, "t": "Faktörler", "f": "Spitz deneyi nedir, sonucu ne öğretir?", "b": "1940'larda Spitz bir yetimhanede (bakımı sadece alt değiştirme ve biberon olan bebekler) ve hapishanede (anneleriyle kalan bebekler) gözlem yaptı. Sevgi/ilgi görmeyen bebeklerde zihinsel ve fiziksel gelişim durdu, çoğu öldü. Hayatta kalmak için bakım yetmez; aile ve bağlanma kişilik ve sağlık için kritik."}, {"d": 1, "t": "Faktörler", "f": "Kişilik gelişiminde hangi dönemler kritiktir?", "b": "Hamilelik dönemi (anne yaşantısı bebeğe aktarılır), doğumdan 3 yaşa kadar güvenli bağlanma (anne ya da onun yerine geçen sevgi dolu bakıcı) ve yaklaşık 6 yaşa kadar kişiliğin büyük bölümü oluşur."}, {"d": 1, "t": "Faktörler", "f": "Çevre faktörü içinde hangi unsurlar sayılır?", "b": "Aile (en önemlisi), okul, öğretmenler, arkadaşlar, akrabalar, toplum normları ve kültür (tabular, yargılar, yeme-içme, inanç/değerler), coğrafya ve iklim (Karadeniz-Ege halk oyunları farkı, güneşin ruh haline etkisi)."}, {"d": 1, "t": "Faktörler", "f": "Durumsal faktörler nedir?", "b": "Hayatta yaşanan özel durumlar ve olaylar. Kısmen zevk/tarz değişikliği (saç modası, yemek) normal akıştır; ağır olaylar (afet, hastalık, kayıp) kişiliği köklü değiştirebilir (cimri biri ölümden dönünce savurgan olabilir)."}, {"d": 1, "t": "Örgüt", "f": "İşletmeler neden kişilik testi kullanır?", "b": "İşe alımda ve performans değerlendirmede kişinin hangi iş/örgüte uyduğunu görmek, performans düşüklüğünün uyumsuzluktan kaynaklanıp kaynaklanmadığını anlamak için. Kişilikle uyumlu işte performans ve mutluluk yüksektir."}, {"d": 1, "t": "Örgüt", "f": "Dışa dönük ve içe dönük kişi iş ortamında nasıl etkilenir?", "b": "Dışa dönük: enerjisini insanlardan alır, kalabalık/etkileşimli işte iyidir; izole işte verimsizleşir. İçe dönük: enerjisini kendinden alır (beceriksiz değil, tercihi bu), sürekli kalabalık işte tükenir. Uyumsuz işte mutsuzluk ve düşük performans görülür."}, {"d": 2, "t": "MBTI", "f": "Myers-Briggs Tip Göstergesi kaç tip üretir, hangi dört ikiliyi kullanır?", "b": "16 kişilik tipi. İkililer: dışa dönük–içe dönük, duyusal–sezgisel, düşünsel(mantık)–duygusal, yargısal–algısal."}, {"d": 2, "t": "MBTI", "f": "Duyusal ve sezgisel tip arasındaki fark nedir?", "b": "Duyusal: bilgiyi duyularıyla (görme, dokunma, işitme) somut edinir; 'görmem/dokunmam lazım'. Sezgisel: sezgilerine, iç sesine güvenir. Kişi koşula göre değişebilir, tek uçta olmaz."}, {"d": 2, "t": "MBTI", "f": "Yargısal ve algısal tip arasındaki fark nedir?", "b": "Yargısal: sistematik, disiplinli, planlı-programlı; hemen karar verir ve hazırlık yapar (üç ay sonraki kongre için hemen bilet alır). Algısal: esnek, oluruna bırakan, seçenekleri açık tutan (indirimi bekleyelim der)."}, {"d": 2, "t": "MBTI", "f": "MBTI'a yöneltilen eleştiri nedir?", "b": "Bilimsel geçerliği düşüktür; bu yüzden günümüzde bilimsel olarak daha geçerli bulunan ve liderlik çalışmalarında kullanılan Büyük Beş modeli daha yaygındır."}, {"d": 2, "t": "Büyük Beş", "f": "Büyük Beş kişilik modelinin beş boyutunu say.", "b": "Dışa dönüklük, duygusal denge (karşıtı nörotiklik), deneyime açıklık, sorumluluk (öz disiplin) ve uyumluluk."}, {"d": 2, "t": "Büyük Beş", "f": "Duygusal denge boyutu ne anlama gelir? Duygusal zekâyla ilişkisi?", "b": "Duygularını kontrol edebilme; ani öfke-barışma gibi iniş çıkışlar azdır, dengeli karar alınır. Duygusal zekâ: kendi duygularının farkında olma, yönetebilme, başkalarının duygularını fark edip yönetme. Duygusal zekâ öğrenilebilir ve geliştirilebilir."}, {"d": 2, "t": "Büyük Beş", "f": "Deneyime açıklık yüksek biri hangi davranışları gösterir?", "b": "Yeni yiyecek, yer, fikir ve görevleri denemeye istekli; belirsizlik ve riski daha kolay üstlenir, girişimciliğe ve yurt dışı görevine atılır. Kapalı olan geri durur, korku ve belirsizlik ona engeldir."}, {"d": 2, "t": "Büyük Beş", "f": "Sorumluluk (öz disiplin) boyutunu örnekle açıkla.", "b": "Kendini disipline edebilmek, nerede ne yapılacağını bilip uygulamak ve davranışların sonucunu üstlenmek. Örnek: gece geç yatmasına rağmen alarmı kapatmadan derse kalkmak ve devamsızlığın sorumluluğunu almak."}, {"d": 2, "t": "Büyük Beş", "f": "Uyumluluk her şeye 'evet' demek midir?", "b": "Hayır. Çevreye ve koşullara uyum sağlama yeteneğidir (su ayısı örneği); takım arkadaşı olabilmeyi sağlar. Her şeye karşı çıkan (sen A dersen Z der) biriyle çalışmak zordur."}, {"d": 2, "t": "Denetim Odağı", "f": "Denetim (kontrol) odağı nedir? İçsel ve dışsal farkı?", "b": "Başına gelen olayların sorumluluğunu nereye yüklediğin. İçsel: 'bu benden kaynaklanıyor' (çalışmadım, devam etmedim). Dışsal: kader, şans, hoca, başkaları ('ders zor, hoca bana taktı, nasip değil')."}, {"d": 2, "t": "Denetim Odağı", "f": "Hocaya göre Türk toplumu denetim odağı açısından nasıl ve tevekkül nasıl yorumlanmalı?", "b": "Daha çok dışsal denetimli (kader, nasip, takdir-i ilahi'ye yükleme). Doğru yorum: önce gerekeni yap, önlem al, çalış; sonuç olmazsa tevekkül et. Önlem almadan her şeyi kadere atmak sorumluluktan kaçmaktır."}, {"d": 2, "t": "Özellikler", "f": "Başarı yönelimi (başarma isteği) neden kişiye ve çevreye göre değişir?", "b": "Temel ihtiyaçlar (açlık) karşılanmamışsa takdir ve başarı arayışı düşük kalır; Maslow hiyerarşisinde kendini gerçekleştirme basamağındakilerin başarma isteği daha yüksektir. Hem çevreye hem kişiye bağlıdır."}, {"d": 2, "t": "Özellikler", "f": "Kendine güven neye bağlıdır, örgüt için neden önemlidir?", "b": "Kendini ne kadar sevip kabul ettiğine (fiziksel ve içsel özellikleriyle). Kendini sevmeyen başkasından değer beklemez; enerji ve ilişkileri etkiler. Olumsuz yönleri fark edip düzeltmek mümkün."}, {"d": 2, "t": "Özellikler", "f": "Otoriter kişilik nedir? Güç mesafesiyle ilişkisi?", "b": "Otoriteye ve hiyerarşiye aşırı önem verir; aşağıdakilere hükmeder, yukarıdakilere aşırı itaat eder, belirsizliğe toleransı düşüktür. Türk toplumu güç mesafesi yüksek bir toplumdur. Otoriter yöneticide sorgula, kendini ifade et."}, {"d": 2, "t": "Özellikler", "f": "Makyavelizm nedir? Tek cümlelik özeti?", "b": "Machiavelli'nin 'Prens' eserinden: 'Amaca giden her yol mübahtır.' Manipülatif ve kendine faydacı; yalan, dedikodu, dolandırıcılık yapabilir; etik kaygı yok. Duygusal destek verirken arkandan iş çevirebilir → dikkatli ol."}, {"d": 2, "t": "Özellikler", "f": "Narsisizm nedir, adı nereden gelir?", "b": "Narkissos mitinden. Kendine aşırı hayranlık, kendi doğrularını ve bakış açısını tek doğru sayma, çevresinden hayranlık bekleme. Hayranı değilsen sorun çıkar. Kökeni çocukluk ve genetik; uzmanlar genelde uzak durmayı veya idare etmeyi önerir."}, {"d": 2, "t": "Özellikler", "f": "Psikopatik özellikler neleri içerir; neden 'tek bir kişilik özelliği' sayılmaz?", "b": "Vicdansızlık, empati yokluğu, duyarsızlık, suçluluk duymama, stresten etkilenmeme. Bir örüntüdür; DSM'de ayrı bir kişilik özelliği olarak geçmez (sosyopat/psikopat kavramları). Köken çocukluk ve genetik."}, {"d": 2, "t": "Özellikler", "f": "Yönetimin 'karanlık' kişilik özellikleri hangileridir?", "b": "Makyavelizm, narsisizm ve psikopatik özellikler (hocanın saydığı grup). Yönetici bunlara sahipse örgüt davranışı olumsuz etkilenir."}, {"d": 2, "t": "Özellikler", "f": "Kendini yansıtma (ayarlama) nedir? İyi mi kötü mü?", "b": "Davranışını çevre ve koşullara göre uyarlayabilme. 'Her devrin adamı' gibi bakılırsa olumsuz; ama prensiplerini koruyarak koşullara (örgütsel değişim, yeni teknoloji) ve farklı kişilere uyum sağlamak yöneticiler için gereklidir. İki yönüyle bak."}, {"d": 2, "t": "Özellikler", "f": "Risk alma eğilimi iş hayatında nasıl yansır? Türk toplumunda durum?", "b": "Yüksek: belirsiz yatırım kararını hemen alır, girişimciliğe yatkındır. Düşük: düşünür, geri çekilir, belki reddeder. Türk toplumu belirsizlikten kaçınmayı seviyor (risk eğilimi düşük); girişimcilik ise risk demektir."}, {"d": 2, "t": "A-B Tipi", "f": "A tipi ve B tipi kişilik özellikleri nelerdir?", "b": "A: zamana takıntılı, hızlı, yerinde duramayan, çok planlı-programlı-düzenli, iş konusunda esnek değil, strese eğilimli. B: daha rahat, oluruna bırakan, yavaş ve esnek. A tipi yönetici B tipi çalışanı umursamaz görebilir; lider tipleri analiz edip uyarlamalı."}, {"d": 2, "t": "Uygulama", "f": "Yönetici olarak farklı kişiliklerle nasıl çalışmalısın?", "b": "Yalnızca kendi tipinle (örn. A tipi) çalışamazsın; narsist, makyavelist, içe/dışa dönük kişilerle çalışacaksın. Tüm kişilikleri analiz edip işleri ona göre dağıtmak ve davranışını uyarlamak liderliğin parçasıdır."}];

 olmaması", "Hastalık salgını", "Genetik rahatsızlık"], "a": 1, "w": "Yalnızca fiziksel bakım yeterli değildir; sevgi ve bağlanma kritik."}, {"d": 1, "q": "Güvenli bağlanmanın en kritik olduğu dönem hangisidir?", "o": ["Ergenlik", "İlk yaklaşık 3 yaş", "20'li yaşlar", "Okul sonrası"], "a": 1, "w": "İlk 3 yaşta güvenli bağlanma; kişilik büyük ölçüde ~6 yaşa kadar şekillenir."}, {"d": 1, "q": "Enerjisini kalabalıktan değil kendinden alan, tercihi yalnız kalmak olan ve bunu beceriksizlikten yapmayan kişi hangi tiptir?", "o": ["Dışa dönük", "İçe dönük", "Algısal", "Makyavelist"], "a": 1, "w": "İçe dönük kişi enerjisini kendinden alır; yetersizlik değil tercih meselesidir."}, {"d": 1, "q": "İşletmelerin işe alımda kişilik testi kullanmasının temel amacı nedir?", "o": ["Zekâyı ölçmek", "Kişinin hangi işe/örgüte uyduğunu görerek performans ve uyumu artırmak", "Maaşı belirlemek", "Cinsiyeti öğrenmek"], "a": 1, "w": "Kişi–iş/örgüt uyumu performans ve mutluluğu etkiler."}, {"d": 2, "q": "Myers-Briggs Tip Göstergesi kaç kişilik tipi üretir?", "o": ["4", "5", "12", "16"], "a": 3, "w": "4 ikiliden 16 tip çıkar."}, {"d": 2, "q": "Aşağıdakilerden hangisi Büyük Beş boyutlarından biri DEĞİLDİR?", "o": ["Deneyime açıklık", "Uyumluluk", "Makyavelizm", "Sorumluluk"], "a": 2, "w": "Büyük Beş: dışa dönüklük, duygusal denge, deneyime açıklık, sorumluluk, uyumluluk. Makyavelizm karanlık özelliklerdendir."}, {"d": 2, "q": "Üç ay sonraki kongre için hemen bilet alıp dört günü planlayan kişi hangi MBTI özelliğini gösterir?", "o": ["Algısal", "Yargısal", "Sezgisel", "İçe dönük"], "a": 1, "w": "Yargısal tip: planlı, programlı, hemen karar verir."}, {"d": 2, "q": "Duygularını kontrol edebilen, başkalarının duygularını fark edip yönetebilen kişi hangi boyutta yüksektir?", "o": ["Dışa dönüklük", "Duygusal denge / duygusal zekâ", "Deneyime açıklık", "Uyumluluk"], "a": 1, "w": "Duygusal denge duygusal zekâyla ilişkilidir ve geliştirilebilir."}, {"d": 2, "q": "'Derse devam etmedim' diyen öğrenci denetim odağı açısından hangisini gösterir?", "o": ["İçsel denetim odağı", "Dışsal denetim odağı", "A tipi kişilik", "Makyavelizm"], "a": 0, "w": "Sorumluluğu kendinde görmek içsel denetim odağıdır; kader/hoca demek dışsaldır."}, {"d": 2, "q": "'Ders çok zordu, hoca bana taktı, kısmet değildi' diyen kişi hangi denetim odağındadır?", "o": ["İçsel", "Dışsal", "Tutarlı", "Algısal"], "a": 1, "w": "Sorumluluğu kader, şans, başkaları gibi dış etkenlere yüklemek dışsal denetim odağıdır."}, {"d": 2, "q": "'Amaca giden her yol mübahtır' ilkesi hangi kişilik özelliğini tanımlar?", "o": ["Narsisizm", "Makyavelizm", "Otoriterlik", "Kendini yansıtma"], "a": 1, "w": "Machiavelli'nin Prens'ine dayanan manipülatif, faydacı yaklaşım."}, {"d": 2, "q": "Kendine aşırı hayranlık, kendi doğrularını tek doğru sayma hangi özelliktir ve adı nereden gelir?", "o": ["Makyavelizm – Machiavelli", "Narsisizm – Narkissos", "Psikopati – DSM", "Otoriterlik – Weber"], "a": 1, "w": "Narsisizm mitolojideki Narkissos'tan gelir."}, {"d": 2, "q": "Psikopatik özellikler için hangisi doğrudur?", "o": ["Tek başına bir kişilik özelliğidir", "Vicdansızlık, empati yokluğu gibi bir örüntüyü ifade eder; DSM'de tek kişilik özelliği olarak geçmez", "Yalnızca kalıtımla oluşur", "Yalnızca yöneticilerde görülür"], "a": 1, "w": "Psikopati birden fazla özelliği kapsayan bir örüntüdür."}, {"d": 2, "q": "Güç mesafesine inanan, yukarıya itaat edip aşağıya hükmeden, belirsizliğe toleransı düşük kişilik hangisidir?", "o": ["Otoriter kişilik", "B tipi", "Deneyime açık", "Duygusal dengeli"], "a": 0, "w": "Otoriter kişilik güç farkını önemser; Türk toplumunda güç mesafesi yüksektir."}, {"d": 2, "q": "Kendini yansıtma (ayarlama) özelliğiyle ilgili hangisi doğrudur?", "o": ["Her zaman olumsuzdur", "Prensipleri koruyarak çevre ve değişime uyum sağlamak yöneticiler için gereklidir", "Sadece B tipi kişilerde görülür", "Kalıtımla belirlenir"], "a": 1, "w": "İki yönü var: karaktersizlik gibi görünebilir ama uyumu sağlar."}, {"d": 2, "q": "Belirsiz bir yatırım kararını hemen kabul eden yönetici hangi eğilimdedir?", "o": ["Düşük risk alma", "Yüksek risk alma", "A tipi", "Dışsal denetim"], "a": 1, "w": "Yüksek risk alma eğilimi belirsizliği kabul etmeyi kolaylaştırır; girişimcilik riskle ilgilidir."}, {"d": 2, "q": "Zamana takıntılı, hızlı, sabırsız ve çok planlı kişilik tipi hangisidir?", "o": ["A tipi", "B tipi", "Algısal tip", "İçe dönük"], "a": 0, "w": "A tipi: zaman baskısı, hız, strese eğilim; B tipi daha rahattır."}, {"d": 2, "q": "Yönetici olarak yalnızca kendi kişilik tipindeki çalışanlarla çalışmak neden mümkün değildir?", "o": ["Yasaktır", "Örgütte çok farklı kişilikler vardır; bunları analiz edip işi ve davranışı uyarlamak liderliğin parçasıdır", "İşe alım yapılmaz", "Tüm çalışanlar aynı tiptedir"], "a": 1, "w": "Lider farklı kişilik tiplerini analiz ederek doğru yerleştirir ve yönetir."}];
const NOTES = "# Ders 1 — Birey ve kişilik\n\n## Neden birey ve kişilik?\n- Örgüte yeni gelen çalışan (hocanın \"Barış\" örneği) örgüte **önce bir birey olarak, kişiliğiyle** gelir. Örgüt onu kişiliğine göre değerlendirir; o da örgütü etkiler. Sonra grup, yönetici, takım ilişkileri kurulur; uyum olursa örgütte kalır.\n- Kitap yerine konular önemli: kişilik, algı, tutum/değer, motivasyon, iletişim, takım, çatışma, liderlik, örgüt kültürü.\n- **Kişiliksiz insan yoktur.** \"Kişiliksiz/şahsiyetsiz/karaktersiz\" demek, kendi kalıbımıza uymayan birini etiketlemektir; herkesin kişiliği vardır.\n- Kişilik **dinamik**dir: doğmadan şekillenmeye başlar, doğduktan sonra da gelişir; dış dünyaya (çevreye) **uyum sağlama** noktasında içimizde gelişen bir sistemdir. Başkasının kişiliğini zamanla davranışlarından **yargılayarak** çıkarırız.\n\n## Kişiliğin 3 temel özelliği\n1. **Benzersizlik (kendine özgülük):** parça parça benzeyen çıkar ama **bütün olarak** kimse kimsenin aynısı değil (dış görünüş, parmak izi/burun izi, zekâ türleri, roller, enerji, ahlaki değerler, kültür düzeyi, yaşam felsefesi).\n   - Zekâ da benzersiz: **Howard Gardner çoklu zekâ** (duygusal, görsel, doğa, ahlaki vb.).\n   - Aile içindeki yer (ilk/ortanca/son çocuk, kız/erkek) rolleri ve yetiştirilmeyi farklılaştırır.\n2. **Tutarlılık:** kişi farklı ortamlarda temel özelliklerini aynı şekilde sergiler (çekingen biri yeni ortamlarda hep çekingen; atılgan biri her zaman atılgan). Duruma göre küçük sapmalar tutarlılığı bozmaz.\n3. **Durağanlık / değişmezlik (süreklilik):** \"yedisinde ne ise yetmişinde o\". **Dağ benzetmesi:** yüzeyi (mevsim, saç rengi, giyim, zevk) değişir ama dağ bütün olarak aynı kalır. Büyüme normal gelişimdir; kişilik çekirdeği değişmez.\n   - İstisna: meteor gibi **radikal olaylar** (yakın kaybı, deprem, ölümcül hastalık, travma) kişiliği 180 derece değiştirebilir.\n\n## Kişiliği oluşturan faktörler\n- **Kalıtım (genler):** dış görünüş, kan kimyası, sinir sistemi, hormonlar, zekâ, cinsiyet, bazı hastalıklar ve eğilimler; travmaların bile kuşaklar arası aktarıldığına dair bulgular (solucan deneyi: ışık–acı bağlantısı yavrulara geçiyor).\n- **Çevre:** *aile* (en etkili; hamilelikten itibaren), okul/öğretmen/arkadaş, akraba, **toplum normları ve kültür**, inanç ve değerler, **coğrafya ve iklim** (Karadeniz–Ege oyunları farkı, Akdeniz insanı).\n- **Durumsal faktörler:** yaşanan özel durumlar; zevk ve tarz değişir (moda, yemek, müzik); ağır olaylar kişiliği kökten değiştirebilir.\n- **Genler mi çevre mi?** Biri öbüründen ağır basmıyor; ikisi birlikte etkili. **Ayrı büyüyen tek yumurta ikizleri** çalışmaları genlerin etkisinin büyük olduğunu gösterir (aynı marka araba/sigara, köpeğe aynı isim).\n- **Aile ve bağlanma (Spitz deneyi, 1940'lar):** yetimhanede yalnızca bakım (alt değiştirme, biberon) alan, sevgi/ilgi görmeyen bebeklerde gelişim durdu, çoğu öldü; hapishanede anneyle kalan bebekler sağlıklıydı. İlk 3 yaşta **güvenli bağlanma** kritik; kişilik büyük ölçüde ~6 yaşa kadar şekillenir. Sosyopat/narsist özelliklerin kökeni çoğu kez çocukluk ve genetik.\n\n## Neden kişilik örgüt için önemli?\n- İşletmeler **işe alımda ve performans değerlendirmede kişilik testi** kullanabilir: kişi–iş/örgüt uyumunu görmek için.\n- **Dışa dönük** (enerjisini insanlardan alır) izole bir işte; **içe dönük** (enerjisini kendinden alır, yetersiz değil, tercihi bu) sürekli kalabalık işte mutsuz ve verimsiz olur.\n- Kendini tanı; kişiliğine uyan iş ve örgütü seç, yoksa tükenirsin.\n\n---\n\n# Ders 2 — Kişilik tipleri ve örgütsel davranışı etkileyen özellikler\n\n## Myers-Briggs Tip Göstergesi (MBTI)\n- 4 ikili → **16 kişilik tipi**:\n  - **Dışa dönük – içe dönük** (enerjiyi nereden alır)\n  - **Duyusal – sezgisel** (bilgiyi nasıl edinir: duyularla/somut vs sezgiyle)\n  - **Düşünsel (mantık) – duygusal** (karar verirken neye ağırlık verir)\n  - **Yargısal – algısal** (yargısal: planlı, programlı, düzenli, hemen karar verir; algısal: esnek, oluruna bırakan, seçenekleri açık tutan)\n- Uyarılar: kavramları ezberleme, davranışına bakıp yaşam içinde anla; kişiler her koşulda tek uçta olmaz. MBTI **bilimsel geçerliği açısından eleştirilir.**\n\n## Büyük Beş (Big Five) kişilik modeli\n- Daha geçerli kabul edilir, liderlik/örgüt çalışmalarında yaygın. Beş boyut:\n  1. **Dışa dönüklük** – sosyal, konuşkan, insanlarla enerji\n  2. **Duygusal denge** (karşıtı nörotiklik) – duygularını kontrol eder, dengeli karar verir; **duygusal zekâ** (kendi ve başkalarının duygularını fark edip yönetme) ile ilişkili; **geliştirilebilir**\n  3. **Deneyime açıklık** – yeni şeyleri deneme, risk ve belirsizliğe daha açık (girişimcilik)\n  4. **Sorumluluk** (öz disiplin) – yapılması gerekeni yapmak, davranışların sonucunu üstlenmek\n  5. **Uyumluluk** – takım arkadaşı olabilme, uyum sağlama (her şeye evet demek değil; su ayısı örneği: ortama uyum). Her şeye karşı çıkan biri takım çalışmasına uygun değil.\n- Bu özellikler stres, performans, liderlik, değişime uyum gibi birçok örgütsel çıktıyı etkiler.\n\n## Örgütsel davranışı etkileyen kişilik özellikleri\n1. **Denetim odağı (kontrol odağı):** başına gelenlerin sorumluluğunu nereye yüklediği.\n   - **İçsel denetim odağı:** sorumluluğu kendinde görür (\"çalışmadım, devam etmedim\").\n   - **Dışsal denetim odağı:** kader, şans, hoca, başkaları (\"ders çok zor, kısmet değil\").\n   - Hocaya göre Türk toplumu daha **dışsal denetimli** (kader/nasip vurgusu); ama tevekkül çalışıp önlem aldıktan sonra gelir, sorumluluktan kaçmak değildir.\n2. **Başarı yönelimi (başarma isteği):** kişiden kişiye ve çevreye göre değişir; açlık gibi temel ihtiyaçlar karşılanmadıysa düşük kalır, **Maslow**'da kendini gerçekleştirme basamağındakilerde yüksektir.\n3. **Kendine güven:** kendini kabul etmek ve sevmekle ilgili; enerjiyi ve başkalarının sana değer vermesini etkiler. Olumsuz yönlerini fark edip düzeltmek mümkün.\n4. **Otoriter kişilik:** otoriteye aşırı önem verir; **güç mesafesine** (yukarıya itaat, aşağıya hükmetme) inanır, belirsizliğe toleransı düşüktür. Türk toplumunda güç mesafesi yüksek. İleride otoriter yöneticiyle karşılaşabilirsin: sorgula, kendini ifade et.\n5. **Makyavelizm:** Machiavelli (*Prens*): **\"amaca giden her yol mübahtır.\"** Manipülatif, faydacı (kendine), etik kaygısız; yalan, dedikodu, dolandırıcılık yapabilir. Duygusal destek verir gibi görünüp arkandan iş çevirebilir → dikkatli ol.\n6. **Narsisizm:** Narkissos mitinden; kendine aşırı hayranlık, kendi doğrularını tek doğru sayma, çevresinden hayranlık bekleme. Hayran olmazsan sorun çıkar; uzmanlar genellikle \"uzak dur / idare et\" der. Kökeni çocukluk + genetik.\n7. **Psikopatik özellikler (psikopati/sosyopati):** vicdansızlık, empati yokluğu, duyarsızlık, stresten az etkilenme. **Tek başına bir kişilik özelliği değil, bir örüntüdür; DSM'de kişilik özelliği olarak geçmez.**\n   - **Makyavelizm + narsisizm + psikopati = \"karanlık\" (yönetimin karanlık yüzü) özellikler.**\n8. **Kendini yansıtma / ayarlama (self-monitoring):** davranışını çevreye ve duruma göre uyarlayabilme. İki yüzlü bakılabilir (\"her devrin adamı\"), ama değişime ve farklı kişilere uyumu sağlayan **yönetici/lider için gerekli** bir özelliktir. Tüm bunlar prensip sahibi olmakla çelişmez.\n9. **Risk alma eğilimi:** girişimcilik ve yatırım kararlarında kritik. Yüksek risk alan yatırım kararını hemen verir; düşük olan düşünür, geri çekilir. Türk toplumunda belirsizlikten kaçınma yüksek (risk eğilimi düşük).\n10. **A tipi – B tipi kişilik:**\n    - **A tipi:** zamana takıntılı, hızlı, sabırsız, yerinde duramaz, çok planlı programlı, esneklik düşük, stres eğilimi yüksek.\n    - **B tipi:** rahat, oluruna bırakan, yavaş, esnek.\n    - A tipi yönetici B tipi çalışanı umursamaz/gevşek görebilir; iyi lider tipleri analiz edip işi/davranışı ona göre ayarlar.\n\n## Uygulama mesajı\n- Yönetici olunca çeşitli kişiliklerle çalışacaksın (narsist, makyavelist, içe/dışa dönük...). Bunları analiz edip işe yerleştirmek ve davranışı uyarlamak liderliğin parçasıdır.\n- Kavram ezberlemek yerine nedenini ve davranışa yansımasını anla.\n";
const COURSE = {"title": "Örgütsel Davranış", "sub": "Birey ve kişilik · Ders 1–2 transkriptlerinden notlar, kartlar, test, plan", "ders": {"1": "Ders 1 · Birey ve kişilik", "2": "Ders 2 · Kişilik tipleri ve örgütsel özellikler"}, "extra": ["Kendini değerlendir: MBTI ikililerinde, Büyük Beş boyutlarında ve A/B tipinde neredesin? Bir iş ilanı seçip kişilik–iş uyumunu yaz"], "id": "orgutsel"};
const DERS = COURSE.ders, NS = Object.keys(DERS).map(Number), U = COURSE.unit||'Ders', GENS = COURSE.gen||[];
const PLAN = (()=>{
  const p=[];
  NS.forEach((n,i)=>p.push({g:`Gün ${i+1} · ${U} ${n}`,t:[`${U} ${n} notlarını oku (25 dk) — bitince kapat, 5 anahtar kavramı kâğıda hatırladığın kadar yaz`,`${U} ${n} kartlarını çalış (15 dk)`,`${U} ${n} testi (10 soru)`].concat(i?['Önceki günlerin bekleyen kartları']:[])}));
  let g=NS.length;
  p.push({g:`Gün ${++g} · Birleştir`,t:['Tüm bekleyen kartlar','Karışık test (20 soru)','Yanlışlarım testini çöz'].concat(GENS.length?['Alıştırma sekmesinde karışık 10 soru çöz']:[])});
  p.push({g:`Gün ${++g} · Aktif hatırlama`,t:[`Her ${U.toLowerCase()} için notlara bakmadan 10 satırlık özet yaz, sonra notlarla karşılaştır`,'Eksik çıkan kavramların kartlarını çalış'].concat(COURSE.extra||[])});
  p.push({g:`Gün ${++g} · Zayıf noktalar`,t:["İlerleme sekmesinde Kutu 1-2'deki kartlara odaklan",'Yanlışlarım testini tekrar et']});
  p.push({g:`Gün ${++g} · Final`,t:['Karışık test (hepsi)','Yanlışlarım testi','2 hafta sonrası için kendine hatırlatma kur: bekleyen kartlar + 1 karışık test']});
  return p;

const $ = (s,r=document)=>r.querySelector(s);
const K=k=>COURSE.id+':'+k;
const store = {
  get(k,d){try{const v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}
};
const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5, INTERVALS=[0,0,1,3,7,14]; // box index → days

const TABS=[["plan",`${PLAN.length} Günlük Plan`],["notes","Notlar"],["cards","Kartlar"],["quiz","Test"]].concat(GENS.length?[["gen","Alıştırma"]]:[],[["prog","İlerleme"]]);
const nav=$('#nav');
TABS.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});

/* ---------- notes (mini markdown) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

/* ---------- flashcards (Leitner) ---------- */
let cardFilter=store.get('pz_filter',0), session=[], sIdx=0, flipped=false;
const cs=()=>store.get('pz_cards',{});
function cardState(id){return cs()[id]||{box:1,due:0}}
function dueList(f){const s=cs(),now=Date.now();return CARDS.map((c,i)=>({...c,id:i})).filter(c=>(!f||c.d===f)&&((s[c.id]||{due:0}).due<=now))}
function renderCards(){
  const el=$('#p-cards');
  let h=`<div class="row" style="margin-bottom:14px">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${cardFilter===f}" data-f="${f}">${f?U+' '+f:'Hepsi'} (${dueList(f).length})</button>`).join('')+`</div><div id="sess"></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cardFilter=+b.dataset.f;store.set('pz_filter',cardFilter);session=[];renderCards()});
  if(!session.length||sIdx>=session.length){session=shuffle(dueList(cardFilter));sIdx=0}
  drawCard();
}
function drawCard(){
  const box=$('#sess');if(!box)return;
  if(!session.length){box.innerHTML=`<div class="card" style="text-align:center"><b>Bekleyen kart yok 🎉</b><p class="mute">Bu filtre için bugün çalışılacak kart kalmadı. Yarın tekrar gel ya da başka bir ${U.toLowerCase()} seç.</p><button class="btn alt" id="all">Yine de hepsini karıştır</button></div>`;
    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>!cardFilter||c.d===cardFilter));sIdx=0;drawCard()};return}
  const c=session[sIdx];flipped=false;
  box.innerHTML=`<div class="mute" style="margin-bottom:6px">${sIdx+1} / ${session.length} · Kutu ${cardState(c.id).box}</div><div class="bar" style="margin-bottom:12px"><i style="width:${sIdx/session.length*100}%"></i></div>
  <div class="card flash" id="fl" tabindex="0"><div class="tag">${esc(DERS[c.d])} · ${esc(c.t)}</div><div class="q">${esc(c.f)}</div><div class="a" id="ans" hidden>${esc(c.b)}</div><div class="mute" id="hint" style="margin-top:12px">Cevabı düşün, sonra çevirmek için dokun (Boşluk)</div></div>
  <div class="row" id="grade" hidden><button class="btn bad" data-g="0">Bilemedim</button><button class="btn alt" data-g="1">Zor</button><button class="btn ok" data-g="2">Bildim</button></div>`;
  const flip=()=>{if(flipped)return;flipped=true;$('#ans').hidden=false;$('#hint').hidden=true;$('#grade').hidden=false};
  $('#fl').onclick=flip;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(c,+b.dataset.g));
  window._flip=flip;
}
function grade(c,g){
  const s=cs(),st=s[c.id]||{box:1,due:0};
  if(g===0)st.box=1;else if(g===2)st.box=Math.min(5,st.box+1);
  st.due=Date.now()+(g===0?0:INTERVALS[st.box]*DAY);
  s[c.id]=st;store.set('pz_cards',s);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(g===0)session.push(c);
  sIdx++;
  if(sIdx>=session.length){session=[];renderCards()}else drawCard();
}
document.addEventListener('keydown',e=>{
  if($('#p-cards').classList.contains('on')&&$('#fl')){
    if(e.code==='Space'){e.preventDefault();window._flip&&window._flip()}
    else if(flipped&&['Digit1','Digit2','Digit3'].includes(e.code))$('#grade').querySelectorAll('[data-g]')[+e.code.slice(-1)-1].click();
  }
});

let qz=null;
function renderQuizHome(){
  const wrong=store.get('pz_wrong',[]),best=store.get('pz_best',{});
  $('#p-quiz').innerHTML=`<div class="card"><b>Test oluştur</b><div class="row" style="margin:12px 0" id="qd">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${(qz&&qz.f||0)===f}" data-f="${f}">${f?U+' '+f:'Karışık'}</button>`).join('')+`</div>
  <div class="row"><button class="btn" id="go10">10 soru</button><button class="btn alt" id="go20">20 soru</button><button class="btn alt" id="goall">Hepsi</button><button class="btn alt" id="gow" ${wrong.length?'':'disabled'}>Yanlışlarım (${wrong.length})</button></div>
  <p class="mute" style="margin:12px 0 0">Şıklar her seferinde karışır. Yanlış yaptıkların "Yanlışlarım"a eklenir, doğru yapınca çıkar.</p></div>
  <div class="card mute">En iyi skorlar: ${[0,...NS].map(f=>`${f?U+' '+f:'Karışık'}:${best[f]!=null?best[f]+'%':'—'}`).join(' · ')}</div>`;
  let f=0;
  $('#qd').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=+b.dataset.f;$('#qd').querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const start=n=>startQuiz(f,n);
  $('#go10').onclick=()=>start(10);$('#go20').onclick=()=>start(20);$('#goall').onclick=()=>start(999);
  $('#gow').onclick=()=>startQuiz(0,999,true);
}
function startQuiz(f,n,wrongOnly){
  const W=store.get('pz_wrong',[]);
  let pool=QUIZ.map((q,i)=>({...q,id:i})).filter(q=>wrongOnly?W.includes(q.id):(!f||q.d===f));
  pool=shuffle(pool).slice(0,n);
  qz={f,items:pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,order:idx,ans:idx.indexOf(q.a)}}),i:0,score:0,done:false,wrongOnly};
  drawQ();
}
function drawQ(){
  const el=$('#p-quiz');
  if(qz.i>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100);
    if(!qz.wrongOnly){const b=store.get('pz_best',{});if(b[qz.f]==null||pct>b[qz.f]){b[qz.f]=pct;store.set('pz_best',b)}}

    $('#again').onclick=()=>{qz=null;renderQuizHome()};return;
  }
  const q=qz.items[qz.i];
  el.innerHTML=`<div class="mute" style="margin-bottom:6px">${qz.i+1} / ${qz.items.length} · ${esc(DERS[q.d])}</div><div class="bar" style="margin-bottom:12px"><i style="width:${qz.i/qz.items.length*100}%"></i></div>
  <div class="card"><div style="font:600 18px/1.45 Georgia,serif;margin-bottom:8px">${esc(q.q)}</div><div id="opts">${q.order.map((oi,k)=>`<button class="opt" data-k="${k}">${esc(q.o[oi])}</button>`).join('')}</div><div id="fb" hidden></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    el.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)qz.score++;
    const W=store.get('pz_wrong',[]),has=W.includes(q.id);
    if(!ok&&!has)W.push(q.id);if(ok&&has)W.splice(W.indexOf(q.id),1);store.set('pz_wrong',W);
    const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<p style="margin:12px 0 4px"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':'Yanlış'}</b> — ${esc(q.w)}</p><button class="btn" id="nx">${qz.i+1>=qz.items.length?'Sonucu gör':'Sonraki'}</button>`;
    $('#nx').onclick=()=>{qz.i++;drawQ()};$('#nx').focus();
  });
}

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmt=x=>String(Math.round(x*1000)/1000).replace('.',','), N=x=>x.toLocaleString('tr-TR');

const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};

const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));

const GEN={
  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder (kök–sol–sağ)',T.pre],['inorder (sol–kök–sağ)',T.ino],['postorder (sol–sağ–kök)',T.post],['level order (seviye seviye)',T.lvl]]),a=fn(t);

  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(7,9));let t=null;v.forEach(x=>t=T.ins(t,x));

  postfix:{label:'Infix → postfix/prefix',f(){let i=0;const t=exprT(R(3,5),()=>'ABCDEFG'[i++],Object.keys(PR)),pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');
    return{q:`<b>${inf(t)}</b> ifadesinin <b>${pre?'prefix':'postfix'}</b> karşılığını yaz.`,type:'txt',a,show:a,sol:`${pre?'Prefix':'Postfix'}: <b>${a}</b>. En son yapılan işlem (${t.op}) ${pre?'en başa':'en sona'} yazılır; parantez içleri önce kendi ${pre?'prefix':'postfix'} haline getirilir.`}}},
  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);

  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;
    for(let i=0,n=R(6,9);i<n;i++){if(ds.length&&Math.random()<.35){last=S?ds.pop():ds.shift();ops.push(S?'pop()':'dequeue()')}else{const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}}

  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,3);

  gsyih:{label:'GSYİH/GSMH · faktörler',f(){

  freq:{label:'Frekans tablosu',f(){const n=R(15,20),d=[...Array(n)].map(()=>R(0,5)),cnt=[0,1,2,3,4,5].map(v=>d.filter(x=>x===v).length),v=R(0,4),k=R(0,2);

    if(Math.random()<.6){const x=R(mu-2*sd,mu+2*sd),z=(x-mu)/sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. <b>${x}</b> alan öğrencinin <b>z skoru</b> kaçtır?`,type:'num',a:z,sol:`z = (X − μ) / σ = (${x} − ${mu}) / ${sd} = ${fmt(z)} → ${z>0?'ortalamanın üstünde':z<0?'ortalamanın altında':'tam ortalamada'}.`}}
    const z=pick([-2,-1.5,-1,-.5,.5,1,1.5,2,2.5]),x=mu+z*sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. z skoru <b>${fmt(z)}</b> olan öğrencinin <b>ham puanı</b> kaçtır?`,type:'num',a:x,sol:`X = μ + z·σ = ${mu} + (${fmt(z)}) × ${sd} = ${fmt(x)}`}}},
  empirical:{label:'Normal dağılım görgül kural',f(){const mu=R(10,14)*5,sd=pick([5,8,10,12,15]),n=pick([200,400,1000,2000,4000]);
    const [z1,z2,p]=pick([[-1,1,68],[0,1,34],[-2,2,95],[1,2,13.5],[-2,-1,13.5],[0,2,47.5],[-3,3,99.7],[1,9,16],[-9,-1,16],[2,9,2.5],[-1,2,81.5]]);
    const lo=mu+z1*sd,hi=mu+z2*sd,desc=z1===-9?`${hi} ve altında`:z2===9?`${lo} ve üstünde`:`${lo} ile ${hi} arasında`,c=Math.random()<.5,a=c?n*p/100:p,zs=z=>z===-9?'−∞':z===9?'+∞':(z>0?'+':'')+z;
    return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>${c?`, N = <b>${N(n)}</b>`:''}. <b>${desc}</b> not alanların ${c?'<b>sayısı</b>':'<b>yüzdesi</b>'} yaklaşık kaçtır?`,type:'num',a,
      sol:`z aralığı: ${zs(z1)} ile ${zs(z2)}. ±1σ ≈ %68 (yarısı %34), ±2σ ≈ %95 (yarısı %47,5), ±3σ ≈ %99,7, ortalamanın her iki yanı %50 → %${fmt(p)}${c?` → ${N(n)} × ${fmt(p/100)} = ${fmt(a)}`:''}`}}}
};
let gq=null,gsel=store.get('pz_gsel','all');
if(gsel!=='all'&&!GENS.includes(gsel))gsel='all';
function renderGen(){
  const st=store.get('pz_gen',{});
  $('#p-gen').innerHTML=`<div class="card"><div class="row" id="gch">`+['all',...GENS].map(g=>`<button class="chip" aria-pressed="${gsel===g}" data-g="${g}">${g==='all'?'Karışık':GEN[g].label}${st[g]?` · ${st[g][0]}/${st[g][1]}`:''}</button>`).join('')+`</div>
  <p class="mute" style="margin:10px 0 0">Sorular her seferinde rastgele sayılarla yeniden üretilir — sınırsız alıştırma. Ondalıkta virgül ya da nokta kullanabilirsin; nihai cevabı virgülden sonra 3 basamağa yuvarla.</p></div><div id="gbox"></div>`;
  $('#gch').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gsel=b.dataset.g;store.set('pz_gsel',gsel);gq=null;renderGen()});
  if(!gq)newGen();drawGen();
}
function newGen(){const g=gsel==='all'?pick(GENS):gsel;gq={g,...GEN[g].f(),done:false}}
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9+\-*/]/g,'');
function parseNum(s){s=String(s).trim().replace(/[%\s]/g,'').replace('−','-');if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))}
function drawGen(){
  const q=gq,b=$('#gbox');
  const inp=q.type==='mc'?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :`<div class="row"><input id="gin" class="gin" autocomplete="off" inputmode="${q.type==='num'?'decimal':'text'}" placeholder="${q.type==='num'?'Sayı (ör. 2,5)':'Cevabın (ör. A, B, C)'}"><button class="btn" id="gchk">Kontrol et</button></div>`;
  b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div>${inp}<div id="gfb"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>checkGen(+x.dataset.i));
  const gin=$('#gin');
  if(gin){$('#gchk').onclick=()=>checkGen(gin.value);gin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gq.done?nextGen():checkGen(gin.value)}};gin.focus()}
  $('#gshow').onclick=()=>{gq.done=true;showSol(null)};$('#gnext').onclick=nextGen;
}
function nextGen(){newGen();renderGen()}
function checkGen(v){
  if(gq.done)return;
  if(gq.type!=='mc'&&String(v).trim()==='')return;
  gq.done=true;
  const ok=gq.type==='mc'?v===gq.a:gq.type==='num'?Math.abs(parseNum(v)-gq.a)<=Math.max(.0015,Math.abs(gq.a)*1e-4):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':'Yanlış'}</b>${ok?'':` — doğru cevap: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){
  const s=cs(),counts=[0,0,0,0,0,0];
  CARDS.forEach((_,i)=>counts[(s[i]||{box:1}).box]++);
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));
  const weak=CARDS.map((c,i)=>({...c,id:i,box:(s[i]||{box:1}).box})).filter(c=>c.box<=2&&s[c.id]).slice(0,8);
  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=()=>{if(confirm('Kart, test, alıştırma ve plan ilerlemesi silinsin mi?')){['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
