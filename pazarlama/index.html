  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,5);
    if(k===4){const s=R(20,200)*10,a=R(1,20),i=Math.round(s*a/100);return{q:`Bir ayda <b>${N(s)}</b> sipariş satıldı, bunların <b>${N(i)}</b> tanesi iade edildi. <b>İade oranı</b> yüzde kaçtır?`,type:'num',a:i/s*100,sol:`İade oranı = iade edilen / satılan × 100 = ${N(i)} / ${N(s)} × 100 = %${fmt(i/s*100)}`}}
    if(k===5){const t=R(20,200)*10,z=Math.round(t*R(70,99)/100);return{q:`<b>${N(t)}</b> sipariş teslim edildi; bunların <b>${N(z)}</b> tanesi söz verilen zamanda ulaştı. <b>Zamanında teslimat oranı</b> yüzde kaçtır?`,type:'num',a:z/t*100,sol:`Zamanında teslimat = söz verilen zamanda teslim / toplam teslim × 100 = ${N(z)} / ${N(t)} × 100 = %${fmt(z/t*100)}`}}
    if(k===0){const v=R(20,200)*1000,s=Math.round(v*R(5,40)/1000),a=s/v*100;return{q:`Bir e-ticaret sitesi ayda <b>${N(v)}</b> ziyaret ve <b>${N(s)}</b> sipariş alıyor. <b>Dönüşüm oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Dönüşüm = sipariş / ziyaret × 100 = ${N(s)} / ${N(v)} × 100 = %${fmt(a)}`}}
    if(k===1){const o=R(5,50)*100,a=R(15,120)*10;return{q:`Aylık gelir <b>${N(o*a)} TL</b>, sipariş sayısı <b>${N(o)}</b>. <b>Ortalama sipariş değeri (AOV)</b> kaç TL'dir?`,type:'num',a,sol:`AOV = gelir / sipariş = ${N(o*a)} / ${N(o)} = ${N(a)} TL`}}
    if(k===2){const m=R(5,40)*100,a=R(5,60)*10;return{q:`Pazarlamaya <b>${N(m*a)} TL</b> harcanarak <b>${N(m)}</b> yeni müşteri kazanıldı. <b>Müşteri edinme maliyeti (CAC)</b> kaç TL'dir?`,type:'num',a,sol:`CAC = pazarlama harcaması / yeni müşteri = ${N(m*a)} / ${N(m)} = ${N(a)} TL`}}

  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);

  gsyih:{label:'GSYİH/GSMH · faktörler',f(){

  freq:{label:'Frekans tablosu',f(){const n=R(15,20),d=[...Array(n)].map(()=>R(0,5)),cnt=[0,1,2,3,4,5].map(v=>d.filter(x=>x===v).length),v=R(0,4),k=R(0,2);

  central:{label:'Ortalama · medyan · mod',f(){let d,mode;do{d=[...Array(R(7,12))].map(()=>R(1,15));const c={};d.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c)),m=Object.keys(c).filter(k=>c[k]===mx);mode=m.length===1&&mx>1?+m[0]:null}while(mode==null);
    const s=[...d].sort((a,b)=>a-b),n=d.length,med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,mean=sum(d)/n;

  weighted:{label:'Ağırlıklı ortalama',f(){const k=R(0,4),wm=(x,w)=>sum(x.map((v,i)=>v*w[i]))/sum(w),
      ws=(x,w)=>`x̄ = Σ(w·x) / Σw = (${x.map((v,i)=>`${N(v)} × ${N(w[i])}`).join(' + ')}) / (${w.map(N).join(' + ')}) = ${fmt(sum(x.map((v,i)=>v*w[i])))} / ${N(sum(w))} = <b>${fmt(wm(x,w))}</b>`;

    if(k===1){const ds=shuf(['Matematik','İstatistik','Muhasebe','İktisat','Hukuk','Pazarlama','İşletme']).slice(0,R(3,5)),w=ds.map(()=>pick([2,3,4,5,6])),x=ds.map(()=>pick([1,1.5,2,2.5,3,3.5,4]));

    if(k===3){const x=[...Array(R(3,4))].map(()=>R(4,24)*5),w=x.map(()=>R(5,40));

    const nm=['1. kısa sınav','2. kısa sınav','Ödev','Vize','Final'],w=pick([[1,1,1,2,3],[1,1,2,3,5],[1,1,1,3,4],[2,2,1,4,6]]),x=nm.map(()=>R(30,100));
    return{q:`Bir derste notlar katsayılarla hesaplanıyor:`+tbl(['Değerlendirme','Katsayı','Not'],nm.map((s,i)=>[s,w[i],x[i]]))+`Öğrencinin <b>ağırlıklı ortalaması</b> kaçtır?`,type:'num',a:wm(x,w),sol:ws(x,w)+`<br>Katsayıların toplamı ${sum(w)}, 1 değil → Σw'ye bölünür.`}}},
  spread:{label:'Ranj · OMS · varyans · s.sapma',f(){let d,n;do{n=R(4,6);d=[...Array(n)].map(()=>R(1,20))}while(sum(d)%n);

    return{q:`Veri (ana kütle): <div class="raw">${d.join(', ')}</div><b>Ranj, ortalama mutlak sapma (OMS), varyans ve standart sapmayı</b> bul.`,type:'multi',fields:[['Ranj',Math.max(...d)-Math.min(...d)],['OMS',sum(dv.map(Math.abs))/n],['Varyans (σ²)',ss/n],['Standart sapma (σ)',Math.sqrt(ss/n)]],

  zscore:{label:'z skoru',f(){const mu=R(40,70),sd=R(5,15),k=R(0,6),Z=()=>pick([-2,-1.5,-1,-.5,.5,1,1.5,2,2.5]);
    if(k===0){const x=R(mu-2*sd,mu+2*sd),z=(x-mu)/sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. <b>${x}</b> alan öğrencinin <b>z skoru</b> kaçtır?`,type:'num',a:z,sol:`z = (X − μ) / σ = (${x} − ${mu}) / ${sd} = ${fmt(z)} → ${z>0?'ortalamanın üstünde':z<0?'ortalamanın altında':'tam ortalamada'}.`}}
    if(k===1){const z=Z(),x=mu+z*sd;return{q:`Ortalama <b>${mu}</b>, standart sapma <b>${sd}</b>. z skoru <b>${fmt(z)}</b> olan öğrencinin <b>ham puanı</b> kaçtır?`,type:'num',a:x,sol:`X = μ + z·σ = ${mu} + (${fmt(z)}) × ${sd} = ${fmt(x)}`}}
    if(k===2){const z=Z(),x=mu+z*sd;return{q:`Bir sınavın ortalaması <b>${mu}</b>. <b>${fmt(x)}</b> alan öğrencinin z skoru <b>${fmt(z)}</b>. Sınavın <b>standart sapması</b> kaçtır?`,type:'num',a:sd,sol:`z = (X − μ) / σ → σ = (X − μ) / z = (${fmt(x)} − ${mu}) / ${fmt(z)} = ${fmt(x-mu)} / ${fmt(z)} = ${sd}`}}
    if(k===3){const z=Z(),x=mu+z*sd;return{q:`Standart sapması <b>${sd}</b> olan bir sınavda <b>${fmt(x)}</b> alan öğrencinin z skoru <b>${fmt(z)}</b>. Sınavın <b>ortalaması</b> kaçtır?`,type:'num',a:mu,sol:`μ = X − z·σ = ${fmt(x)} − (${fmt(z)}) × ${sd} = ${fmt(x)} − (${fmt(z*sd)}) = ${mu}`}}
    if(k===4){const z=Z(),x=mu+z*sd,m2=R(10,20)*5,s2=pick([5,8,10,12,15,20]),a=m2+z*s2;
      return{q:`Ali A sınavından <b>${fmt(x)}</b> aldı (μ = ${mu}, σ = ${sd}). B sınavında (μ = <b>${m2}</b>, σ = <b>${s2}</b>) <b>aynı göreli başarıyı</b> göstermesi için kaç puan alması gerekir?`,type:'num',a,sol:`Aynı göreli başarı = aynı z skoru. z = (${fmt(x)} − ${mu}) / ${sd} = ${fmt(z)} → X_B = μ_B + z·σ_B = ${m2} + (${fmt(z)}) × ${s2} = ${fmt(a)}`}}
    if(k===5){const P=[-1,-.5,0,.5,1,1.5,2],ma=R(10,14)*5,mb=R(10,14)*5,sa=2*R(3,7),sb=2*R(3,7);let za,zb;do{za=pick(P);zb=pick(P)}while(za===zb);const xa=ma+za*sa,xb=mb+zb*sb;
      return{q:`Ayşe matematikten <b>${xa}</b> (sınıf μ = ${ma}, σ = ${sa}), Türkçeden <b>${xb}</b> (sınıf μ = ${mb}, σ = ${sb}) aldı. <b>Sınıfına göre</b> hangi derste daha başarılıdır?`,type:'mc',opts:['Matematik','Türkçe','İkisinde eşit'],a:za>zb?0:1,
        sol:`z_mat = (${xa} − ${ma}) / ${sa} = ${fmt(za)} · z_tür = (${xb} − ${mb}) / ${sb} = ${fmt(zb)} → z'si büyük olan derste göreli olarak daha başarılıdır. Ham puanlar farklı ölçeklerde olduğu için doğrudan karşılaştırılmaz.`}}
    const [q,o,s]=pick([

      ['z = −1,5 ne anlatır?',['Değer ortalamanın 1,5 standart sapma altındadır','Değer ortalamadan 1,5 puan düşüktür','Değer en düşük %15\'lik dilimdedir','Değer ortalamanın 1,5 standart sapma üstündedir'],'z, ortalamadan kaç standart sapma uzakta olunduğunu gösterir; eksi işareti ortalamanın altında demektir.'],
      ['z skorunun birimi nedir?',['Birimsizdir','Ham puanla aynı birimdedir','Yüzdedir','Ham puan biriminin karesidir'],'(X − μ) / σ işleminde pay ile payda aynı birimde olduğu için birim sadeleşir. Bu sayede farklı ölçekler karşılaştırılabilir.'],
      ['Ham puanı ortalamaya eşit olan bir kişinin z skoru kaçtır?',['0','1','−1','Ortalamaya eşittir'],'X = μ ise X − μ = 0, yani z = 0.'],

  empirical:{label:'Normal dağılım görgül kural',f(){const mu=R(10,14)*5,sd=pick([5,8,10,12,15]),n=pick([200,400,1000,2000,4000]),k=R(0,4),
      KUR='±1σ ≈ %68 (yarısı %34), ±2σ ≈ %95 (yarısı %47,5), ±3σ ≈ %99,7 (yarısı %49,85), ortalamanın her iki yanı %50',ORTA=[[1,68],[2,95],[3,99.7]];

      const lo=mu+z1*sd,hi=mu+z2*sd,desc=z1===-9?`${hi} ve altında`:z2===9?`${lo} ve üstünde`:`${lo} ile ${hi} arasında`,c=Math.random()<.5,a=c?n*p/100:p,zs=z=>z===-9?'−∞':z===9?'+∞':(z>0?'+':'')+z;

        sol:`z aralığı: ${zs(z1)} ile ${zs(z2)}. ${KUR} → %${fmt(p)}${c?` → ${N(n)} × ${fmt(p/100)} = ${fmt(a)}`:''}`}}
    if(k===1){const [z,p]=pick(ORTA);

    if(k===2){const [z,p]=pick(ORTA),lo=mu-z*sd,hi=mu+z*sd;

    const [z,p,how]=pick([[-2,2.5,'%50 − %47,5'],[-1,16,'%50 − %34'],[0,50,'tam ortalama → %50'],[1,84,'%50 + %34'],[2,97.5,'%50 + %47,5'],[3,99.85,'%50 + %49,85']]),x=mu+z*sd;

function renderGen(){

  <p class="mute" style="margin:10px 0 0">Sorular her seferinde rastgele sayılarla yeniden üretilir — sınırsız alıştırma. Ondalıkta virgül ya da nokta kullanabilirsin; nihai cevabı virgülden sonra 3 basamağa yuvarla.</p></div><div id="gbox"></div>`;
