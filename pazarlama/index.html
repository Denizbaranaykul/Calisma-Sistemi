<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pazarlama</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.avl .nd{cursor:pointer}.avl .nd.sel circle{fill:var(--accent)}.avl .nd.sel text{fill:var(--accent-ink)}
.avl .nd.bad circle{stroke:var(--bad);stroke-width:3.5}.avl .bf{font-size:11px;fill:var(--mute);text-anchor:start}.avl .nd.bad .bf{fill:var(--bad);font-weight:700}
.avl.anim line{animation:avfade .4s ease .35s both}@keyframes avfade{from{opacity:0}}
.seqc{display:inline-block;min-width:30px;text-align:center;padding:2px 8px;border-radius:6px;margin:2px;background:var(--soft);font-weight:600}.seqc.done{opacity:.4;text-decoration:line-through}.seqc.next{background:var(--accent);color:var(--accent-ink)}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>

<header>

<section class="panel" id="p-cards"></section>
<section class="panel" id="p-quiz"></section>

</div>

<script>
const CARDS = [{"d": 1, "t": "Bölümlendirme", "f": "Pazar bölümlendirme pazarlamada neden bu kadar önemli?", "b": "4P'yi (ürün, fiyat, dağıtım, tutundurma) herkese değil, belirli bir hedef kitleye ulaştırmak zorundayız. Hedef kitle yanlış kesilirse tüm çaba boşa gider. Örnek: 80 milyon kişiden ayakkabı → cinsiyet → yaş → ilgi → fiyat segmenti ile ~50 bin kişilik hedef kitle."}, {"d": 1, "t": "Bölümlendirme", "f": "Pazar bölümlendirmede 5 kriter nedir?", "b": "1) Coğrafi 2) Demografik 3) Davranışsal 4) Fayda 5) Psikografik (psikolojik). Hepsini ayrı ayrı yapmayız; yapabildiğimiz kadarını birlikte kullanırız."}, {"d": 1, "t": "Bölümlendirme", "f": "Coğrafi bölümlendirme nedir? Örnek ver.", "b": "Fiziksel uzaklık/yakınlık, kişinin yaşadığı bölgeye göre ayırma. Örnek: kampüs çevresindeki kafeler öğrenciye hitap eder; kar sporu ürünleri Erzurum gibi dağlık bölgede satılır (Afrika'da snowboard satılmaz). Dijitalde: ülkeler arası yasa/kısıtlar bazı ürünleri bazı ülkelerde satmayı engeller."}, {"d": 1, "t": "Bölümlendirme", "f": "Demografik bölümlendirme nedir? Avantaj ve dezavantajı?", "b": "Cinsiyet, yaş, eğitim, gelir, meslek. En basit ve en kolay toplanan veri (anketler). Avantaj: kolay toplanır, çok eskimez (10 yıl sonra yaş/cinsiyet hâlâ tahmin edilebilir). Dezavantaj: demografisi aynı olanlar aynı şeyi tüketmez (herkesin tarzı/yaşam şekli farklı) → tek başına yetmez."}, {"d": 1, "t": "Bölümlendirme", "f": "Davranışsal bölümlendirme nedir ve bugün neden çok önemli?", "b": "Kişinin ne tükettiğine, satın alma geçmişine, ürünü nasıl kullandığına bakar. Eskiden veri toplamak çok zordu (çöp karıştırmak gerekirdi); bugün dijital izler, market indirim kartları, büyük veri analizi ile toplanıyor. 4P kararlarında (fiyat, indirim, tutundurma) geri bildirim sağlar."}, {"d": 1, "t": "Bölümlendirme", "f": "Davranışsal verinin en büyük zayıflığı nedir?", "b": "Çok hızlı eskir: yaklaşık 3-4 yılda yaşam değişir (lise→üniversite→iş→aile) ve davranışlar da değişir. Bu yüzden davranış verisi güncel/taze toplanmalıdır."}, {"d": 1, "t": "Bölümlendirme", "f": "Fayda bölümlendirmesi nedir? Örnek?", "b": "İnsanlar aynı ürünü farklı fayda için satın alır. Ceket örneği: soğuktan korunma (termal), moda/tarz, güvenlik (kayak montu). Müzik örneği: koleksiyoncu vs internetten dinleyen. Müşterinin ürünümüzden ne beklediğini anlamak gerekir."}, {"d": 1, "t": "Bölümlendirme", "f": "Psikografik (psikolojik) bölümlendirme neyi kapsar?", "b": "Yaşam tarzı, inançlar, değerler, kişilik, ilgi alanları ve hobiler. Örnekler: inanca göre tüketim (domuz/inek eti), spor ilgisi (koşu ürünleri), fit yaşam (besin etiketi okuma), çevrecilik (doğaya zararsız ürün)."}, {"d": 1, "t": "Bölümlendirme", "f": "Psikografik verinin toplanması neden zordur?", "b": "İnsanların içi görünmez ('kara kutu'). Anketlerde fikirleri öğrenilecek diye yanlış cevap verirler; gözlemlendiklerinde farklı davranırlar. Karakter yavaş değişir (hızlı eskimez) ama veriyi bulmak zordur. Bir tişört (Greenpeace) bile güvenilir ipucu değildir."}, {"d": 1, "t": "Bölümlendirme", "f": "Hangi bölümlendirme verisi hızlı eskir, hangisi yavaş?", "b": "Davranışsal: çok hızlı eskir. Demografik: çok az eskir. Psikografik: yavaş değişir (kişilik kolay kırılmaz, güncellenir)."}, {"d": 1, "t": "Bölümlendirme", "f": "Persona (profil çıkarma) nedir, nasıl yapılır?", "b": "Hedef pazar içinden birbirinden farklı yaklaşık 5 kurgusal kişi tahmin edilir; bunların davranış ve ihtiyaçları empatiyle çıkarılır. Örnek (futbol kulübü): 30-45 yaş, her maça gelen, her sene yeni forma alan, sosyal medyada yorum yapan taraftar vs 16-23 yaş genç, bayrak sallayan taraftar. Doğru profil → daha iyi sonuç."}, {"d": 1, "t": "İş Modelleri", "f": "B2C nedir? Hangi ürünler örnektir?", "b": "Business to Consumer: işletmeden tüketiciye. Kitlesel, genelde üretim maliyeti düşük ürünler; marketler, AVM'lerde satılanlar. Örnek sektörler: gıda, tekstil, oyuncak."}, {"d": 1, "t": "İş Modelleri", "f": "Niş B2C'yi tanımlayan iki özellik nedir?", "b": "1) Çok üst kalite ürün, tüketicisi çok zengin. 2) Az ihtiyaç duyulan ürün, küçük pazar. Örnekler: çok lüks otomobil (yılda ~25 adet), tekerlekli sandalye, gelişmiş işitme cihazı/implant."}, {"d": 1, "t": "İş Modelleri", "f": "B2B'nin B2C'den farkları nelerdir?", "b": "Alıcı da satıcı da şirkettir. Satın almalar devasa miktarlarda ve profesyonel, standartlara bağlıdır. İletişimi satın alma görevlisi/yöneticiler kişisel kurar (Ahmet Bey–Mehmet Bey); B2C'deki anonim çağrı merkezi yoktur. TV reklamı gibi kitle tutundurması gereksizdir (izleyenlerin çoğunun ihtiyacı yok)."}, {"d": 1, "t": "İş Modelleri", "f": "Abonelik tabanlı iş modeli nedir? Örnek?", "b": "Ürünü kullandıkça belirli aralıklarla (aylık/yıllık) düzenli ödeme yapılır; kira mantığı. Örnekler: antivirüs programları, güncelleme/yıllık lisans, Netflix. İnternetin ilk döneminde yaygındı; popülerliği bugün biraz azaldı."}, {"d": 1, "t": "İş Modelleri", "f": "Freemium modeli nedir, nasıl doğdu?", "b": "Ürünün temel kısmı ücretsiz, ek fayda isteyen öder. 2006 sonrası Asya'da online oyun sektöründe hızlandı, sonra dünya geneline yayıldı. Örnekler: Spotify (reklamsız/istediğin şarkı), YouTube Premium (reklamsız, 4K, arka plan)."}, {"d": 1, "t": "İş Modelleri", "f": "Freemium'un asıl amacı nedir? (YouTube örneği)", "b": "Kullanıcıyı üründen koparmamak ve reklam gelirini korumak. YouTube herkesi ücretli yapsa kullanıcılar alternatife geçer, reklam geliri kaybolur; reklam geliri kaybeden sosyal medya birkaç yılda ölür. Amaç: reklam izlemeyi kabul edenleri tutarken, para verenlere ek fayda sunmak."}, {"d": 1, "t": "İş Modelleri", "f": "Mikro işlem (microtransaction) nedir?", "b": "Ürün ücretsizdir ama içinde küçük küçük satın alımlar yapılır. Örnek: oyunda takıldığın bölümü geçmek için kristal/şeker satın almak."}, {"d": 1, "t": "Vaka", "f": "Facebook vakası: sorun neydi, çözüm iş modeli neydi?", "b": "Çok hızlı büyüdü, sunucu parası yetmedi. Çözüm: işletme sayfaları (markalar profil açar, takipçilerle iletişim kurar) + buna uygun reklam gösterimi. Şirketler çok kişi olduğu için Facebook'a para verdi. Doğru iş modeli sayesinde ayakta kaldı (Meta: WhatsApp, Instagram)."}, {"d": 1, "t": "Vaka", "f": "Google vakası: Google parasını nasıl kazanmaya başladı?", "b": "Başta arama sonuçlarında reklam yoktu, para kazanmıyordu. Çözüm: AdWords — arama sonuçlarının tepesine, aranan kelimeye göre reklam (ücretli aramalar; bugün 'sponsorlu' yazan ilk sonuçlar). Bu fikir Google'ı dünyanın en büyük teknoloji şirketlerinden biri yaptı."}, {"d": 1, "t": "Vaka", "f": "Word of mouth (ağızdan ağıza pazarlama) nedir? Google'ın örneği?", "b": "Ürünün kalite ve güveninin insanlar arasında konuşularak yayılması; aşırı reklam yerine. Gmail örneği: herkes üye olamazdı, davetiye/referans linki ile açılırdı; 10 yıllık stratejiyle büyüdü."}, {"d": 1, "t": "Küresel Dijital", "f": "Başka ülkede dijital faaliyet göstermeden önce nelerin bilinmesi gerekir?", "b": "Hukuki sistem, kültür, dil, yaşam tarzı; altyapı (internet hızı 3G/5G, elektrik), kullanılan cihaz ve işletim sistemi; insanların çalışma saatleri ve haftalık düzeni (reklamı doğru saate koymak için); hava durumu, milli maç gibi olaylar."}, {"d": 1, "t": "Küresel Dijital", "f": "Mobil neden bu kadar önemlidir?", "b": "İnsanlar telefonu her yerde yanında taşır. Eskiden televizyon/gazete karşısına geçmeleri beklenirdi; artık kimse bir şey beklemiyor, mobil sayesinde her saat, her yerde ulaşılabiliyorlar. Mobil teknolojiyi kullanmak büyük önem taşır."}, {"d": 1, "t": "Küresel Dijital", "f": "'Ben sadece Türkiye'de dijital satış yaparım' demek neden mümkün değildir?", "b": "Küreselleşme: müşteri sizden değil başka ülkedeki bir firmadan alabilir. Ayrıca herkesin aynı dijital iletişim kanalına/altyapıya sahip olmadığını bilmek gerekir (ebeveyn–genç farkı, ülkeden ülkeye cihaz ve internet farkı)."}, {"d": 2, "t": "Dijital Dönüşüm", "f": "Ders 2'nin ana sorusu nedir?", "b": "Teknoloji hızla ilerlerken şirketler yeni teknolojiyi hemen kullanmalı mı, uzak mı durmalı, ne zaman geçmeli? Dijital pazarlamada/dijital dönüşümde karşılaşılan engeller."}, {"d": 2, "t": "Dijital Dönüşüm", "f": "Tüketici yeni teknolojiye şirketten neden daha kolay uyum sağlar?", "b": "Tek kişidir; kötü giderse uygulamayı kapatır/alternatife geçer (WhatsApp bozulursa Telegram). Şirket ise sipariş, müşteri iletişimi, personel uyumu, cihaz uyumu ve masraf riski yaşar; bir şirketin 1-2 hafta çalışmaması iflasa/icraya yol açabilir."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Teknoloji adaptasyon eğrisinin 5 grubunu sırayla say.", "b": "1) Yenilikçiler (innovators) 2) Erken benimseyenler (early adopters) 3) Erken çoğunluk (early majority) 4) Geç çoğunluk (late majority) 5) Gecikenler/direnenler (laggards). Eğri normal dağılım şeklindedir; çoğunluk ortadadır."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Yenilikçiler (innovators) kimlerdir?", "b": "Yeni teknoloji çıkar çıkmaz denemek isteyen, risk almayı seven ve parası olan kişiler/şirketler. Örnek: ilk elektrikli araba alanlar; şarj altyapısı yokken stres ve sıkıntı çektiler."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Erken benimseyenler (early adopters) yenilikçilerden nasıl ayrılır?", "b": "Yeni teknolojiye sıcaktırlar, araştırır okurlar ama hemen koşup almazlar; 'biraz kullanılsın, sonra geçeriz' derler. Daha mantıklı ve temkinlidirler. Yenilikçilerden hemen sonra gelirler."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Erken çoğunluk, geç çoğunluk ve gecikenler arasındaki fark nedir?", "b": "Erken çoğunluk: teknolojiyi nispeten denemeye istekli, altyapı oturunca geçer. Geç çoğunluk: daha geç, iyice bekler, teknolojiye mesafelidir. Gecikenler (laggards): direnir, mecbur kalınca (uygulama zorunluluğu, cihaz bozulması) kullanır; onlara yeni şeyi sunmak zordur."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Şirketler de bu eğrideki gruplara ayrılır mı?", "b": "Evet. Bazı şirketler yenilikçidir (her şeyi ilk kez dener), bazıları erken benimseyen, erken çoğunluk vb. olur. Sorunun cevabı 'hangisi daha iyi' değil, avantaj/dezavantajları tartmaktır."}, {"d": 2, "t": "Öncü Avantajı", "f": "Pazara ilk girmenin (first mover) avantajı nedir?", "b": "Rakip yoktur; tek başına çok para kazanır, pazarın kaymağını alır; özellikle taklit edilemiyorsa güçlüdür. WhatsApp örneği: ilk girenlerin şansı büyük."}, {"d": 2, "t": "Öncü Avantajı", "f": "Yenilikçi olmanın dezavantajı nedir? Örnekler?", "b": "Önde gidenler hataları ilk yapar; arkadan gelenler bu hatalardan ders çıkarıp onları geçebilir. Örnekler: Nokia (2012'de hâlâ ilk 20'de) → Apple arkadan gelip geçti. Story özelliği önce Snapchat'te çıktı, Instagram uyarlayıp (müzik, yazı ekleyerek) daha başarılı oldu."}, {"d": 2, "t": "Öncü Avantajı", "f": "British Gas hashtag örneğinden ne öğreniyoruz?", "b": "Enerji firması sosyal medya başlangıcında tüketiciyle iletişim için hashtag kampanyası açtı; aynı dönemde fiyat zammı geldi, hashtag şikâyet alanına döndü ve kampanya kaldırıldı. Ders: yenilikçi davranırken riski görememek zarar verir; arkadan gelenler tecrübeyi izleyip sessiz kalmayı seçti."}, {"d": 2, "t": "Öncü Avantajı", "f": "Patent ve marka her şeyi korur mu? Hangi sonuca varıyoruz?", "b": "Hayır. Fikir/özellik (ör. story) patentlenemez; yazılımda kodun telifi vardır ama fikri ve mekaniği başkası sıfırdan yazabilir; patent ülkeye göre değişir ve zordur. Sonuç: taklit edilmesi zor şey üret ya da patentlenebilir bir şey bul; hızlı ilerle."}, {"d": 2, "t": "Riskler", "f": "Yeni teknolojide neden 'geri dönüş planı' (rollback) şarttır?", "b": "Yeni teknoloji zarar verebilir (hata, üretim bozulması). Banka örneği: güncellenen uygulama 2-3 gün açılmadı, milyonlar işlem yapamadı; banka eski sürüme dönüp hataları düzeltti, haftalar sonra yeniden yayınladı. Eski sistem güvencedir; hemen terk edilmez (fabrika ayarı, Windows geri yükleme gibi)."}, {"d": 2, "t": "Yetenek Açığı", "f": "Yetenek açığını kapatmanın iki yolu nedir?", "b": "1) Mevcut personeli eğitmek 2) Yeni personel istihdam etmek. (Bonus: şirket içinde bu işi zaten bilen gizli yetenek aramak.)"}, {"d": 2, "t": "Yetenek Açığı", "f": "Mevcut personeli eğitmenin avantaj ve dezavantajları?", "b": "Avantaj: ek maaş yok, sadece eğitim masrafı; personel nitelikli hale gelir; yeni gelen yüzünden motivasyon düşmez; sözleşmeyle rakibe gitmesi engellenebilir (~2 yıl). Dezavantaj: eğitim 1-3 ay sürer; eğitim sonrası da tecrübe eksik kalır; hızlı aksiyon gerekiyorsa yetmez."}, {"d": 2, "t": "Yetenek Açığı", "f": "Yeni personel almanın avantaj ve dezavantajları?", "b": "Avantaj: deneyimli (ör. 10 yıllık) kişi hızlı sonuç verir, kampanya çökerken erken müdahale eder, çözüm ve tecrübe getirir. Dezavantaj: sıfırdan maaş, maliyetli; mevcut personelin motivasyonu düşer, ayağını kaydırma/iş kaybı korkusu doğar."}, {"d": 2, "t": "Yetenek Açığı", "f": "Ne zaman yeni kişi alınır, ne zaman mevcut personel eğitilir?", "b": "Acele varsa/fırsat penceresi kısaysa (hızlı aksiyon) → yeni, deneyimli personel. Zaman varsa ve hazırlık yapılabiliyorsa → mevcut personeli eğitmek. Kampanya, 'Mahmut Bey'in tecrübe tahtası' olmamalı: tecrübesiz kişiye büyük bütçeli kampanya yüklenmez."}, {"d": 2, "t": "Bütçe", "f": "Bütçe kısıtında departmanlar arasında ne olur?", "b": "Yeni teknoloji bedava değildir; parası bir yerden çıkar. Muhasebe, finans, üretim, pazarlama, Ar-Ge, dış ticaret kendi bütçesini korumak ister; kimse parasını vermek istemez, bir departmanın bütçesi başka departman teknolojisine kayabilir."}, {"d": 2, "t": "Bütçe", "f": "Yeni teknoloji projesini iptalden nasıl korursun?", "b": "Projeyi bölümlere ayır, küçük başarı noktaları (milestone / kilometre taşı) belirle ve iyi giden sonuçları (tüketici tepkisi, personel öğrenmesi, algoritma performansı) yönetime düzenli göster. Başarılı projeyi iptal etmek isteyen az olur; iptal edilecek ilk proje seninki olmasın."}, {"d": 2, "t": "Bütçe", "f": "Projelerin iptal edilme nedenleri nelerdir?", "b": "Rakip girişi/rekabet, ekonomik kriz, borsa çöküşü, makro olaylar (savaş, petrol fiyatı), CEO/yönetici değişimi (yeni yönetici kendi ekibini ister), yönetimin tutuculuğu/teknolojiyi bilmemesi (kibir, yaş-teknoloji uçurumu). Çoğu senin elinde değildir; amaç iptal edilmemek."}, {"d": 2, "t": "Düzenlemeler", "f": "Dijital pazarlamada düzenlemeler (regülasyonlar) neyi belirler, örnek kurumlar?", "b": "Hukuki altyapı: internette ne yapılabilir/yapılamaz. Örnekler (derste): ABD'de FCC, İngiltere'de ASA (Advertising Standards Authority), Türkiye'de Ticaret Bakanlığı ve BTK. (Not: derste Çin için söylenen kurum adı transkriptte net değil, doğrula.)"}, {"d": 2, "t": "Düzenlemeler", "f": "Düzenlemelerin alt başlıkları ve örnekleri nelerdir?", "b": "Çerez (cookie) onayı (ülkeye göre zorunlu onay vs. gezinmeyi kabul sayma), gizlilik/veri koruma, konum paylaşımı, çocukların korunması (Disney'in çocuk konumu gösterme uygulaması → ceza), 18 yaş altıyla yazışma kısıtları, bulut depolama güvenliği (iCloud fotoğraf sızıntısı)."}, {"d": 2, "t": "Düzenlemeler", "f": "Platformlara/ülke düzenlemelerine bağımlılık neden risktir?", "b": "Platformlar bir ülkeden çekilebilir ya da yasaklanabilir (Discord örneği, Facebook/Twitter ofis krizi); ödeme hizmetleri ülkeden ülkeye değişir. Tek bir yere kendini bağlama; internet her şey yasaklanabilir ya da açılabilir."}, {"d": 2, "t": "Zaman ve Para", "f": "21. yüzyılda tüketici için neden 'zaman' kıt kaynaktır ve hangi hizmetler bunu çözer?", "b": "Tüketici zaman yoksulu: iş, yol, uyku arasında zaman kalmıyor. Çözenler: süpermarket/AVM (tüm hizmetler bir arada), internet (vergi, film, ödev, sohbet aynı anda) ve mobil cihazlar (interneti cebe almak). Ortak mantık: 'hepsi bir arada' + zaman kazandırma."}, {"d": 3, "t": "SEO", "f": "Google'da sıralamayı etkileyen 3 ana faktör nedir?", "b": "1) Teknik (web sitesinin teknik iyileştirilmesi, kullanıcı deneyimi metrikleri) 2) İçerik (özgün, güncel, kaliteli yazı/görsel) 3) Bağlantı (başka sitelerin sana referans vermesi → otorite). Ders 3 teknik ve bağlantıyı işler."}, {"d": 3, "t": "SEO", "f": "SEO açısından kullanıcı deneyimi (UX) neye bakar?", "b": "Kullanıcı aradığını bulabiliyor mu, rahat geziyor mu, düğmelere ulaşabiliyor mu, sayfa geçişlerinde ne kadar bekliyor, hemen çıkıyor mu? UX yüksekse Google üst sıralara alır, düşükse aşağı atar. Google'un geliri, aranan şeyi doğru yere götürmekten gelir."}, {"d": 3, "t": "Core Web Vitals", "f": "Üç temel kullanıcı deneyimi metriğini söyle (kısaltmalarıyla).", "b": "1) LCP – Largest Contentful Paint 2) FID – First Input Delay 3) CLS – Cumulative Layout Shift. (Güncel not: Mart 2024'ten beri Google FID yerine INP – Interaction to Next Paint kullanıyor; derste FID anlatıldı.)"}, {"d": 3, "t": "Core Web Vitals", "f": "LCP neyi ölçer? Düşük çıkarsa ne olur?", "b": "Sayfadaki en büyük içeriğin (boyut olarak; resim, video, yazı bloğu) yüklenme hızını. Değer ne kadar küçükse (saniyenin altı ideal) o kadar iyi. Yüksekse site gelir ama resim sonradan gelir → kullanıcı deneyimi düşük → sıralama düşer."}, {"d": 3, "t": "Core Web Vitals", "f": "FID (First Input Delay) neyi ölçer?", "b": "Kullanıcının sayfada ilk etkileşimi (düğmeye tıklama) ile sayfanın buna yanıt vermesi arasındaki gecikmeyi, milisaniye cinsinden. Düğmenin görseli yüklenmiş ama arkadaki kod hazır değilse tıklama çalışmaz. Uzak coğrafyadaki sitelerde daha net hissedilir."}, {"d": 3, "t": "Core Web Vitals", "f": "CLS (Cumulative Layout Shift) neyi ölçer ve en sık nedeni nedir?", "b": "Sayfa yüklenirken öğelerin yer değiştirmesini/kaymasını (okurken yazının kayması). En sık neden: reklamlar ve çerçevesi önceden doğru ayarlanmamış öğeler; büyük reklam sığmayınca diğerlerini kaydırır."}, {"d": 3, "t": "Core Web Vitals", "f": "Bu metrikleri hangi araçlarla ölçeriz?", "b": "Chrome'daki Lighthouse (ve benzeri arayüzler): hangi oranın kötü/iyi olduğunu, hangi hataların olduğunu ve neyi değiştirip neyi kaldırmak gerektiğini (ör. görsel boyutunu düşür) gösterir. Ücretli SEO araçları da vardır."}, {"d": 3, "t": "Site Yapısı", "f": "Site hiyerarşisi nasıl kurulmalı ve neden?", "b": "Mantıksal, adım adım: Başlık → alt başlık → onların alt başlıkları (ör. Ayakkabı → Spor → Koşu → Hızlı koşu/Yürüyüş). Hem insanı adım adım yönlendirir hem Google crawler'ının işine gelir; sistematik tasarlanmış site önemli görülür."}, {"d": 3, "t": "Site Yapısı", "f": "Site bağlantıları (sitelinks) nedir?", "b": "Google sonuçlarında ana sonucun altında çıkan ek düğmeler (örn. akademik takvim, online başvuru). Siteyi hiyerarşik/düzenli tasarlayanlar kazanır; kullanıcıyı doğrudan istediği alt sayfaya götürür."}, {"d": 3, "t": "Site Yapısı", "f": "SEO dostu URL nasıl olmalıdır?", "b": "Kısa, anlamlı ve hiyerarşik: ayakkabi/spor/kosu. Anlamsız kod ve uzantılar (dcdx, 2/2) olmasın; hem kullanıcı hem crawler anlam çıkarır."}, {"d": 3, "t": "Menüler", "f": "Üç menü tipi nedir?", "b": "1) Mega menü 2) Minimalist menü 3) Hamburger menü. Sitenin içeriğine ve cihaza göre biri veya birkaçı birlikte kullanılır."}, {"d": 3, "t": "Menüler", "f": "Mega menü nedir, kimler mecburen kullanır?", "b": "Çok sayıda düğmenin olduğu karmaşık menü. Çok çeşitli ürün satan perakendeciler (Trendyol, Hepsiburada tipi) mecburen kullanır; tüketicinin istediği bir şey değildir, kullanıcı deneyimine hizmet etmez. Karmaşadan kurtulmanın yolu arama çubuğudur."}, {"d": 3, "t": "Menüler", "f": "Minimalist menünün özelliği nedir?", "b": "Az düğme, basit; kullanıcıyı merdiven gibi adım adım yönlendirir. Tercih etmemiz gereken menü budur; kullanıcıyı yormaz, Google'ın hiyerarşi anlayışıyla da uyumludur."}, {"d": 3, "t": "Menüler", "f": "Hamburger menü neden doğdu?", "b": "İnternetin mobil cihazlarda kullanılmaya başlamasıyla (~2009-2010) doğdu. Küçük ekranda düğmeler yer kaplıyor, yanlış tıklama oluyordu. Üç çizgili tek düğme: içerik okunur, gerektiğinde basılınca menü büyük açılır. (Şekli hamburgere benzediği için bu ad.) Derste öğrenci 'drop down' dedi."}, {"d": 3, "t": "Teknik SEO", "f": "Başlık etiketleri H1-H6 ne işe yarar?", "b": "Başlıkları önem sırasına göre etiketler: H1 en önemli, H2 ikinci basamak, H3... en fazla H6 (ötesi karmaşa). Google hiyerarşiyi kod üzerinden okur."}, {"d": 3, "t": "Teknik SEO", "f": "Alt text (görsel alternatif metni) neden eklenir?", "b": "Görselin altına/içine ne olduğunu yazmak crawler'ın işini kolaylaştırır; eskiden yapay zeka resmi göremezdi, görsel arama ise zaman kaybıdır. Resimlere anlamlı isim verilir."}, {"d": 3, "t": "Teknik SEO", "f": "Meta description nedir? Uzunluğu ne olmalı, sıralamaya etkisi nedir?", "b": "Arama sonucunda sitenin altında görünen kısa tanım. Tek başına sıralamayı yükseltmez ama iyi yazılırsa tıklanma/trafiği artırır (dolaylı katkı). ~150-160 karakter (aslında piksel sınırı); fazlası '...' ile kesilir. Özgün olmalı ve anahtar kelimeler içermeli."}, {"d": 3, "t": "Teknik SEO", "f": "Canonical (kanonik) etiket nedir, neden kullanılır?", "b": "Aynı içeriği sitende birden fazla yere yazmak zorunda kaldıysan (misyon hem ana sayfada hem misyon sayfasında) Google bunu kopya içerik sayıp cezalandırabilir. Kanonik etiketle 'asıl sayfa şudur' dersin; kopyalama amacıyla yapılmadığını belirtip cezadan kurtulursun."}, {"d": 3, "t": "Bağlantı", "f": "SEO'da 'bağlantı' (backlink) nedir?", "b": "Başka sitelerin senin sitene referans vermesi. Otoritesi yüksek siteler verirse Google sana yüksek otorite verir ve üst sıraya çıkarır. Kendi kendine üretemezsin; en zor kısım. Örnek: National Geographic fotoğrafçının sitesine bağ verirse."}, {"d": 3, "t": "Bağlantı", "f": "Neden bağlantı satın alınmaz (kara şapka)?", "b": "Spam sitelerden parayla bağlantı almak Google tarafından anlaşılır (bir hafta başka yere, bir hafta sana link veren alakasız site) ve ceza/ban gelir. Bağlantı satın alma; spam site açıp kendine link verdirme de yapılmaz."}, {"d": 3, "t": "Bağlantı", "f": "nofollow etiketi ne zaman kullanılır?", "b": "Reklam vererek/ödeyerek bağlantı aldıysan ve bunu SEO için yapmadıysan, bağlantıya nofollow ('beni takip etme') eklenir. Böylece Google bunun algoritmayı kandırma amacı taşımadığını anlar ve ceza vermez."}, {"d": 3, "t": "Bağlantı", "f": "Organik bağlantı taktiklerini say (7 yöntem).", "b": "1) Temel organik bağlantılar (forum, sosyal medya, yorum, Reddit/GitHub — aşırıya kaçmadan) 2) Kırık bağlantı düzeltme 3) Karşılıklı referans/ortaklık (büyük sitelerle karşılıklı bahsetme) 4) Dijital halkla ilişkiler 5) Bağlantı yemi (link bait) 6) Kaynak sayfaları (Wikipedia) 7) Bağlantı reddetme."}, {"d": 3, "t": "Bağlantı", "f": "Temel organik bağlantılar nelerdir ve sınırı nedir?", "b": "Forumlar, sosyal medya, yorumlar, Reddit/GitHub gibi platformlarda kendi sayfanın çözümünü paylaşıp link koymak. Aşırıya kaçılırsa (her yere yazmak) Google bunu manipülasyon sayıp banlar; birkaçıyla sınırlı kal."}, {"d": 3, "t": "Bağlantı", "f": "Kırık bağlantı (broken link) düzeltme nasıl çalışır?", "b": "Eski rehber/içeriklerdeki ölü linkleri bulursun (ör. çalışmayan DLL indirme linki), aynı içeriği kendi sitende sunup linki oraya yönlendirirsin. Kullanıcıların sorununu çözdüğün için trafik ve bağlantı gelir. Meşakkatli, profesyonellik ister."}, {"d": 3, "t": "Bağlantı", "f": "Karşılıklı referans (ortaklık) ile dijital halkla ilişkiler (PR) arasındaki fark nedir?", "b": "Karşılıklı referans: büyük, ciddi, spam olmayan sitelerle para almadan 'sen benden bahset, ben senden' anlaşması (link, vaka çalışması). Dijital PR: iyi içerik üretip haber sitelerine/sektör yayınlarına göndermek; değerli bulurlarsa yayınlayıp link verirler."}, {"d": 3, "t": "Bağlantı", "f": "Bağlantı yemi (link bait) nedir? Örnek?", "b": "İnsanların sorununu çözen, o kadar işe yarayan içerik üretmek ki diğer siteler kendiliğinden referans verir. Örnekler: hesaplayıcılar/dönüştürücüler (altın/kur, vücut kitle indeksi, diyet enerjisi, istatistik hesapları). Kopyalayanlar da kaynak göstermek zorunda kalır."}, {"d": 3, "t": "Bağlantı", "f": "Kaynak sayfalarından (Wikipedia) bağlantı alma sınırı nedir?", "b": "Wikipedia/ekşi sözlük gibi sayfalarda içerik yazıp sitenizi kaynak gösterebilirsiniz ama moderatör ve doğruluk kontrolü vardır; sonsuza dek olmaz. Yazar olarak güvenilir sayılınca yazdıkların yayına girer."}, {"d": 3, "t": "Bağlantı", "f": "Bağlantı reddetme (disavow) nedir, ne zaman gerekir, nasıl yapılır?", "b": "Tanımadığın spam/kalitesiz sitelerin sana verdiği linkleri Google'a 'benim bunlarla ilişkim yok' diye bildirmek. Rakip sana spam link yağdırabilir (negatif SEO) ya da sitenin hacklenmiş listelerde olabilir; bu seni aşağı çeker. Google Search Console üzerinden yapılır."}, {"d": 4, "t": "PPC", "f": "Ücretli arama (PPC) nedir?", "b": "Pay per click: reklamverenin seçtiği anahtar kelimelerde arama sonuçlarının üstünde 'Sponsorlu' olarak çıkması; yalnızca reklama tıklandığında ücret ödenir."}, {"d": 4, "t": "PPC", "f": "PPC'nin geleneksel (TV, billboard) reklamdan temel farkı?", "b": "Geleneksel reklam sabit ücretlidir, kaç kişinin gördüğü fark etmez. PPC'de bütçe ayrılır, yalnızca tıklamada ödenir, bütçe bitince reklam durur ve sonuçlar ölçülebilir."}, {"d": 4, "t": "PPC", "f": "TBM 3 TL ve bütçe 3.000 TL ise kaç tıklama alınır?", "b": "3.000 / 3 = 1.000 tıklama. Gösterim ücretsizdir."}, {"d": 4, "t": "PPC", "f": "Google aynı kelimeye reklam veren birçok kişiden kimin reklamını gösterir?", "b": "İki kritere bakar: açık artırmayı (teklifi) kim kazandı ve kalite puanı. Kalite puanı yüksek olan daha düşük teklifle de kazanabilir."}, {"d": 4, "t": "PPC", "f": "Kalite puanını belirleyen unsurlar?", "b": "Anahtar kelime + reklam metni + açılış (reklam) sayfası arasındaki uyum; ayrıca Google'dan uzun süredir sorunsuz reklam alıyor olmak."}, {"d": 4, "t": "PPC", "f": "Uzun kuyruklu anahtar kelimenin etkisi? (elbise / Denizli'de beyaz elbise)", "b": "Kelime uzadıkça TBM düşer (37 TL → 14 TL) ama görüntülenme de azalır; aynı bütçeyle daha çok ve daha hedefli tıklama alınır."}, {"d": 4, "t": "PPC", "f": "Negatif anahtar kelime nedir? Örnek?", "b": "Reklamın, bize benzeyen ama başka şey arayan aramalarda çıkmamasını sağlayan kelime. 'Beyaz elbise dolabı' arayanlar için 'dolap' negatif yapılır."}, {"d": 4, "t": "PPC", "f": "Yamyamlık etkisi nedir? Çözümü?", "b": "İki kampanyanın birbirinin bütçesini yemesi (koşu şortu reklamından girenlerin tişört alması); hangi kampanyanın işe yaradığı ölçülemez. Çözüm: karşılıklı negatif anahtar kelimelerle araya set çekmek."}, {"d": 4, "t": "PPC", "f": "Jenerik marka nedir? Örnek ve sakıncası?", "b": "Ürün türünün adı hâline gelmiş marka (Selpak, jilet, Cif). Marka korunamaz: 'Selpak' isteyene başka marka verilir. Jenerik kelimelerde rekabet ve TBM yüksektir."}, {"d": 4, "t": "PPC", "f": "Rakibin marka adına reklam vermek yasal mı? Hocanın uyarısı?", "b": "Yasal (Nike 'Adidas' aramasına reklam verebilir) ama karşılıklı bir savaş başlatır ve bütçeleri eritir; dikkatli girilmeli."}, {"d": 4, "t": "PPC", "f": "Üç eşleşme tipi ve trafik–alaka dengesi?", "b": "Tam eşleşme: yalnızca birebir arama, en az trafik, en yüksek alaka. Cümle eşleşmesi: öbeği içeren aramalar, orta. Geniş eşleşme: yakın her arama, en çok trafik, en düşük alaka."}, {"d": 4, "t": "PPC", "f": "Geniş eşleşme hangi durumda tercih edilir?", "b": "Sektöre yeni girilmiş, bütçe yeterli ve amaç tanınmak, yeni müşteri kazanmaksa."}, {"d": 4, "t": "PPC", "f": "İyi bir açılış (landing) sayfasının özellikleri?", "b": "Anahtar kelimeye özel ve alakalı (ana sayfa değil), kopya içeriksiz, dikkat çeken indirim ve kampanyalar, kıtlık mesajları ('son 3 ürün'), sosyal kanıt ('5 yıldız aldı'); kullanıcıyı sitede tutmalı."}, {"d": 5, "t": "Görsel", "f": "Görsel reklamın dijitale geçerken koruduğu 3 özellik?", "b": "Kitlesel olması, görsel/grafiksel olması, standart boyutlarda olması (internette banner'ların piksel standartları)."}, {"d": 5, "t": "Görsel", "f": "Pop-up reklamlar neden ana akım markalarca terk edildi? Kimler hâlâ kullanır?", "b": "Baskıcı oldukları (kapatsan da tekrar çıkar) ve reklama önyargı yarattıkları için; markalar itibarını korumak ister. İmaj kaybı olmayanlar (yasa dışı bahis, yetişkin içerik) hâlâ kullanır."}, {"d": 5, "t": "Görsel", "f": "Arama motorları görsel reklamcılıkta nasıl bir kırılma yarattı?", "b": "Kullanıcılar bilinmeyen siteleri de bulmaya başladı, trafik dağıldı; büyük sitelerin tekeli bitti. Reklamveren hangi siteye vereceğini ve kaç kişiye ulaşacağını bilemez hâle geldi."}, {"d": 5, "t": "Görsel", "f": "Reklam sunucusunun (ad server) iki katkısı?", "b": "1) Siteye gelenleri bağımsız ve şeffaf ölçerek denetim ve anlaşmazlık uzlaşması sağlar. 2) Hazır reklam formatları kütüphanesiyle iş akışını basitleştirir."}, {"d": 5, "t": "Programatik", "f": "Programatik reklamcılık / gerçek zamanlı teklif (RTB) nedir?", "b": "Reklam yeri satan ile reklam vermek isteyenin bir platformda otomatik, birbirini görmeden eşleştiği; teklif ve gösterimin bir saniyeden kısa sürede tamamlandığı sistem."}, {"d": 5, "t": "Programatik", "f": "Programatik reklamın unsurları?", "b": "Kullanıcı, arz tarafı platformu (SSP: reklam yerini ve kullanıcı profilini sunar), talep tarafı platformları (DSP: reklamverenler adına teklif verir), veri yönetim platformu (DMP: geçmiş müşteri verisi), reklamveren."}, {"d": 5, "t": "Programatik", "f": "Arz tarafı platformu (SSP) ne yapar?", "b": "Site sahibinin reklam yerini (boyut, sayfa, konum) ilan eder; kullanıcının çerezlerinden ve geçmiş davranışlarından profil çıkarıp talep tarafına sunar; en yüksek teklifi seçer."}, {"d": 5, "t": "Programatik", "f": "Krampon–Ford–Barbie örneği neyi anlatır?", "b": "Her reklamveren kullanıcı profiline göre farklı değer biçer (0,2 $ / 0,5 $ / 0,8 $); en yüksek teklif kazanır. Aynı sayfaya giren iki kişi farklı reklam görür (hiper hedefleme)."}, {"d": 5, "t": "Programatik", "f": "Programatik reklamda çerezlerin dışında ek hedefleme seçenekleri?", "b": "Belirli siteleri veya makaleleri seçmek ya da hariç tutmak (savaş, siyasi haberlerin yanında çıkmamak), kullanıcı lokasyonu, gün ve saat dilimi."}, {"d": 5, "t": "Format", "f": "Zengin medya reklamı banner'dan nasıl ayrılır?", "b": "Görüntüye ek ses, video, veri sunma (stoktan 'son 3 ürün' bilgisi) ve veri toplama (kaydırma, oyunlaştırma/mini oyun), fareyle etkileşim içerir."}, {"d": 5, "t": "Format", "f": "Yayın içi reklam nedir? Twitch ile YouTube farkı?", "b": "YouTube, Twitch, online TV gibi yayınların başında, ortasında veya sonunda çıkan reklam. Twitch genelde herkese benzer reklam gösterir; YouTube çerezlerle kişiye özel hedefler."}, {"d": 5, "t": "Format", "f": "YouTube'un atlanabilir video reklamının (TrueView / gerçek görüş) 3 faydası?", "b": "1) Reklamı yalnızca ilgilenenler izler. 2) Reklamın süre sınırı kalkar. 3) Reklamveren yalnızca atlanmadan izlenen reklam için öder."}];

const NOTES = "# Ders 1 — Pazar Bölümlendirme ve Dijital İş Modelleri\n\n## Neden bölümlendirme?\n- 4P (ürün, fiyat, dağıtım, tutundurma) herkese değil, **belirli bir hedef kitleye** ulaştırılır. Hedef kitle yanlış kesilirse tüm çaba boşa gider.\n- Örnek (ayakkabı): 80 milyon → erkek/kadın → yaş (çocuk 7-11) → ilgi (futbol/krampon) → fiyat segmenti ⇒ ~50 bin kişilik hedef kitle.\n- Aynı AVM içindeki iki mağaza bile farklı hedef pazara hitap eder. Dijitalde bu iş \"görsel/dijital reklam\" dersinde ileri seviyede işlenecek.\n\n## 5 bölümlendirme kriteri\n- **Coğrafi:** konuma göre. Kampüs çevresi kafeler; kar sporu ürünleri Erzurum'da. Dijitalde ülke yasaları satışı kısıtlar.\n- **Demografik:** cinsiyet, yaş, eğitim, gelir, meslek. En kolay veri, **az eskir**; ama tek başına yetmez (aynı demografiye sahip herkes aynı şeyi tüketmez).\n- **Davranışsal:** ne tüketiyor, satın alma geçmişi. Dijital izler, indirim kartları, büyük veri. **Çok hızlı eskir** (3-4 yılda hayat değişir) → güncel toplanmalı. 4P kararlarına geri bildirim verir.\n- **Fayda:** aynı ürünü farklı fayda için alma (ceket: sıcaklık / moda / güvenlik).\n- **Psikografik:** yaşam tarzı, inanç, değer, kişilik, ilgi/hobi. Yavaş değişir, **toplaması çok zor** (kara kutu; anketlerde yanlış cevap, gözlemlenince farklı davranma).\n- Hepsini ayrı yapmak zorunda değiliz; mümkün olduğunca **birlikte** kullanılır.\n\n## Persona (profil çıkarma)\n- Hedef pazardan birbirinden farklı ~5 kurgusal kişi tahmin edilir; davranış/ihtiyaçlar empatiyle çıkarılır.\n- Örnek (kulüp): 30-45 yaş sadık taraftar (forma, maç, sosyal medya yorumu) vs 16-23 yaş genç taraftar (bayrak, her maç).\n\n## İş modelleri\n- **B2C:** işletme → tüketici; kitlesel, düşük maliyet (gıda, tekstil, oyuncak).\n- **Niş B2C:** (1) çok üst kalite + zengin tüketici (2) az ihtiyaç duyulan ürün (lüks araç, tekerlekli sandalye, işitme cihazı).\n- **B2B:** işletme → işletme; devasa hacim, profesyonel standartlar, kişiler belli (anonim çağrı merkezi yok); TV reklamı gereksiz.\n- **Abonelik tabanlı:** kullandıkça düzenli ödeme (antivirüs, Netflix). İlk internet döneminde yaygındı, şimdi etkisi azaldı.\n- **Freemium:** ürün ücretsiz, ek fayda ücretli. 2006 sonrası Asya oyun sektörü; Spotify, YouTube Premium. Amaç: kullanıcıyı ve reklam gelirini kaybetmemek.\n- **Mikro işlem:** ücretsiz uygulama içinde küçük satın alımlar (oyun kristali).\n\n## Vakalar\n- **Facebook:** hızlı büyüdü, sunucu parası yoktu → **işletme sayfaları + reklam** iş modeli (Meta: WhatsApp, Instagram).\n- **Google:** başta gelirsizdi → **AdWords** (arama sonucunun tepesinde kelimeye göre reklam = \"ücretli aramalar\"). Ayrıca **word of mouth**: Gmail davetiye/referans ile yayıldı; 10 yıllık strateji.\n\n## Küresel ve mobil dijital\n- Yurt dışında faaliyet için: hukuk, kültür, dil, yaşam tarzı, altyapı (internet hızı, elektrik), cihaz/işletim sistemi, çalışma saatleri (reklam saati), hava/maç gibi olaylar.\n- \"Sadece Türkiye'de satarım\" diyemezsin (küreselleşme).\n- **Mobil:** her yerde, her saat ulaşabiliyoruz; TV/gazete gibi beklemek yok.\n\n---\n\n# Ders 2 — Dijital Pazarlamada / Dijital Dönüşümde Engeller\n\n## Ana soru\nTeknoloji hızla ilerliyor: şirket yeni teknolojiye **hemen mi geçmeli, beklemeli mi, hiç mi geçmemeli?** (YBS'nin \"arada kalan\" rolü: işletme + mühendislik.)\n\n## Neden şirket için daha zor?\n- Tüketici: bir uygulama bozulursa kapatır. Şirket: sipariş, müşteri iletişimi, personel uyumu, cihaz uyumu, masraf. 1-2 hafta kapalı kalmak iflas/icra demek.\n- Pazarlama için SEO, ücretli arama, yapay zekâ gibi araçlar **görece korkutucu değil** (hazır sistemler var; kendin yaparsın ya da dışarıdan alırsın).\n\n## Teknoloji adaptasyon eğrisi (normal dağılım)\n1. **Yenilikçiler:** hemen dener, risk sever, parası var (ilk elektrikli araç alanlar).\n2. **Erken benimseyenler:** ilgili ama hemen almaz, biraz bekler.\n3. **Erken çoğunluk:** altyapı oturunca geçer (çoğunluk).\n4. **Geç çoğunluk:** mesafeli, iyice bekler.\n5. **Gecikenler (laggards):** direnir, mecbur kalınca geçer.\n- Şirketler de bu gruplara ayrılır.\n\n## Öncü avantajı vs dezavantajı\n- **Avantaj:** rakip yok, pazarın kaymağı, taklit zorsa güçlü (WhatsApp).\n- **Dezavantaj:** hataları ilk yapan sensin; arkadan gelen ders alır. Nokia → Apple; Snapchat story → Instagram; **British Gas** hashtag felaketi (zam dönemi).\n- **Patent/marka her şeyi korumaz:** fikir/özellik patentlenemez, yazılımda kod telifi var ama fikir sıfırdan yazılabilir. Çözüm: taklidi zor şey üret, hızlı ilerle.\n\n## Engeller\n### 1) Teknolojik belirsizlik ve geri dönüş planı\n- Banka uygulaması örneği: güncelleme 2-3 gün açılmadı → eski sürüme dönüldü, hata giderildi, haftalar sonra tekrar yayınlandı.\n- **Eski sistemi hemen terk etme; rollback planın olsun.**\n\n### 2) Yetenek açığı\n| | Mevcut personeli eğitmek | Yeni personel almak |\n|---|---|---|\n| Artı | Ucuz (ek maaş yok), personel gelişir, motivasyon düşmez, sözleşmeyle rakibe gitmesi engellenir (~2 yıl) | Deneyimli, hızlı sonuç, kampanya çökerken erken müdahale |\n| Eksi | 1-3 ay sürer, tecrübe eksik kalır | Pahalı, mevcut personelin motivasyonu düşer, rekabet/ayak kaydırma |\n- Acele varsa → yeni; zaman varsa → eğit. Tecrübesiz kişiyi büyük kampanyada \"deneme tahtası\" yapma.\n- Bonus: şirket içinde bu işi daha önce yapmış **gizli yeteneği** bul (İK'nın personeli tanıması).\n\n### 3) Bütçe\n- Teknoloji bedava değil; departmanlar (finans, üretim, pazarlama, Ar-Ge...) bütçe için yarışır.\n- **Projeyi koru:** bölümlere ayır → **kilometre taşları (milestone)** → iyi sonuçları yönetime sürekli göster.\n- İptal nedenleri: rakip, ekonomik kriz, borsa/makro olaylar (petrol), CEO değişimi, tutucu yönetici.\n\n### 4) Düzenlemeler (regülasyon)\n- Örnek kurumlar (derste): ABD FCC, İngiltere ASA, Türkiye Ticaret Bakanlığı / BTK.\n- Alt konular: çerez onayı, gizlilik, konum, çocukların korunması (Disney cezası), 18 yaş altı yazışma, bulut depolama güvenliği.\n- Platformlar yasaklanabilir/çekilebilir (Discord, Facebook-Twitter ofis krizi) → **tek yere bağlanma**.\n\n### 5) Zaman ve para\n- Tüketici zaman yoksulu → AVM, internet, mobil = \"hepsi bir arada\" zaman kazandırır.\n- Şirketin parası risk almasını sınırlar; yanlış hamle kapanışa kadar gidebilir.\n\n---\n\n# Ders 3 — Arama Motoru Optimizasyonu (SEO): Teknik ve Bağlantı\n\n## Üç sıralama faktörü\n**Teknik** (site yapısı, metrikler) · **İçerik** (özgün, güncel) · **Bağlantı** (başkalarının referansı). Ders 3 = teknik + bağlantı.\n\n## Kullanıcı deneyimi metrikleri (Core Web Vitals)\n- **LCP – Largest Contentful Paint:** en büyük içeriğin yüklenme hızı.\n- **FID – First Input Delay:** ilk tıklamada gecikme (düğme görünüyor ama kod hazır değil). *Güncel not: 2024'ten beri yerini INP aldı.*\n- **CLS – Cumulative Layout Shift:** yükleme sırasında öğelerin kayması (çoğunlukla reklam çerçeveleri).\n- Araç: **Chrome Lighthouse** (ne bozuk, neyi küçült/kaldır).\n- Mantık: Google, aranan şeyi hızlı ve doğru yere götürerek para kazanır → UX düşük siteyi aşağı atar.\n\n## Site tasarımı\n- **Hiyerarşi:** başlık → alt başlık → alt alt başlık (Ayakkabı → Spor → Koşu → Hızlı koşu). İnsan ve crawler için mantıksal.\n- **Site bağlantıları (sitelinks):** düzenli yapı Google sonucunda ek düğmeler kazandırır.\n- **URL:** kısa, anlamlı, hiyerarşik (`ayakkabi/spor/kosu`); anlamsız kodlar yok.\n- **Menü tipleri:**\n  - *Mega menü:* çok ürün çeşidi olan perakendeciler mecburen kullanır; karmaşık; çıkış yolu arama çubuğu.\n  - *Minimalist menü:* az düğme, adım adım yönlendirme; **tercih edilen**.\n  - *Hamburger menü:* mobil ekran küçük olduğu için (2009-10); üç çizgili, açılır menü.\n- **H1–H6:** başlık önem sırası (H1 en önemli, en fazla H6).\n- **Alt text:** görsele ne olduğunu yaz, resimlere anlamlı isim ver.\n- **Meta description:** sonuçta görünen tanım; ~150-160 karakter (aslında piksel), özgün, anahtar kelimeli; **tek başına sıralamayı artırmaz, tıklanmayı artırır**.\n- **Canonical etiketi:** aynı içeriği birden çok yere yazmak zorundaysan asıl sayfayı göster → kopya içerik cezası yok.\n\n## Bağlantı (backlink)\n- Başkalarının sana verdiği referans; otoriteyi artırır; kendin üretemezsin, **en zor kısım**. Otoriter site (National Geographic) verirse etkisi çok büyük.\n- **Yapma:** bağlantı satın alma, spam sitelerle link yağdırma (kara şapka) → ban.\n- **nofollow:** reklam/ödemeyle aldığın ama SEO amacı olmayan bağlantıya ekle.\n- **Organik taktikler:**\n  1. Temel organik bağlantılar (forum, sosyal medya, yorum, Reddit/GitHub) — aşırıya kaçma\n  2. Kırık bağlantı düzeltme (ölü linkin yerine kendi içeriğin)\n  3. Karşılıklı referans/ortaklık (büyük ciddi sitelerle, parasız)\n  4. Dijital halkla ilişkiler (haber siteleri/sektör yayınlarına içerik)\n  5. Bağlantı yemi (hesaplayıcı, dönüştürücü, problem çözen araç)\n  6. Kaynak sayfaları (Wikipedia; moderasyon ve doğruluk kontrolü var)\n  7. Bağlantı reddetme (**Google Search Console**; spam/negatif SEO linklerini \"benimle ilgisi yok\" diye bildir)\n\n\n# Ders 4 — Ücretli Arama (PPC / Arama Motoru Reklamcılığı)\n\n## Mantık\n- Google'ın para kazanma yöntemi: reklam veren bir **anahtar kelimeye** reklam verir, arama sonuçlarının tepesinde **\"Sponsorlu\"** olarak çıkar (\"reklam\" kelimesi itici olduğu için yumuşatılmış). İngilizcesi **pay per click (PPC)**, Türkçesi **ücretli arama**.\n- Hangi coğrafyaya reklam verilecekse o coğrafyanın kullandığı arama motoru seçilir (Google, Yandex, Bing…).\n- SEO'da anahtar kelimeyi sayfa içeriği belirler; PPC'de **hangi kelimeye reklam vereceğine sen karar verirsin**.\n- **Geleneksel reklamdan farkı:** billboard (haftası 40.000 TL), TV (izlenme saatine göre) **sabit ücretlidir**; kaç kişinin gördüğü fark etmez. PPC'de her anahtar kelimeye bütçe ayrılır ve **yalnızca tıklanınca** para kesilir. Örn. TBM 3 TL, bütçe 3.000 TL → **1.000 tıklama**; tıklamayan kişi için ücret yok; bütçe bitince reklam durur. Rekabetli kelimelerde TBM 15 TL'ye çıkabilir.\n- Avantajlar: bütçe sınır koymaz (küçük şirket de reklam verebilir), verimli, **geri dönüş ölçülebilir** (kim, nereden tıkladı, aldı mı, kelime işe yaradı mı?).\n\n## Kimin reklamı gösterilir? Açık artırma + kalite puanı\n- Aynı kelimeye binlerce reklam veren yarışır. Google iki şeye bakar: **1) açık artırmayı (teklifi) kim kazandı, 2) kalite puanı.**\n- Yüksek kalite puanı **daha düşük teklifle kazanmayı** sağlar (sen 3 TL, rakip 4 TL verse bile kalite puanın yüksekse sen kazanabilirsin).\n- **Kalite puanı = anahtar kelime + reklam metni + reklam (açılış) sayfası uyumu.** \"Araba\" kelimesine motosiklet reklamı, kedi kelimesine köpek reklamı → uyumsuz → puan düşer. Açılış sayfası şirketi anlatıyorsa (otomobil listesi yerine) alaka azalır.\n- Ek olarak: Google'dan **uzun süredir sorunsuz reklam alan** reklamverenin kalite puanı biraz yükselir.\n\n## Anahtar kelime seçimi\n- Rekabet edilecek alanı doğru seçmek gerekir (çok paran olsa bile Apple/Android'le telefon pazarında yarışmak risklidir); PPC'de yarış alanı **anahtar kelimelerdir**.\n- Kelimeler uzatılabilir: ucuz otomobil, Denizli otomobil, lüks otomobil, ipek kumaştan beyaz elbise… Lokasyon önemlidir.\n- **Uzun kuyruk (long-tail):** kelime uzadıkça **TBM düşer** ama **görüntülenme de azalır**. Örn. \"elbise\" 37 TL (günde ~10.000 görüntülenme), \"beyaz elbise\" ~4.000, \"Denizli'de beyaz elbise\" 14 TL (~300). Aynı bütçeyle uzun kelimeden çok daha fazla ve **daha hedefli** tıklama alınır (Denizli'de arayan dükkâna gelebilir). Strateji: tek genel kelime yerine çok sayıda hedefli uzun kelimeye ayrı bütçe.\n\n## Negatif anahtar kelime ve yamyamlık etkisi\n- **Negatif anahtar kelime:** bizim kelimemize benzeyip başka şey arayanlar reklamımızı görmesin diye işaretlenen kelime. *\"Beyaz elbise dolabı\"* arayan dolap ister; giyim reklamına tıklarsa para boşa gider → \"dolap\" negatif yapılır.\n- **Yamyamlık (cannibalization) etkisi:** iki kampanya birbirinin bütçesini yer. *Adidas X koşu şortu (600 $) ve X koşu tişörtü (100 $):* şort reklamı çok tıklanmış ama şort satmamış; tişört reklamı az tıklanmış ama tişört satışı patlamış → tişört arayanlar şort reklamından girip tişört almış. Yanlış sonuçlar çıkarılır (\"şort satmıyor\", \"tişört reklamına gerek yok\"). **Çözüm:** şort kampanyasına \"tişört\"ü, tişört kampanyasına \"şort\"u negatif yaparak araya **set çekmek** → ölçülebilir kampanya.\n\n## Jenerik, marka ve rakip anahtar kelimeler\n- **Jenerik:** genel kabul görmüş, ürün türünün adı hâline gelmiş marka/kelime. *Selpak* (kâğıt mendil yerine; markette \"Selpak ver\" deyince başka marka veriliyor → **marka değeri korunamıyor**), jilet, Cif, Aygaz, Sana. Elma, portakal, İstanbul gibi genel kelimelerde rekabet çok yüksektir; \"portakal\" yazınca meyve çıkıyor, Portakal Bahçem altta kalıyor → üste çıkmak için PPC vermek zorunda. \"Pamukkale\" yazınca otobüs firması ve üniversite çıkıyor.\n- **Marka kelimesi:** kendi markana reklam vermek (Adidas \"Adidas\"a). Marka çok güçlüyse gerekmeyebilir (Adidas aramasında reklam yok, SEO yeterli).\n- **Rakip kelimesi:** Nike'ın \"Adidas\" aramasına reklam vermesi **yasal**, ama karşılıklı bir savaş başlatır ve bütçeleri eritir; dikkatli girilmeli.\n- Küresel jenerik ve büyük pazar kelimelerinde TBM çok yüksek (kumar/bahis kelimelerinde tıklama başı ~40 $). Uzun ve hedefli kelimeler (\"güvenli online bahis\") daha ucuzdur.\n\n## Eşleşme tipleri\n| Tip | Kimler görür? | Trafik | Alaka |\n|---|---|---|---|\n| **Tam eşleşme** | Yalnızca kelimeyi birebir yazanlar (\"beyaz elbise\"; \"ipek beyaz elbise\" yazan görmez) | En az | En yüksek — \"az olsun öz olsun\" |\n| **Cümle eşleşmesi** | Kelime öbeğini içeren aramalar (\"ipek beyaz elbise\", \"çiçekli beyaz elbise\") | Orta | Orta |\n| **Geniş eşleşme** | Yakın her arama (kırmızı elbise, beyaz etek, beyaz şapka…) | En çok | Düşük — tıklayan çoğu almaz |\n- Geniş eşleşme neden seçilir? Sektöre yeni girdin, bütçen var, **tanınmak / yeni müşteri** kazanmak istiyorsun. Tam hedef için tam eşleşme.\n- Google ayrıca reklamın **hangi gün ve saatlerde** çıkacağını seçtirir; çerezlerle hedefleme yapılır.\n\n## Açılış (landing) sayfası\n- Tıklamadan sonra kullanıcının indiği sayfa (\"uçağın piste inmesi\" benzetmesi). Reklamın ilk görüldüğü yer arama sonucu, asıl etkileşim landing page'de başlar.\n- Doğrusu: **anahtar kelimeyle ilgili, özel hazırlanmış** sayfa (şort reklamına tıklayan şort sayfasına gitmeli). Büyük firmalar çoğu zaman ana sayfaya yönlendirir — bu **yanlıştır**; küçük şirketler bunu önemsemek zorunda.\n- İyi landing page: **kopya içerik olmamalı** (Google cezalandırır); dikkat çeken indirimler, kampanyalar, yan ürünler; kullanıcıyı sitede tutacak teklifler (**\"son 3 ürün\", \"stokta 2 tane kaldı\"** gibi kıtlık mesajları); **sosyal kanıt** (\"arkadaşların bunu aldı\", \"5 yıldız\"). Para ödendi, kullanıcı çıkmasın.\n- Hocanın özeti — önemli olanlar: **kalite puanı, açık artırma sistemi, anahtar kelime seçimi, negatif anahtar kelimenin amacı.**\n\n# Ders 5 — Görsel (Display) Reklamcılık ve Programatik Reklam\n*Not: hoca \"haftaya sınav\" dedi.*\n\n## Görsel reklam nedir?\n- **Göze hitap eden** reklam: gazetedeki kutu ilan, TV reklamı, billboard (\"ABC Hastanesi'ne yeni hekim\"), otobüs durağı panosu, asansör ilanı. Radyo (işitsel) değildir.\n- İnternetle ölmedi, **şekil değiştirdi**: web sitelerine gömüldü, uygulamalara, oyunlara, sosyal medyaya girdi; sosyal medyanın en çok para kazandığı yöntemlerden biri oldu.\n- Dijitalde **korunan 3 özelliği:** 1) **kitlesel** olması, 2) **görsel/grafiksel** olması, 3) **standart boyutlar** (billboardlarda 2,5 × 3,5 m gibi; TV'de 4:3, 16:9). İnternette **banner** reklamların standart **piksel** boyutları vardır; uymazsan reklam taşar, sayfa kayar (SEO'daki kullanıcı deneyimi sorunları).\n\n## Pop-up dönemi\n- İlk dönemde reklamlar öne çıkmak için **baskıcı** yöntemlere başvurdu: kapatsan da tekrar çıkan, bazen virüsle bilgisayara yerleşen **pop-up** reklamlar → insanların reklama bakışı bozuldu, **reklama önyargı** oluştu.\n- **Ana akım** markalar itibarını korumak için pop-up'tan uzak durur. İmaj kaybı olmayan firmalar (yetişkin içerik, **yasa dışı bahis** siteleri: biri kapanınca diğeri açılır, marka değeri zaten yok) pop-up'ı kullanmaya devam eder.\n\n## Reklam sunucuları (ad server)\n- 90'larda az sayıda bilinen site vardı (Yahoo, Mynet, gazete siteleri) — TV kanalları gibi; kime reklam verileceği belliydi. Siteler **kulaktan kulağa (word of mouth)** öğreniliyordu.\n- **Kırılma: arama motorları.** Kullanıcılar bilinmeyen siteleri de bulmaya başladı, trafik dağıldı; büyük sitelerin tekeli bitti. Reklamverenin soruları: **hangi siteye vermeli, kaç kişiye ulaşılır?** Site sahibinin \"20.000 kişi geldi\" demesine güvenmek zorundaydın.\n- **Ad server (reklam sunucusu):** 3. parti ya da sitenin kendi hizmeti olabilir. 1) Siteye gelenleri **bağımsız ve şeffaf** ölçer (TV'deki rating cihazı manipülasyonunun aksine) → **denetim ve anlaşmazlık uzlaşması**. 2) **Hazır reklam formatları kütüphanesi** (banner boyutları, metin, görsel) → **iş akışını basitleştirir**.\n\n## Programatik reklamcılık ve gerçek zamanlı teklif (RTB)\n- Bugünkü **tam otomatik** sistem: reklam vermek isteyen ile reklam alanı satmak isteyen bir platformda otomatik eşleşir; birbirlerini görmezler. Tüm süreç **bir saniyeden kısa** sürer — sayfa açılmadan biter.\n- **Unsurlar:**\n  1. **Kullanıcı** (bilgisayar/telefon/tablet) bir web sayfasına girer; sayfada reklam yerleri vardır.\n  2. **Arz tarafı platformu (SSP):** site sahibinin reklam yerini ilan eder; boyut, sayfa, konum bilgisini ve kullanıcının **çerezlerini, geçmiş davranışlarını** toplayıp **profil** çıkarır, \"bu kullanıcıyı isteyen var mı?\" diye pazara sunar.\n  3. **Talep tarafı platformları (DSP):** her biri bir reklamvereni temsil eder; profili değerlendirir.\n  4. **Veri yönetim platformu (DMP):** reklamverenin geçmiş verisi — bu kişiyi tanıyor muyuz, bizden ne aldı?\n  5. **Reklamveren** (firma, dükkân, kişi).\n- *Örnek:* krampon reklamcısı \"yaşı geçmiş, kız çocuğu var\" diyerek 0,2 $ teklif eder; daha önce Ford almış olduğu için **Ford** 0,5 $; kızı olduğu için **Barbie** 0,8 $ → en yüksek teklif kazanır, kullanıcı Barbie reklamını görür. Diğer reklam yerlerini Ford ve (Netflix'i olmadığı için) Netflix kazanabilir.\n- Sonuç: aynı sayfaya giren iki kişi **farklı reklamlar** görür. **Çerezlerin** en çok işe yaradığı yer burasıdır → **hiper hedefleme**; reklam kitleselliğini kaybetmeye başlar.\n- Ek hedefleme: belirli siteler/makaleler seçilebilir veya hariç tutulabilir (**savaş, siyasi haberlerin yanında görünmeme** — marka güvenliği), **lokasyon**, **saat dilimi** (örn. 20.00–23.00).\n- Platform örnekleri: **Amazon DSP**, Yahoo, **Display & Video 360** (talep tarafı); **Google Ad Manager, AdSense** (arz tarafı; hem satıp hem alınabilir).\n\n## Görsel reklam formatları\n1. **Banner (görüntülü reklam):** belli piksel boyutlarında sabit/hareketli görsel ve yazı; internet reklamcılığının temeli. *Million Dollar Homepage:* bir öğrencinin 1 milyon piksellik sayfası, piksel başı 1 $ → ~1 milyon $ kazanç; bugün çoğu link bozuk.\n2. **Zengin medya (rich media):** görüntüye ek **ses, video, veri sunma** (\"son 3 ürün\" bilgisini stoktan çekip gösterir) ve **veri toplama** (kaydırma, mini oyun/**oyunlaştırma** — hedef vurma, gemi batırma), fare üstüne gelince değişen reklamlar. Banner'lar geride kaldı.\n3. **Yayın içi reklamlar:** TV ölmedi; YouTube, Twitch, Netflix gibi platformlara geçti. Yayının **başında, ortasında, sonunda** çıkar. Twitch genelde herkese benzer reklam gösterir (programatik az); YouTube çerezlerle hedefler. TV kanallarının online sürümlerindeki reklamlar TV'dekinden ayrıdır (ayrı ücret). Ürün yerleştirme de bir türdür.\n- **Atlanabilir video reklam (YouTube, 2012) ve \"gerçek görüş\" (TrueView):** ilk birkaç saniyeden sonra **\"Reklamı atla\"** düğmesi.\n  - **Faydaları:** 1) reklamı yalnızca **ilgilenenler izler**; 2) **süre sınırı kalkar** (atlanmayan 1,5 saatlik reklam bile oynayabilir); 3) **fiyatlandırma faydası:** reklamveren yalnızca atlanmadan izlenen reklam için öder. YouTube'u, tüketiciyi (bıktırmaz) ve reklamvereni korur. Atlarsan yayıncı da kazanmaz.\n";
const COURSE = {"title": "Pazarlama", "sub": "Ders 1–5 kayıtlarından: bölümlendirme, dijital dönüşüm, SEO, ücretli arama, görsel/programatik reklam", "ders": {"1": "Ders 1 · Bölümlendirme & iş modelleri", "2": "Ders 2 · Dijital dönüşüm engelleri", "3": "Ders 3 · SEO", "4": "Ders 4 · Ücretli arama (PPC)", "5": "Ders 5 · Görsel ve programatik reklam"}, "extra": ["Vaka karşılaştırması: Nokia/Apple · Snapchat/Instagram · British Gas — ortak ders nedir?", "Alıştırma sekmesinde ücretli arama sorularından (TBM, tıklama oranı, eşleşme tipleri, negatif kelime) en az 8 tane çöz", "Programatik reklam akışını (kullanıcı → SSP → DSP/DMP → reklamveren → kazanan reklam) kâğıda hafızadan çiz"], "gen": ["ppc"], "id": "pazarlama"};
const DERS = COURSE.ders, NS = Object.keys(DERS).map(Number), U = COURSE.unit||'Ders', GENS = COURSE.gen||[];
const PLAN = (()=>{
  const p=[];
  NS.forEach((n,i)=>p.push({g:`Gün ${i+1} · ${U} ${n}`,t:[`${U} ${n} notlarını oku (25 dk) — bitince kapat, 5 anahtar kavramı kâğıda hatırladığın kadar yaz`,`${U} ${n} kartlarını çalış (15 dk)`,`${U} ${n} testi (10 soru)`].concat(i?['Önceki günlerin bekleyen kartları']:[])}));
  let g=NS.length;
  p.push({g:`Gün ${++g} · Birleştir`,t:['Tüm bekleyen kartlar','Karışık test (20 soru)','Yanlışlarım testini çöz'].concat(GENS.length?['Alıştırma sekmesinde karışık 10 soru çöz']:[])});
  p.push({g:`Gün ${++g} · Aktif hatırlama`,t:[`Her ${U.toLowerCase()} için notlara bakmadan 10 satırlık özet yaz, sonra notlarla karşılaştır`,'Eksik çıkan kavramların kartlarını çalış'].concat(COURSE.extra||[])});
  p.push({g:`Gün ${++g} · Zayıf noktalar`,t:["İlerleme sekmesinde Kutu 1-2'deki kartlara odaklan",'Yanlışlarım testini tekrar et']});
  p.push({g:`Gün ${++g} · Final`,t:['Karışık test (hepsi)','Yanlışlarım testi','2 hafta sonrası için kendine hatırlatma kur: bekleyen kartlar + 1 karışık test']});
  return p;
})();
const $ = (s,r=document)=>r.querySelector(s);
const K=k=>COURSE.id+':'+k;
const store = {
  get(k,d){try{const v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}
};
const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5, INTERVALS=[0,0,1,3,7,14]; // box index → days

/* ---------- tabs ---------- */
const TABS=[["plan",`${PLAN.length} Günlük Plan`],["notes","Notlar"],["cards","Kartlar"],["quiz","Test"]].concat(GENS.length?[["gen","Alıştırma"]]:[],[["prog","İlerleme"]]);
const nav=$('#nav');
TABS.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
function show(id){

  let h=`<div class="card"><div class="row" style="justify-content:space-between"><b>İlerleme</b><span class="mute">${n}/${total}</span></div><div class="bar" style="margin-top:8px"><i style="width:${n/total*100}%"></i></div>
  <p class="mute" style="margin:10px 0 0">Kural: önce notları <b>bir kez</b> oku, sonra kapatıp kendini sına. Tekrar okumak değil, hatırlamaya çalışmak öğretir.</p></div>`;

  $('#p-plan').innerHTML=h;
  $('#p-plan').querySelectorAll('input').forEach(c=>c.onchange=()=>{const d=store.get('pz_plan',{});d[c.dataset.k]=c.checked;store.set('pz_plan',d);renderPlan()});

/* ---------- notes (mini markdown) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

/* ---------- flashcards (Leitner) ---------- */
let cardFilter=store.get('pz_filter',0), session=[], sIdx=0, flipped=false;
const cs=()=>store.get('pz_cards',{});
function cardState(id){return cs()[id]||{box:1,due:0}}
function dueList(f){const s=cs(),now=Date.now();return CARDS.map((c,i)=>({...c,id:i})).filter(c=>(!f||c.d===f)&&((s[c.id]||{due:0}).due<=now))}
function renderCards(){
  const el=$('#p-cards');
  let h=`<div class="row" style="margin-bottom:14px">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${cardFilter===f}" data-f="${f}">${f?U+' '+f:'Hepsi'} (${dueList(f).length})</button>`).join('')+`</div><div id="sess"></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cardFilter=+b.dataset.f;store.set('pz_filter',cardFilter);session=[];renderCards()});
  if(!session.length||sIdx>=session.length){session=shuffle(dueList(cardFilter));sIdx=0}
  drawCard();
}
function drawCard(){
  const box=$('#sess');if(!box)return;
  if(!session.length){box.innerHTML=`<div class="card" style="text-align:center"><b>Bekleyen kart yok 🎉</b><p class="mute">Bu filtre için bugün çalışılacak kart kalmadı. Yarın tekrar gel ya da başka bir ${U.toLowerCase()} seç.</p><button class="btn alt" id="all">Yine de hepsini karıştır</button></div>`;
    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>!cardFilter||c.d===cardFilter));sIdx=0;drawCard()};return}
  const c=session[sIdx];flipped=false;
  box.innerHTML=`<div class="mute" style="margin-bottom:6px">${sIdx+1} / ${session.length} · Kutu ${cardState(c.id).box}</div><div class="bar" style="margin-bottom:12px"><i style="width:${sIdx/session.length*100}%"></i></div>
  <div class="card flash" id="fl" tabindex="0"><div class="tag">${esc(DERS[c.d])} · ${esc(c.t)}</div><div class="q">${esc(c.f)}</div><div class="a" id="ans" hidden>${esc(c.b)}</div><div class="mute" id="hint" style="margin-top:12px">Cevabı düşün, sonra çevirmek için dokun (Boşluk)</div></div>
  <div class="row" id="grade" hidden><button class="btn bad" data-g="0">Bilemedim</button><button class="btn alt" data-g="1">Zor</button><button class="btn ok" data-g="2">Bildim</button></div>`;
  const flip=()=>{if(flipped)return;flipped=true;$('#ans').hidden=false;$('#hint').hidden=true;$('#grade').hidden=false};
  $('#fl').onclick=flip;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(c,+b.dataset.g));
  window._flip=flip;
}
function grade(c,g){
  const s=cs(),st=s[c.id]||{box:1,due:0};
  if(g===0)st.box=1;else if(g===2)st.box=Math.min(5,st.box+1);
  st.due=Date.now()+(g===0?0:INTERVALS[st.box]*DAY);
  s[c.id]=st;store.set('pz_cards',s);

function drawQ(){
  const el=$('#p-quiz');

  <div class="card"><div style="font:600 18px/1.45 Georgia,serif;margin-bottom:8px">${esc(q.q)}</div><div id="opts">${q.order.map((oi,k)=>`<button class="opt" data-k="${k}">${esc(q.o[oi])}</button>`).join('')}</div><div id="fb" hidden></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    el.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)qz.score++;

    if(!ok&&!has)W.push(q.id);if(ok&&has)W.splice(W.indexOf(q.id),1);store.set('pz_wrong',W);

    $('#nx').onclick=()=>{qz.i++;drawQ()};$('#nx').focus();
  });
}

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];

const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},

  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);if(t.l.op&&PR[t.l.op]<PR[t.op])a=`(${a})`;if(t.r.op&&PR[t.r.op]<=PR[t.op])b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const AVL={
  bf:n=>T.h(n.l)-T.h(n.r),

  // standart AVL ekleme: her dengesizlikte gereken en az döndürmeyi ve durumu kaydeder

  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder (kök–sol–sağ)',T.pre],['inorder (sol–kök–sağ)',T.ino],['postorder (sol–sağ–kök)',T.post],['level order (seviye seviye)',T.lvl]]),a=fn(t);

  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(7,9));let t=null;v.forEach(x=>t=T.ins(t,x));

  postfix:{label:'Infix → postfix/prefix',f(){let i=0;const t=exprT(R(3,5),()=>'ABCDEFG'[i++],Object.keys(PR)),pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');

  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);

  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;

  weighted:{label:'Ağırlıklı ortalama',f(){const k=R(0,4),wm=(x,w)=>sum(x.map((v,i)=>v*w[i]))/sum(w),

  const inp=q.type==='mc'?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :q.type==='multi'?`<div class="mf">${q.fields.map(([l],i)=>`<label>${esc(l)}<input class="gin" data-f="${i}" autocomplete="off" inputmode="decimal" placeholder="Sayı"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="gchk">Kontrol et</button></div>`
    :`<div class="row"><input id="gin" class="gin" autocomplete="off" inputmode="${q.type==='num'?'decimal':'text'}" placeholder="${q.type==='num'?'Sayı (ör. 2,5)':'Cevabın (ör. A, B, C)'}"><button class="btn" id="gchk">Kontrol et</button></div>`;
  b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div>${inp}<div id="gfb"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>checkGen(+x.dataset.i));
  const gin=$('#gin'),mi=[...b.querySelectorAll('[data-f]')];
  if(mi.length){const vals=()=>mi.map(x=>x.value);$('#gchk').onclick=()=>checkGen(vals());
    mi.forEach((x,i)=>x.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(gq.done)return nextGen();const empty=mi.find(y=>!y.value.trim());empty?empty.focus():checkGen(vals())});mi[0].focus()}
  if(gin){$('#gchk').onclick=()=>checkGen(gin.value);gin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gq.done?nextGen():checkGen(gin.value)}};gin.focus()}
  $('#gshow').onclick=()=>{gq.done=true;showSol(null)};$('#gnext').onclick=nextGen;
}
function nextGen(){newGen();renderGen()}
function checkGen(v){
  if(gq.done)return;
  const numOk=(s,a)=>Math.abs(parseNum(s)-a)<=Math.max(.0015,Math.abs(a)*1e-4);
  if(gq.type==='multi'){const mi=[...$('#gbox').querySelectorAll('[data-f]')],e=mi.find(x=>!x.value.trim());if(e)return e.focus()}
  else if(gq.type!=='mc'&&String(v).trim()==='')return;
  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){
  const s=cs(),counts=[0,0,0,0,0,0];
  CARDS.forEach((_,i)=>counts[(s[i]||{box:1}).box]++);
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));
  const weak=CARDS.map((c,i)=>({...c,id:i,box:(s[i]||{box:1}).box})).filter(c=>c.box<=2&&s[c.id]).slice(0,8);
  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=()=>{if(confirm('Kart, test, alıştırma ve plan ilerlemesi silinsin mi?')){['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
