<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pazarlama</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>

<script>
const CARDS = [{"d": 1, "t": "Bölümlendirme", "f": "Pazar bölümlendirme pazarlamada neden bu kadar önemli?", "b": "4P'yi (ürün, fiyat, dağıtım, tutundurma) herkese değil, belirli bir hedef kitleye ulaştırmak zorundayız. Hedef kitle yanlış kesilirse tüm çaba boşa gider. Örnek: 80 milyon kişiden ayakkabı → cinsiyet → yaş → ilgi → fiyat segmenti ile ~50 bin kişilik hedef kitle."}, {"d": 1, "t": "Bölümlendirme", "f": "Pazar bölümlendirmede 5 kriter nedir?", "b": "1) Coğrafi 2) Demografik 3) Davranışsal 4) Fayda 5) Psikografik (psikolojik). Hepsini ayrı ayrı yapmayız; yapabildiğimiz kadarını birlikte kullanırız."}, {"d": 1, "t": "Bölümlendirme", "f": "Coğrafi bölümlendirme nedir? Örnek ver.", "b": "Fiziksel uzaklık/yakınlık, kişinin yaşadığı bölgeye göre ayırma. Örnek: kampüs çevresindeki kafeler öğrenciye hitap eder; kar sporu ürünleri Erzurum gibi dağlık bölgede satılır (Afrika'da snowboard satılmaz). Dijitalde: ülkeler arası yasa/kısıtlar bazı ürünleri bazı ülkelerde satmayı engeller."}, {"d": 1, "t": "Bölümlendirme", "f": "Demografik bölümlendirme nedir? Avantaj ve dezavantajı?", "b": "Cinsiyet, yaş, eğitim, gelir, meslek. En basit ve en kolay toplanan veri (anketler). Avantaj: kolay toplanır, çok eskimez (10 yıl sonra yaş/cinsiyet hâlâ tahmin edilebilir). Dezavantaj: demografisi aynı olanlar aynı şeyi tüketmez (herkesin tarzı/yaşam şekli farklı) → tek başına yetmez."}, {"d": 1, "t": "Bölümlendirme", "f": "Davranışsal bölümlendirme nedir ve bugün neden çok önemli?", "b": "Kişinin ne tükettiğine, satın alma geçmişine, ürünü nasıl kullandığına bakar. Eskiden veri toplamak çok zordu (çöp karıştırmak gerekirdi); bugün dijital izler, market indirim kartları, büyük veri analizi ile toplanıyor. 4P kararlarında (fiyat, indirim, tutundurma) geri bildirim sağlar."}, {"d": 1, "t": "Bölümlendirme", "f": "Davranışsal verinin en büyük zayıflığı nedir?", "b": "Çok hızlı eskir: yaklaşık 3-4 yılda yaşam değişir (lise→üniversite→iş→aile) ve davranışlar da değişir. Bu yüzden davranış verisi güncel/taze toplanmalıdır."}, {"d": 1, "t": "Bölümlendirme", "f": "Fayda bölümlendirmesi nedir? Örnek?", "b": "İnsanlar aynı ürünü farklı fayda için satın alır. Ceket örneği: soğuktan korunma (termal), moda/tarz, güvenlik (kayak montu). Müzik örneği: koleksiyoncu vs internetten dinleyen. Müşterinin ürünümüzden ne beklediğini anlamak gerekir."}, {"d": 1, "t": "Bölümlendirme", "f": "Psikografik (psikolojik) bölümlendirme neyi kapsar?", "b": "Yaşam tarzı, inançlar, değerler, kişilik, ilgi alanları ve hobiler. Örnekler: inanca göre tüketim (domuz/inek eti), spor ilgisi (koşu ürünleri), fit yaşam (besin etiketi okuma), çevrecilik (doğaya zararsız ürün)."}, {"d": 1, "t": "Bölümlendirme", "f": "Psikografik verinin toplanması neden zordur?", "b": "İnsanların içi görünmez ('kara kutu'). Anketlerde fikirleri öğrenilecek diye yanlış cevap verirler; gözlemlendiklerinde farklı davranırlar. Karakter yavaş değişir (hızlı eskimez) ama veriyi bulmak zordur. Bir tişört (Greenpeace) bile güvenilir ipucu değildir."}, {"d": 1, "t": "Bölümlendirme", "f": "Hangi bölümlendirme verisi hızlı eskir, hangisi yavaş?", "b": "Davranışsal: çok hızlı eskir. Demografik: çok az eskir. Psikografik: yavaş değişir (kişilik kolay kırılmaz, güncellenir)."}, {"d": 1, "t": "Bölümlendirme", "f": "Persona (profil çıkarma) nedir, nasıl yapılır?", "b": "Hedef pazar içinden birbirinden farklı yaklaşık 5 kurgusal kişi tahmin edilir; bunların davranış ve ihtiyaçları empatiyle çıkarılır. Örnek (futbol kulübü): 30-45 yaş, her maça gelen, her sene yeni forma alan, sosyal medyada yorum yapan taraftar vs 16-23 yaş genç, bayrak sallayan taraftar. Doğru profil → daha iyi sonuç."}, {"d": 1, "t": "İş Modelleri", "f": "B2C nedir? Hangi ürünler örnektir?", "b": "Business to Consumer: işletmeden tüketiciye. Kitlesel, genelde üretim maliyeti düşük ürünler; marketler, AVM'lerde satılanlar. Örnek sektörler: gıda, tekstil, oyuncak."}, {"d": 1, "t": "İş Modelleri", "f": "Niş B2C'yi tanımlayan iki özellik nedir?", "b": "1) Çok üst kalite ürün, tüketicisi çok zengin. 2) Az ihtiyaç duyulan ürün, küçük pazar. Örnekler: çok lüks otomobil (yılda ~25 adet), tekerlekli sandalye, gelişmiş işitme cihazı/implant."}, {"d": 1, "t": "İş Modelleri", "f": "B2B'nin B2C'den farkları nelerdir?", "b": "Alıcı da satıcı da şirkettir. Satın almalar devasa miktarlarda ve profesyonel, standartlara bağlıdır. İletişimi satın alma görevlisi/yöneticiler kişisel kurar (Ahmet Bey–Mehmet Bey); B2C'deki anonim çağrı merkezi yoktur. TV reklamı gibi kitle tutundurması gereksizdir (izleyenlerin çoğunun ihtiyacı yok)."}, {"d": 1, "t": "İş Modelleri", "f": "Abonelik tabanlı iş modeli nedir? Örnek?", "b": "Ürünü kullandıkça belirli aralıklarla (aylık/yıllık) düzenli ödeme yapılır; kira mantığı. Örnekler: antivirüs programları, güncelleme/yıllık lisans, Netflix. İnternetin ilk döneminde yaygındı; popülerliği bugün biraz azaldı."}, {"d": 1, "t": "İş Modelleri", "f": "Freemium modeli nedir, nasıl doğdu?", "b": "Ürünün temel kısmı ücretsiz, ek fayda isteyen öder. 2006 sonrası Asya'da online oyun sektöründe hızlandı, sonra dünya geneline yayıldı. Örnekler: Spotify (reklamsız/istediğin şarkı), YouTube Premium (reklamsız, 4K, arka plan)."}, {"d": 1, "t": "İş Modelleri", "f": "Freemium'un asıl amacı nedir? (YouTube örneği)", "b": "Kullanıcıyı üründen koparmamak ve reklam gelirini korumak. YouTube herkesi ücretli yapsa kullanıcılar alternatife geçer, reklam geliri kaybolur; reklam geliri kaybeden sosyal medya birkaç yılda ölür. Amaç: reklam izlemeyi kabul edenleri tutarken, para verenlere ek fayda sunmak."}, {"d": 1, "t": "İş Modelleri", "f": "Mikro işlem (microtransaction) nedir?", "b": "Ürün ücretsizdir ama içinde küçük küçük satın alımlar yapılır. Örnek: oyunda takıldığın bölümü geçmek için kristal/şeker satın almak."}, {"d": 1, "t": "Vaka", "f": "Facebook vakası: sorun neydi, çözüm iş modeli neydi?", "b": "Çok hızlı büyüdü, sunucu parası yetmedi. Çözüm: işletme sayfaları (markalar profil açar, takipçilerle iletişim kurar) + buna uygun reklam gösterimi. Şirketler çok kişi olduğu için Facebook'a para verdi. Doğru iş modeli sayesinde ayakta kaldı (Meta: WhatsApp, Instagram)."}, {"d": 1, "t": "Vaka", "f": "Google vakası: Google parasını nasıl kazanmaya başladı?", "b": "Başta arama sonuçlarında reklam yoktu, para kazanmıyordu. Çözüm: AdWords — arama sonuçlarının tepesine, aranan kelimeye göre reklam (ücretli aramalar; bugün 'sponsorlu' yazan ilk sonuçlar). Bu fikir Google'ı dünyanın en büyük teknoloji şirketlerinden biri yaptı."}, {"d": 1, "t": "Vaka", "f": "Word of mouth (ağızdan ağıza pazarlama) nedir? Google'ın örneği?", "b": "Ürünün kalite ve güveninin insanlar arasında konuşularak yayılması; aşırı reklam yerine. Gmail örneği: herkes üye olamazdı, davetiye/referans linki ile açılırdı; 10 yıllık stratejiyle büyüdü."}, {"d": 1, "t": "Küresel Dijital", "f": "Başka ülkede dijital faaliyet göstermeden önce nelerin bilinmesi gerekir?", "b": "Hukuki sistem, kültür, dil, yaşam tarzı; altyapı (internet hızı 3G/5G, elektrik), kullanılan cihaz ve işletim sistemi; insanların çalışma saatleri ve haftalık düzeni (reklamı doğru saate koymak için); hava durumu, milli maç gibi olaylar."}, {"d": 1, "t": "Küresel Dijital", "f": "Mobil neden bu kadar önemlidir?", "b": "İnsanlar telefonu her yerde yanında taşır. Eskiden televizyon/gazete karşısına geçmeleri beklenirdi; artık kimse bir şey beklemiyor, mobil sayesinde her saat, her yerde ulaşılabiliyorlar. Mobil teknolojiyi kullanmak büyük önem taşır."}, {"d": 1, "t": "Küresel Dijital", "f": "'Ben sadece Türkiye'de dijital satış yaparım' demek neden mümkün değildir?", "b": "Küreselleşme: müşteri sizden değil başka ülkedeki bir firmadan alabilir. Ayrıca herkesin aynı dijital iletişim kanalına/altyapıya sahip olmadığını bilmek gerekir (ebeveyn–genç farkı, ülkeden ülkeye cihaz ve internet farkı)."}, {"d": 2, "t": "Dijital Dönüşüm", "f": "Ders 2'nin ana sorusu nedir?", "b": "Teknoloji hızla ilerlerken şirketler yeni teknolojiyi hemen kullanmalı mı, uzak mı durmalı, ne zaman geçmeli? Dijital pazarlamada/dijital dönüşümde karşılaşılan engeller."}, {"d": 2, "t": "Dijital Dönüşüm", "f": "Tüketici yeni teknolojiye şirketten neden daha kolay uyum sağlar?", "b": "Tek kişidir; kötü giderse uygulamayı kapatır/alternatife geçer (WhatsApp bozulursa Telegram). Şirket ise sipariş, müşteri iletişimi, personel uyumu, cihaz uyumu ve masraf riski yaşar; bir şirketin 1-2 hafta çalışmaması iflasa/icraya yol açabilir."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Teknoloji adaptasyon eğrisinin 5 grubunu sırayla say.", "b": "1) Yenilikçiler (innovators) 2) Erken benimseyenler (early adopters) 3) Erken çoğunluk (early majority) 4) Geç çoğunluk (late majority) 5) Gecikenler/direnenler (laggards). Eğri normal dağılım şeklindedir; çoğunluk ortadadır."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Yenilikçiler (innovators) kimlerdir?", "b": "Yeni teknoloji çıkar çıkmaz denemek isteyen, risk almayı seven ve parası olan kişiler/şirketler. Örnek: ilk elektrikli araba alanlar; şarj altyapısı yokken stres ve sıkıntı çektiler."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Erken benimseyenler (early adopters) yenilikçilerden nasıl ayrılır?", "b": "Yeni teknolojiye sıcaktırlar, araştırır okurlar ama hemen koşup almazlar; 'biraz kullanılsın, sonra geçeriz' derler. Daha mantıklı ve temkinlidirler. Yenilikçilerden hemen sonra gelirler."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Erken çoğunluk, geç çoğunluk ve gecikenler arasındaki fark nedir?", "b": "Erken çoğunluk: teknolojiyi nispeten denemeye istekli, altyapı oturunca geçer. Geç çoğunluk: daha geç, iyice bekler, teknolojiye mesafelidir. Gecikenler (laggards): direnir, mecbur kalınca (uygulama zorunluluğu, cihaz bozulması) kullanır; onlara yeni şeyi sunmak zordur."}, {"d": 2, "t": "Teknoloji Adaptasyon Eğrisi", "f": "Şirketler de bu eğrideki gruplara ayrılır mı?", "b": "Evet. Bazı şirketler yenilikçidir (her şeyi ilk kez dener), bazıları erken benimseyen, erken çoğunluk vb. olur. Sorunun cevabı 'hangisi daha iyi' değil, avantaj/dezavantajları tartmaktır."}, {"d": 2, "t": "Öncü Avantajı", "f": "Pazara ilk girmenin (first mover) avantajı nedir?", "b": "Rakip yoktur; tek başına çok para kazanır, pazarın kaymağını alır; özellikle taklit edilemiyorsa güçlüdür. WhatsApp örneği: ilk girenlerin şansı büyük."}, {"d": 2, "t": "Öncü Avantajı", "f": "Yenilikçi olmanın dezavantajı nedir? Örnekler?", "b": "Önde gidenler hataları ilk yapar; arkadan gelenler bu hatalardan ders çıkarıp onları geçebilir. Örnekler: Nokia (2012'de hâlâ ilk 20'de) → Apple arkadan gelip geçti. Story özelliği önce Snapchat'te çıktı, Instagram uyarlayıp (müzik, yazı ekleyerek) daha başarılı oldu."}, {"d": 2, "t": "Öncü Avantajı", "f": "British Gas hashtag örneğinden ne öğreniyoruz?", "b": "Enerji firması sosyal medya başlangıcında tüketiciyle iletişim için hashtag kampanyası açtı; aynı dönemde fiyat zammı geldi, hashtag şikâyet alanına döndü ve kampanya kaldırıldı. Ders: yenilikçi davranırken riski görememek zarar verir; arkadan gelenler tecrübeyi izleyip sessiz kalmayı seçti."}, {"d": 2, "t": "Öncü Avantajı", "f": "Patent ve marka her şeyi korur mu? Hangi sonuca varıyoruz?", "b": "Hayır. Fikir/özellik (ör. story) patentlenemez; yazılımda kodun telifi vardır ama fikri ve mekaniği başkası sıfırdan yazabilir; patent ülkeye göre değişir ve zordur. Sonuç: taklit edilmesi zor şey üret ya da patentlenebilir bir şey bul; hızlı ilerle."}, {"d": 2, "t": "Riskler", "f": "Yeni teknolojide neden 'geri dönüş planı' (rollback) şarttır?", "b": "Yeni teknoloji zarar verebilir (hata, üretim bozulması). Banka örneği: güncellenen uygulama 2-3 gün açılmadı, milyonlar işlem yapamadı; banka eski sürüme dönüp hataları düzeltti, haftalar sonra yeniden yayınladı. Eski sistem güvencedir; hemen terk edilmez (fabrika ayarı, Windows geri yükleme gibi)."}, {"d": 2, "t": "Yetenek Açığı", "f": "Yetenek açığını kapatmanın iki yolu nedir?", "b": "1) Mevcut personeli eğitmek 2) Yeni personel istihdam etmek. (Bonus: şirket içinde bu işi zaten bilen gizli yetenek aramak.)"}, {"d": 2, "t": "Yetenek Açığı", "f": "Mevcut personeli eğitmenin avantaj ve dezavantajları?", "b": "Avantaj: ek maaş yok, sadece eğitim masrafı; personel nitelikli hale gelir; yeni gelen yüzünden motivasyon düşmez; sözleşmeyle rakibe gitmesi engellenebilir (~2 yıl). Dezavantaj: eğitim 1-3 ay sürer; eğitim sonrası da tecrübe eksik kalır; hızlı aksiyon gerekiyorsa yetmez."}, {"d": 2, "t": "Yetenek Açığı", "f": "Yeni personel almanın avantaj ve dezavantajları?", "b": "Avantaj: deneyimli (ör. 10 yıllık) kişi hızlı sonuç verir, kampanya çökerken erken müdahale eder, çözüm ve tecrübe getirir. Dezavantaj: sıfırdan maaş, maliyetli; mevcut personelin motivasyonu düşer, ayağını kaydırma/iş kaybı korkusu doğar."}, {"d": 2, "t": "Yetenek Açığı", "f": "Ne zaman yeni kişi alınır, ne zaman mevcut personel eğitilir?", "b": "Acele varsa/fırsat penceresi kısaysa (hızlı aksiyon) → yeni, deneyimli personel. Zaman varsa ve hazırlık yapılabiliyorsa → mevcut personeli eğitmek. Kampanya, 'Mahmut Bey'in tecrübe tahtası' olmamalı: tecrübesiz kişiye büyük bütçeli kampanya yüklenmez."}, {"d": 2, "t": "Bütçe", "f": "Bütçe kısıtında departmanlar arasında ne olur?", "b": "Yeni teknoloji bedava değildir; parası bir yerden çıkar. Muhasebe, finans, üretim, pazarlama, Ar-Ge, dış ticaret kendi bütçesini korumak ister; kimse parasını vermek istemez, bir departmanın bütçesi başka departman teknolojisine kayabilir."}, {"d": 2, "t": "Bütçe", "f": "Yeni teknoloji projesini iptalden nasıl korursun?", "b": "Projeyi bölümlere ayır, küçük başarı noktaları (milestone / kilometre taşı) belirle ve iyi giden sonuçları (tüketici tepkisi, personel öğrenmesi, algoritma performansı) yönetime düzenli göster. Başarılı projeyi iptal etmek isteyen az olur; iptal edilecek ilk proje seninki olmasın."}, {"d": 2, "t": "Bütçe", "f": "Projelerin iptal edilme nedenleri nelerdir?", "b": "Rakip girişi/rekabet, ekonomik kriz, borsa çöküşü, makro olaylar (savaş, petrol fiyatı), CEO/yönetici değişimi (yeni yönetici kendi ekibini ister), yönetimin tutuculuğu/teknolojiyi bilmemesi (kibir, yaş-teknoloji uçurumu). Çoğu senin elinde değildir; amaç iptal edilmemek."}, {"d": 2, "t": "Düzenlemeler", "f": "Dijital pazarlamada düzenlemeler (regülasyonlar) neyi belirler, örnek kurumlar?", "b": "Hukuki altyapı: internette ne yapılabilir/yapılamaz. Örnekler (derste): ABD'de FCC, İngiltere'de ASA (Advertising Standards Authority), Türkiye'de Ticaret Bakanlığı ve BTK. (Not: derste Çin için söylenen kurum adı transkriptte net değil, doğrula.)"}, {"d": 2, "t": "Düzenlemeler", "f": "Düzenlemelerin alt başlıkları ve örnekleri nelerdir?", "b": "Çerez (cookie) onayı (ülkeye göre zorunlu onay vs. gezinmeyi kabul sayma), gizlilik/veri koruma, konum paylaşımı, çocukların korunması (Disney'in çocuk konumu gösterme uygulaması → ceza), 18 yaş altıyla yazışma kısıtları, bulut depolama güvenliği (iCloud fotoğraf sızıntısı)."}, {"d": 2, "t": "Düzenlemeler", "f": "Platformlara/ülke düzenlemelerine bağımlılık neden risktir?", "b": "Platformlar bir ülkeden çekilebilir ya da yasaklanabilir (Discord örneği, Facebook/Twitter ofis krizi); ödeme hizmetleri ülkeden ülkeye değişir. Tek bir yere kendini bağlama; internet her şey yasaklanabilir ya da açılabilir."}, {"d": 2, "t": "Zaman ve Para", "f": "21. yüzyılda tüketici için neden 'zaman' kıt kaynaktır ve hangi hizmetler bunu çözer?", "b": "Tüketici zaman yoksulu: iş, yol, uyku arasında zaman kalmıyor. Çözenler: süpermarket/AVM (tüm hizmetler bir arada), internet (vergi, film, ödev, sohbet aynı anda) ve mobil cihazlar (interneti cebe almak). Ortak mantık: 'hepsi bir arada' + zaman kazandırma."}, {"d": 3, "t": "SEO", "f": "Google'da sıralamayı etkileyen 3 ana faktör nedir?", "b": "1) Teknik (web sitesinin teknik iyileştirilmesi, kullanıcı deneyimi metrikleri) 2) İçerik (özgün, güncel, kaliteli yazı/görsel) 3) Bağlantı (başka sitelerin sana referans vermesi → otorite). Ders 3 teknik ve bağlantıyı işler."}, {"d": 3, "t": "SEO", "f": "SEO açısından kullanıcı deneyimi (UX) neye bakar?", "b": "Kullanıcı aradığını bulabiliyor mu, rahat geziyor mu, düğmelere ulaşabiliyor mu, sayfa geçişlerinde ne kadar bekliyor, hemen çıkıyor mu? UX yüksekse Google üst sıralara alır, düşükse aşağı atar. Google'un geliri, aranan şeyi doğru yere götürmekten gelir."}, {"d": 3, "t": "Core Web Vitals", "f": "Üç temel kullanıcı deneyimi metriğini söyle (kısaltmalarıyla).", "b": "1) LCP – Largest Contentful Paint 2) FID – First Input Delay 3) CLS – Cumulative Layout Shift. (Güncel not: Mart 2024'ten beri Google FID yerine INP – Interaction to Next Paint kullanıyor; derste FID anlatıldı.)"}, {"d": 3, "t": "Core Web Vitals", "f": "LCP neyi ölçer? Düşük çıkarsa ne olur?", "b": "Sayfadaki en büyük içeriğin (boyut olarak; resim, video, yazı bloğu) yüklenme hızını. Değer ne kadar küçükse (saniyenin altı ideal) o kadar iyi. Yüksekse site gelir ama resim sonradan gelir → kullanıcı deneyimi düşük → sıralama düşer."}, {"d": 3, "t": "Core Web Vitals", "f": "FID (First Input Delay) neyi ölçer?", "b": "Kullanıcının sayfada ilk etkileşimi (düğmeye tıklama) ile sayfanın buna yanıt vermesi arasındaki gecikmeyi, milisaniye cinsinden. Düğmenin görseli yüklenmiş ama arkadaki kod hazır değilse tıklama çalışmaz. Uzak coğrafyadaki sitelerde daha net hissedilir."}, {"d": 3, "t": "Core Web Vitals", "f": "CLS (Cumulative Layout Shift) neyi ölçer ve en sık nedeni nedir?", "b": "Sayfa yüklenirken öğelerin yer değiştirmesini/kaymasını (okurken yazının kayması). En sık neden: reklamlar ve çerçevesi önceden doğru ayarlanmamış öğeler; büyük reklam sığmayınca diğerlerini kaydırır."}, {"d": 3, "t": "Core Web Vitals", "f": "Bu metrikleri hangi araçlarla ölçeriz?", "b": "Chrome'daki Lighthouse (ve benzeri arayüzler): hangi oranın kötü/iyi olduğunu, hangi hataların olduğunu ve neyi değiştirip neyi kaldırmak gerektiğini (ör. görsel boyutunu düşür) gösterir. Ücretli SEO araçları da vardır."}, {"d": 3, "t": "Site Yapısı", "f": "Site hiyerarşisi nasıl kurulmalı ve neden?", "b": "Mantıksal, adım adım: Başlık → alt başlık → onların alt başlıkları (ör. Ayakkabı → Spor → Koşu → Hızlı koşu/Yürüyüş). Hem insanı adım adım yönlendirir hem Google crawler'ının işine gelir; sistematik tasarlanmış site önemli görülür."}, {"d": 3, "t": "Site Yapısı", "f": "Site bağlantıları (sitelinks) nedir?", "b": "Google sonuçlarında ana sonucun altında çıkan ek düğmeler (örn. akademik takvim, online başvuru). Siteyi hiyerarşik/düzenli tasarlayanlar kazanır; kullanıcıyı doğrudan istediği alt sayfaya götürür."}, {"d": 3, "t": "Site Yapısı", "f": "SEO dostu URL nasıl olmalıdır?", "b": "Kısa, anlamlı ve hiyerarşik: ayakkabi/spor/kosu. Anlamsız kod ve uzantılar (dcdx, 2/2) olmasın; hem kullanıcı hem crawler anlam çıkarır."}, {"d": 3, "t": "Menüler", "f": "Üç menü tipi nedir?", "b": "1) Mega menü 2) Minimalist menü 3) Hamburger menü. Sitenin içeriğine ve cihaza göre biri veya birkaçı birlikte kullanılır."}, {"d": 3, "t": "Menüler", "f": "Mega menü nedir, kimler mecburen kullanır?", "b": "Çok sayıda düğmenin olduğu karmaşık menü. Çok çeşitli ürün satan perakendeciler (Trendyol, Hepsiburada tipi) mecburen kullanır; tüketicinin istediği bir şey değildir, kullanıcı deneyimine hizmet etmez. Karmaşadan kurtulmanın yolu arama çubuğudur."}, {"d": 3, "t": "Menüler", "f": "Minimalist menünün özelliği nedir?", "b": "Az düğme, basit; kullanıcıyı merdiven gibi adım adım yönlendirir. Tercih etmemiz gereken menü budur; kullanıcıyı yormaz, Google'ın hiyerarşi anlayışıyla da uyumludur."}, {"d": 3, "t": "Menüler", "f": "Hamburger menü neden doğdu?", "b": "İnternetin mobil cihazlarda kullanılmaya başlamasıyla (~2009-2010) doğdu. Küçük ekranda düğmeler yer kaplıyor, yanlış tıklama oluyordu. Üç çizgili tek düğme: içerik okunur, gerektiğinde basılınca menü büyük açılır. (Şekli hamburgere benzediği için bu ad.) Derste öğrenci 'drop down' dedi."}, {"d": 3, "t": "Teknik SEO", "f": "Başlık etiketleri H1-H6 ne işe yarar?", "b": "Başlıkları önem sırasına göre etiketler: H1 en önemli, H2 ikinci basamak, H3... en fazla H6 (ötesi karmaşa). Google hiyerarşiyi kod üzerinden okur."}, {"d": 3, "t": "Teknik SEO", "f": "Alt text (görsel alternatif metni) neden eklenir?", "b": "Görselin altına/içine ne olduğunu yazmak crawler'ın işini kolaylaştırır; eskiden yapay zeka resmi göremezdi, görsel arama ise zaman kaybıdır. Resimlere anlamlı isim verilir."}, {"d": 3, "t": "Teknik SEO", "f": "Meta description nedir? Uzunluğu ne olmalı, sıralamaya etkisi nedir?", "b": "Arama sonucunda sitenin altında görünen kısa tanım. Tek başına sıralamayı yükseltmez ama iyi yazılırsa tıklanma/trafiği artırır (dolaylı katkı). ~150-160 karakter (aslında piksel sınırı); fazlası '...' ile kesilir. Özgün olmalı ve anahtar kelimeler içermeli."}, {"d": 3, "t": "Teknik SEO", "f": "Canonical (kanonik) etiket nedir, neden kullanılır?", "b": "Aynı içeriği sitende birden fazla yere yazmak zorunda kaldıysan (misyon hem ana sayfada hem misyon sayfasında) Google bunu kopya içerik sayıp cezalandırabilir. Kanonik etiketle 'asıl sayfa şudur' dersin; kopyalama amacıyla yapılmadığını belirtip cezadan kurtulursun."}, {"d": 3, "t": "Bağlantı", "f": "SEO'da 'bağlantı' (backlink) nedir?", "b": "Başka sitelerin senin sitene referans vermesi. Otoritesi yüksek siteler verirse Google sana yüksek otorite verir ve üst sıraya çıkarır. Kendi kendine üretemezsin; en zor kısım. Örnek: National Geographic fotoğrafçının sitesine bağ verirse."}, {"d": 3, "t": "Bağlantı", "f": "Neden bağlantı satın alınmaz (kara şapka)?", "b": "Spam sitelerden parayla bağlantı almak Google tarafından anlaşılır (bir hafta başka yere, bir hafta sana link veren alakasız site) ve ceza/ban gelir. Bağlantı satın alma; spam site açıp kendine link verdirme de yapılmaz."}, {"d": 3, "t": "Bağlantı", "f": "nofollow etiketi ne zaman kullanılır?", "b": "Reklam vererek/ödeyerek bağlantı aldıysan ve bunu SEO için yapmadıysan, bağlantıya nofollow ('beni takip etme') eklenir. Böylece Google bunun algoritmayı kandırma amacı taşımadığını anlar ve ceza vermez."}, {"d": 3, "t": "Bağlantı", "f": "Organik bağlantı taktiklerini say (7 yöntem).", "b": "1) Temel organik bağlantılar (forum, sosyal medya, yorum, Reddit/GitHub — aşırıya kaçmadan) 2) Kırık bağlantı düzeltme 3) Karşılıklı referans/ortaklık (büyük sitelerle karşılıklı bahsetme) 4) Dijital halkla ilişkiler 5) Bağlantı yemi (link bait) 6) Kaynak sayfaları (Wikipedia) 7) Bağlantı reddetme."}, {"d": 3, "t": "Bağlantı", "f": "Temel organik bağlantılar nelerdir ve sınırı nedir?", "b": "Forumlar, sosyal medya, yorumlar, Reddit/GitHub gibi platformlarda kendi sayfanın çözümünü paylaşıp link koymak. Aşırıya kaçılırsa (her yere yazmak) Google bunu manipülasyon sayıp banlar; birkaçıyla sınırlı kal."}, {"d": 3, "t": "Bağlantı", "f": "Kırık bağlantı (broken link) düzeltme nasıl çalışır?", "b": "Eski rehber/içeriklerdeki ölü linkleri bulursun (ör. çalışmayan DLL indirme linki), aynı içeriği kendi sitende sunup linki oraya yönlendirirsin. Kullanıcıların sorununu çözdüğün için trafik ve bağlantı gelir. Meşakkatli, profesyonellik ister."}, {"d": 3, "t": "Bağlantı", "f": "Karşılıklı referans (ortaklık) ile dijital halkla ilişkiler (PR) arasındaki fark nedir?", "b": "Karşılıklı referans: büyük, ciddi, spam olmayan sitelerle para almadan 'sen benden bahset, ben senden' anlaşması (link, vaka çalışması). Dijital PR: iyi içerik üretip haber sitelerine/sektör yayınlarına göndermek; değerli bulurlarsa yayınlayıp link verirler."}, {"d": 3, "t": "Bağlantı", "f": "Bağlantı yemi (link bait) nedir? Örnek?", "b": "İnsanların sorununu çözen, o kadar işe yarayan içerik üretmek ki diğer siteler kendiliğinden referans verir. Örnekler: hesaplayıcılar/dönüştürücüler (altın/kur, vücut kitle indeksi, diyet enerjisi, istatistik hesapları). Kopyalayanlar da kaynak göstermek zorunda kalır."}, {"d": 3, "t": "Bağlantı", "f": "Kaynak sayfalarından (Wikipedia) bağlantı alma sınırı nedir?", "b": "Wikipedia/ekşi sözlük gibi sayfalarda içerik yazıp sitenizi kaynak gösterebilirsiniz ama moderatör ve doğruluk kontrolü vardır; sonsuza dek olmaz. Yazar olarak güvenilir sayılınca yazdıkların yayına girer."}, {"d": 3, "t": "Bağlantı", "f": "Bağlantı reddetme (disavow) nedir, ne zaman gerekir, nasıl yapılır?", "b": "Tanımadığın spam/kalitesiz sitelerin sana verdiği linkleri Google'a 'benim bunlarla ilişkim yok' diye bildirmek. Rakip sana spam link yağdırabilir (negatif SEO) ya da sitenin hacklenmiş listelerde olabilir; bu seni aşağı çeker. Google Search Console üzerinden yapılır."}];

const NOTES = "# Ders 1 — Pazar Bölümlendirme ve Dijital İş Modelleri\n\n## Neden bölümlendirme?\n- 4P (ürün, fiyat, dağıtım, tutundurma) herkese değil, **belirli bir hedef kitleye** ulaştırılır. Hedef kitle yanlış kesilirse tüm çaba boşa gider.\n- Örnek (ayakkabı): 80 milyon → erkek/kadın → yaş (çocuk 7-11) → ilgi (futbol/krampon) → fiyat segmenti ⇒ ~50 bin kişilik hedef kitle.\n- Aynı AVM içindeki iki mağaza bile farklı hedef pazara hitap eder. Dijitalde bu iş \"görsel/dijital reklam\" dersinde ileri seviyede işlenecek.\n\n## 5 bölümlendirme kriteri\n- **Coğrafi:** konuma göre. Kampüs çevresi kafeler; kar sporu ürünleri Erzurum'da. Dijitalde ülke yasaları satışı kısıtlar.\n- **Demografik:** cinsiyet, yaş, eğitim, gelir, meslek. En kolay veri, **az eskir**; ama tek başına yetmez (aynı demografiye sahip herkes aynı şeyi tüketmez).\n- **Davranışsal:** ne tüketiyor, satın alma geçmişi. Dijital izler, indirim kartları, büyük veri. **Çok hızlı eskir** (3-4 yılda hayat değişir) → güncel toplanmalı. 4P kararlarına geri bildirim verir.\n- **Fayda:** aynı ürünü farklı fayda için alma (ceket: sıcaklık / moda / güvenlik).\n- **Psikografik:** yaşam tarzı, inanç, değer, kişilik, ilgi/hobi. Yavaş değişir, **toplaması çok zor** (kara kutu; anketlerde yanlış cevap, gözlemlenince farklı davranma).\n- Hepsini ayrı yapmak zorunda değiliz; mümkün olduğunca **birlikte** kullanılır.\n\n## Persona (profil çıkarma)\n- Hedef pazardan birbirinden farklı ~5 kurgusal kişi tahmin edilir; davranış/ihtiyaçlar empatiyle çıkarılır.\n- Örnek (kulüp): 30-45 yaş sadık taraftar (forma, maç, sosyal medya yorumu) vs 16-23 yaş genç taraftar (bayrak, her maç).\n\n## İş modelleri\n- **B2C:** işletme → tüketici; kitlesel, düşük maliyet (gıda, tekstil, oyuncak).\n- **Niş B2C:** (1) çok üst kalite + zengin tüketici (2) az ihtiyaç duyulan ürün (lüks araç, tekerlekli sandalye, işitme cihazı).\n- **B2B:** işletme → işletme; devasa hacim, profesyonel standartlar, kişiler belli (anonim çağrı merkezi yok); TV reklamı gereksiz.\n- **Abonelik tabanlı:** kullandıkça düzenli ödeme (antivirüs, Netflix). İlk internet döneminde yaygındı, şimdi etkisi azaldı.\n- **Freemium:** ürün ücretsiz, ek fayda ücretli. 2006 sonrası Asya oyun sektörü; Spotify, YouTube Premium. Amaç: kullanıcıyı ve reklam gelirini kaybetmemek.\n- **Mikro işlem:** ücretsiz uygulama içinde küçük satın alımlar (oyun kristali).\n\n## Vakalar\n- **Facebook:** hızlı büyüdü, sunucu parası yoktu → **işletme sayfaları + reklam** iş modeli (Meta: WhatsApp, Instagram).\n- **Google:** başta gelirsizdi → **AdWords** (arama sonucunun tepesinde kelimeye göre reklam = \"ücretli aramalar\"). Ayrıca **word of mouth**: Gmail davetiye/referans ile yayıldı; 10 yıllık strateji.\n\n## Küresel ve mobil dijital\n- Yurt dışında faaliyet için: hukuk, kültür, dil, yaşam tarzı, altyapı (internet hızı, elektrik), cihaz/işletim sistemi, çalışma saatleri (reklam saati), hava/maç gibi olaylar.\n- \"Sadece Türkiye'de satarım\" diyemezsin (küreselleşme).\n- **Mobil:** her yerde, her saat ulaşabiliyoruz; TV/gazete gibi beklemek yok.\n\n---\n\n# Ders 2 — Dijital Pazarlamada / Dijital Dönüşümde Engeller\n\n## Ana soru\nTeknoloji hızla ilerliyor: şirket yeni teknolojiye **hemen mi geçmeli, beklemeli mi, hiç mi geçmemeli?** (YBS'nin \"arada kalan\" rolü: işletme + mühendislik.)\n\n## Neden şirket için daha zor?\n- Tüketici: bir uygulama bozulursa kapatır. Şirket: sipariş, müşteri iletişimi, personel uyumu, cihaz uyumu, masraf. 1-2 hafta kapalı kalmak iflas/icra demek.\n- Pazarlama için SEO, ücretli arama, yapay zekâ gibi araçlar **görece korkutucu değil** (hazır sistemler var; kendin yaparsın ya da dışarıdan alırsın).\n\n## Teknoloji adaptasyon eğrisi (normal dağılım)\n1. **Yenilikçiler:** hemen dener, risk sever, parası var (ilk elektrikli araç alanlar).\n2. **Erken benimseyenler:** ilgili ama hemen almaz, biraz bekler.\n3. **Erken çoğunluk:** altyapı oturunca geçer (çoğunluk).\n4. **Geç çoğunluk:** mesafeli, iyice bekler.\n5. **Gecikenler (laggards):** direnir, mecbur kalınca geçer.\n- Şirketler de bu gruplara ayrılır.\n\n## Öncü avantajı vs dezavantajı\n- **Avantaj:** rakip yok, pazarın kaymağı, taklit zorsa güçlü (WhatsApp).\n- **Dezavantaj:** hataları ilk yapan sensin; arkadan gelen ders alır. Nokia → Apple; Snapchat story → Instagram; **British Gas** hashtag felaketi (zam dönemi).\n- **Patent/marka her şeyi korumaz:** fikir/özellik patentlenemez, yazılımda kod telifi var ama fikir sıfırdan yazılabilir. Çözüm: taklidi zor şey üret, hızlı ilerle.\n\n## Engeller\n### 1) Teknolojik belirsizlik ve geri dönüş planı\n- Banka uygulaması örneği: güncelleme 2-3 gün açılmadı → eski sürüme dönüldü, hata giderildi, haftalar sonra tekrar yayınlandı.\n- **Eski sistemi hemen terk etme; rollback planın olsun.**\n\n### 2) Yetenek açığı\n| | Mevcut personeli eğitmek | Yeni personel almak |\n|---|---|---|\n| Artı | Ucuz (ek maaş yok), personel gelişir, motivasyon düşmez, sözleşmeyle rakibe gitmesi engellenir (~2 yıl) | Deneyimli, hızlı sonuç, kampanya çökerken erken müdahale |\n| Eksi | 1-3 ay sürer, tecrübe eksik kalır | Pahalı, mevcut personelin motivasyonu düşer, rekabet/ayak kaydırma |\n- Acele varsa → yeni; zaman varsa → eğit. Tecrübesiz kişiyi büyük kampanyada \"deneme tahtası\" yapma.\n- Bonus: şirket içinde bu işi daha önce yapmış **gizli yeteneği** bul (İK'nın personeli tanıması).\n\n### 3) Bütçe\n- Teknoloji bedava değil; departmanlar (finans, üretim, pazarlama, Ar-Ge...) bütçe için yarışır.\n- **Projeyi koru:** bölümlere ayır → **kilometre taşları (milestone)** → iyi sonuçları yönetime sürekli göster.\n- İptal nedenleri: rakip, ekonomik kriz, borsa/makro olaylar (petrol), CEO değişimi, tutucu yönetici.\n\n### 4) Düzenlemeler (regülasyon)\n- Örnek kurumlar (derste): ABD FCC, İngiltere ASA, Türkiye Ticaret Bakanlığı / BTK.\n- Alt konular: çerez onayı, gizlilik, konum, çocukların korunması (Disney cezası), 18 yaş altı yazışma, bulut depolama güvenliği.\n- Platformlar yasaklanabilir/çekilebilir (Discord, Facebook-Twitter ofis krizi) → **tek yere bağlanma**.\n\n### 5) Zaman ve para\n- Tüketici zaman yoksulu → AVM, internet, mobil = \"hepsi bir arada\" zaman kazandırır.\n- Şirketin parası risk almasını sınırlar; yanlış hamle kapanışa kadar gidebilir.\n\n---\n\n# Ders 3 — Arama Motoru Optimizasyonu (SEO): Teknik ve Bağlantı\n\n## Üç sıralama faktörü\n**Teknik** (site yapısı, metrikler) · **İçerik** (özgün, güncel) · **Bağlantı** (başkalarının referansı). Ders 3 = teknik + bağlantı.\n\n## Kullanıcı deneyimi metrikleri (Core Web Vitals)\n- **LCP – Largest Contentful Paint:** en büyük içeriğin yüklenme hızı.\n- **FID – First Input Delay:** ilk tıklamada gecikme (düğme görünüyor ama kod hazır değil). *Güncel not: 2024'ten beri yerini INP aldı.*\n- **CLS – Cumulative Layout Shift:** yükleme sırasında öğelerin kayması (çoğunlukla reklam çerçeveleri).\n- Araç: **Chrome Lighthouse** (ne bozuk, neyi küçült/kaldır).\n- Mantık: Google, aranan şeyi hızlı ve doğru yere götürerek para kazanır → UX düşük siteyi aşağı atar.\n\n## Site tasarımı\n- **Hiyerarşi:** başlık → alt başlık → alt alt başlık (Ayakkabı → Spor → Koşu → Hızlı koşu). İnsan ve crawler için mantıksal.\n- **Site bağlantıları (sitelinks):** düzenli yapı Google sonucunda ek düğmeler kazandırır.\n- **URL:** kısa, anlamlı, hiyerarşik (`ayakkabi/spor/kosu`); anlamsız kodlar yok.\n- **Menü tipleri:**\n  - *Mega menü:* çok ürün çeşidi olan perakendeciler mecburen kullanır; karmaşık; çıkış yolu arama çubuğu.\n  - *Minimalist menü:* az düğme, adım adım yönlendirme; **tercih edilen**.\n  - *Hamburger menü:* mobil ekran küçük olduğu için (2009-10); üç çizgili, açılır menü.\n- **H1–H6:** başlık önem sırası (H1 en önemli, en fazla H6).\n- **Alt text:** görsele ne olduğunu yaz, resimlere anlamlı isim ver.\n- **Meta description:** sonuçta görünen tanım; ~150-160 karakter (aslında piksel), özgün, anahtar kelimeli; **tek başına sıralamayı artırmaz, tıklanmayı artırır**.\n- **Canonical etiketi:** aynı içeriği birden çok yere yazmak zorundaysan asıl sayfayı göster → kopya içerik cezası yok.\n\n## Bağlantı (backlink)\n- Başkalarının sana verdiği referans; otoriteyi artırır; kendin üretemezsin, **en zor kısım**. Otoriter site (National Geographic) verirse etkisi çok büyük.\n- **Yapma:** bağlantı satın alma, spam sitelerle link yağdırma (kara şapka) → ban.\n- **nofollow:** reklam/ödemeyle aldığın ama SEO amacı olmayan bağlantıya ekle.\n- **Organik taktikler:**\n  1. Temel organik bağlantılar (forum, sosyal medya, yorum, Reddit/GitHub) — aşırıya kaçma\n  2. Kırık bağlantı düzeltme (ölü linkin yerine kendi içeriğin)\n  3. Karşılıklı referans/ortaklık (büyük ciddi sitelerle, parasız)\n  4. Dijital halkla ilişkiler (haber siteleri/sektör yayınlarına içerik)\n  5. Bağlantı yemi (hesaplayıcı, dönüştürücü, problem çözen araç)\n  6. Kaynak sayfaları (Wikipedia; moderasyon ve doğruluk kontrolü var)\n  7. Bağlantı reddetme (**Google Search Console**; spam/negatif SEO linklerini \"benimle ilgisi yok\" diye bildir)\n";
const COURSE = {"title": "Pazarlama", "sub": "Ders 1–3 transkriptlerinden: notlar · aralıklı tekrar kartları · test · plan", "ders": {"1": "Ders 1 · Bölümlendirme & iş modelleri", "2": "Ders 2 · Dijital dönüşüm engelleri", "3": "Ders 3 · SEO"}, "extra": ["Vaka karşılaştırması: Nokia/Apple · Snapchat/Instagram · British Gas — ortak ders nedir?"], "id": "pazarlama"};

const $ = (s,r=document)=>r.querySelector(s);
const K=k=>COURSE.id+':'+k;
const store = {
  get(k,d){try{const v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}}

const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5, INTERVALS=[0,0,1,3,7,14]; // box index → days

const nav=$('#nav');
TABS.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});

/* ---------- notes (mini markdown) ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

/* ---------- flashcards (Leitner) ---------- */
let cardFilter=store.get('pz_filter',0), session=[], sIdx=0, flipped=false;
const cs=()=>store.get('pz_cards',{});
function cardState(id){return cs()[id]||{box:1,due:0}}
function dueList(f){const s=cs(),now=Date.now();return CARDS.map((c,i)=>({...c,id:i})).filter(c=>(!f||c.d===f)&&((s[c.id]||{due:0}).due<=now))}
function renderCards(){
  const el=$('#p-cards');
  let h=`<div class="row" style="margin-bottom:14px">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${cardFilter===f}" data-f="${f}">${f?U+' '+f:'Hepsi'} (${dueList(f).length})</button>`).join('')+`</div><div id="sess"></div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{cardFilter=+b.dataset.f;store.set('pz_filter',cardFilter);session=[];renderCards()});
  if(!session.length||sIdx>=session.length){session=shuffle(dueList(cardFilter));sIdx=0}
  drawCard();
}
function drawCard(){
  const box=$('#sess');if(!box)return;
  if(!session.length){box.innerHTML=`<div class="card" style="text-align:center"><b>Bekleyen kart yok 🎉</b><p class="mute">Bu filtre için bugün çalışılacak kart kalmadı. Yarın tekrar gel ya da başka bir ${U.toLowerCase()} seç.</p><button class="btn alt" id="all">Yine de hepsini karıştır</button></div>`;
    $('#all').onclick=()=>{session=shuffle(CARDS.map((c,i)=>({...c,id:i})).filter(c=>!cardFilter||c.d===cardFilter));sIdx=0;drawCard()};return}
  const c=session[sIdx];flipped=false;
  box.innerHTML=`<div class="mute" style="margin-bottom:6px">${sIdx+1} / ${session.length} · Kutu ${cardState(c.id).box}</div><div class="bar" style="margin-bottom:12px"><i style="width:${sIdx/session.length*100}%"></i></div>
  <div class="card flash" id="fl" tabindex="0"><div class="tag">${esc(DERS[c.d])} · ${esc(c.t)}</div><div class="q">${esc(c.f)}</div><div class="a" id="ans" hidden>${esc(c.b)}</div><div class="mute" id="hint" style="margin-top:12px">Cevabı düşün, sonra çevirmek için dokun (Boşluk)</div></div>
  <div class="row" id="grade" hidden><button class="btn bad" data-g="0">Bilemedim</button><button class="btn alt" data-g="1">Zor</button><button class="btn ok" data-g="2">Bildim</button></div>`;
  const flip=()=>{if(flipped)return;flipped=true;$('#ans').hidden=false;$('#hint').hidden=true;$('#grade').hidden=false};
  $('#fl').onclick=flip;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>grade(c,+b.dataset.g));
  window._flip=flip;
}
function grade(c,g){
  const s=cs(),st=s[c.id]||{box:1,due:0};
  if(g===0)st.box=1;else if(g===2)st.box=Math.min(5,st.box+1);
  st.due=Date.now()+(g===0?0:INTERVALS[st.box]*DAY);
  s[c.id]=st;store.set('pz_cards',s);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(g===0)session.push(c);
  sIdx++;
  if(sIdx>=session.length){session=[];renderCards()}else drawCard();
}
document.addEventListener('keydown',e=>{
  if($('#p-cards').classList.contains('on')&&$('#fl')){
    if(e.code==='Space'){e.preventDefault();window._flip&&window._flip()}
    else if(flipped&&['Digit1','Digit2','Digit3'].includes(e.code))$('#grade').querySelectorAll('[data-g]')[+e.code.slice(-1)-1].click();
  }
});

let qz=null;
function renderQuizHome(){
  const wrong=store.get('pz_wrong',[]),best=store.get('pz_best',{});
  $('#p-quiz').innerHTML=`<div class="card"><b>Test oluştur</b><div class="row" style="margin:12px 0" id="qd">`+[0,...NS].map(f=>`<button class="chip" aria-pressed="${(qz&&qz.f||0)===f}" data-f="${f}">${f?U+' '+f:'Karışık'}</button>`).join('')+`</div>
  <div class="row"><button class="btn" id="go10">10 soru</button><button class="btn alt" id="go20">20 soru</button><button class="btn alt" id="goall">Hepsi</button><button class="btn alt" id="gow" ${wrong.length?'':'disabled'}>Yanlışlarım (${wrong.length})</button></div>
  <p class="mute" style="margin:12px 0 0">Şıklar her seferinde karışır. Yanlış yaptıkların "Yanlışlarım"a eklenir, doğru yapınca çıkar.</p></div>
  <div class="card mute">En iyi skorlar: ${[0,...NS].map(f=>`${f?U+' '+f:'Karışık'}:${best[f]!=null?best[f]+'%':'—'}`).join(' · ')}</div>`;
  let f=0;

function startQuiz(f,n,wrongOnly){
  const W=store.get('pz_wrong',[]);
  let pool=QUIZ.map((q,i)=>({...q,id:i})).filter(q=>wrongOnly?W.includes(q.id):(!f||q.d===f));
  pool=shuffle(pool).slice(0,n);
  qz={f,items:pool.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,order:idx,ans:idx.indexOf(q.a)}}),i:0,score:0,done:false,wrongOnly};
  drawQ();
}
function drawQ(){
  const el=$('#p-quiz');
  if(qz.i>=qz.items.length){
    const pct=Math.round(qz.score/qz.items.length*100);
    if(!qz.wrongOnly){const b=store.get('pz_best',{});if(b[qz.f]==null||pct>b[qz.f]){b[qz.f]=pct;store.set('pz_best',b)}}
    el.innerHTML=`<div class="card" style="text-align:center"><div class="tag">Sonuç</div><div style="font:700 48px Georgia,serif">${qz.score}/${qz.items.length}</div><p class="mute">%${pct} · ${pct>=85?'Güçlü — tekrar aralığını uzatabilirsin.':pct>=60?'İyi gidiyor — yanlışların kartlarını çalış.':'Notlara dön, ilgili kartları çalış, sonra tekrar dene.'}</p><button class="btn" id="again">Yeni test</button></div>`;
    $('#again').onclick=()=>{qz=null;renderQuizHome()};return;
  }
  const q=qz.items[qz.i];
  el.innerHTML=`<div class="mute" style="margin-bottom:6px">${qz.i+1} / ${qz.items.length} · ${esc(DERS[q.d])}</div><div class="bar" style="margin-bottom:12px"><i style="width:${qz.i/qz.items.length*100}%"></i></div>
  <div class="card"><div style="font:600 18px/1.45 Georgia,serif;margin-bottom:8px">${esc(q.q)}</div><div id="opts">${q.order.map((oi,k)=>`<button class="opt" data-k="${k}">${esc(q.o[oi])}</button>`).join('')}</div><div id="fb" hidden></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,ok=k===q.ans;
    el.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(i===q.ans)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok)qz.score++;
    const W=store.get('pz_wrong',[]),has=W.includes(q.id);
    if(!ok&&!has)W.push(q.id);if(ok&&has)W.splice(W.indexOf(q.id),1);store.set('pz_wrong',W);
    const fb=$('#fb');fb.hidden=false;fb.innerHTML=`<p style="margin:12px 0 4px"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':'Yanlış'}</b> — ${esc(q.w)}</p><button class="btn" id="nx">${qz.i+1>=qz.items.length?'Sonucu gör':'Sonraki'}</button>`;
    $('#nx').onclick=()=>{qz.i++;drawQ()};$('#nx').focus();
  });
}

/* ---------- practice (procedural generators) ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];
const fmt=x=>String(Math.round(x*1000)/1000).replace('.',','), N=x=>x.toLocaleString('tr-TR');
const sum=a=>a.reduce((s,x)=>s+x,0);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const mcq=o=>{const s=shuf(o.map((t,i)=>[t,i]));return{opts:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===0)}}; // doğru şık o[0]
const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});
    return `<svg class="tree" viewBox="0 0 ${i*44+8} ${T.h(t)*56}" style="max-width:${i*44+8}px">${e}${c}</svg>`}
};
const PR={'+':1,'-':1,'*':2,'/':2};
const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);if(t.l.op&&PR[t.l.op]<PR[t.op])a=`(${a})`;if(t.r.op&&PR[t.r.op]<=PR[t.op])b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const tbl=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

const GEN={
  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder (kök–sol–sağ)',T.pre],['inorder (sol–kök–sağ)',T.ino],['postorder (sol–sağ–kök)',T.post],['level order (seviye seviye)',T.lvl]]),a=fn(t);
    return{q:`Aşağıdaki ikili ağacın <b>${nm}</b> dolaşma sırasını yaz.`+T.svg(t),type:'txt',a:a.join(''),show:a.join(', '),sol:`Sıra: <b>${a.join(', ')}</b>`}}},
  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(7,9));let t=null;v.forEach(x=>t=T.ins(t,x));
    const ns=T.nodes(t),k=R(0,4),lead=`Boş bir ikili arama ağacına sırasıyla <b>${v.join(', ')}</b> ekleniyor. `;let q,a,type='num';
    if(k===0){a=T.pre(t);q='Ağacın <b>preorder</b> dolaşımını yaz.';type='txt'}
    else if(k===1){a=T.post(t);q='Ağacın <b>postorder</b> dolaşımını yaz.';type='txt'}
    else if(k===2){const c=pick(ns.filter(x=>x.p));a=c.p.v;q=`<b>${c.n.v}</b> düğümünün ebeveyni hangisidir?`}
    else if(k===3){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> vardır?'}

    const arr=Array.isArray(a);return{q:lead+q,type,a:arr?a.join(''):a,show:arr?a.join(', '):a,sol:'Kural: küçükse sola, büyük veya eşitse sağa. Oluşan ağaç:'+T.svg(t)+(arr?`Cevap: <b>${a.join(', ')}</b>`:'')}}},
  treeprops:{label:'Ağaç terimleri',f(){const t=T.rand(R(7,10)),ns=T.nodes(t),c=pick(ns),k=R(0,4);let q,a;
    if(k===0){a=ns.filter(x=>!x.n.l&&!x.n.r).length;q='Ağaçta kaç <b>yaprak</b> düğüm vardır?'}
    else if(k===1){a=c.d;q=`<b>${c.n.v}</b> düğümünün <b>derinliği</b> kaçtır? (kökten kenar sayısı, kök = 0)`}
    else if(k===2){a=c.d+1;q=`<b>${c.n.v}</b> düğümünün <b>seviyesi</b> kaçtır? (kök = 1)`}

    else{a=ns.filter(x=>x.n.l||x.n.r).length;q='Ağaçta kaç <b>dahili</b> (yaprak olmayan) düğüm vardır?'}
    return{q:q+T.svg(t),type:'num',a,sol:`Cevap: <b>${a}</b>. Derinlik = kökten kenar sayısı, seviye = derinlik + 1, derece = çocuk sayısı, yaprak = çocuğu olmayan düğüm.`}}},
  postfix:{label:'Infix → postfix/prefix',f(){let i=0;const t=exprT(R(3,5),()=>'ABCDEFG'[i++],Object.keys(PR)),pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');
    return{q:`<b>${inf(t)}</b> ifadesinin <b>${pre?'prefix':'postfix'}</b> karşılığını yaz.`,type:'txt',a,show:a,sol:`${pre?'Prefix':'Postfix'}: <b>${a}</b>. En son yapılan işlem (${t.op}) ${pre?'en başa':'en sona'} yazılır; parantez içleri önce kendi ${pre?'prefix':'postfix'} haline getirilir.`}}},
  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);
    const tk=pst(t),st=[],steps=[];tk.forEach(x=>{if(typeof x==='number')st.push(x);else{const b=st.pop(),a=st.pop(),r=ev({op:x,l:{v:a},r:{v:b}});st.push(r);steps.push(`${a} ${x} ${b} = ${r} → yığın: [${st.join(', ')}]`)}});
    return{q:`<b>${tk.join(' ')}</b> postfix ifadesinin değeri kaçtır?`,type:'num',a:v,sol:'Sayıları yığına at; operatör gelince iki eleman çıkar (ikinci çıkan soldadır), sonucu geri at:<br>'+steps.join('<br>')}}},
  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;
    for(let i=0,n=R(6,9);i<n;i++){if(ds.length&&Math.random()<.35){last=S?ds.pop():ds.shift();ops.push(S?'pop()':'dequeue()')}else{const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}}
    if(!ds.length){const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}
    const k=last!=null?R(0,2):R(0,1),q=[S?'Tepede (top) hangi eleman vardır?':'Önde (front) hangi eleman vardır?','Yapıda kaç eleman kalmıştır?',`Son ${S?'pop':'dequeue'} işlemi hangi elemanı çıkarmıştır?`][k];
    return{q:`Boş bir ${S?'yığına (stack)':'kuyruğa (queue)'} sırasıyla şu işlemler uygulanıyor:<div class="raw">${ops.join(', ')}</div>${q}`,type:'num',a:[S?ds[ds.length-1]:ds[0],ds.length,last][k],sol:`Son durum (${S?'alttan tepeye':'önden arkaya'}): [${ds.join(', ')}]. ${S?'LIFO: son giren ilk çıkar.':'FIFO: ilk giren ilk çıkar.'}`}}},
  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,3);
    if(k===0){const v=R(20,200)*1000,s=Math.round(v*R(5,40)/1000),a=s/v*100;return{q:`Bir e-ticaret sitesi ayda <b>${N(v)}</b> ziyaret ve <b>${N(s)}</b> sipariş alıyor. <b>Dönüşüm oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Dönüşüm = sipariş / ziyaret × 100 = ${N(s)} / ${N(v)} × 100 = %${fmt(a)}`}}
    if(k===1){const o=R(5,50)*100,a=R(15,120)*10;return{q:`Aylık gelir <b>${N(o*a)} TL</b>, sipariş sayısı <b>${N(o)}</b>. <b>Ortalama sipariş değeri (AOV)</b> kaç TL'dir?`,type:'num',a,sol:`AOV = gelir / sipariş = ${N(o*a)} / ${N(o)} = ${N(a)} TL`}}
    if(k===2){const m=R(5,40)*100,a=R(5,60)*10;return{q:`Pazarlamaya <b>${N(m*a)} TL</b> harcanarak <b>${N(m)}</b> yeni müşteri kazanıldı. <b>Müşteri edinme maliyeti (CAC)</b> kaç TL'dir?`,type:'num',a,sol:`CAC = pazarlama harcaması / yeni müşteri = ${N(m*a)} / ${N(m)} = ${N(a)} TL`}}
    const s=R(10,80)*100,o=Math.round(s*R(20,80)/100),a=(s-o)/s*100;return{q:`<b>${N(s)}</b> sepet oluşturuldu, bunların <b>${N(o)}</b> tanesi siparişe döndü. <b>Sepet terk oranı</b> yüzde kaçtır?`,type:'num',a,sol:`Sepet terk = (sepet − sipariş) / sepet × 100 = (${N(s)} − ${N(o)}) / ${N(s)} × 100 = %${fmt(a)}`}}},
  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);

  gsyih:{label:'GSYİH/GSMH · faktörler',f(){

      return{q:`Türkiye açısından: <b>${s}</b> hangisine dahildir?`,type:'mc',opts:['Yalnız GSYİH','Yalnız GSMH','Hem GSYİH hem GSMH'],a,sol:'GSYİH: üretim nerede yapıldı? (toprak ilkesi). GSMH: üretimi kim yaptı? (vatandaşlık ilkesi).'}}
    const [s,a]=pick([['Atölyenin bulunduğu arsa için ödenen kira',0],['İşçilere ödenen ücretler',1],['Dikiş makineleri için çekilen kredinin bedeli',2],['İşletme sahibinin üstlendiği riskin karşılığı',3],['Maden ocağının kullanım bedeli',0],['Yazılım mühendislerine ödenen maaşlar',1],['Banka kredisine ödenen faiz',2],['Girişimcinin yıl sonunda elde ettiği artık',3]]);

  freq:{label:'Frekans tablosu',f(){const n=R(15,20),d=[...Array(n)].map(()=>R(0,5)),cnt=[0,1,2,3,4,5].map(v=>d.filter(x=>x===v).length),v=R(0,4),k=R(0,2);

  central:{label:'Ortalama · medyan · mod',f(){let d,mode;do{d=[...Array(R(7,12))].map(()=>R(1,15));const c={};d.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c)),m=Object.keys(c).filter(k=>c[k]===mx);mode=m.length===1&&mx>1?+m[0]:null}while(mode==null);

let gq=null,gsel=store.get('pz_gsel','all');
if(gsel!=='all'&&!GENS.includes(gsel))gsel='all';
function renderGen(){

}
function newGen(){const g=gsel==='all'?pick(GENS):gsel;gq={g,...GEN[g].f(),done:false}}
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9+\-*/]/g,'');
function parseNum(s){s=String(s).trim().replace(/[%\s]/g,'').replace('−','-');if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))}
function drawGen(){
  const q=gq,b=$('#gbox');
  const inp=q.type==='mc'?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :q.type==='multi'?`<div class="mf">${q.fields.map(([l],i)=>`<label>${esc(l)}<input class="gin" data-f="${i}" autocomplete="off" inputmode="decimal" placeholder="Sayı"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="gchk">Kontrol et</button></div>`
    :`<div class="row"><input id="gin" class="gin" autocomplete="off" inputmode="${q.type==='num'?'decimal':'text'}" placeholder="${q.type==='num'?'Sayı (ör. 2,5)':'Cevabın (ör. A, B, C)'}"><button class="btn" id="gchk">Kontrol et</button></div>`;
  b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div>${inp}<div id="gfb"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>checkGen(+x.dataset.i));
  const gin=$('#gin'),mi=[...b.querySelectorAll('[data-f]')];
  if(mi.length){const vals=()=>mi.map(x=>x.value);$('#gchk').onclick=()=>checkGen(vals());
    mi.forEach((x,i)=>x.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(gq.done)return nextGen();const empty=mi.find(y=>!y.value.trim());empty?empty.focus():checkGen(vals())});mi[0].focus()}
  if(gin){$('#gchk').onclick=()=>checkGen(gin.value);gin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gq.done?nextGen():checkGen(gin.value)}};gin.focus()}
  $('#gshow').onclick=()=>{gq.done=true;showSol(null)};$('#gnext').onclick=nextGen;
}
function nextGen(){newGen();renderGen()}
function checkGen(v){
  if(gq.done)return;
  const numOk=(s,a)=>Math.abs(parseNum(s)-a)<=Math.max(.0015,Math.abs(a)*1e-4);
  if(gq.type==='multi'){const mi=[...$('#gbox').querySelectorAll('[data-f]')],e=mi.find(x=>!x.value.trim());if(e)return e.focus()}
  else if(gq.type!=='mc'&&String(v).trim()==='')return;
  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=()=>{if(confirm('Kart, test, alıştırma ve plan ilerlemesi silinsin mi?')){['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}

/* ---------- init ---------- */
$('#ttl').textContent=COURSE.title;$('#sub').insertAdjacentHTML('beforeend',COURSE.sub);
$('#notes').innerHTML=md(NOTES);
renderPlan();
show(store.get('pz_tab','plan'));
</script>
</body>
</html>
