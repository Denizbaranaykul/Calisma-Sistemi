    if(k===5){const P=[-1,-.5,0,.5,1,1.5,2],ma=R(10,14)*5,mb=R(10,14)*5,sa=2*R(3,7),sb=2*R(3,7);let za,zb;do{za=pick(P);zb=pick(P)}while(za===zb);const xa=ma+za*sa,xb=mb+zb*sb;
      return{q:`Ayşe matematikten <b>${xa}</b> (sınıf μ = ${ma}, σ = ${sa}), Türkçeden <b>${xb}</b> (sınıf μ = ${mb}, σ = ${sb}) aldı. <b>Sınıfına göre</b> hangi derste daha başarılıdır?`,type:'mc',opts:['Matematik','Türkçe','İkisinde eşit'],a:za>zb?0:1,
        sol:`z_mat = (${xa} − ${ma}) / ${sa} = ${fmt(za)} · z_tür = (${xb} − ${mb}) / ${sb} = ${fmt(zb)} → z'si büyük olan derste göreli olarak daha başarılıdır. Ham puanlar farklı ölçeklerde olduğu için doğrudan karşılaştırılmaz.`}}
    const [q,o,s]=pick([
      ['Bir veri setindeki tüm değerler z skoruna dönüştürülürse yeni dağılımın ortalaması ve standart sapması ne olur?',['Ortalama 0, standart sapma 1','Ortalama 1, standart sapma 0','Ortalama ve standart sapma değişmez','Ortalama 50, standart sapma 10'],'z skorlarının ortalaması her zaman 0, standart sapması her zaman 1\'dir.'],
      ['Sağa çarpık bir dağılımdaki değerler z skorlarına dönüştürülürse dağılımın şekli ne olur?',['Sağa çarpık kalır','Normal dağılıma dönüşür','Sola çarpık olur','Simetrik olur'],'z dönüşümü yalnızca kaydırır ve ölçekler; dağılımın şeklini değiştirmez.'],
      ['z = −1,5 ne anlatır?',['Değer ortalamanın 1,5 standart sapma altındadır','Değer ortalamadan 1,5 puan düşüktür','Değer en düşük %15\'lik dilimdedir','Değer ortalamanın 1,5 standart sapma üstündedir'],'z, ortalamadan kaç standart sapma uzakta olunduğunu gösterir; eksi işareti ortalamanın altında demektir.'],
      ['z skorunun birimi nedir?',['Birimsizdir','Ham puanla aynı birimdedir','Yüzdedir','Ham puan biriminin karesidir'],'(X − μ) / σ işleminde pay ile payda aynı birimde olduğu için birim sadeleşir. Bu sayede farklı ölçekler karşılaştırılabilir.'],
      ['Ham puanı ortalamaya eşit olan bir kişinin z skoru kaçtır?',['0','1','−1','Ortalamaya eşittir'],'X = μ ise X − μ = 0, yani z = 0.'],
      ['İki öğrencinin z skorları +2 ve −2\'dir. Hangisi doğrudur?',['Ortalamaya eşit uzaklıktadırlar, biri üstünde biri altında','İkisi de ortalamanın üstündedir','Puanlarının toplamı sıfırdır','İkisi de aynı puanı almıştır'],'|z| uzaklığı, işaret yönü gösterir.']]);
    return{q,type:'mc',...mcq(o),sol:s}}},
  empirical:{label:'Normal dağılım görgül kural',f(){const mu=R(10,14)*5,sd=pick([5,8,10,12,15]),n=pick([200,400,1000,2000,4000]),k=R(0,4),
      KUR='±1σ ≈ %68 (yarısı %34), ±2σ ≈ %95 (yarısı %47,5), ±3σ ≈ %99,7 (yarısı %49,85), ortalamanın her iki yanı %50',ORTA=[[1,68],[2,95],[3,99.7]];
    if(k===0){const [z1,z2,p]=pick([[-1,1,68],[0,1,34],[-2,2,95],[1,2,13.5],[-2,-1,13.5],[0,2,47.5],[-3,3,99.7],[1,9,16],[-9,-1,16],[2,9,2.5],[-9,-2,2.5],[-1,2,81.5],[-2,1,81.5],[2,3,2.35],[-3,-2,2.35],[-9,1,84],[-1,9,84],[-9,2,97.5],[0,3,49.85]]);
      const lo=mu+z1*sd,hi=mu+z2*sd,desc=z1===-9?`${hi} ve altında`:z2===9?`${lo} ve üstünde`:`${lo} ile ${hi} arasında`,c=Math.random()<.5,a=c?n*p/100:p,zs=z=>z===-9?'−∞':z===9?'+∞':(z>0?'+':'')+z;
      return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>${c?`, N = <b>${N(n)}</b>`:''}. <b>${desc}</b> not alanların ${c?'<b>sayısı</b>':'<b>yüzdesi</b>'} yaklaşık kaçtır?`,type:'num',a,
        sol:`z aralığı: ${zs(z1)} ile ${zs(z2)}. ${KUR} → %${fmt(p)}${c?` → ${N(n)} × ${fmt(p/100)} = ${fmt(a)}`:''}`}}
    if(k===1){const [z,p]=pick(ORTA);
      return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>. Öğrencilerin <b>ortadaki %${fmt(p)}</b>'lik kısmı hangi iki not arasındadır?`,type:'multi',fields:[['Alt sınır',mu-z*sd],['Üst sınır',mu+z*sd]],sol:`Ortadaki %${fmt(p)} → μ ± ${z}σ = ${mu} ± ${z} × ${sd} → ${mu-z*sd} ile ${mu+z*sd}`}}
    if(k===2){const [z,p]=pick(ORTA),lo=mu-z*sd,hi=mu+z*sd;
      return{q:`Normal dağılan bir sınavda öğrencilerin ortadaki <b>%${fmt(p)}</b>'lik kısmı <b>${lo}</b> ile <b>${hi}</b> arasında not aldı. Sınavın <b>ortalaması ve standart sapması</b> kaçtır?`,type:'multi',fields:[['Ortalama (μ)',mu],['Standart sapma (σ)',sd]],sol:`Dağılım simetrik → μ = (${lo} + ${hi}) / 2 = ${mu}. %${fmt(p)} = μ ± ${z}σ → aralığın genişliği ${hi-lo} = ${2*z}σ → σ = ${hi-lo} / ${2*z} = ${sd}`}}
    if(k===3){const [z,p]=pick([[1,32],[2,5],[3,.3]]),c=Math.random()<.5,a=c?n*p/100:p;
      return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>${c?`, N = <b>${N(n)}</b>`:''}. <b>${mu-z*sd} altında veya ${mu+z*sd} üstünde</b> not alanların ${c?'<b>sayısı</b>':'<b>yüzdesi</b>'} yaklaşık kaçtır?`,type:'num',a,
        sol:`Bu notlar μ ± ${z}σ aralığının dışında. İçerisi %${fmt(100-p)} → dışarısı %100 − %${fmt(100-p)} = %${fmt(p)} (her kuyrukta %${fmt(p/2)})${c?` → ${N(n)} × ${fmt(p/100)} = ${fmt(a)}`:''}`}}
    const [z,p,how]=pick([[-2,2.5,'%50 − %47,5'],[-1,16,'%50 − %34'],[0,50,'tam ortalama → %50'],[1,84,'%50 + %34'],[2,97.5,'%50 + %47,5'],[3,99.85,'%50 + %49,85']]),x=mu+z*sd;
    return{q:`Notlar normal dağılıyor: μ = <b>${mu}</b>, σ = <b>${sd}</b>. <b>${x}</b> alan bir öğrenci, öğrencilerin yaklaşık <b>yüzde kaçından</b> daha yüksek not almıştır?`,type:'num',a:p,sol:`z = (${x} − ${mu}) / ${sd} = ${z}. z = ${z} noktasının solundaki (altındaki) alan: ${how} = %${fmt(p)}`}}}
};
let gq=null,gsel=store.get('pz_gsel','all');
if(gsel!=='all'&&!GENS.includes(gsel))gsel='all';
function renderGen(){
  const st=store.get('pz_gen',{});
  $('#p-gen').innerHTML=`<div class="card"><div class="row" id="gch">`+['all',...GENS].map(g=>`<button class="chip" aria-pressed="${gsel===g}" data-g="${g}">${g==='all'?'Karışık':GEN[g].label}${st[g]?` · ${st[g][0]}/${st[g][1]}`:''}</button>`).join('')+`</div>
  <p class="mute" style="margin:10px 0 0">Sorular her seferinde rastgele sayılarla yeniden üretilir — sınırsız alıştırma. Ondalıkta virgül ya da nokta kullanabilirsin; nihai cevabı virgülden sonra 3 basamağa yuvarla.</p></div><div id="gbox"></div>`;
  $('#gch').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gsel=b.dataset.g;store.set('pz_gsel',gsel);gq=null;renderGen()});
  if(!gq)newGen();drawGen();
}
function newGen(){const g=gsel==='all'?pick(GENS):gsel;gq={g,...GEN[g].f(),done:false}}
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9+\-*/]/g,'');
function parseNum(s){s=String(s).trim().replace(/[%\s]/g,'').replace('−','-');if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))}
function drawGen(){
  const q=gq,b=$('#gbox');
  const inp=q.type==='mc'?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :q.type==='multi'?`<div class="mf">${q.fields.map(([l],i)=>`<label>${esc(l)}<input class="gin" data-f="${i}" autocomplete="off" inputmode="decimal" placeholder="Sayı"></label>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="gchk">Kontrol et</button></div>`
    :`<div class="row"><input id="gin" class="gin" autocomplete="off" inputmode="${q.type==='num'?'decimal':'text'}" placeholder="${q.type==='num'?'Sayı (ör. 2,5)':'Cevabın (ör. A, B, C)'}"><button class="btn" id="gchk">Kontrol et</button></div>`;
  b.innerHTML=`<div class="card pr"><div class="tag">${GEN[q.g].label}</div><div class="gq">${q.q}</div>${inp}<div id="gfb"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="gshow">Çözümü göster</button><button class="btn alt" id="gnext">Yeni soru →</button></div></div>`;
  b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>checkGen(+x.dataset.i));
  const gin=$('#gin'),mi=[...b.querySelectorAll('[data-f]')];
  if(mi.length){const vals=()=>mi.map(x=>x.value);$('#gchk').onclick=()=>checkGen(vals());
    mi.forEach((x,i)=>x.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(gq.done)return nextGen();const empty=mi.find(y=>!y.value.trim());empty?empty.focus():checkGen(vals())});mi[0].focus()}
  if(gin){$('#gchk').onclick=()=>checkGen(gin.value);gin.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();gq.done?nextGen():checkGen(gin.value)}};gin.focus()}
  $('#gshow').onclick=()=>{gq.done=true;showSol(null)};$('#gnext').onclick=nextGen;
}
function nextGen(){newGen();renderGen()}
function checkGen(v){
  if(gq.done)return;
  const numOk=(s,a)=>Math.abs(parseNum(s)-a)<=Math.max(.0015,Math.abs(a)*1e-4);
  if(gq.type==='multi'){const mi=[...$('#gbox').querySelectorAll('[data-f]')],e=mi.find(x=>!x.value.trim());if(e)return e.focus()}
  else if(gq.type!=='mc'&&String(v).trim()==='')return;
  gq.done=true;
  let ok;
  if(gq.type==='multi'){const r=gq.fields.map(([,a],i)=>numOk(v[i],a));ok=r.every(Boolean);gq.right=r.filter(Boolean).length;
    $('#gbox').querySelectorAll('[data-f]').forEach((x,i)=>{x.disabled=true;x.classList.add(r[i]?'right':'wrong')})}
  else ok=gq.type==='mc'?v===gq.a:gq.type==='num'?numOk(v,gq.a):norm(v)===norm(gq.a);
  const st=store.get('pz_gen',{}),s=st[gq.g]||[0,0];s[1]++;if(ok)s[0]++;st[gq.g]=s;store.set('pz_gen',st);
  const log=store.get('pz_log',{}),d=new Date().toISOString().slice(0,10);log[d]=(log[d]||0)+1;store.set('pz_log',log);
  if(gq.type==='mc')$('#gbox').querySelectorAll('[data-i]').forEach((x,i)=>{x.disabled=true;if(i===gq.a)x.classList.add('right');else if(i===v)x.classList.add('wrong')});
  showSol(ok);
}
function showSol(ok){
  const multi=gq.type==='multi',ans=gq.type==='mc'?gq.opts[gq.a]:gq.type==='num'?fmt(gq.a):multi?gq.fields.map(([l,a])=>`${l} = ${fmt(a)}`).join(' · '):gq.show;
  $('#gfb').innerHTML=`${ok==null?'':`<p style="margin:12px 0 0"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'Doğru':multi?`Yanlış (${gq.right}/${gq.fields.length} doğru)`:'Yanlış'}</b>${ok?'':` — doğru cevap${multi?'lar':''}: <b>${esc(String(ans))}</b>`}</p>`}<div class="sol">${ok==null?`Cevap: <b>${esc(String(ans))}</b><br>`:''}${gq.sol}</div>`;
  $('#gshow').hidden=true;$('#gnext').classList.remove('alt');$('#gnext').focus();
}

/* ---------- progress ---------- */
function renderProg(){

  CARDS.forEach((_,i)=>counts[(s[i]||{box:1}).box]++);
  const due=dueList(0).length,log=store.get('pz_log',{}),today=log[new Date().toISOString().slice(0,10)]||0;
  const days=Object.keys(log).length,mx=Math.max(1,...counts.slice(1));

  $('#p-prog').innerHTML=`<div class="card"><div class="stats">
  <div class="stat"><b>${CARDS.length}</b>kart</div><div class="stat"><b>${due}</b>bugün bekleyen</div><div class="stat"><b>${today}</b>bugün çalışılan</div><div class="stat"><b>${days}</b>çalışılan gün</div></div></div>
  <div class="card"><b>Kutu dağılımı</b><span class="mute"> (5 = iyi öğrenildi)</span><div class="box" style="margin-top:12px">${[1,2,3,4,5].map(b=>`<i style="height:${counts[b]/mx*100}%" title="Kutu ${b}: ${counts[b]}"></i>`).join('')}</div>
  <div class="row mute" style="justify-content:space-around;margin-top:4px">${[1,2,3,4,5].map(b=>`<span>K${b}: ${counts[b]}</span>`).join('')}</div>
  <p class="mute" style="margin-bottom:0">Bir kart kutuya girince şu kadar gün sonra tekrar gelir: Kutu 2 → 1 gün, 3 → 3 gün, 4 → 7 gün, 5 → 14 gün. "Bilemedim" kartı Kutu 1'e geri atar.</p></div>
  ${weak.length?`<div class="card"><b>Zorlandığın kartlar</b><ul>${weak.map(c=>`<li>${esc(c.f)} <span class="mute">(${DERS[c.d].split(' · ')[0]})</span></li>`).join('')}</ul></div>`:''}
  ${(()=>{const g=store.get('pz_gen',{}),ks=GENS.filter(k=>g[k]);return ks.length?`<div class="card"><b>Alıştırma başarısı</b><ul>${ks.map(k=>`<li>${GEN[k].label}: ${g[k][0]}/${g[k][1]} doğru <span class="mute">(%${Math.round(g[k][0]/g[k][1]*100)})</span></li>`).join('')}</ul></div>`:''})()}
  <div class="card"><button class="btn alt" id="reset">Tüm ilerlemeyi sıfırla</button></div>`;
  $('#reset').onclick=()=>{if(confirm('Kart, test, alıştırma ve plan ilerlemesi silinsin mi?')){['pz_cards','pz_log','pz_wrong','pz_best','pz_plan','pz_gen'].forEach(k=>{try{localStorage.removeItem(K(k))}catch(e){}});session=[];renderPlan();renderProg()}};
}
