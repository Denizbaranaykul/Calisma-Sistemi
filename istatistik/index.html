<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İstatistik</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#e4dfd5;--accent:#c2410c;--accent-ink:#fff;--ok:#15803d;--bad:#b91c1c;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}}
:root[data-theme="dark"]{--bg:#171512;--card:#211e1a;--ink:#f1ede4;--mute:#a39c8e;--line:#35302a;--accent:#fb923c;--accent-ink:#1a1208;--ok:#4ade80;--bad:#f87171;--soft:#2a2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px}
h1{font:700 26px/1.2 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .q{font:600 20px/1.4 Georgia,serif}
.flash .a{font-size:16px;border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.notes h1{font:700 22px/1.3 Georgia,serif;margin:28px 0 8px;color:var(--accent)}
.notes h2{font-size:17px;margin:20px 0 6px}.notes h3{font-size:15px;margin:14px 0 4px}
.notes ul{margin:4px 0 8px;padding-left:22px}.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.notes hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.notes code{background:var(--soft);padding:1px 5px;border-radius:4px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--accent)}
.plan .done{color:var(--mute);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}
.box{display:flex;gap:4px;align-items:end;height:70px}.box i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
a{color:var(--accent)}
.tree{width:100%;height:auto;display:block;margin:12px auto}
.tree line{stroke:var(--mute);stroke-width:2}.tree circle{fill:var(--card);stroke:var(--accent);stroke-width:2}
.tree text{fill:var(--ink);font:600 13px system-ui,sans-serif;text-anchor:middle}
.gq{font:600 17px/1.5 Georgia,serif;margin:8px 0 12px}
.raw{font:15px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0;word-spacing:2px}
.gin{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}.mf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.mf .gin{min-width:0}
.gin.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.gin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.pr table{border-collapse:collapse;font-size:14px;margin:8px 0}.pr th,.pr td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:15px}
</style>
</head>
<body>

<header>
  <p class="sub"><a href="../index.html">← Tüm dersler</a></p>

  <p class="sub" id="sub"></p>
</header>
<nav role="tablist" id="nav"></nav>

<section class="panel" id="p-plan"></section>
<section class="panel" id="p-notes"><div class="card notes" id="notes"></div></section>
<section class="panel" id="p-cards"></section>
<section class="panel" id="p-quiz"></section>
<section class="panel" id="p-gen"></section>
<section class="panel" id="p-prog"></section>
</div>

<script>
const CARDS = [{"d": 1, "t": "Çerçeve", "f": "Bu dersin iki kolu nedir ve gelecek dönem ne işlenecek?", "b": "Betimleyici (betimsel) istatistik + olasılık. Betimsel: eldeki veriyi özetle/tasvir et. Gelecek dönem çıkarımsal istatistik (örneklemden ana kütleye genelleme); onu anlamak için olasılık gerekir."}, {"d": 1, "t": "Çerçeve", "f": "Uygulamalı ve matematiksel istatistik farkı nedir?", "b": "Matematiksel (teorik) istatistik formüllerin türetilmesiyle ilgilenir. Biz uygulamalı istatistik yapıyoruz: yöntemi kullanıp veriyi analiz etmek."}, {"d": 1, "t": "Çerçeve", "f": "Derste veri hakkında hangi varsayımı yapıyoruz?", "b": "Veri hazır; ölçme geçerli ve güvenilir, kalitesinde sorun yok, eksik veri yok. Gerçek araştırmada bunlar mutlaka sorgulanır (bitirme tezi, tez, kurum raporu)."}, {"d": 1, "t": "Çerçeve", "f": "İstatistik ile makine öğrenmesi/veri bilimi arasındaki temel farklar?", "b": "Veri bilimi/ML: veri toplama, dağınık/büyük veri ve genelde sadece tahmin; ana kütleye genelleme derdi yok. İstatistik: elde hazır veri var, nasıl analiz edip anlaşılır kılarız ve (çıkarımsalda) genelleriz."}, {"d": 1, "t": "Veri Seti", "f": "Veri setinde satır ve sütun neyi temsil eder?", "b": "Satır = gözlem (analiz) birimi (öğrenci, firma, ülke, ürün...). Sütun = değişken. Excel tablosunun genel adı spreadsheet / veri matrisi."}, {"d": 1, "t": "Veri Seti", "f": "ID (kimlik) değişkeni neden eklenir?", "b": "Gözlem birimlerini birbirinden ayırt etmek ve farklı veri setlerini birleştirmek (eşleştirmek) için. Gerçek bir değişken değil, yardımcı değişkendir; sıra anlamı taşımak zorunda değil."}, {"d": 1, "t": "Veri Seti", "f": "Analiz birimini nasıl belirlersin? Örnek ver.", "b": "İlgilendiğin özellik hangi varlığa aitse o analiz birimidir. Ciro → firma (müdürün/çalışanın değil). Aynı enflasyon verisinde: bir yıl için birçok ülke → birim ülke; tek ülkenin yıllık enflasyonu → birim yıl."}, {"d": 1, "t": "Tanımlar", "f": "Kavramsal tanım nedir?", "b": "Kavramı başka kavramlar üzerinden açıklar (sözlük/ansiklopedi/bilimsel kitap). Bilimde ortak tek tanım yoktur; hangi teoriye/tanıma dayandığını belirtirsin ki herkes aynı şeyi anlasın."}, {"d": 1, "t": "Tanımlar", "f": "Operasyonel (işlemsel) tanım nedir? Örnek?", "b": "Kavramı nasıl ölçtüğünü/hangi işlemleri uyguladığını anlatarak tanımlama. Derse devam = 14 haftalık yoklamada gelinen hafta sayısı (0-14). Akademik başarı = tarih final notu (100 soruda doğru sayısı). Enflasyon = sepet ürünlerinin fiyat oranlarının katsayılarla ağırlıklı ortalaması."}, {"d": 1, "t": "Tanımlar", "f": "'Enflasyon düştü' cümlesi neden sık yanlış anlaşılır?", "b": "Halk fiyatların düştüğünü sanır. Aslında fiyatlar artmaya devam eder ama artış hızı düşmüştür. Fiyatlar düşerse enflasyon negatif (eksi) olur."}, {"d": 1, "t": "Değişken", "f": "Bir özelliğin 'değişken' sayılması için hangi 3 koşul gerekir?", "b": "1) Ölçülebilir hale getirilip fiilen ölçülmüş olmalı 2) Araştırmada bir rolü olmalı (bağımlı/bağımsız vb.) 3) Farklı değerler almalı (herkes aynı değeri aldıysa sabit olur; bilim sabiti açıklayamaz, ancak değişkenliği açıklar)."}, {"d": 1, "t": "Değişken", "f": "Bağımlı ve bağımsız değişken nedir?", "b": "Bağımlı (Y, çıktı): nedenini merak ettiğin değişken. Bağımsız (X, öncül, ML'de feature): Y'nin nedeni olabileceğini düşündüğün değişken. Kardeş sayısı X, akademik başarı Y olabilir."}, {"d": 1, "t": "Örneklem", "f": "Ana kütle, örneklem, istatistik, parametre arasındaki ilişki nedir?", "b": "Ana kütle: genellemek istediğin tüm varlıklar. Örneklem: ondan seçilen küçük kısım. İstatistik: örneklemden hesaplanan sayı. Parametre: ana kütleye ait gerçek değer (genelde bilinmez). Çıkarımsal istatistik: istatistikten parametreye tahmin."}, {"d": 1, "t": "Örneklem", "f": "Örnekleme neden başvurulur? Ana kütle ne zaman örneklem olur?", "b": "Ana kütlenin tamamına ulaşılamadığı için (seçmen kütüğü 45 milyon). Tamamına ulaşabiliyorsan örnekleme gerek yok (5 çalışanlı firma). Ana kütle büyüklüğünü araştırmacı amacına, bütçesine, zamanına göre seçer. Amaç genelleme değilse eldeki veri ana kütle sayılır."}, {"d": 1, "t": "Örneklem", "f": "%5 kuralı nedir?", "b": "Örneklem ana kütlenin yaklaşık %5'inden küçükse, sonlu ana kütleyi sonsuz kabul etmek sonuçları çok değiştirmez; çıkarımsal yöntemler sonsuz ana kütle varsayar. Örneklem büyük olmalı ama ana kütleye göre küçük kalmalı → bu yüzden yeterince büyük ana kütle seç."}, {"d": 1, "t": "Örneklem", "f": "Çıkarımsal istatistik sonucu nasıl ifade edilir? Örnek?", "b": "Hata payı ve olasılık (güven düzeyi) ile aralık tahmini: 10 bin kişilik örneklemde A Partisi %35 → tüm seçmenlerde oy oranı %95 güvenle %32 ile %39 arasında."}, {"d": 1, "t": "Betimleme", "f": "Betimleme araçları nelerdir, asıl oyuncu hangisi?", "b": "1) İstatistiksel tablolar (frekans, çapraz) 2) Grafikler (histogram, lollipop...) 3) Sayısal göstergeler/istatistikler (ortalama...). Tablo ve grafik yardımcı; asıl araç sayısal göstergelerdir."}, {"d": 1, "t": "Betimleme", "f": "Ortalama gibi özet sayılar neden kullanılır, sınırı nedir?", "b": "Yüzlerce değeri tek sayıyla özetler, grubun genel seviyesini verir; birey-grup ve grup-grup karşılaştırmasını mümkün kılar. Ancak 'A sınıfı ortalaması yüksek' her A öğrencisinin her B öğrencisinden iyi olduğu anlamına gelmez."}, {"d": 2, "t": "Nedensellik", "f": "Karşıt olgusallık (counterfactual) nedir?", "b": "X, Y'nin nedeni mi? X olmasaydı (diğer her şey aynı) Y olur muydu? Olmazsa X neden sayılır. Alkollü sürücü örneği. Kusurları var (boşanmanın nedeni evlilik mi?) ama en çok kabul gören yaklaşımlardan."}, {"d": 2, "t": "Nedensellik", "f": "İstatistik nedenselliği tek başına gösterebilir mi?", "b": "Hayır. İstatistik ilişkinin varlığını gösterir; nedensel yorum teori, araştırma tasarımı, mantıksal gerekçe ve istatistik dışı yöntemlerle yapılan bir çıkarımdır."}, {"d": 2, "t": "Nedensellik", "f": "Korelasyon nedir? 'Correlation does not imply causation' ne demek?", "b": "İki değişken arasındaki ilişkinin sayısal ölçüsü (Pearson momentler çarpımı); günlük dilde ilişki anlamında kullanılır. İlişki var diye biri diğerinin nedeni olmak zorunda değil."}, {"d": 2, "t": "Nedensellik", "f": "Açıklama ile tahmin arasındaki fark nedir?", "b": "Klasik bilim X'in Y'ye neden olduğunu açıklamaya çalışır. Tahmin (prediction): nedeni bilmeden X'ten Y'yi öngörmek (hangi hisse yükselecek, hangi hasta kurtulacak). Makine öğrenmesi sadece tahminle ilgilenir. Halk için tahmin çoğu zaman yeterlidir (deprem tahmin modeli)."}, {"d": 2, "t": "Ölçme", "f": "Ölçme nedir? Hangi iki şey gerekir?", "b": "Varlıkta özelliğin olup olmadığını, varsa hangi düzeyde olduğunu standart bir birimle sayısallaştırmak. Gerekenler: anlamlı birim sistemi (metre, kilogram; prototip/evrensel sabit) ve karşılaştırma mekanizması (iki kefeli terazi, dik tutulan metre)."}, {"d": 2, "t": "Ölçme", "f": "Stevens'ın ölçme tanımı nedir ve ne sonuç doğurur?", "b": "Belli kurallara uyarak varlıkların özelliklerine sayısal değerler atamak. Geniş tanım olduğu için dört ölçüm düzeyi çıkar; psikolojinin 'ölçme yok' eleştirisine yanıt olmuştur."}, {"d": 2, "t": "Ölçüm Düzeyi", "f": "4 ölçüm düzeyini kıdemliden basite sırala.", "b": "Oran (ratio) > Aralık (interval) > Sıralı (ordinal) > Sınıflayıcı (nominal). Üstteki, alttakilerin tüm özelliklerini taşır. Oran+aralık = metrik (sayısal) değişken."}, {"d": 2, "t": "Ölçüm Düzeyi", "f": "Oran (ratio) ölçümünün ayırt edici özelliği nedir? Örnekler?", "b": "Sıfır gerçek yokluğu temsil eder → eksi değer olmaz ve iki değer oranlanabilir (2 katı). Boy, kütle, uzunluk, maaş (60 bin 30 binin 2 katı)."}, {"d": 2, "t": "Ölçüm Düzeyi", "f": "Aralık (interval) ölçüm nedir? Neden oranlama yapılamaz?", "b": "Anlamlı birim ve eşit aralıklar var ama sıfır keyfi (yokluk değil). Celsius/Fahrenheit, takvim yılı. Farklar alınır (4 derece arttı) ama 4 °C → 8 °C 'iki kat sıcak' denmez; −2 → +2 'eksi bir kat' saçmalığına gider. Kelvin oran ölçeğidir."}, {"d": 2, "t": "Ölçüm Düzeyi", "f": "Sıralı (ordinal) ölçüm nedir, sayılar neyi gösterir?", "b": "Varlıklar anlamlı bir sıraya konur ve sıraya artan sayılar verilir. Örnek: eğitim düzeyi, yarışta sıra/F1 puanı, rütbe. Sadece büyük/küçük karşılaştırılır; farkların eşit anlamı yoktur, toplama/çıkarma/oranlama yapılamaz."}, {"d": 2, "t": "Ölçüm Düzeyi", "f": "Nominal (sınıflayıcı) ölçümde sayılar ne işe yarar? Hangi işlem yapılır?", "b": "Sayılar sadece kategori etiketidir (plaka kodu 34-35, cinsiyet, medeni hal). Yapılabilen: eşit / eşit değil (ve mod). Büyüklük-küçüklük, toplama, oranlama anlamsız."}, {"d": 2, "t": "Ölçüm Düzeyi", "f": "Plaka kodu ile eğitim düzeyi (1-6) arasındaki ölçüm farkı nedir?", "b": "Plaka kodu nominal (sıra anlamı yok); eğitim düzeyi sıralı (büyük = daha fazla öğrenim) ama aralıklar eşit değil. Ölçüm düzeyi hangi istatistiksel analizin yapılabileceğini belirler."}, {"d": 3, "t": "Veri Türü", "f": "Kesikli ve sürekli değişken farkı nedir?", "b": "Kesikli: değerler arasında boşluk var (1 ile 2 arasında değer yok; tam sayı sayımları). Sürekli: reel sayı doğrusunda boşluk yok, iki değer arasında sonsuz değer var."}, {"d": 3, "t": "Veri Türü", "f": "Gerçek hayatta tam sürekli veri var mıdır? Neden yine de sürekli kabul ederiz?", "b": "Hayır; ölçüm aletlerinin hassasiyeti sınırlıdır. Ama yeterince ince ölçüm varsa sürekliymiş gibi kabul etmek matematiği/hesabı kolaylaştırır (masayı dikdörtgen sayıp a×b ile alan hesaplamak gibi). Bu 'yeterince' kararını araştırmacı verir."}, {"d": 3, "t": "Veri Türü", "f": "Sayma verisi derken istatistikte neyi kastederiz?", "b": "Sayarak elde edilen, çok az farklı değer alabilen (0-7 kardeş, alttan ders sayısı) ve çoğu kez bir değerde aşırı yığılma olan veri. (Her ölçme bir ölçüde sayma içerir ama bu dar anlam kastedilir.)"}, {"d": 3, "t": "Veri Türü", "f": "Dikotomik değişken nedir, neden 'en az iki şık' gerekir?", "b": "İki şıklı (evet/hayır, doğru/yanlış). Tek şıklı olursa herkes aynı değeri alır, değişkenlik olmaz. Nominaldir; 0/1 kodlanır (hangisi 0 olacağı önemsiz, matematiksel avantaj sağlar). Poli = çok şıklı."}, {"d": 3, "t": "Veri Türü", "f": "Dikotomize etmek nedir, neden önerilmez?", "b": "Aslında çok şıklı/metrik olan veriyi iki şıklıya çevirmek (ehliyet yazılı sınavı 0-100 → geçti/kaldı). Basitleştirir ve bazı analizlere izin verir ama bilgi kaybı yaratır (69 alanla 0 alan aynı kefeye girer)."}, {"d": 3, "t": "Veri Türü", "f": "Nominal ölçümde kategorilerin hangi iki kuralı sağlaması gerekir?", "b": "Birbirini dışlamalı (örtüşmemeli) ve kapsayıcı olmalı: her kişi bir ve yalnızca bir kategoriye girer. Anket şıklarını cevaplayanların nasıl anlayacağına göre yaz (dul belirsiz → 'şu an evli misin?')."}, {"d": 3, "t": "Frekans Tablosu", "f": "Frekans nedir? Frekans tablosunda ne olur?", "b": "Bir skorun veri setinde kaç kez görüldüğü (sıklık). Tabloda değişkenin alabildiği değerler (skorlar) satırlara yazılır, yanına frekans eklenir; 100 satırlık ham veri 11 satıra iner. Frekansların toplamı N."}, {"d": 3, "t": "Frekans Tablosu", "f": "Frekans tablosunun büyüklüğünü ne belirler?", "b": "Gözlem sayısı değil, değişkenin aldığı farklı değer sayısı. 100 öğrenci de 1 milyon öğrenci de olsa 0-10 arası değer alan değişken için 11 satır olur."}, {"d": 3, "t": "Frekans Tablosu", "f": "Pay (proportion) nedir, nasıl hesaplanır, toplamı kaç olur?", "b": "Parçanın bütüne oranı: pay = frekans / toplam gözlem sayısı (N). Payların toplamı 1. Yüzdelik = pay × 100 (toplam %100). Göreli (nispi) frekans da denir. Hoca başına öğrenci gibi oranlar 'pay' değildir (parça/bütün değil)."}, {"d": 3, "t": "Frekans Tablosu", "f": "Kümülatif frekans, kümülatif pay ve kümülatif yüzdelik nasıl bulunur?", "b": "Küçük skordan başlayıp birikimli toplam alınır: her satır = önceki kümülatif + o satırın değeri. Son satır sırasıyla N, 1 ve %100 olmalı. Belli bir değere kadar olanların oranı doğrudan okunur."}, {"d": 3, "t": "Frekans Tablosu", "f": "'3'ten fazla dersi olanların oranı' kümülatif tablodan nasıl bulunur?", "b": "Küçükten büyüğe tabloda 3'ün kümülatif payını 1'den (ya da %100'den) çıkarırsın: 1 − 0,60 = 0,40. Alternatif: tabloyu büyükten küçüğe sıralayıp kümülatif hesaplarsın."}, {"d": 3, "t": "Frekans Tablosu", "f": "Yüzdelik dilim (percentile) nedir? %1'lik dilim ne anlama gelir?", "b": "Kişinin diğerlerinin yüzde kaçını geçtiğini gösteren konum. Üniversite sınavında %1'lik dilim = en başarılı %1 (yaklaşık %99'unu geçtin); dilim ne kadar düşükse yerleşmek o kadar zor. Puan yıldan yıla oynar, dilim daha kararlıdır."}, {"d": 3, "t": "Frekans Tablosu", "f": "Lollipop grafiği neyi gösterir, nasıl çizilir?", "b": "X ekseninde skorlar, y ekseninde o skorun frekansı; her skor için bir nokta ve x eksenine uzanan çubuk (lolipop şekli). Gösterdiği şey frekans dağılımıdır; asıl dağılan x'in skorlarıdır."}, {"d": 3, "t": "Frekans Tablosu", "f": "Tek değişkenli (univariate) istatistik nedir?", "b": "Veri setinde çok değişken olsa da her değişkeni tek tek ele alıp özetlemek/betimlemek. Çok değişkenli analizlerde değişkenler arası ilişki incelenir (sonraki haftalar)."}, {"d": 3, "t": "Yazım Kuralı", "f": "Sınavda nihai cevap kaç basamak yazılır, yuvarlama nasıl yapılır?", "b": "Virgülden sonra 3. basamağa yuvarla: 4. basamak 5 ve üzeriyse 3. basamağı yukarı al, 4 ve altıysa aynen bırak. Ara işlemlerde yuvarlama yapma (hesap makinesindeki tüm basamaklar). Sondaki sıfırlar yazılmayabilir."}, {"d": 3, "t": "Yazım Kuralı", "f": "Oran mı yüzdelik mi yazılır? Sık yapılan hata nedir?", "b": "Sınavda genelde oran (0,20); sadece %20 yazma. Hepsini aynı basamak sayısında tut. En sık hata: 0,05'i 0,5 yazmak (%5'in oranı 0,05'tir)."}, {"d": 3, "t": "Yazım Kuralı", "f": "Sayı ve sembol yazım kuralları (ondalık, %, para)?", "b": "Türkiye'de ondalık ayırıcı virgül, binlik ayırıcı nokta (Excel/kodda yerel ayarı kontrol et). Türkçede yüzde işareti önce (%23), İngilizcede sonra (23%). Para sembolü başa (₺1000), alt birim (kuruş/cent) sona."}, {"d": 3, "t": "Yazım Kuralı", "f": "İşlem adımlarını yazma kuralı nedir?", "b": "Basit bile olsa işlem adımları gösterilir (12 ÷ 6 = 2 şeklinde), sadece '2' yazmak puan kaybettirir. Cevap sadece gerçek işlemin sonucu olmalı."}, {"d": 4, "t": "Kavram", "f": "Dikotomi nedir? Medeni hal (evli/bekâr/dul) dikotomik midir?", "b": "İki şıklı sınıflandırma (geçti–kaldı). Çok şıklıya politomi denir. Medeni hal 3 şıklı olduğu için dikotomik değildir. Dikotomi basitleştirir ama bilgi kaybettirir."}, {"d": 4, "t": "Tablo", "f": "Tam frekans tablosunun sütunları?", "b": "Skor (x), frekans, pay (nispi frekans), yüzde, kümülatif frekans, kümülatif pay, kümülatif yüzde."}, {"d": 4, "t": "Tablo", "f": "Pay (oran, nispi frekans) nasıl hesaplanır?", "b": "Hücre frekansı / toplam gözlem sayısı (parçanın bütüne oranı). Teknik raporda pay gösterilir; sınavda oran olarak sorulur."}, {"d": 4, "t": "Tablo", "f": "Kümülatif yüzde nasıl bulunur? Son satırda kaç olur?", "b": "Yukarıdan başlayarak yüzdeler biriktirilerek toplanır; son satırda %100 (kümülatif pay 1) olur."}, {"d": 4, "t": "Grafik", "f": "Histogram hangi veriler için kullanılır, sütunları nasıldır?", "b": "Metrik (interval–rasyo) veriler için; sütunlar bitişiktir ve alan oranı gösterir (yükseklik değil alan önemli)."}, {"d": 4, "t": "Grafik", "f": "Sütun (bar) grafiği hangi veriler için, histogramdan farkı?", "b": "Nominal veya ordinal veriler için; sütunlar arasında boşluk bırakılır."}, {"d": 4, "t": "Grafik", "f": "Hangi grafiğin kullanılması tercih edilmez?", "b": "Pasta grafiği (dilim alanlarını kıyaslamak zordur)."}, {"d": 4, "t": "Grafik", "f": "Lolipop grafiğinde eksenler neyi gösterir?", "b": "x ekseni skorları, y ekseni frekansı (kaç tane olduğu). Gösterilen şey aslında x değişkenine ait skorların dağılımıdır."}, {"d": 4, "t": "Grafik", "f": "Histogramda boş kategori (frekansı 0) için teamül ve teknik kural nedir?", "b": "Teamül: o sütun silinir. Teknik kural: histogramda boşluk olmaz, komşu kategorilerle birleştirilir; alan korunacağı için taban 2 birim olunca yükseklik yarıya iner."}, {"d": 4, "t": "Grafik", "f": "Gruplanmış veri nedir, neden yapılır?", "b": "Çok sayıda farklı skoru aralıklara (5'lik, 10'luk) toplamak; her grubun orta değeri ad olabilir. Az sütunla kolay anlaşılır grafik için yapılan suni ayrıştırmadır (SPSS: bin)."}, {"d": 4, "t": "Kural", "f": "Sınavda yuvarlama kuralı?", "b": "Nihai sonuç virgülden sonra 3. basamağa yuvarlanır; 4. basamak 5 ve üstüyse 3. basamak 1 artar (92,57469 → 92,575). Ara işlemde yuvarlama yapılmaz, kesir bırakılmaz."}, {"d": 5, "t": "Ortalama", "f": "Aritmetik ortalama formülü ve gösterimleri?", "b": "μx = ΣXᵢ / N. x̄: örneklem ortalaması; μx veya Mx: ana kütle ortalaması. Bu dönem veriler ana kütle kabul edilir."}, {"d": 5, "t": "Ortalama", "f": "Çamlık oda sayısı verisi: 0,7,1,2,3,3,1,6,2,2,2,1. Ortalama?", "b": "Toplam 30, N = 12 → μ = 30/12 = 2,5."}, {"d": 5, "t": "Ortalama", "f": "Frekans tablosundan ortalama nasıl hesaplanır?", "b": "μ = Σ(skor × frekans) / N ya da μ = Σ xᵢ·p(xᵢ). Alttan ders örneği: 147/100 = 1,47."}, {"d": 5, "t": "Ortalama", "f": "Vize %40 (50), final %60 (70) ise ağırlıklı ortalama?", "b": "50×0,4 + 70×0,6 = 20 + 42 = 62 (basit ortalama 60)."}, {"d": 5, "t": "Ortalama", "f": "Ortalamadan sapmaların toplamı kaçtır?", "b": "Her zaman 0 (ortalamanın tanımı gereği)."}, {"d": 5, "t": "Konum", "f": "Medyan nasıl bulunur?", "b": "Veriler küçükten büyüğe sıralanır, ortadaki değer alınır; N çiftse ortadaki iki değerin ortalaması (3 ve 4 → 3,5)."}, {"d": 5, "t": "Konum", "f": "Mod nedir? Nominal değişkende hangi konum ölçüsü kullanılır?", "b": "En sık görülen değer. Nominal değişkende yalnızca mod kullanılabilir; sınavda kategori adı yazıyla yazılmalı (Mod = YBS)."}, {"d": 5, "t": "Konum", "f": "Robust (dirençli) istatistik ne demek? Hangisi daha robust?", "b": "Uç değerlerden az etkilenen. Medyan ortalamaya göre daha robust (Elon Musk kantine gelince ortalama gelir uçar, medyan değişmez)."}, {"d": 5, "t": "Konum", "f": "\"Ortalama öğretmen maaşı 40.000 TL\" neyi ifade ETMEZ?", "b": "Herkesin 40.000 aldığını ya da çoğunluğun bu civarda olduğunu ifade etmez; sınıfı temsil eden idealize bir değerdir."}, {"d": 6, "t": "Değişkenlik", "f": "Ranj nedir, neden zayıf bir göstergedir?", "b": "Ranj = max − min. Yalnızca iki uç değeri kullanır, aradaki tüm skorları yok sayar."}, {"d": 6, "t": "Değişkenlik", "f": "Sapma skoru nedir? Sapma skoru 0 olan öğrenci kaç almıştır?", "b": "dᵢ = Xᵢ − μ. Sapma 0 ise öğrenci tam ortalamayı almıştır; + üstünde, − altında."}, {"d": 6, "t": "Değişkenlik", "f": "Ortalama mutlak sapma (OMS) formülü?", "b": "OMS = Σ|Xᵢ − μ| / N. Mutlak değer sapmaların sıfırlanmasını önler, N'e bölmek farklı büyüklükteki grupları kıyaslanabilir yapar."}, {"d": 6, "t": "Değişkenlik", "f": "Kareler toplamı (SS), varyans ve standart sapma formülleri?", "b": "SS = Σ(Xᵢ − μ)². Varyans σ² = SS/N. Standart sapma σ = √(SS/N)."}, {"d": 6, "t": "Değişkenlik", "f": "Varyans yerine neden standart sapma yorumlanır?", "b": "Varyansın birimi orijinal birimin karesidir (cm²); karekök alınınca standart sapma orijinal birime döner."}, {"d": 6, "t": "Değişkenlik", "f": "Tarih sınavı örneği (N=10, toplam 520): μ, OMS, SS, varyans, σ?", "b": "μ = 52, OMS = 18, SS = 3960, varyans = 396, σ ≈ 19,900."}, {"d": 6, "t": "Değişkenlik", "f": "μ = 50, N = 6, skorlar 0–100 iken standart sapma en fazla kaç olur?", "b": "Üçü 0, üçü 100 (kutuplaşma): sapmalar ±50, SS = 15000, varyans 2500, σ = 50."}, {"d": 6, "t": "Excel", "f": "Excel'de varyans ve standart sapma (ana kütle) fonksiyonları?", "b": "=VAR.P(aralık) ve =STDSAPMA.P(aralık). Türkçe Excel'de argüman ayracı ; işaretidir; sabit hücre $C$3 ile dolarlanır."}, {"d": 7, "t": "Şekil", "f": "Dağılımın üç temel özelliği?", "b": "Konum (merkezi eğilim), değişkenlik (serpilme), şekil (biçim/form)."}, {"d": 7, "t": "Şekil", "f": "Sağa çarpık dağılımda mod, medyan ve ortalamanın sırası?", "b": "Mod < medyan < ortalama. Çarpıklık yönü kuyruğa göre söylenir; uç değerler ortalamayı kuyruğa çeker."}, {"d": 7, "t": "Şekil", "f": "Tavan etkisi ve taban etkisi nedir?", "b": "Tavan: üst limitten kaynaklanan yığılma (çok kolay sınavda herkes 100). Taban: alt limitten kaynaklanan yığılma."}, {"d": 7, "t": "Şekil", "f": "Uç değer nedir? Görünce ne kontrol edilir?", "b": "Veri yığınından kopuk değer. Kontrol: 1) veri girişi hatası mı? 2) ana kütle dışından biri mi karıştı? İkisi de değilse sırf uç diye silinmez."}, {"d": 7, "t": "Normal", "f": "Normal dağılımın özellikleri?", "b": "Sürekli, tek tepeli, çan şeklinde, ortalamaya göre simetrik, iki ucu asimptotik; ortalama = mod = medyan; parametreleri μ ve σ."}, {"d": 7, "t": "Normal", "f": "Normal dağılımda μ ve σ grafiği nasıl etkiler?", "b": "μ eğriyi sağa-sola kaydırır (−∞, +∞). σ genişliği belirler: geniş eğrinin σ'sı büyüktür (σ > 0)."}, {"d": 7, "t": "z skoru", "f": "z skoru formülü ve anlamı?", "b": "z = (X − μ)/σ. Birimsizdir; skorun ortalamadan kaç standart sapma yukarıda (+) ya da aşağıda (−) olduğunu gösterir."}, {"d": 7, "t": "z skoru", "f": "z skorlarının ortalaması ve standart sapması kaçtır? Şekli değişir mi?", "b": "Ortalama 0, standart sapma 1. Şekil değişmez, yalnızca birim değişir."}, {"d": 7, "t": "Normal", "f": "Standart normal dağılım nedir?", "b": "Ortalaması 0, standart sapması 1 olan normal dağılım."}, {"d": 7, "t": "Görgül", "f": "Normal dağılımın üç görgül kuralı?", "b": "μ ± 1σ ≈ %68 (her yarı %34); μ ± 2σ ≈ %95; μ ± 3σ ≈ %99,7."}, {"d": 7, "t": "Görgül", "f": "μ = 55, σ = 10, N = 4000: 65–75 arası kaç öğrenci?", "b": "z +1 ile +2 arası = %47,5 − %34 = %13,5 → 4000 × 0,135 = 540 öğrenci."}, {"d": 7, "t": "Veri seti", "f": "Futbol verisinde gol sayısı: ortalama 23,3, medyan 15, mod 5. Dağılım nasıldır?", "b": "Mod < medyan < ortalama → sağa çarpık (az sayıda golcü ortalamayı yukarı çekiyor)."}, {"d": 7, "t": "Veri seti", "f": "Futbol verisindeki Pozisyon, Milli ve Yaş değişkenlerinin ölçüm düzeyleri?", "b": "Pozisyon: nominal (mod = Defans). Milli: dikotomik nominal. Yaş: rasyo."}];
const QUIZ = [{"d": 1, "q": "Veri setinde satırlar neyi temsil eder?", "o": ["Değişkenleri", "Gözlem (analiz) birimlerini", "Parametreleri", "Kategorileri"], "a": 1, "w": "Satır = gözlem birimi; sütun = değişken."}, {"d": 1, "q": "Bir araştırmada firmaların 2025 cirosu inceleniyor. Analiz birimi nedir?", "o": ["Yönetici", "Çalışan", "Firma", "Sektör müdürü"], "a": 2, "w": "Ciro firmanın özelliğidir; özelliğin ait olduğu varlık analiz birimidir."}, {"d": 1, "q": "Derse devamı '14 haftalık yoklamada imza sayısı' olarak tanımlamak hangi tanım türüdür?", "o": ["Kavramsal tanım", "Operasyonel tanım", "Sözlük tanımı", "Teorik tanım"], "a": 1, "w": "Nasıl ölçüldüğünü anlatan tanım operasyonel (işlemsel) tanımdır."}, {"d": 1, "q": "Enflasyon %70'ten %40'a düştü. Hangisi doğrudur?", "o": ["Fiyatlar düştü", "Fiyatlar artmaya devam ediyor ama artış hızı yavaşladı", "Fiyatlar sabit kaldı", "Enflasyon negatif oldu"], "a": 1, "w": "Enflasyon fiyat artış hızıdır; fiyat düşerse enflasyon negatif çıkar."}, {"d": 1, "q": "Aşağıdakilerden hangisi bir özelliğin değişken olması için gerekli koşul DEĞİLDİR?", "o": ["Fiilen ölçülmüş olması", "Araştırmada rolü olması", "Farklı değerler alması", "Tüm değerlerin tam sayı olması"], "a": 3, "w": "Koşullar: ölçülmüş, rol, farklı değerler. Tam sayı olma şartı yok."}, {"d": 1, "q": "Nedenini merak ettiğimiz değişkene ne denir?", "o": ["Bağımsız değişken", "Bağımlı değişken", "ID değişkeni", "Kontrol değişkeni"], "a": 1, "w": "Nedeni merak edilen Y: bağımlı değişken."}, {"d": 1, "q": "Örneklemden hesaplanan sayıya ve ana kütleye ait gerçek değere sırasıyla ne denir?", "o": ["Parametre – istatistik", "İstatistik – parametre", "Frekans – pay", "Ortalama – medyan"], "a": 1, "w": "Örneklem → istatistik; ana kütle → parametre."}, {"d": 1, "q": "Ana kütlenin tamamına ulaşabiliyorsak ne yaparız?", "o": ["Yine de örneklem alırız", "Örnekleme gerek yok, ana kütle ile çalışırız", "Veriyi atarız", "Çıkarımsal istatistik şarttır"], "a": 1, "w": "Örneklemin varlık nedeni ana kütleye ulaşamamaktır."}, {"d": 1, "q": "'Örneklem ana kütlenin %5'inden küçükse ana kütleyi sonsuz kabul edebiliriz' ifadesi hangi konudadır?", "o": ["Yuvarlama", "%5 kuralı / çıkarımsal istatistik varsayımı", "Frekans tablosu", "Ölçüm düzeyi"], "a": 1, "w": "Çıkarımsal yöntemler sonsuz ana kütle varsayar; küçük örneklem oranı bunu makul kılar."}, {"d": 1, "q": "Makine öğrenmesi ile klasik istatistik arasındaki en önemli fark hangisidir?", "o": ["ML nedensel açıklama ister", "ML ağırlıklı olarak tahminle ilgilenir ve genelleme kaygısı taşımaz", "İstatistik sadece büyük veriyle çalışır", "ML ölçme yapmaz"], "a": 1, "w": "ML/veri bilimi tahmin odaklıdır; klasik bilim açıklama da ister."}, {"d": 2, "q": "Sıfırın gerçek yokluğu temsil ettiği ve oranlamanın yapılabildiği ölçüm düzeyi hangisidir?", "o": ["Nominal", "Sıralı", "Aralık", "Oran"], "a": 3, "w": "Oran ölçümünde sıfır gerçek yokluktur."}, {"d": 2, "q": "'Dün hava 4 °C, bugün 8 °C; hava iki kat sıcak.' İfade neden yanlıştır?", "o": ["Sıcaklık nominaldir", "Celsius aralık ölçümüdür, sıfır yokluk değildir; oranlama yapılamaz", "Sıcaklık sürekli değildir", "Termometre hatalıdır"], "a": 1, "w": "Aralık ölçümlerinde farklar anlamlı, oranlar anlamsızdır (Kelvin hariç)."}, {"d": 2, "q": "Plaka kodlarıyla (34, 35, 06) doğum yeri kodlamak hangi ölçüm düzeyidir?", "o": ["Oran", "Aralık", "Sıralı", "Nominal"], "a": 3, "w": "Sayılar yalnızca etikettir; büyüklük-küçüklük anlamı yoktur."}, {"d": 2, "q": "Eğitim düzeyi (ilkokul=1 ... doktora=6) hangi ölçüm düzeyine örnektir?", "o": ["Sıralı", "Nominal", "Oran", "Aralık"], "a": 0, "w": "Sıra anlamlı ama farklar eşit anlamlı değil: sıralı ölçüm."}, {"d": 2, "q": "Nominal ölçümde hangi işlem anlamlıdır?", "o": ["Toplama", "Oranlama", "Eşit / eşit değil karşılaştırması", "Çıkarma"], "a": 2, "w": "Nominalde yalnızca aynı mı farklı mı sorusu sorulur."}, {"d": 2, "q": "Hangi grup 'metrik (sayısal)' değişkenleri oluşturur?", "o": ["Nominal + sıralı", "Sıralı + aralık", "Oran + aralık", "Yalnız oran"], "a": 2, "w": "Gerçek ölçüm sayılan oran ve aralık ölçümleri metriktir."}, {"d": 2, "q": "'Korelasyon nedensellik değildir' ne demektir?", "o": ["Korelasyon hesaplanamaz", "İki değişken arasında ilişki olması biri diğerinin nedeni olduğunu göstermez", "Nedensellik ölçülemez", "Korelasyon yalnızca sürekli veride olur"], "a": 1, "w": "İlişki gerekli ama nedensellik için yeterli değildir."}, {"d": 2, "q": "'X olmasaydı Y olmazdı' mantığına dayanan nedensellik yaklaşımı hangisidir?", "o": ["Karşıt olgusallık (counterfactual)", "Korelasyon", "Operasyonel tanım", "Dikotomizasyon"], "a": 0, "w": "Karşıt olgusallık: gerçekte olmayan senaryoyu düşünerek neden belirleme."}, {"d": 2, "q": "Stevens'ın ölçme tanımı hangisidir?", "o": ["Yalnızca uzunluk ve ağırlığı sayıya çevirmek", "Belirli kurallara uyarak varlıklara sayı atamak", "Ortalama hesaplamak", "Kategorilere isim vermek"], "a": 1, "w": "Kurala dayalı sayı atama; bu yüzden nominal ve sıralı da ölçmedir."}, {"d": 3, "q": "1 ile 2 arasında hiçbir değer alamayan, boşluklu değişken türü hangisidir?", "o": ["Sürekli", "Kesikli", "Oransal", "Dikotomik"], "a": 1, "w": "Kesikli değişkende değerler arasında boşluk vardır."}, {"d": 3, "q": "Gerçek hayatta veri hiçbir zaman tam sürekli değildir. Yine de sürekli kabul etmemizin nedeni nedir?", "o": ["Yasal zorunluluk", "Yeterince ince ölçümlerde matematiksel işlemleri kolaylaştırması", "Bilgisayarların sınırı", "Sürekli veri kesikliden daha doğrudur"], "a": 1, "w": "Yeterince hassas ölçüm varsa sürekli varsaymak hesapları basitleştirir."}, {"d": 3, "q": "Ehliyet sınavında 0-100 puanı 'geçti/kaldı'ya çevirmek ne olarak adlandırılır ve sonucu nedir?", "o": ["Operasyonelleştirme – bilgi kazancı", "Dikotomize etme – bilgi kaybı", "Kodlama – oranlama", "Örnekleme – genelleme"], "a": 1, "w": "Çok şıklı veriyi iki şıklıya çevirmek bilgi kaybı yaratır."}, {"d": 3, "q": "Medeni hal sorusunda 'dul' şıkkı belirsiz olduğu için ne yapılmalıdır?", "o": ["Olduğu gibi bırakılır", "Şık eşi vefat etmiş/boşanmış olarak ayrılır ya da soru 'şu an evli misin?' haline getirilir", "Soru silinir", "Yaş sorusuyla birleştirilir"], "a": 1, "w": "Kategoriler cevaplayanların anlayışına göre belirsizlikten arındırılmalıdır."}, {"d": 3, "q": "100 öğrencilik veride 20 öğrencinin alttan dersi yoksa bu skorun payı kaçtır?", "o": ["20", "0,2", "0,02", "2"], "a": 1, "w": "Pay = frekans / N = 20 / 100 = 0,20."}, {"d": 3, "q": "Payların toplamı kaçtır?", "o": ["100", "N", "1", "0"], "a": 2, "w": "Payların toplamı 1, yüzdeliklerin toplamı %100'dür."}, {"d": 3, "q": "Kümülatif pay tablosunda 3'ün karşısındaki değer 0,60 ise '3'ten fazla' olanların oranı nedir?", "o": ["0,60", "0,40", "1,60", "0,30"], "a": 1, "w": "1 − 0,60 = 0,40."}, {"d": 3, "q": "Frekans tablosunun satır sayısını ne belirler?", "o": ["Gözlem sayısı", "Değişkenin aldığı farklı değer sayısı", "Sütun sayısı", "Örneklem büyüklüğü"], "a": 1, "w": "Tablo büyüklüğü farklı skor sayısına bağlıdır; 1 milyon gözlem de 11 satıra inebilir."}, {"d": 3, "q": "Üniversite sınavında %1'lik dilimde olmak ne demektir?", "o": ["En kötü %1'de olmak", "En başarılı %1'de olmak", "Puanın 1 olması", "Sıralamada 1. olmak"], "a": 1, "w": "Yüzdelik dilim düştükçe başarı artar; %1 en iyi dilimdir."}, {"d": 3, "q": "Sınavda nihai cevap 92,5739 çıkmıştır. Nasıl yazılmalıdır?", "o": ["92,5", "92,57", "92,574", "93"], "a": 2, "w": "3. basamağa yuvarlanır: 4. basamak (9) ≥5 olduğu için 92,573 → 92,574."}, {"d": 3, "q": "Aşağıdakilerden hangisi doğru yazım/hesap kuralıdır?", "o": ["Ara işlemlerde de 3. basamağa yuvarlamak", "%5'in oranını 0,5 yazmak", "Ara işlemleri yuvarlamadan nihai cevabı 3. basamağa yuvarlamak", "Adımları göstermeden direkt sonucu yazmak"], "a": 2, "w": "Ara işlemde yuvarlama yok, nihai cevap 3. basamak; %5 = 0,05."}, {"d": 4, "q": "Metrik (interval–rasyo) bir değişken için en uygun grafik hangisidir?", "o": ["Pasta grafiği", "Histogram", "Sütun grafiği", "Hiçbiri"], "a": 1, "w": "Histogram metrik veriler içindir; sütunlar bitişiktir."}, {"d": 4, "q": "Nominal veya ordinal veriler için kullanılan, sütunları arasında boşluk bulunan grafik hangisidir?", "o": ["Histogram", "Sütun (bar) grafiği", "Lolipop grafiği", "Normal eğri"], "a": 1, "w": "Kategoriler arasında süreklilik olmadığı için boşluk bırakılır."}, {"d": 4, "q": "Histogramda bir sütunun neyi temsil ettiğini belirleyen nedir?", "o": ["Yüksekliği", "Alanı", "Rengi", "Genişliği tek başına"], "a": 1, "w": "Histogramda alan oranı gösterir."}, {"d": 4, "q": "Histogramda 6 ve 7 kategorileri birleştiriliyor; 6'nın alanı 6 birimdi ve taban 2 birime çıkıyor. Yeni sütunun yüksekliği kaç olmalıdır?", "o": ["6", "12", "3", "2"], "a": 2, "w": "Alan korunur: 6 / 2 = 3."}, {"d": 4, "q": "Bir frekans tablosunda N = 100 ve x = 2 skorunun frekansı 15 ise payı kaçtır?", "o": ["15", "0,15", "%1,5", "1,5"], "a": 1, "w": "Pay = 15/100 = 0,15 (ondalıklı gösterilir)."}, {"d": 4, "q": "Frekanslar 20, 15, 15 ise üçüncü satırın kümülatif yüzdesi kaçtır (N = 100)?", "o": ["%15", "%35", "%50", "%30"], "a": 2, "w": "20 + 15 + 15 = 50 → %50."}, {"d": 4, "q": "Aşağıdakilerden hangisi dikotomik bir değişkendir?", "o": ["Medeni hal (evli/bekâr/dul)", "Ehliyet sınavı sonucu (geçti/kaldı)", "Eğitim düzeyi", "Yaş"], "a": 1, "w": "Dikotomi iki şıklıdır."}, {"d": 4, "q": "92,57469 sayısı sınav kuralına göre nasıl yazılır?", "o": ["92,57", "92,574", "92,575", "92,6"], "a": 2, "w": "4. basamak 6 ≥ 5 → 3. basamak 1 artar: 92,575."}, {"d": 4, "q": "Hangi grafik türünün kullanılması tercih edilmez?", "o": ["Histogram", "Sütun grafiği", "Pasta grafiği", "Lolipop grafiği"], "a": 2, "w": "Pasta dilimlerini kıyaslamak zordur."}, {"d": 4, "q": "0–100 arası notları 5'lik aralıklarla gösterme işlemine ne denir?", "o": ["Dikotomi", "Gruplama (gruplanmış veri)", "Standardizasyon", "Kümülatif toplama"], "a": 1, "w": "Az sütunla anlaşılır grafik için yapılan suni ayrıştırma."}, {"d": 5, "q": "0, 7, 1, 2, 3, 3, 1, 6, 2, 2, 2, 1 verisinin aritmetik ortalaması kaçtır?", "o": ["2", "2,5", "3", "2,25"], "a": 1, "w": "Toplam 30, N = 12 → 2,5."}, {"d": 5, "q": "Aynı verinin (0,7,1,2,3,3,1,6,2,2,2,1) modu kaçtır?", "o": ["1", "2", "3", "2,5"], "a": 1, "w": "2 değeri 4 kez görülür."}, {"d": 5, "q": "Aynı verinin (0,7,1,2,3,3,1,6,2,2,2,1) medyanı kaçtır?", "o": ["2", "2,5", "1,5", "3"], "a": 0, "w": "Sıralı: 0,1,1,1,2,2,2,2,3,3,6,7 → 6. ve 7. değer 2 ve 2 → 2."}, {"d": 5, "q": "Vize %40 (50 puan), final %60 (70 puan) ise ağırlıklı ortalama kaçtır?", "o": ["60", "62", "58", "64"], "a": 1, "w": "20 + 42 = 62."}, {"d": 5, "q": "x̄ sembolü neyi gösterir?", "o": ["Ana kütle ortalamasını", "Örneklem ortalamasını", "Standart sapmayı", "Medyanı"], "a": 1, "w": "μ veya Mx ana kütle ortalamasıdır."}, {"d": 5, "q": "Uç değerlerden en az etkilenen konum ölçüsü hangisidir?", "o": ["Aritmetik ortalama", "Medyan", "Ranj", "Varyans"], "a": 1, "w": "Medyan robusttur."}, {"d": 5, "q": "\"Bölüm\" (YBS, İşletme, İktisat...) değişkeni için hangi konum ölçüsü hesaplanabilir?", "o": ["Ortalama", "Medyan", "Mod", "Standart sapma"], "a": 2, "w": "Nominal değişkende yalnızca mod anlamlıdır."}, {"d": 5, "q": "Bir veri setinde ortalamadan sapmaların toplamı kaçtır?", "o": ["N", "1", "0", "Ortalamaya eşit"], "a": 2, "w": "Ortalamanın tanımı gereği her zaman 0."}, {"d": 5, "q": "Alttan ders sayıları: 0(35), 1(24), 2(17), 3(12), 4(8), 5(3), 6(1). Ortalama kaçtır?", "o": ["1,47", "2", "1", "3"], "a": 0, "w": "147 / 100 = 1,47."}, {"d": 6, "q": "47, 48, 49, 51, 52, 53 verisinin ranjı kaçtır?", "o": ["50", "6", "3", "53"], "a": 1, "w": "53 − 47 = 6."}, {"d": 6, "q": "Bir öğrencinin sapma skoru 0 ise ne söylenebilir?", "o": ["0 almıştır", "Sınıf ortalamasını almıştır", "En yüksek notu almıştır", "Sınava girmemiştir"], "a": 1, "w": "d = X − μ = 0 → X = μ."}, {"d": 6, "q": "Varyansın yorumlanmasını zorlaştıran temel sorun nedir?", "o": ["Negatif çıkabilmesi", "Biriminin orijinal birimin karesi olması", "Medyana eşit olması", "Hesaplanamaması"], "a": 1, "w": "cm → cm²; karekök alınarak standart sapmaya geçilir."}, {"d": 6, "q": "Kareler toplamı 3960 ve N = 10 ise varyans kaçtır?", "o": ["396", "39,6", "19,9", "3960"], "a": 0, "w": "SS / N = 396."}, {"d": 6, "q": "Varyans 2500 ise standart sapma kaçtır?", "o": ["25", "50", "250", "1250"], "a": 1, "w": "√2500 = 50."}, {"d": 6, "q": "Ortalaması 50 olan 6 kişilik sınıfta (0–100) standart sapmanın en büyük olduğu durum hangisidir?", "o": ["Herkes 50 alırsa", "Üçü 0, üçü 100 alırsa", "47–53 arası alırlarsa", "Biri 100, diğerleri 40 alırsa"], "a": 1, "w": "En yüksek kutuplaşma → σ = 50."}, {"d": 6, "q": "A sınıfında σ = 20, B sınıfında σ = 5 ise hangisi doğrudur?", "o": ["A daha homojendir", "B'de notlar birbirine daha yakındır", "A'nın ortalaması daha yüksektir", "B'nin ranjı daha büyüktür"], "a": 1, "w": "σ küçüldükçe skorlar ortada yığılır."}, {"d": 6, "q": "Excel'de ana kütle standart sapması hangi fonksiyonla hesaplanır?", "o": ["=ORTALAMA()", "=VAR.P()", "=STDSAPMA.P()", "=TOPLA()"], "a": 2, "w": "VAR.P varyansı verir."}, {"d": 6, "q": "5, 5, 5, 5 verisinin standart sapması kaçtır?", "o": ["5", "1", "0", "Hesaplanamaz"], "a": 2, "w": "Değişkenlik yoksa σ = 0."}, {"d": 7, "q": "Sağa çarpık bir dağılımda hangi sıralama doğrudur?", "o": ["Ortalama < medyan < mod", "Mod < medyan < ortalama", "Mod = medyan = ortalama", "Medyan < mod < ortalama"], "a": 1, "w": "Uç değerler ortalamayı sağdaki kuyruğa çeker."}, {"d": 7, "q": "Çok kolay bir sınavda öğrencilerin çoğunun 100 alması hangi etkiye örnektir?", "o": ["Taban etkisi", "Tavan etkisi", "Uç değer", "Normal dağılım"], "a": 1, "w": "Üst limitten kaynaklanan yığılma."}, {"d": 7, "q": "Normal dağılım için aşağıdakilerden hangisi YANLIŞTIR?", "o": ["Tek tepelidir", "Ortalamaya göre simetriktir", "Uçları x eksenine değer", "Ortalama = mod = medyan"], "a": 2, "w": "Uçlar asimptotiktir, eksene hiç değmez."}, {"d": 7, "q": "μ = 55, σ = 12 iken X = 81'in z skoru kaçtır?", "o": ["+2,000", "+2,167", "+1,250", "+26"], "a": 1, "w": "(81 − 55)/12 = 2,1666… → 2,167."}, {"d": 7, "q": "μ = 55, σ = 12 iken X = 40'ın z skoru kaçtır?", "o": ["−1,250", "+1,250", "−15", "−0,800"], "a": 0, "w": "(40 − 55)/12 = −1,25."}, {"d": 7, "q": "Bir veri setinin tüm skorları z skoruna dönüştürülürse ortalama ve standart sapma ne olur?", "o": ["Değişmez", "0 ve 1", "1 ve 0", "100 ve 15"], "a": 1, "w": "z dönüşümü şekli değil birimi değiştirir."}, {"d": 7, "q": "Normal dağılımda μ ± 1σ arasında alanın yaklaşık yüzde kaçı bulunur?", "o": ["%50", "%68", "%95", "%99,7"], "a": 1, "w": "Her yarıda %34."}, {"d": 7, "q": "μ = 55, σ = 10 olan normal dağılımda 55–65 arası not alanların oranı yaklaşık kaçtır?", "o": ["%68", "%34", "%13,5", "%50"], "a": 1, "w": "μ ile μ + 1σ arası %34."}, {"d": 7, "q": "μ = 55, σ = 10, N = 4000 iken 65–75 arası not alan yaklaşık kaç öğrenci vardır?", "o": ["1360", "540", "1900", "270"], "a": 1, "w": "%47,5 − %34 = %13,5 → 540."}, {"d": 7, "q": "Ortalamaları aynı, standart sapmaları farklı iki normal dağılım için hangisi doğrudur?", "o": ["Tepe noktaları farklı yerdedir", "Daha geniş olanın standart sapması büyüktür", "Daha dar olanın ortalaması büyüktür", "İkisi çakışır"], "a": 1, "w": "σ genişliği, μ konumu belirler."}, {"d": 7, "q": "Futbol verisinde gol sayısının ortalaması 23,3, medyanı 15, modu 5'tir. Dağılım için ne söylenir?", "o": ["Simetrik", "Sola çarpık", "Sağa çarpık", "Normal"], "a": 2, "w": "Mod < medyan < ortalama."}, {"d": 7, "q": "Futbol verisindeki \"Pozisyon\" değişkeninin ölçüm düzeyi nedir?", "o": ["Nominal", "Ordinal", "İnterval", "Rasyo"], "a": 0, "w": "Defans, orta saha, kanat, forvet arasında sıra yoktur."}, {"d": 7, "q": "Veri setinde uç değer görüldüğünde ilk yapılması gereken nedir?", "o": ["Hemen silmek", "Veri girişi hatası ve ana kütle dışı gözlem olup olmadığını kontrol etmek", "Ortalamayı ikiyle çarpmak", "Medyanı yok saymak"], "a": 1, "w": "Hata yoksa sırf uç diye silinmez."}];
const NOTES = "# Konu 1 — Giriş: Betimsel istatistik, veri seti, değişken, ana kütle\n\n## Dersin çerçevesi\n- Ders = **betimleyici (betimsel) istatistik + olasılık**. Olasılık matematiğin ayrı bir dalı; çıkarımsal istatistiği anlamak için ikisi birlikte gerekir.\n- **Uygulamalı istatistik** çalışıyoruz (matematiksel/teorik istatistik değil). İki kol: **betimsel** (veriyi özetle) ve **çıkarımsal** (örneklemden ana kütleye genelle; gelecek dönem).\n- Veri **hazır** varsayılır: veri toplama/temizleme, ölçme kalitesi, geçerlik-güvenirlik ve eksik veri bu dersin konusu değil (gerçek araştırmada mutlaka sorgulanır).\n- İstatistik ≠ makine öğrenmesi: ML/veri bilimi veri toplama, büyük veri ve **tahmin** ağırlıklıdır; genelleme derdi yoktur. Dinamik/ısı haritası/keman (violin) grafikleri bu alanlardan yaygınlaştı.\n\n## Veri seti yapısı\n- **Satır = gözlem (analiz) birimi** (öğrenci, firma, ülke, ürün...). **Sütun = değişken**.\n- **ID (kimlik) değişkeni:** gözlemleri ayırt etmek ve veri setlerini birleştirmek için; gerçek değişken değil, **yardımcı** değişken. Örnek: ülkeler için enflasyon ve kaza verisini ID ile eşleştirip birleştirirsin.\n- Analiz biriminin neyin özelliği olduğuna bak: ciro **firmanın** özelliğidir, müdürün değil.\n\n## Kavramsal vs operasyonel tanım\n- **Kavramsal tanım:** kavramı başka kavramlarla anlatır (sözlük/bilimsel tanım). Bilimde ortak tek tanım yoktur → hangi teoriyi aldığını belirt.\n- **Operasyonel (işlemsel) tanım:** kavramı **nasıl ölçtüğünü** anlatır. Örnek: derse devam = 14 haftalık yoklama sayısı (0-14); akademik başarı = tarih final notu (0-100); enflasyon = sepetteki ürünlerin fiyat oranlarının ağırlıklı ortalaması.\n- Halk dili tuzağı: \"enflasyon düştü\" ≠ \"fiyatlar düştü\"; fiyat artış **hızı** düştü. Fiyatlar düşerse enflasyon negatiftir.\n\n## Değişken olmanın koşulları\n1. Ölçülebilir hale getirildi ve fiilen ölçüldü\n2. Araştırmada bir **rol** var (bağımlı / bağımsız ...)\n3. **Farklı değerler alıyor** (herkes aynı değeri aldıysa değişken değil; bilim sabiti açıklamaz)\n- **Bağımlı (Y, çıktı):** nedenini merak ettiğin değişken. **Bağımsız (X, öncül, ML'de feature):** Y'nin nedeni olabileceğini düşündüğün değişken.\n\n## Ana kütle, örneklem, istatistik, parametre\n- **Ana kütle (popülasyon):** genellemek istediğin tüm varlıklar; büyüklüğünü **araştırmacı amacına göre** seçer. **Örneklem:** ana kütleden seçilen küçük kısım. Ana kütlenin tamamına ulaşabiliyorsan örnekleme gerek yok.\n- **İstatistik** = örneklemden hesaplanan değer. **Parametre** = ana kütleye ait değer (gerçekte genelde bilinmez).\n- **Çıkarımsal istatistik:** örneklem istatistiğinden ana kütle parametresine ilişkin tahmin/genelleme (hata payı ve güven aralığıyla; örnek: %35 çıktı → %95 güvenle %32-%39).\n- **%5 kuralı:** örneklem ana kütlenin ~%5'inden küçükse ana kütleyi sonsuz kabul etmek sonuçları bozmaz. Örneklem ne kadar büyük olursa iyi; ama ana kütleye göre küçük kalmalı → bunun için ana kütleyi yeterince büyük seç.\n- Bu derste ayrım yapmıyoruz = veri setini **ana kütle** kabul ediyoruz.\n- **Meta-analiz:** birçok araştırmanın sonuçlarını birleştirip analiz etmek.\n\n## Betimleme araçları\n1. **İstatistiksel tablolar** (frekans, çapraz tablo) 2. **Grafikler** (histogram, nokta/lollipop...) 3. **Sayısal göstergeler (istatistikler)** — asıl araç (ortalama vb.).\n- Ortalama gibi tek bir sayı grubun \"genel seviyesini\" verir; bireyi gruba, grupları birbirine kıyaslamayı mümkün kılar. Ama \"A sınıfı ortalaması yüksek\" demek her A öğrencisinin her B öğrencisinden iyi olduğu anlamına gelmez.\n\n---\n\n# Konu 2 — Tanımlar, değişken rolleri, nedensellik, ölçüm düzeyleri\n\n## Terimler\n- **Terim** = kelimenin kendisi, **kavram** = anlatmaya çalıştığı soyut anlam. Operasyonel tanımın Türkçesi: işlemsel tanım.\n- Kavramları belirleyip sınırlarını çizmek önemli (derse devam = sadece fiziksel bulunma mı, aktif katılım mı?).\n\n## Özellik → değişken yolu\n- Özellik/kavram → tanımla → ölçülebilir kıl → ölç → rol ata → **değişken**. Ölçülebilir kılmak çoğu zaman **derinlik kaybı** demektir (basitleştirme).\n- Birden fazla değişken olsa da **tek tek** ele almak = **tek değişkenli (univariate) istatistik**.\n- Analiz birimi çalışmaya göre değişir: aynı enflasyon verisinde birim ülke (bir yıl için) ya da yıl (tek ülke için) olabilir.\n- Excel tablosu = **veri matrisi / spreadsheet**.\n\n## Nedensellik\n- Bilimsel araştırmanın temel amacı: X'in Y'nin nedeni olup olmadığını göstermek. Bu zordur; \"neden\" tanımında döngüsellik/felsefi sorun vardır.\n- **Karşıt olgusallık (counterfactual):** X olmasaydı Y olmazdı → X, Y'nin nedeni. (Alkollü kaza örneği.) Kusursuz değil (boşanmanın nedeni evlilik mi?).\n- İstatistik yalnızca **ilişki** olup olmadığını gösterir; nedensel yorum teori, tasarım, mantıkla yapılır.\n- **Korelasyon** = ilişkinin özel bir sayısal ölçüsü (Pearson). **Korelasyon nedensellik değildir.**\n- **Tahmin (prediction):** nedeni bilmesek de X ile Y'yi öngörmek. Makine öğrenmesi sadece tahminle ilgilenir; klasik bilim açıklamayı da ister.\n- Başka roller: kontrol, aracı, düzenleyici, araç değişken (ileride).\n\n## Ölçme ne demektir?\n- (1) Varlıkta özelliğin olup olmadığını (2) varsa **standart bir birimle** hangi düzeyde olduğunu **sayısallaştırmak**.\n- Anlamlı **birim sistemi** + **karşılaştırma mekanizması** gerekir (metre/prototip, iki kefeli terazi). Prototipler artık evrensel sabitlere bağlandı (ışık hızı vb.).\n- Geniş tanım (**Stevens, 1946**): kurallara uyarak varlıklara sayı atamak. Bu yüzden 4 ölçüm düzeyi vardır.\n\n## Stevens'ın 4 ölçüm düzeyi (kıdemli → basit)\n| Düzey | Özellik | Sıfır | Yapılabilen işlem |\n|---|---|---|---|\n| **Oran (ratio)** | Anlamlı birim, farklar eşit anlamlı | **Gerçek yokluk** | Toplama, çıkarma, **oranlama (kaç katı)** |\n| **Aralık (interval)** | Eşit aralıklı, anlamlı birim | Keyfi (yokluk değil) | Toplama, çıkarma; **oranlama yok** |\n| **Sıralı (ordinal)** | Anlamlı sıra, artan sayılar | — | Büyük/küçük karşılaştırma; farkın anlamı yok |\n| **Sınıflayıcı (nominal)** | Kategoriye sayı/etiket | — | Sadece eşit / eşit değil (mod) |\n- **Oran örnekleri:** boy, kütle, maaş, uzunluk. 0 TL maaş = maaş yok; 60 bin, 30 binin 2 katı.\n- **Aralık örnekleri:** Celsius/Fahrenheit sıcaklık (0 °C yokluk değil), takvim yılı. 4 °C → 8 °C \"2 kat sıcak\" denemez; Kelvin ise oran ölçeğidir (0 K gerçek sıfır).\n- **Sıralı örnekleri:** eğitim düzeyi (ilkokul=1...), yarış sırası, F1 puanı, askeri rütbe. 1→2 ile 4→5 arası farkın aynı olduğu söylenemez.\n- **Nominal örnekleri:** plaka kodu, cinsiyet, medeni hal. Sayılar yalnızca etikettir.\n- Oran ölçümü aralığın, aralık da diğerlerinin tüm özelliklerini taşır. **Oran + aralık = metrik (sayısal, kantitatif)** değişkenler.\n- Neden önemli: hangi istatistiksel analizin yapılabileceğini belirler.\n\n---\n\n# Konu 3 — Veri türleri, tek değişkenli betimleme, frekans tablosu\n\n## Sayı kümeleri (hatırlatma)\n- Doğal sayılar (0 dahil kabul) ⊂ tam sayılar (Z) ⊂ **rasyonel** (a/b, b≠0) ⊂ **reel** (sayı doğrusu; π, √2 irrasyonel) ⊂ karmaşık.\n- \"Negatif olmayan tam sayılar\" = doğal sayılar. İsimlendirme geleneği: non-parametrik, non-lineer.\n\n## Kesikli vs sürekli\n- **Kesikli (discrete):** değerler arasında boşluk var (1 ile 2 arasında değer yok). **Sürekli:** reel sayı doğrusunda boşluk yok.\n- Gerçek hayatta ölçüm aletlerinin hassasiyeti sınırlı olduğu için hiçbir veri tam sürekli değildir; ama yeterince ince ölçüm varsa **sürekliymiş gibi** kabul edilir → matematik kolaylaşır. (Dikdörtgen masa örneği: gerçek hayatta kusurlu ama a×b formülü yeterince iyi.)\n- Olasılıkta karşılığı: kesikli ve sürekli olasılık dağılımları.\n\n## Sayma ve ölçme\n- Sayma verisi: sayarak elde edilen, **az sayıda farklı değer** alan, bazen bir değerde aşırı yığılma olan değişken (kaç kardeş, kaç alttan ders). Gerçek hayatta ölçme de bir tür saymayı içerir; ama \"sayma verisi\" deyince bu dar anlam kastedilir.\n\n## Dikotomik (iki şıklı) değişken\n- En az 2 kategori gerekir (tek şıklı değişken değildir). Nominal ölçüm; 0/1 kodlamak matematiksel avantaj sağlar (hangisine 0 vereceğin önemsiz).\n- **Dikotomize etmek:** aslında çok şıklı/metrik olanı iki şıklı yapmak (ehliyet sınavı geçti/kaldı). Basit ama **bilgi kaybı** → pek önerilmez.\n- Kategoriler **birbirini dışlamalı** ve **kapsayıcı** olmalı. Anket sorusunu cevaplayanların nasıl anlayacağına göre yaz (\"dul\" belirsiz → \"şu an evli misin?\").\n- Günlük dilde \"dikotomi\" = olmayan ikili ayrım dayatmak (\"ya seversin ya terk edersin\").\n\n## Tek değişkenli betimleme: frekans tablosu\n- **Frekans (sıklık):** bir skorun veri setinde kaç kez görüldüğü. Skor = bir gözlem biriminin değişkendeki değeri.\n- **Pay (proportion, parçanın bütüne oranı)** = frekans / toplam gözlem (N). Payların toplamı **1**. **Yüzdelik** = pay × 100. (Hoca başına öğrenci gibi başka oranlar \"parça/bütün\" değildir.)\n- **Kümülatif frekans / pay / yüzdelik:** küçükten büyüğe birikimli toplam; son satır N, 1, %100. \"En fazla 3 dersi olanların oranı\" tek bakışta okunur. \"3'ten fazla\" = 1 − kümülatif pay. İlgi eşiği büyük değerlerdeyse tabloyu büyükten küçüğe sırala.\n- **Yüzdelik dilim (percentile):** üniversite sınavında %1'lik dilim = en iyi %1 (%99'u geçtin).\n- Tablo büyüklüğünü gözlem sayısı değil, **farklı değer sayısı** belirler (1 milyon öğrenci de olsa 11 değerli değişken için 11 satır).\n- **Lollipop grafiği:** x ekseninde skor, y ekseninde frekans; nokta + çubuk. Aslında \"x'in dağılımı\" (teknik adı frekans dağılımı).\n- Frekans tablosu en yaygın betimleme aracı olmasına rağmen ana oyuncu **sayısal göstergelerdir** (tablo ve grafik yardımcı).\n\n## Yazım ve yuvarlama kuralları (sınav için!)\n- Ondalık ayırıcı **virgül**, binlik ayırıcı nokta (Türkiye). Excel/kod ortamında yerel ayara dikkat.\n- **Nihai cevabı virgülden sonra 3. basamağa yuvarla.** 4. basamak ≥5 ise yukarı, ≤4 ise aynen. **Ara işlemlerde yuvarlama yok** (hesap makinesindeki tüm basamaklar).\n- Sondaki sıfırlar yazılmayabilir (92,300 = 92,3). Adımları göster (12/6 → direkt 2 yazma).\n- Payları **oran** olarak yaz (0,20); sadece % yazma. Hepsi aynı basamak sayısında olsun. **0,05'i 0,5 yazma** (sık hata).\n- Türkçede **%23** (önce sembol), İngilizcede 23%. Para: sembol kullanılırsa başa (₺1000), alt birim (kuruş, cent) sona.\n- Excel iş hayatında çok önemli.\n\n\n# Konu 4 — Grafikler: lolipop, histogram, sütun grafiği, gruplanmış veri\n*Kaynak: 2026 öğrenci el notları (4.–5. hafta).*\n\n## Betimleme araçları ve yönleri (hatırlatma)\n- Değişkenler tek tek ele alınıyorsa **tek değişkenli (univariate)** betimleme yapılır. Araçlar: **tablo** (frekans, çapraz), **grafik**, **sayısal göstergeler (istatistik)**.\n- Hangi yönlerden betimleriz? **1) Merkezi eğilim (konum)**, **2) değişkenlik**, **3) dağılımın şekli**.\n- **Dikotomi:** iki şıklı sınıflandırma (geçti–kaldı, ehliyet sınavı); çok şıklıya **politomi (polytomous)** denir. Dikotomi bir amaç doğrultusunda basitleştirmedir, bilgiyi çöpe atar. *Medeni hal (evli/bekâr/dul) dikotomik değildir.* \"Dul\" belirsiz (eşi vefat etmiş mi, boşanmış mı?) → şıklar belirsizlik bırakmamalı.\n\n## Frekans tablosu (tam hali)\n| x | Frekans | Pay | Yüzde | Kümülatif frekans | Kümülatif pay | Kümülatif yüzde |\n|---|---|---|---|---|---|---|\n| 0 | 20 | 0,20 | %20 | 20 | 0,20 | %20 |\n| 1 | 15 | 0,15 | %15 | 35 | 0,35 | %35 |\n| 2 | 15 | 0,15 | %15 | 50 | 0,50 | %50 |\n| … | … | … | … | … | … | … |\n| 10 | 10 | 0,10 | %10 | 100 | 1 | %100 |\n\n- **Pay = oran = nispi frekans** = hücre frekansı / toplam gözlem sayısı (parçanın bütüne oranı). Teknik raporda **pay** gösterilir; sınavda **oran** şeklinde sorulur.\n- **Gözlem sayısı = frekanslar toplamı.** 100 satır × 1 sütunluk ham veri → 11 satır × 2 sütunluk özet.\n- Türkçede yüzde işareti **başa** (%23), İngilizcede sona (23%). Ondalık ayraç virgüldür.\n- **Kural 1:** nihai sonucu virgülden sonra **3. basamağa** yuvarla (4. basamak 5 ve üstüyse 3. basamak 1 artar: 92,57439 → 92,574; 92,57469 → 92,575). Ara işlemde yuvarlama yok.\n- **Kural 2:** 92,3 = 92,30 = 92,300; sondaki sıfırları yazmayabilirsin. Sonucu kesir halinde bırakma.\n\n## Grafik türleri\n- **Lolipop grafiği:** x ekseninde skorlar, y ekseninde frekans (kaç tane olduğu); her skorda bir çubuk + nokta. Grafiğin gösterdiği şey \"frekans dağılımı\" denir ama aslında **x değişkenine ait skorların dağılımıdır**.\n- **Histogram:** en çok kullanılan grafik; **metrik (interval–rasyo)** veriler için. Sütunlar **bitişiktir**. Histogramda **alan oranı** gösterir — yükseklik değil **alan** önemlidir.\n- **Sütun (çubuk, bar) grafiği:** **nominal veya ordinal** veriler için; sütunlar **arasında boşluk** bırakılır.\n- **Pasta grafiği:** kullanımı **tercih edilmemesi gereken** grafik (alanları kıyaslamak zordur).\n- Histogram okuyucuyu yanıltabilir: bitişik sütunlar \"buçuklu değer de var\" izlenimi verebilir.\n- **Teamül (gelenek):** frekansı 0 olan skor sütunu silinir. **Teknik kural:** histogramda boşluk olmaz → boş kategori komşusuyla birleştirilir. Örn. 6 ve 7'yi birleştirince taban 2 birim olur; alan korunacağı için **yükseklik yarıya** düşer (alan 6 ise yükseklik 3).\n\n## Gruplanmış veri\n- Çok sayıda farklı skor varsa (0–100 arası 101 sütun) skorlar aralıklara **gruplanır** (ör. 5'lik: 1–5, 6–10, …; 20 grup). Her grubun **orta değeri** grup adı olabilir. Bu **suni bir ayrıştırmadır**; amaç az sütunla kolay anlaşılır grafik. Kaç sütun olacağı amaca göre değişir (SPSS'te aralığa **bin** denir).\n- Metrik veri baştan gruplanmış toplanmışsa (maaş: 2 bin TL'lik aralıklar) buna **gruplanmış veri** denir.\n- Sınavda ham veri yerine **frekans tablosu** veya **histogram** verilebilir; ikisi arasında **geçiş** yapabilmelisin.\n\n# Konu 5 — Merkezi eğilim (konum): ortalama, medyan, mod\n*Kaynak: 2026 5. hafta notları + 2025 4.–5. hafta notları.*\n\n## Aritmetik ortalama\n- Tüm gözlenen değerleri topla, **gözlem sayısına** böl: **μx = (X₁ + X₂ + … + X_N) / N = ΣXᵢ / N**.\n- Gösterimler: **x̄** örneklem ortalaması; **μx (mu) / Mx** ana kütle ortalaması. N: ana kütle büyüklüğü, n: örneklem büyüklüğü. **Bu dönem elimizdeki veriler hep ana kütle kabul edilir.**\n- *Çamlık örneği (oda sayısı, N = 12):* 0, 7, 1, 2, 3, 3, 1, 6, 2, 2, 2, 1 → toplam 30 → **μ = 30/12 = 2,5**. (Kınıklı'da N = 50.)\n- **Frekans tablosundan ortalama:** μ = Σ (skor × frekans) / N. Alttan ders örneği: 0×35 + 1×24 + 2×17 + 3×12 + 4×8 + 5×3 + 6×1 = 147 → 147/100 = **1,47**.\n- **Paylarla ortalama:** μ = Σ xᵢ · p(xᵢ) (k = farklı skor sayısı).\n- **Ağırlıklı ortalama:** vize %40 (50), final %60 (70) → 50×0,4 + 70×0,6 = 20 + 42 = **62** (basit ortalama 60 olurdu). Ağırlıklar toplamı 1 değilse ağırlık toplamına bölünür.\n- Ortalamadan sapmaların toplamı **her zaman 0**'dır. Ortalama sınıfı temsil eden **idealize** değerdir; \"herkes bunu alıyor\" ya da \"çoğunluk bu civarda\" demek **değildir**.\n\n## Medyan ve mod\n- **Medyan (ortanca):** veriler sıralanınca ortadaki değer; N çiftse ortadaki iki değerin ortalaması (3 ve 4 → 3,5).\n- **Mod (tepe değeri):** en sık görülen değer. Kategorik (nominal) değişkende kullanılabilen tek konum ölçüsüdür (Bölüm: **Mod = YBS** — sınavda kategoriyi **yazıyla** yaz, kodla değil!). Histogramda en kolay görülen değerdir.\n- **Robust (dirençli):** uç değerler ortalamayı çok etkiler, medyanı neredeyse hiç etkilemez. *Kantindeki arkadaş grubuna Elon Musk gelirse* ortalama gelir uçar, medyan değişmez. Yine de çoğunlukla ortalama kullanılır; uç değerler ayıklanıp ortalama alınır (bilim insanı uç değerleri merak etmelidir).\n- **Ortalamaları eşit üç sınıf (MA = MB = MC = 50):** A: 0,0,0,100,100,100 (kutuplaşma); B: 47…53 (az değişkenlik); C: hepsi 50 (homojen). Ortalama aynı, dağılım çok farklı → **değişkenliğe** de bakmak gerekir.\n\n# Konu 6 — Değişkenlik: ranj, OMS, kareler toplamı, varyans, standart sapma\n*Kaynak: 2025 5.–6. hafta notları (bu yıl henüz işlenmediyse önden çalışma).*\n\n## Ranj\n- **Ranj = max − min** (B sınıfı: 53 − 47 = 6). İki şekilde söylenir: \"skorlar 60 ile 80 arasında\" ya da \"ranj 20\".\n- Zayıf göstergedir: yalnızca iki değeri kullanır, aradaki skorları yok sayar.\n\n## Ortalama mutlak sapma (OMS)\n- **Sapma skoru dᵢ = Xᵢ − μ.** Sapma 0 ise öğrenci tam ortalamayı almıştır; + ise ortalamanın üstü, − ise altı.\n- Sapmaların toplamı 0 olduğu için **mutlak değer** alınır; gözlem sayıları farklı gruplar adil kıyaslansın diye N'e bölünür: **OMS = Σ|Xᵢ − μ| / N**.\n\n## Kareler toplamı, varyans, standart sapma\n- Matematikte mutlak değer yerine **kare** tercih edilir. **Kareler toplamı SS = Σ(Xᵢ − μ)²**.\n- **Varyans = SS / N** (σ², Var(x)). Birimi orijinal birimin **karesidir** (cm → cm²), yorumlamak zordur.\n- **Standart sapma σ = √Varyans = √(SS/N)** → orijinal birime döner.\n- *Tarih sınavı (N = 10):* 80, 30, 50, 40, 60, 70, 70, 20, 70, 30 → toplam 520, **μ = 52**; Σ|d| = 180 → **OMS = 18**; **SS = 3960**; **varyans = 396**; **σ ≈ 19,900**.\n- Excel: `=ORTALAMA()`, `=VAR.P()`, `=STDSAPMA.P()`, `=KAREKÖK()`, `=YUVARLA(x;3)`. Türkçe Excel'de ayraç `;`. Sabit hücre `$C$3` ile dolarlanır; formül sürüklenince göreli adresler kayar.\n- N yerine N−1 de görülebilir (örneklem); bu dönem önemli değil.\n- **σ sıfıra yaklaştıkça** skorlar ortada yığılır (herkes benzer). σ = 20 olan sınıf σ = 5 olan sınıftan daha heterojendir.\n- **Maksimum standart sapma:** ortalama 50, N = 6, skorlar 0–100 → üçü 0, üçü 100 (kutuplaşma) → her sapma ±50, SS = 15000, varyans 2500, **σ = 50**.\n- Çoğu veri setinde skorların büyük bölümü **μ ± σ** arasındadır (μ = 52, σ = 20 → 32 ile 72 arası).\n\n# Konu 7 — Dağılımın şekli, normal dağılım ve z skoru\n*Kaynak: 2025 6.–7. hafta notları (önden çalışma).*\n\n## Dağılımın üç özelliği\n1. **Konum** (ortalama, mod, medyan) 2. **Değişkenlik** (ranj, OMS, standart sapma) 3. **Şekil/biçim/form**.\n- **Nitel şekil soruları:** Tek tepeli mi? Simetrik mi? Uç değer var mı? Tepesiz, U şeklinde, tek skorda (genelde 0'da) yığılma olabilir (ameliyat sayısı).\n- **Çarpıklık:** simetrik değilse çarpıktır; yön **kuyruğa** (azar azar azalan tarafa) göre söylenir. **Sağa çarpık:** mod < medyan < ortalama (uç değerler ortalamayı kuyruğa çeker). Medyan her zaman mod ile ortalamanın arasındadır.\n- Simetrik ve tek tepeli dağılımda **mod = medyan = ortalama**. Medyan ile ortalama birbirinden ne kadar uzaksa simetri o kadar bozuktur.\n- Alt veya üst sınırı olan ölçümlerde (kira, gelir — finansal konular) çarpıklık normaldir; en sık görülen **sağa çarpıklık**tır.\n- **Tavan etkisi:** üst limitten kaynaklanan yığılma (çok kolay sınavda herkes 100). **Taban etkisi:** alt limitten kaynaklanan yığılma. Sınır değerlerde yığılma sağlıklı bir ölçüm değildir (10 kg'lık tartıda 20 kg).\n- **Uç (ekstrem) değer:** yalnızca çok yüksek/düşük değer değil, **veri yığınından kopuk** değerdir. Uç değer varsa: 1) veri girişi hatası mı? 2) ana kütle dışından biri mi karıştı? İkisi de değilse sırf uç diye silinmez.\n\n## Normal (Gauss) dağılım\n- En meşhur **sürekli** dağılım; **tek tepeli, çan şeklinde, ortalamaya göre simetrik**; iki ucu **asimptotik** (x eksenine hiç değmez, −∞'dan +∞'a).\n- **Ortalama = mod = medyan** (tepe noktası).\n- İki **parametresi** vardır: **μ** (konumu, sağa-sola kaydırır; −∞, +∞) ve **σ** (genişliği; 0'dan büyük). Aynı σ, farklı μ → aynı şekil kaymış; aynı μ, farklı σ → geniş olanın σ'sı büyük.\n- **Standart normal dağılım:** μ = 0, σ = 1.\n\n## z skoru (standart skor)\n- **zᵢ = (Xᵢ − μ) / σ** → birimsiz; ortalamadan **kaç standart sapma** yukarıda/aşağıda olduğunu gösterir.\n- μ = 55, σ = 12: X = 81 → z = **+2,167**; X = 40 → z = **−1,250**; X = 79 → z = **+2,000**.\n- z skorlarının ortalaması her zaman **0**, standart sapması **1**'dir. z dönüşümü **şekli değiştirmez**, birimi değiştirir (çarpıksa çarpık kalır).\n\n## Normal dağılımın görgül kuralları\n- **μ ± 1σ:** alanın yaklaşık **%68**'i (her yarı %34).\n- **μ ± 2σ:** yaklaşık **%95** (gerçek değer ±1,96σ; bu dönem %95 kabul edilir).\n- **μ ± 3σ:** yaklaşık **%99,7** (hiçbir zaman %100 olmaz).\n- Örnek: μ = 55, σ = 10 → 55–65 arası **%34**; 65–75 arası (z: +1 ile +2) **%13,5** → 4000 öğrencide **540** kişi.\n\n# Uygulama veri seti — Futbol-00.xlsx\n*310 futbolcu; değişkenler: Yaş, Maç sayısı, Gol sayısı, Pozisyon, Milli (milli maçı var/yok), Uyruk (Norwegian/Foreign), Ayak (right/left-both).*\n\n| Değişken | Ölçüm düzeyi | Ortalama | Medyan | Mod | Min–Max | σ |\n|---|---|---|---|---|---|---|\n| Yaş | Rasyo | 25,545 | 25 | 22 | 17–38 | 4,204 |\n| Maç sayısı | Rasyo (sayma) | 181,806 | 167 | 168 | 10–584 | 109,068 |\n| Gol sayısı | Rasyo (sayma) | 23,303 | 15 | 5 | 0–191 | 26,489 |\n\n- **Pozisyon** (nominal): Defans 113, Orta saha 89, Kanat 59, Forvet 49 → **mod = Defans** (pay 0,365).\n- **Milli** (dikotomik nominal): milli maçı olan 58, olmayan 252. **Uyruk:** Norveçli 214, yabancı 96. **Ayak:** sağ 229, sol/her ikisi 81.\n- Gol sayısında **ortalama (23,3) > medyan (15) > mod (5)** → **sağa çarpık** dağılım (az sayıda golcü ortalamayı yukarı çekiyor). Yaşta ortalama ≈ medyan → yaklaşık simetrik.\n- Alıştırma: Excel'de Pozisyon için frekans tablosu (frekans, pay, yüzde, kümülatif) ve Gol için histogram çiz; `=ORTALAMA`, `=ORTANCA`, `=ENÇOK_OLAN`, `=STDSAPMA.P` ile tablodaki değerleri doğrula.\n";

function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const L=src.split('\n');let out='',stack=[];
  const closeTo=d=>{while(stack.length>d){out+='</ul>';stack.pop()}};
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/^\|/.test(l)){closeTo(0);const rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}i--;
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out+='<table><tr>'+cells(rows[0]).map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</table>';continue}
    let m;
    if(m=l.match(/^(#{1,3}) (.*)/)){closeTo(0);out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if(/^---$/.test(l)){closeTo(0);out+='<hr>'}
    else if(m=l.match(/^(\s*)(?:-|\d+\.) (.*)/)){const d=Math.floor(m[1].length/2)+1;while(stack.length<d){out+='<ul>';stack.push(1)}closeTo(d);out+=`<li>${inline(m[2])}</li>`}
    else if(l.trim()===''){closeTo(0)}
    else{closeTo(0);out+=`<p>${inline(l)}</p>`}
  }
  closeTo(0);return out;
}

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[R(0,a.length-1)];

const mcq=o=>{const s=shuf(o.map((t,i)=>[t,i]));return{opts:s.map(x=>x[0]),a:s.findIndex(x=>x[1]===0)}}; // doğru şık o[0]
const T={
  ins(t,v){if(!t)return{v,l:null,r:null};if(v<t.v)t.l=T.ins(t.l,v);else t.r=T.ins(t.r,v);return t},
  pre(t){return t?[t.v,...T.pre(t.l),...T.pre(t.r)]:[]},
  ino(t){return t?[...T.ino(t.l),t.v,...T.ino(t.r)]:[]},
  post(t){return t?[...T.post(t.l),...T.post(t.r),t.v]:[]},
  lvl(t){const o=[],q=[t];while(q.length){const n=q.shift();o.push(n.v);n.l&&q.push(n.l);n.r&&q.push(n.r)}return o},
  h(t){return t?1+Math.max(T.h(t.l),T.h(t.r)):0},
  nodes(t,d=0,p=null,o=[]){if(t){o.push({n:t,d,p});T.nodes(t.l,d+1,t,o);T.nodes(t.r,d+1,t,o)}return o},
  rand(n){const L='ABCDEFGHIJK',root={v:'A',l:null,r:null},all=[root];
    for(let i=1;i<n;i++){const p=pick(all.filter(x=>!x.l||!x.r)),k={v:L[i],l:null,r:null};p[!p.l&&!p.r?pick(['l','r']):p.l?'r':'l']=k;all.push(k)}return root},
  svg(t){let i=0;const pos=new Map();(function w(n,d){if(!n)return;w(n.l,d+1);pos.set(n,[i++*44+26,d*56+24]);w(n.r,d+1)})(t,0);
    let e='',c='';pos.forEach(([x,y],n)=>{[n.l,n.r].forEach(k=>{if(k){const[a,b]=pos.get(k);e+=`<line x1="${x}" y1="${y}" x2="${a}" y2="${b}"/>`}});c+=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}">${n.v}</text>`});

const exprT=(n,leaf,ops)=>{if(n===1)return{v:leaf()};const k=R(1,n-1),l=exprT(k,leaf,ops);return{op:pick(ops),l,r:exprT(n-k,leaf,ops)}};
const inf=t=>{if(t.v!=null)return String(t.v);let a=inf(t.l),b=inf(t.r);if(t.l.op&&PR[t.l.op]<PR[t.op])a=`(${a})`;if(t.r.op&&PR[t.r.op]<=PR[t.op])b=`(${b})`;return `${a} ${t.op} ${b}`};
const pst=t=>t.v!=null?[t.v]:[...pst(t.l),...pst(t.r),t.op], prf=t=>t.v!=null?[t.v]:[t.op,...prf(t.l),...prf(t.r)];
const ev=t=>t.v!=null?t.v:({'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b})[t.op](ev(t.l),ev(t.r));
const tbl=(head,rows)=>`<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

const GEN={
  traversal:{label:'Ağaç dolaşma',f(){const t=T.rand(R(6,9)),[nm,fn]=pick([['preorder (kök–sol–sağ)',T.pre],['inorder (sol–kök–sağ)',T.ino],['postorder (sol–sağ–kök)',T.post],['level order (seviye seviye)',T.lvl]]),a=fn(t);

  bst:{label:'İkili arama ağacı',f(){const v=shuffle([...Array(70)].map((_,i)=>i+5)).slice(0,R(7,9));let t=null;v.forEach(x=>t=T.ins(t,x));
    const ns=T.nodes(t),k=R(0,4),lead=`Boş bir ikili arama ağacına sırasıyla <b>${v.join(', ')}</b> ekleniyor. `;let q,a,type='num';
    if(k===0){a=T.pre(t);q='Ağacın <b>preorder</b> dolaşımını yaz.';type='txt'}

    const arr=Array.isArray(a);return{q:lead+q,type,a:arr?a.join(''):a,show:arr?a.join(', '):a,sol:'Kural: küçükse sola, büyük veya eşitse sağa. Oluşan ağaç:'+T.svg(t)+(arr?`Cevap: <b>${a.join(', ')}</b>`:'')}}},
  treeprops:{label:'Ağaç terimleri',f(){const t=T.rand(R(7,10)),ns=T.nodes(t),c=pick(ns),k=R(0,4);let q,a;

  postfix:{label:'Infix → postfix/prefix',f(){let i=0;const t=exprT(R(3,5),()=>'ABCDEFG'[i++],Object.keys(PR)),pre=Math.random()<.4,a=(pre?prf:pst)(t).join('');
    return{q:`<b>${inf(t)}</b> ifadesinin <b>${pre?'prefix':'postfix'}</b> karşılığını yaz.`,type:'txt',a,show:a,sol:`${pre?'Prefix':'Postfix'}: <b>${a}</b>. En son yapılan işlem (${t.op}) ${pre?'en başa':'en sona'} yazılır; parantez içleri önce kendi ${pre?'prefix':'postfix'} haline getirilir.`}}},
  evalpostfix:{label:'Postfix hesaplama',f(){let t,v;do{t=exprT(R(3,4),()=>R(1,9),['+','-','*']);v=ev(t)}while(Math.abs(v)>150);

  stackq:{label:'Yığın / kuyruk',f(){const S=Math.random()<.5,ops=[],ds=[];let last=null;
    for(let i=0,n=R(6,9);i<n;i++){if(ds.length&&Math.random()<.35){last=S?ds.pop():ds.shift();ops.push(S?'pop()':'dequeue()')}else{const x=R(1,30);ds.push(x);ops.push(`${S?'push':'enqueue'}(${x})`)}}

  kpi:{label:'E-ticaret göstergeleri',f(){const k=R(0,3);

    if(k===1){const o=R(5,50)*100,a=R(15,120)*10;return{q:`Aylık gelir <b>${N(o*a)} TL</b>, sipariş sayısı <b>${N(o)}</b>. <b>Ortalama sipariş değeri (AOV)</b> kaç TL'dir?`,type:'num',a,sol:`AOV = gelir / sipariş = ${N(o*a)} / ${N(o)} = ${N(a)} TL`}}

  pazarhiz:{label:'Pazar gelişim hızı',f(){const p=R(40,400)*5,c=Math.round(p*(1+R(-15,35)/100)),g=(c-p)/p*100,u=R(2,6);

  gsyih:{label:'GSYİH/GSMH · faktörler',f(){

  freq:{label:'Frekans tablosu',f(){const n=R(15,20),d=[...Array(n)].map(()=>R(0,5)),cnt=[0,1,2,3,4,5].map(v=>d.filter(x=>x===v).length),v=R(0,4),k=R(0,2);

  weighted:{label:'Ağırlıklı ortalama',f(){const k=R(0,4),wm=(x,w)=>sum(x.map((v,i)=>v*w[i]))/sum(w),

  spread:{label:'Ranj · OMS · varyans · s.sapma',f(){let d,n;do{n=R(4,6);d=[...Array(n)].map(()=>R(1,20))}while(sum(d)%n);

  zscore:{label:'z skoru',f(){const mu=R(40,70),sd=R(5,15),k=R(0,6),Z=()=>pick([-2,-1.5,-1,-.5,.5,1,1.5,2,2.5]);

    if(k===3){const z=Z(),x=mu+z*sd;return{q:`Standart sapması <b>${sd}</b> olan bir sınavda <b>${fmt(x)}</b> alan öğrencinin z skoru <b>${fmt(z)}</b>. Sınavın <b>ortalaması</b> kaçtır?`,type:'num',a:mu,sol:`μ = X − z·σ = ${fmt(x)} − (${fmt(z)}) × ${sd} = ${fmt(x)} − (${fmt(z*sd)}) = ${mu}`}}
    if(k===4){const z=Z(),x=mu+z*sd,m2=R(10,20)*5,s2=pick([5,8,10,12,15,20]),a=m2+z*s2;
